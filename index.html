      <nav className="relative z-30 w-16 shrink-0 h-full flex flex-col items-center py-3 gap-1 border-r" style={{background:"var(--rail-bg)", borderColor: (sideCollapsed && !railHover) ? "transparent" : "var(--side-bd)"}}>
        {/* Live (GitHub Pages) vs local tell: github.io → orange "G", elsewhere → purple "F". Code stays in source so it survives every push; only the RENDER differs by host. */}
        <div className="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm mb-2" style={{background: IS_LIVE?"linear-gradient(135deg,#d97757,#e89b82)":"linear-gradient(135deg,#5b6cff,#7c89ff)",color:"#fff"}}>{IS_LIVE?"G":"F"}</div>
        {SUITES.map(s=>{
          const on = s.id===activeSuite;
          return (
            <button key={s.id} onClick={()=>pickSuite(s)} title={s.label}
              className="relative w-11 h-11 rounded-xl flex items-center justify-center transition-colors group"
              style={{background: on?"var(--rail-active)":"transparent", color: on?"var(--rail-icon-active)":"var(--rail-icon)"}}>
              {on && <span className="absolute left-0 top-2 bottom-2 w-1 rounded-r" style={{background:"var(--accent)", marginLeft:"-10px"}}></span>}
              <span className="w-5 h-5 flex items-center justify-center">{s.icon}</span>
              <span className="pointer-events-none absolute left-full ml-2 px-2 py-1 rounded-md text-[11px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>{s.label}</span>
            </button>
          );
        })}
        <div className="mt-auto flex flex-col items-center gap-1">
          {RAIL_BOTTOM.map(b=>(
            <button key={b.id} title={b.label} className="relative w-11 h-11 rounded-xl flex items-center justify-center transition-colors group" style={{color:"var(--rail-icon)"}}>
              <span className="w-5 h-5 flex items-center justify-center">{b.icon}</span>
              <span className="pointer-events-none absolute left-full ml-2 px-2 py-1 rounded-md text-[11px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>{b.label}</span>
            </button>
          ))}
          <button title="Account" className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold mt-1" style={{background:"var(--avatar-bg)", color:"var(--avatar-fg)"}}>PG</button>
        </div>
      </nav>
      {/* ── Sidebar 2 (in-flow): width animates closed on collapse ── */}
      <aside className={"shrink-0 h-full overflow-hidden transition-[width] duration-300 ease-in-out " + (sideCollapsed ? "w-0" : "w-[220px]")} style={{background:"var(--side-bg)"}}>
        <div className="w-[220px] h-full flex flex-col">{moduleListBody}</div>
      </aside>
      {/* ── Sidebar 2 (floating): slides in over content when collapsed + rail hover ── */}
      <aside className={"absolute left-16 top-0 z-20 w-[220px] h-full flex flex-col border-r transition-transform duration-300 ease-in-out " + ((sideCollapsed && railHover) ? "translate-x-0" : "-translate-x-full pointer-events-none")}
        style={{background:"var(--side-bg)", borderColor:"var(--side-bd)", boxShadow:(sideCollapsed&&railHover)?"var(--inset-shadow)":"none"}}>
        {moduleListBody}
      </aside>
      </div>
      {/* ── Main pane = workflow area inside its own inset frame ── */}
      <div className="flex-1 min-w-0 h-full p-2 pl-1">
      <div className="h-full w-full rounded-xl overflow-hidden flex flex-col" style={{background:"var(--bg)", boxShadow:"var(--inset-shadow)"}}>
      {!showBuilder ? (
        <div className="h-full w-full flex flex-col items-center justify-center gap-3" style={{color:"var(--muted)"}}>
          <div className="w-12 h-12 opacity-60" style={{color:"var(--accent)"}}>{suiteDef.icon}</div>
          <div className="text-[17px] font-semibold" style={{color:"var(--text)"}}>{(suiteDef.modules.find(m=>m.id===activeModule)||{}).label || suiteDef.label}</div>
          <div className="text-[13px]">Coming soon</div>
        </div>
      ) : (
    <div className="relative flex flex-col h-full w-full overflow-hidden">
      {/* top bar */}
      <header className="h-14 shrink-0 flex items-center gap-3 px-6 border-b" style={{borderColor:"var(--border)",background:"var(--topbar)"}}>
        <button onClick={toggleSide}
          className="group relative w-8 h-8 -ml-1 rounded-lg flex items-center justify-center transition-colors hover:bg-[var(--pop-hover)] shrink-0"
          style={{color:"var(--muted)"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M9 4v16" stroke="currentColor" strokeWidth="1.8"/></svg>
          <span className="pointer-events-none absolute top-full left-0 mt-2 flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-[12px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50"
            style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>
            {sideCollapsed?"Expand sidebar":"Collapse sidebar"}
            <kbd className="px-1.5 py-0.5 rounded text-[11px] font-medium leading-none" style={{background:"var(--panel2)", border:"1px solid var(--border)", color:"var(--muted)"}}>Ctrl B</kbd>
          </span>
        </button>
        <span className="w-px h-5 shrink-0" style={{background:"var(--border)"}}></span>
        <div className="flex items-center gap-2 text-[15px] min-w-0">
          <button title="Workflows" className="font-medium shrink-0 transition-colors hover:brightness-110" style={{color:"var(--muted)"}}>Workflows</button>
          <span className="shrink-0" style={{color:"var(--faint)"}}>/</span>
          <div className="relative group/nm flex items-center gap-2 min-w-0">
            {editingName
              ? <input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="Untitled rule"
                  onFocus={e=>e.target.select()} onBlur={()=>setEditingName(false)}
                  onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Escape"){ e.preventDefault(); setEditingName(false); } }}
                  className="bg-transparent outline-none text-[15px] font-medium w-48 min-w-0 px-2.5 -mx-1 rounded-md"
                  style={{color:"var(--text)", height:"28px", lineHeight:"28px", borderBottom:"1px solid var(--accent)"}} />
              : <button onClick={()=>setEditingName(true)}
                  className="text-[15px] font-medium truncate rounded-md px-2.5 -mx-1 transition-colors hover:bg-[var(--pop-hover)]"
                  style={{color:"var(--text)", height:"28px", lineHeight:"28px", borderBottom:"1px solid transparent"}}>{name||"Untitled rule"}</button>}
            <span className="shrink-0 text-xs px-2 py-0.5 rounded-full"
              style={{background: isComplete?"var(--rdy-bg)":"var(--drf-bg)", color: isComplete?"var(--rdy-fg)":"var(--drf-fg)", border:`1px solid ${isComplete?"var(--rdy-bd)":"var(--drf-bd)"}`}}>{isComplete? "Ready" : "Draft"}</span>
            {!editingName &&
              <div className="absolute left-0 top-full mt-2 z-30 px-3 py-2 rounded-lg opacity-0 pointer-events-none group-hover/nm:opacity-100 transition-opacity whitespace-nowrap"
                style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}>
                <div className="text-[12.5px] font-semibold" style={{color:"var(--text)"}}>{name||"Untitled rule"}</div>
                <div className="text-[11px]" style={{color:"var(--muted)"}}>Click to rename</div>
              </div>}

              {/* one extremely subtle neutral depth gradient — no accent colour */}
              <div className="absolute inset-0" style={{ background:"linear-gradient(168deg, color-mix(in srgb, var(--bg) 82%, #000), var(--bg))" }} />
              {/* very faint neutral grid */}
              <div className="absolute inset-0" style={{ opacity:.3, backgroundImage:"linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px)", backgroundSize:"30px 30px", maskImage:"radial-gradient(130% 120% at 55% 6%, #000 28%, transparent 78%)", WebkitMaskImage:"radial-gradient(130% 120% at 55% 6%, #000 28%, transparent 78%)" }} />

              {/* top-left: app mark + name */}
              <div className="absolute z-10 top-4 left-6 flex items-center gap-2">
                <span className="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-[12px]" style={{ background: IS_LIVE?"linear-gradient(135deg,#d97757,#e89b82)":"linear-gradient(135deg,#5b6cff,#7c89ff)", color:"#fff" }}>{IS_LIVE?"G":"F"}</span>
                <span className="text-[13px] font-semibold tracking-tight" style={{ color:"var(--text)" }}>Flow</span>
              </div>

              {/* hero mockup — a framed recessed "canvas" of minimal node rows (tagline removed → more room);
                  its bottom is CUT OFF by the content card sliding over it (frame bottom + rail bleed under). */}
              <div className="absolute z-[1]" style={{ left:"24px", right:"24px", top:"58px" }}>
                <div className="relative rounded-2xl px-4 pt-4 pb-6" style={{ background:"color-mix(in srgb, var(--panel) 50%, transparent)", border:"1px solid var(--border)" }}>
                  {/* connector rail (runs past the bottom — gets cut off by the content card) */}
                  <div className="absolute" style={{ left:"27px", top:"30px", bottom:"-24px", width:"2px", background:"var(--border2)" }} />
                  <div className="flex flex-col gap-2.5">
                    {MINI.map((r,i)=>(
                      <div key={i} className="relative flex items-center" style={{ paddingLeft:"20px" }}>
                        <span className="absolute flex items-center justify-center" style={{ left:"6px", top:"50%", transform:"translate(-50%,-50%)", boxShadow:"0 0 0 4px var(--panel)" }}>{r.mk}</span>
                        {/* minimal node row — soft border, transparent fill; the icon tile is the only colour */}
                        <div className="flex-1 flex items-center gap-2.5 rounded-lg px-3 py-1.5" style={{ border:"1px solid color-mix(in srgb, var(--border) 70%, transparent)", background:"color-mix(in srgb, var(--panel) 35%, transparent)" }}>
                          <span className="shrink-0 w-6 h-6 rounded-md flex items-center justify-center" style={{ background:`color-mix(in srgb, ${r.c} 16%, transparent)`, color:r.c }}>{r.icon}</span>
                          <span className="shrink-0 text-[9px] font-semibold uppercase tracking-[0.1em]" style={{ color:r.c }}>{r.badge}</span>
                          <span className="text-[13px] leading-none truncate" style={{ color:"var(--muted)" }}>{r.text}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* ── SURFACE 2: CONTENT CARD (~50% — solid opaque, above the hero; text grouped at top, CTA
                pinned to the bottom with breathing space between via justify-between) ── */}
            <div className="relative z-10 flex flex-col justify-between px-8 pt-7 pb-7"
              style={{ background:"var(--panel2)", marginTop:"-26px", minHeight:"284px", boxShadow:"0 -10px 26px -12px rgba(0,0,0,.55)", borderTop:"1px solid var(--border2)" }}>
              {/* TOP group — three text lines kept tight together */}
              <div>
                <div className="text-[10.5px] font-semibold uppercase tracking-[0.14em] mb-2" style={{ color:"var(--muted)" }}>Workflow Builder</div>
                <div className="flex items-center gap-2 mb-2">
                  <div className="text-[20px] font-bold leading-tight tracking-[-0.01em]" style={{ color:"var(--text)" }}>Build automations in plain English</div>
                  <span className="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-[0.08em]" style={{ background:"color-mix(in srgb, var(--accent) 16%, transparent)", color:"var(--accent2)" }}>Beta</span>
                </div>
                <div className="text-[13px] leading-relaxed" style={{ color:"var(--muted)" }}>A trigger, an optional condition, an action — no code, just a sentence.</div>
              </div>
              {/* BOTTOM group — CTA row pinned to the bottom */}
              <div className="flex items-center justify-between gap-3">
                <button onClick={()=>setIntroOpen(false)} className="text-[13px] font-medium transition-colors hover:text-[var(--text)]" style={{ color:"var(--faint)" }}>Maybe later</button>
                <button onClick={startWalk}
                  className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-[13.5px] font-semibold transition-all hover:-translate-y-0.5"
                  style={{ background:"var(--accent)", color:"#fff", boxShadow:"0 10px 24px -12px var(--accent)" }}>
                  Take the walkthrough
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        );
      })()}

      {/* INTERACTIVE SPOTLIGHT WALKTHROUGH — dims the screen, highlights the live target with a box-shadow
          cutout, and shows a coachmark. The overlay is purely VISUAL (pointer-events:none) so the target
          (and the rest of the canvas) stays fully interactive; the tour advances only when the user actually
          completes each step (watched on the real doc). The coachmark's own controls re-enable pointer events. */}
      {tourActive && tourStep < TOUR_STEPS.length && ((tourDisp && tourDisp.rect) || tourRect || tourLastRect.current) && (()=>{
        const st = TOUR_STEPS[tourStep];
        // render from the EASED display values so frame + beacon + connector move in LOCKSTEP (no snapping).
        const frame = (tourDisp && tourDisp.rect) || tourRect || tourLastRect.current; // NEVER vanish
        const dispBeacon = (tourDisp && tourDisp.bx!=null) ? { x:tourDisp.bx, y:tourDisp.by } : tourBeacon;
        const ph = tourPhase();                       // current sub-phase (state-driven)
        const title = ph ? ph.title : st.key;
        const instr = ph ? ph.instr : null;
        const menuOn = tourMenuOpen();
        // FRAME padding — symmetric for menus/popovers/slots; EXTRA LEFT only for a canvas NODE CARD (card phase).
        const padT = 10, padR = 10, padB = 10, padL = menuOn ? 10 : 22;
        const fX = frame.left - padL, fY = frame.top - padT;            // dimmed-frame top-left
        const fW = frame.width + padL + padR, fH = frame.height + padT + padB; // frame size
        const fL = fX, fR = fX + fW, fT = fY, fB = fY + fH;                   // frame edges
        const vw = window.innerWidth, vh = window.innerHeight, cmW = 300, cmH = 134, GAP = 30; // generous gap (not hugging)
        // PLACEMENT PREFERENCE (A): prefer BELOW the target first, then RIGHT, then above/left only if no room.
        let cmTop, cmLeft, side; // side = which frame edge the card faces → drives the orthogonal connector
        const roomAbove = (fT - GAP - cmH) > 12;
        const roomLeft  = (fL - GAP - cmW) > 12;
        const roomRight = (fR + GAP + cmW) < vw - 12;
        const roomBelow = (fB + GAP + cmH) < vh - 12;
        if (roomBelow)      { cmTop = fB + GAP;             cmLeft = Math.min(Math.max(12, fL), vw - cmW - 12); side = "top";    } // card BELOW → faces frame bottom
        else if (roomRight) { cmLeft = fR + GAP;            cmTop = Math.min(Math.max(12, fT), vh - cmH - 12); side = "left";   } // card RIGHT → faces frame right
        else if (roomAbove) { cmTop = fT - GAP - cmH;       cmLeft = Math.min(Math.max(12, fL), vw - cmW - 12); side = "bottom"; } // card ABOVE → faces frame top
        else if (roomLeft)  { cmLeft = fL - GAP - cmW;      cmTop = Math.min(Math.max(12, fT), vh - cmH - 12); side = "right";  } // card LEFT  → faces frame left
        else                { cmTop = Math.min(fB + GAP, vh - cmH - 12); cmLeft = Math.min(Math.max(12, fL), vw - cmW - 12); side = "top"; }
        // CONNECTOR — the CARD endpoint may ONLY touch the card's TOP-LEFT or LEFT edge (never right/bottom):
        //   card below the frame (side "top")  → meet the card's TOP edge toward the LEFT;
        //   card to the right (side "left")     → meet the card's LEFT edge;
        //   card above (side "bottom")          → meet the card's TOP edge toward the LEFT (still top-left);
        //   card to the left (side "right")     → meet the card's LEFT edge.
        // Always orthogonal (vertical/horizontal, L-elbow if needed), always connected to both frame and card.
        const cardLeftX = cmLeft + 24;                 // a point near the card's LEFT (top-left attach zone)
        let pts;
        if (side==="top" || side==="bottom") {
          // card above/below → attach at the card's TOP edge, toward the LEFT; vertical line (L-elbow to reach).
          const fEdgeY = side==="top" ? fB : fT;       // frame edge facing the card
          const cAttach = { x:cardLeftX, y:cmTop };    // card TOP edge, left side
          const fx = Math.min(Math.max((fL+fR)/2, fL+14), fR-14);
          if (Math.abs(fx - cardLeftX) < 1) {          // aligned → single vertical
            pts = [{x:cardLeftX,y:fEdgeY},{x:cardLeftX,y:cAttach.y}];
          } else {                                     // L-elbow: frame edge → mid → down to the card top-left
            const midY = (fEdgeY + cAttach.y)/2;
            pts = [{x:fx,y:fEdgeY},{x:fx,y:midY},{x:cardLeftX,y:midY},{x:cardLeftX,y:cAttach.y}];
          }
        } else {
          // card left/right → attach at the card's LEFT edge; horizontal line (L-elbow to reach).
          const fEdgeX = side==="left" ? fR : fL;      // frame edge facing the card
          const cAttach = { x:cmLeft, y:Math.min(Math.max((fT+fB)/2, cmTop+16), cmTop+cmH-16) }; // card LEFT edge
          const fy = Math.min(Math.max((fT+fB)/2, fT+12), fB-12);
          if (Math.abs(fy - cAttach.y) < 1) {          // aligned → single horizontal
            pts = [{x:fEdgeX,y:cAttach.y},{x:cAttach.x,y:cAttach.y}];
          } else {                                     // L-elbow: frame edge → mid → into the card left edge
            const midX = (fEdgeX + cAttach.x)/2;
            pts = [{x:fEdgeX,y:fy},{x:midX,y:fy},{x:midX,y:cAttach.y},{x:cAttach.x,y:cAttach.y}];
          }
        }
        const frameAnchor = pts[0]; // the end touching the frame
        // CLICK-GATE: leave click-through HOLE(S). A phase may declare `holes` (a list of menu-item labels) → one
        // hole per matched element (e.g. Hardware row + Done button); else a single hole over the allowed element.
        const swallow = (e)=>{ e.preventDefault(); e.stopPropagation(); }; // blocked area → no-op (never dismiss/advance)
        const hpad = 4;
        const holeRects = [];
        if (ph && ph.holes && menuOn) {
          ph.holes.forEach(lab => { const el = tourMenuItemEl(lab); const r = el && el.getBoundingClientRect();
            if (r && (r.width||r.height)) holeRects.push({ top:Math.max(0,r.top-hpad), left:Math.max(0,r.left-hpad), right:Math.min(vw,r.left+r.width+hpad), bottom:Math.min(vh,r.top+r.height+hpad) }); });
        } else if (tourAllow) {
          const a = tourAllow; holeRects.push({ top:Math.max(0,a.top-hpad), left:Math.max(0,a.left-hpad), right:Math.min(vw,a.left+a.width+hpad), bottom:Math.min(vh,a.top+a.height+hpad) });
        }
        // a click is allowed only if it lands inside ANY hole; otherwise swallow it.
        const inAnyHole = (e)=> holeRects.some(h => e.clientX>=h.left && e.clientX<=h.right && e.clientY>=h.top && e.clientY<=h.bottom);
        const gate = (e)=>{ if (!inAnyHole(e)) swallow(e); };
        return (
        <div className="fixed inset-0 z-[58]" style={{ pointerEvents:"none" }}>
          {/* ── CLICK-GATE: ONE full-screen catcher (pointer-events:auto). A click INSIDE a hole is forwarded to the
                real element beneath (elementFromPoint); a click OUTSIDE every hole is swallowed (no-op). Supports
                MULTIPLE holes (Hardware row + Done button). On the FINAL info-only step there are NO holes →
                the canvas is fully non-interactive; only the coachmark's Finish (above this catcher) works. */}
          <div style={{ position:"absolute", inset:0, pointerEvents:"auto" }}
            onMouseDownCapture={(e)=>{ if (inAnyHole(e)) { swallow(e); const self=e.currentTarget; const x=e.clientX,y=e.clientY; self.style.pointerEvents="none"; const tgt=document.elementFromPoint(x,y); self.style.pointerEvents="auto"; if(tgt){ const md=new MouseEvent("mousedown",{bubbles:true,cancelable:true,clientX:x,clientY:y}); tgt.dispatchEvent(md); } } else swallow(e); }}
            onClickCapture={(e)=>{ if (inAnyHole(e)) { swallow(e); const self=e.currentTarget; const x=e.clientX,y=e.clientY; self.style.pointerEvents="none"; const tgt=document.elementFromPoint(x,y); self.style.pointerEvents="auto"; if(tgt){ const cl=new MouseEvent("click",{bubbles:true,cancelable:true,clientX:x,clientY:y}); tgt.dispatchEvent(cl); } } else swallow(e); }} />
          {/* dim the rest of the screen around the FRAME — position comes from the eased tween (lockstep), no CSS jump */}
          <div className="absolute rounded-xl" style={{ pointerEvents:"none",
            top:fY, left:fX, width:fW, height:fH,
            boxShadow:`0 0 0 9999px rgba(0,0,0,.5)`, outline:`1px solid color-mix(in srgb, ${st.accent} 22%, transparent)`, outlineOffset:"0px" }} />
          {/* connector: ALWAYS connected — a single orthogonal segment when spans overlap, else an L-elbow
              (vertical + horizontal); both ends touch the frame edge and the card edge. Never floating/diagonal. */}
          <svg className="absolute inset-0 w-full h-full" style={{ overflow:"visible", pointerEvents:"none" }}>
            <polyline points={pts.map(p=>`${p.x},${p.y}`).join(" ")} fill="none" stroke={st.accent} strokeWidth="1.5" strokeDasharray="4 4" strokeLinecap="round" strokeLinejoin="round" opacity="0.65" />
            <circle cx={frameAnchor.x} cy={frameAnchor.y} r="2.5" fill={st.accent} opacity="0.65" />
          </svg>
          {/* "TAP HERE" TARGET — a fast-paced white pulse marking the click spot (no cursor icon). Position comes
              from the eased tween (lockstep with the frame/connector). Hidden on the final info-only step. */}
          {!st.noBeacon && dispBeacon && (
            <span className="absolute" style={{ pointerEvents:"none", left:dispBeacon.x, top:dispBeacon.y, transform:"translate(-50%,-50%)", width:"0px", height:"0px" }}>
              {/* quick click ripples — emanate OUT from the point (tight max scale) */}
              <span className="tour-tapripple absolute rounded-full" style={{ left:"-10px", top:"-10px", width:"20px", height:"20px", border:"1.5px solid rgba(255,255,255,.9)" }} />
              <span className="tour-tapripple2 absolute rounded-full" style={{ left:"-10px", top:"-10px", width:"20px", height:"20px", border:"1.5px solid rgba(255,255,255,.6)" }} />
              {/* target-lock ring — contracts inward toward the centre on each beat */}
              <span className="tour-taplock absolute rounded-full" style={{ left:"-8px", top:"-8px", width:"16px", height:"16px", border:"1.5px solid rgba(255,255,255,.85)" }} />
              {/* snappy solid white core dot with glow + thin dark outline */}
              <span className="tour-tapcore absolute rounded-full" style={{ left:"-4.5px", top:"-4.5px", width:"9px", height:"9px", background:"rgba(255,255,255,1)", boxShadow:"0 0 6px 1.5px rgba(255,255,255,.8), 0 0 0 1.5px rgba(0,0,0,.45)" }} />
            </span>
          )}
          {/* coachmark — clean tour card; ABOVE the blockers with pointer-events:auto so Skip/controls stay clickable.
              Its top/left derive from the eased frame, so it moves in lockstep with the frame/connector (no snap). */}
          <div className="absolute rounded-2xl px-4 py-3.5" style={{ pointerEvents:"auto",
            top:cmTop, left:cmLeft, width:cmW, background:"var(--pop-bg)", boxShadow:"0 18px 50px -12px rgba(0,0,0,.6)" }}>
            <div className="flex items-center gap-2 mb-1.5">
              <span className="text-[10.5px] font-bold uppercase tracking-[0.14em]" style={{ color:st.accent }}>{title}</span>
              {!st.finalStep && <span className="ml-auto text-[11px] font-semibold" style={{ color:"var(--faint)" }}>{tourStep+1} of {TOUR_STEPS.filter(s=>!s.finalStep).length}</span>}
            </div>
            <div className="text-[13px] leading-snug mb-3" style={{ color:"var(--text)" }}>{instr}</div>
            <div className="flex items-center justify-between">
              {st.finalStep
                ? <span className="text-[12px] font-medium" style={{ color:"var(--faint)" }}>All done</span>
                : <button onClick={endTour} className="text-[12px] font-medium transition-colors hover:text-[var(--text)]" style={{ color:"var(--faint)" }}>Skip tour</button>}
              {st.finalStep
                ? <button onClick={endTour} className="px-3.5 h-8 rounded-lg text-[12.5px] font-semibold transition-all hover:-translate-y-0.5" style={{ background:"var(--accent)", color:"#fff", boxShadow:"0 6px 16px -10px var(--accent)" }}>Finish</button>
                : <span className="flex items-center gap-1">
                    {TOUR_STEPS.filter(s=>!s.finalStep).map((_,i)=>(<span key={i} className="rounded-full transition-all" style={{ width:i===tourStep?"16px":"6px", height:"6px", background: i<=tourStep ? st.accent : "var(--border2)" }} />))}
                  </span>}
            </div>
          </div>
        </div>
        );
      })()}

      {/* (old success toast removed — the final PUBLISH coachmark above is the tour's last step) */}
      {false && (
        <div className="guidein fixed left-1/2 bottom-8 z-[60] -translate-x-1/2 w-[400px] max-w-[calc(100vw-32px)] rounded-2xl overflow-hidden"
          style={{ background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-pop)" }}>
          <div className="h-0.5 w-full" style={{ background:"linear-gradient(90deg, var(--c-when), var(--c-if), var(--c-then))" }} />
          <div className="px-5 py-4 flex items-center gap-3.5">
            <span className="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center" style={{ background:"color-mix(in srgb, var(--accent) 16%, transparent)", color:"var(--accent2)" }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </span>
            <div className="flex-1 min-w-0">
              <div className="text-[14px] font-semibold leading-tight" style={{ color:"var(--text)" }}>Nice — you built your first workflow!</div>
              <div className="text-[12px] mt-0.5" style={{ color:"var(--muted)" }}>Keep going, or tweak any step.</div>
            </div>
            <button onClick={endTour} className="shrink-0 px-3.5 h-9 rounded-lg text-[12.5px] font-semibold transition-all hover:-translate-y-0.5" style={{ background:"var(--accent)", color:"#fff", boxShadow:"0 6px 16px -10px var(--accent)" }}>Done</button>
          </div>
        </div>
      )}

      {/* "How it works" — multi-step stepper (opened from the help menu / 💡) */}
      {guideOpen && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center px-4" style={{background:"rgba(0,0,0,.5)"}} onMouseDown={()=>{ setGuideOpen(false); setStep(0); }}>
          <div className="guidein w-[600px] max-w-full rounded-2xl overflow-hidden flex flex-col" style={{height:"540px", background:"var(--panel2)",border:"1px solid var(--border2)", boxShadow:"var(--shadow-pop)"}} onMouseDown={e=>e.stopPropagation()}>
            <div className="px-6 pt-6">
              <div className="rounded-2xl flex items-center justify-center px-4 w-full" style={{ height:"300px", overflow:"hidden", background:"var(--bg)", border:"1px solid var(--border)" }}>
                <div key={"g"+step} className="stepin flex justify-center items-center w-full" style={{ transform:"scale(0.82)" }}>{STEPPER[step].mock}</div>
              </div>
              <div className="flex items-end mt-5" style={{ minHeight:"30px" }}>
                <div key={"t"+step} className="stepin text-[22px] font-semibold leading-tight" style={{color:"var(--text)"}}>{STEPPER[step].title}</div>
              </div>
              <div className="mt-2" style={{ minHeight:"40px" }}>
                <div key={"d"+step} className="stepin text-[13px] leading-snug" style={{color:"var(--muted)"}}>{STEPPER[step].caption}</div>
              </div>
            </div>
            <div className="flex items-center justify-between px-6 pb-5 mt-auto pt-10">
              <button onClick={()=>{ setGuideOpen(false); setStep(0); }} className="text-[12.5px] font-medium transition-colors hover:text-[var(--text)]" style={{color:"var(--faint)"}}>Skip</button>
              <div className="flex items-center gap-1.5">
                {STEPPER.map((_,i)=>(<button key={i} onClick={()=>setStep(i)} className="rounded-full transition-all" style={{ width:i===step?"18px":"7px", height:"7px", background:i===step?"var(--accent)":"var(--border2)" }} />))}
              </div>
              <div className="flex items-center gap-2">
                {step>0 && (<button onClick={()=>setStep(s=>Math.max(0,s-1))} className="px-3.5 py-2 rounded-lg text-[13px] font-medium transition-colors hover:bg-[var(--pop-hover)]" style={{ background:"transparent", border:"1px solid var(--border2)", color:"var(--muted)" }}>Back</button>)}
                {step < STEPPER.length-1 ? (
                  <button onClick={()=>setStep(s=>Math.min(STEPPER.length-1,s+1))} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-[13px] font-semibold transition-all hover:-translate-y-0.5" style={{ background:"var(--accent)", color:"#fff", boxShadow:"0 8px 20px -10px var(--accent)" }}>Next<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                ) : (
                  <button onClick={()=>{ setGuideOpen(false); setStep(0); }} className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-[13px] font-semibold transition-all hover:-translate-y-0.5" style={{ background:"var(--accent)", color:"#fff", boxShadow:"0 8px 20px -10px var(--accent)" }}>Done</button>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Node reference & keyboard shortcuts now render in the right-section panel (see <aside>). */}
    </div>
      )}
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
