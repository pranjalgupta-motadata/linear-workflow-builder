  const Station = ({ marker, isFirst, isLast, head, headColor, headBg, hoverBg, onRemove, removeLabel, onInsert, onCopy, onHead, onAddCond, addLabel="new condition", addAccent="var(--c-if)", addActive=false, addHoverOnly=false, wideContent, dnd, onFocus, onClick, focused, help, innerRef, dense, gapBottom, okBorder, editing, bgLeft="16px", bgRight="16px", padLeft="34px", padRight="28px", padY, markerY, children }) => {
    const [xHover, setXHover] = useState(false);
    const pt = padY!==undefined ? padY : (dense ? 6 : PAD), bgBottom = gapBottom!==undefined ? gapBottom : (dense ? 12 : GAP), pb = pt + bgBottom, mc = markerY!==undefined ? markerY : (pt + HEAD/2);
    const active = focused && !!pop; // row's popover is open → keep its tint on (focus state)
    // row is the DROP target; the grip handle (below) is the drag SOURCE so slots stay clickable
    // the WHOLE row is the drag source now (drag from anywhere, not just the grip) — and still the drop target
    const dndProps = dnd ? { draggable:true, onDragStart:(e)=>dnd.start(dnd.id, e), onDragOver:(e)=>dnd.over(dnd.id, e), onDrop:(e)=>dnd.drop(dnd.id, e), onDragEnd:()=>dnd.end() } : {};
    const showBefore = dnd && dnd.hint && dnd.hint.id===dnd.id && dnd.hint.pos==="before";
    const showAfter  = dnd && dnd.hint && dnd.hint.id===dnd.id && dnd.hint.pos==="after";
    return (
    <div ref={innerRef} className="relative group" onMouseDown={onFocus} {...dndProps}
      style={{paddingLeft:padLeft, paddingRight:padRight, paddingTop:`${pt}px`, paddingBottom:`${pb}px`}}>
      {/* drop indicator line while dragging another node over this row */}
      {(showBefore||showAfter) && <div className="absolute h-0.5 rounded-full pointer-events-none" style={{ left:bgLeft, right:bgRight, top: showBefore?0:`calc(100% - ${bgBottom}px)`, background:"var(--accent)" }}/>}
      {/* role-tinted background: on hover, and while this row's popover is open */}
      <div className={"absolute rounded-lg transition-opacity pointer-events-none " + (active ? "opacity-100" : "opacity-0 group-hover:opacity-100")}
        style={{ top:0, bottom:`${bgBottom}px`, left:bgLeft, right:bgRight, background:hoverBg||"var(--panel2)" }}/>
      {/* persistent green border once the node's form is confirmed "Good to go" */}
      {okBorder && <div className="absolute rounded-lg pointer-events-none" style={{ top:0, bottom:`${bgBottom}px`, left:bgLeft, right:bgRight, border:"1px solid var(--rdy-bd)" }}/>}
      {/* rail */}
      <div className="absolute w-px" style={{ left:"9px", top:isFirst?`${mc}px`:0, bottom:isLast?`calc(100% - ${mc}px)`:0, background:"var(--border2)" }}/>
      {/* marker (optional) */}
      {marker && <span className="absolute flex items-center justify-center" style={{ left:"9px", top:`${mc}px`, transform:"translate(-50%,-50%)" }}>{marker}</span>}
      {/* drag handle — visual cue on the FAR LEFT (the whole row is the drag source, so this is just a grip) */}
      {dnd && <span title="Drag to move" className="absolute flex items-center justify-center opacity-0 group-hover:opacity-100 transition cursor-grab active:cursor-grabbing text-[var(--faint)] hover:text-[var(--text)]"
        style={{ left:"-22px", top:`${mc}px`, transform:"translateY(-50%)" }}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </span>}
      <div onClick={onClick} className={"relative flex items-start gap-4 " + (onClick ? "cursor-pointer" : "")}>
        <div className={"flex-1 min-w-0 text-[17.5px]" + (wideContent ? " flex items-start gap-1" : "")} style={{lineHeight:`${HEAD}px`, wordSpacing:"2px"}}>
          {head && <span className={"relative group/help inline-flex items-center align-top mr-2.5" + (wideContent ? " shrink-0" : "")} style={{height:`${HEAD}px`}}>
            <Badge color={headColor||"var(--faint)"} bg={headBg||"var(--panel2)"} className={"inline-flex items-center " + (help ? "cursor-help" : "")}>{head}</Badge>
            {help && <div className="absolute z-30 left-0 top-full mt-2 w-72 p-3.5 rounded-xl opacity-0 pointer-events-none group-hover/help:opacity-100 transition-opacity"
              style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}>
              <HelpCard help={help} />
            </div>}
          </span>}
          <span className={(wideContent ? "flex-1 min-w-0 block align-top " : "inline align-top ") + (xHover ? "striking" : "")}>
            {children}
          </span>
        </div>
        {/* row actions on the right: drag handle + copy + remove (revealed on hover). Rendered only when
           the node has node-level actions — otherwise it reserves empty space that shoves in-card clusters left. */}
        {(onAddCond || onHead || onCopy || onRemove) &&
        <div className="relative shrink-0 flex items-center gap-0.5" style={{height:`${HEAD}px`}}>
          {xHover && removeLabel &&
            <div className="absolute right-0 px-2 py-1 rounded-md text-[11px] whitespace-nowrap" style={{ bottom:"28px", background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)" }}>{removeLabel}</div>}
          {onAddCond && <>
            <button onMouseDown={(e)=>{ e.stopPropagation(); onAddCond(e.currentTarget); }} title={addLabel}
              className={"inline-flex items-center gap-1 rounded-md text-[12px] font-medium whitespace-nowrap transition-[color,opacity] " + (addActive ? "" : "text-[var(--muted)] ") + (addHoverOnly && !addActive ? "opacity-0 group-hover:opacity-100" : "")}
              style={{ padding:"4px 7px", ...(addActive?{color:addAccent}:{}) }}
              onMouseEnter={(e)=>{ if(!addActive) e.currentTarget.style.color=addAccent; }}
              onMouseLeave={(e)=>{ if(!addActive) e.currentTarget.style.color=""; }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
              {addLabel}
            </button>
            {(onHead || onCopy || onRemove) &&
              <span className="shrink-0 opacity-0 group-hover:opacity-100 transition-opacity" style={{ width:"1px", height:"16px", background:"var(--border2)", margin:"0 4px" }}/>}
          </>}
          {onHead &&
            <button onMouseDown={(e)=>{ e.stopPropagation(); onHead(e.currentTarget); }} title="Change trigger"
              className="rounded-md flex items-center justify-center transition-colors opacity-0 group-hover:opacity-100 hover:bg-[var(--pop-hover)] text-[var(--faint)] hover:text-[var(--text)]"
              style={{ padding:"6px" }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 0 1 15-6.7L21 8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M21 3v5h-5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M3 21v-5h5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>}
          {onCopy &&
            <button onMouseDown={(e)=>{ e.stopPropagation(); onCopy(); }} title="Duplicate"
              className="rounded-md flex items-center justify-center transition-colors opacity-0 group-hover:opacity-100 hover:bg-[var(--pop-hover)] text-[var(--faint)] hover:text-[var(--text)]"
              style={{ padding:"6px" }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15V5a2 2 0 012-2h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
            </button>}
          <button onMouseDown={(e)=>{ if(!onRemove) return; e.stopPropagation(); setPop(null); onRemove(); }}
            onMouseEnter={()=>setXHover(true)} onMouseLeave={()=>setXHover(false)}
            className={"rounded-md flex items-center justify-center transition-colors " + (onRemove ? "opacity-0 group-hover:opacity-100" : "opacity-0 pointer-events-none")}
            style={{ color: xHover ? "var(--red)" : "var(--faint)", background: xHover ? "rgba(248,81,73,0.18)" : "transparent", padding:"6px" }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>}
      </div>
      {/* "Add step" — neutral pill sitting in the gap below the row (insert between this node and the next); hover-revealed */}
      {onInsert &&
        <button onMouseDown={(e)=>{ e.stopPropagation(); onInsert(e.currentTarget); }} title="Add a step here"
          className="absolute z-10 inline-flex items-center gap-1 rounded-full opacity-0 group-hover:opacity-100 transition-all hover:text-[var(--text)]"
          style={{ left:"0px", bottom:`${(bgBottom/2)-10}px`, height:"20px", padding:"0 9px 0 7px",
                   border:"1px solid var(--border2)", background:"var(--panel2)", color:"var(--muted)", boxShadow:"0 0 0 3px var(--bg), var(--shadow-sm)" }}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/></svg>
          <span className="text-[10.5px] font-medium whitespace-nowrap">Add step</span>
        </button>}
    </div>
    );
  };

  /* trunk opener — the green "Then do this…" prompt for the FIRST action. Once any action exists (or we've
     branched, where steps are added inside branches), it disappears; "add step" then lives in the bottom CTA bar. */
  // a 44px connector-line gap so the Opener sits the SAME distance below the trigger/last node as the insert zones
  const OpenerGap = () => (
    <div className="relative" style={{ height:"31px" }}>
      <div className="absolute" style={{ left:"9px", top:0, bottom:0, width:"1px", background:"var(--border2)" }}/>
    </div>
  );
  // the opener is a NEUTRAL placeholder (same palette as the Add-step card) — it's not a real action yet.
  // Picking a step CONVERTS it in place into that node; an action only turns the THEN green once it exists.
  const OPENER_MARK = (
    <span className="flex items-center justify-center rounded-full" style={{ width:"18px", height:"18px", border:"1px solid var(--border2)", background:"var(--panel2)", color:"var(--muted)", boxShadow:"0 0 0 3px var(--bg)" }}>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/></svg>
    </span>
  );
  const Opener = ({ path }) => {
    if (!hasTrigger)
      return (<><OpenerGap />
        <Station marker={OPENER_MARK} isLast head="Then" headColor="var(--muted)" headBg="var(--panel2)" hoverBg="var(--pop-hover)" help={NODE_HELP.action}>
          <span className="text-[16px]" style={{color:"var(--faint)", opacity:.55}} title="Add a trigger first">do this…</span>
        </Station></>);
    if (flow.length>0) return null; // ANY node added → it took the opener's place; further steps use "Add step" + the end cap
    return (<><OpenerGap />
      <Station marker={OPENER_MARK} isLast head="Then" headColor="var(--muted)" headBg="var(--panel2)" hoverBg="var(--pop-hover)" help={NODE_HELP.action} innerRef={(el)=>setRowRef("__then", el)}
        focused={focusKey==="__then"} onFocus={()=>setFocusKey("__then")}>
        <Slot value={null} placeholder="do this…" open={openSlot==="__then"} innerRef={(el)=>setRowRef("__thenSlot", el)} onClick={(e)=>openMain(path,e)} />
      </Station></>);
  };

  /* branch opener — reveals a full add-step NODE on hover (icon + "Add step in this branch"), matching the
     main flow's InsertZone ghost-card. Stays revealed while its add-menu is open (no collapse-jump). */
  const BranchAdd = ({ path, branchId }) => {
    const addOpen = branchMenuPath === pathKey(path); // this branch's add-menu is open → stay expanded
    return (
    <div ref={(el)=>{ if(el) branchAddRefs.current[pathKey(path)]=el; }} onClick={(e)=>openBranchAdd(path,e)}
      onDragOver={branchId!=null ? (e)=>{ e.preventDefault(); } : undefined} onDrop={branchId!=null ? (e)=>dropInto(branchId, e) : undefined}
      className="group/add relative cursor-pointer" style={{paddingTop:`${PAD}px`, paddingBottom:`${PAD+GAP}px`}}>
      {/* branch rail stub down to the marker centre */}
      <div className="absolute w-px" style={{ left:"9px", top:0, bottom:`calc(100% - ${MC}px)`, background:"var(--border2)" }}/>
      {/* + marker on the rail, revealed on hover / while open */}
      <span className={"absolute flex items-center justify-center w-[18px] h-[18px] rounded-full transition-all duration-200 " + (addOpen ? "opacity-100" : "opacity-0 group-hover/add:opacity-100")}
        style={{ left:"9px", top:`${MC}px`, transform:"translate(-50%,-50%)", border:"1px solid var(--border2)", background:"var(--panel2)", color:"var(--muted)", boxShadow:"0 0 0 3px var(--bg)", zIndex:2 }}>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/></svg>
      </span>
      {/* full add-step node card — same styling as the main flow's "Add step" */}
      <div className={"flex items-center gap-1.5 rounded-lg text-[13px] font-medium transition-all duration-200 hover:bg-[var(--pop-hover)] hover:text-[var(--text)] hover:border-[var(--border)] " + (addOpen ? "opacity-100" : "opacity-0 group-hover/add:opacity-100")}
        style={{ marginLeft:"34px", paddingLeft:"12px", paddingRight:"12px", height:`${HEAD}px`, color:"var(--muted)", border:"1px solid var(--border2)", background:"var(--panel2)", boxShadow:"var(--shadow-sm)" }}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
        Add step in this branch
      </div>
    </div>
    );
  };

  /* a small clickable AND/OR combiner chip (gold) shown between condition clauses */
  // the AND/OR joiner shown between clauses — an underlined editable word (like a slot), not a badge.
  // Click to toggle and ↔ or.
  const CombinerChip = ({ combiner, onClick }) => (
    <button onClick={onClick} data-tip="Toggle AND / OR"
      className="slot mx-1 align-baseline font-medium" style={{ color:"var(--c-if)" }}>
      {(combiner||"and")}
    </button>
  );
  /* inline gold escalation affordance (a small chip button on a condition row) */
  const Escalate = ({ label, onClick }) => (
    <button onClick={(e)=>{ e.stopPropagation(); onClick(); }}
      className="ml-2 align-middle inline-flex items-center text-[11px] font-medium px-2 py-[2px] rounded-full opacity-80 hover:opacity-100 transition-all hover:brightness-110"
      style={{ color:"var(--c-if)", background:"var(--c-if-bg)", border:"1px solid color-mix(in srgb, var(--c-if) 28%, transparent)" }}>{label}</button>
  );

  // render the clause chain for an INLINE condition node
  // INLINE condition = DNF. clauses is a flat array; a clause with `.or` starts a NEW or-group.
  // AND within a group (rendered inline), OR between groups (rendered as stacked "or" rows). The
  // joiner word is an underlined toggle: click "and"↔"or" to merge/split groups.
  // remove one clause from an inline condition / a branch path; keep the new first clause as a group start
  const removeClause = (path, ci) => setFlow(f => { const n=nodeAt(f,path); const cls=(n&&n.clauses)||[]; if(cls.length<=1) return mergeAdjacentConditions(treeRemove(f, path)); const next=cls.filter((_,k)=>k!==ci); next[0]={...next[0]}; delete next[0].conn; delete next[0].or; const patch={ clauses: next }; if(next.length<=1) patch.cardMode=undefined; return treeUpdate(f, path, patch); });
  // duplicate a single clause-line directly below itself (a copy "per card", like a trigger row's copy)
  const copyClause = (path, ci) => setFlow(f => { const n=nodeAt(f,path); const cls=(n&&n.clauses)||[]; const c=cls[ci]; if(!c) return f; const dup={...c, conn:c.conn||"and"}; const next=[...cls.slice(0,ci+1), dup, ...cls.slice(ci+1)]; return treeUpdate(f, path, { clauses: next }); });
  const removePathClause = (path, pi, ci) => setFlow(f => { const n=nodeAt(f,path); const paths=n.paths.map((p,k)=>{ if(k!==pi) return p; const next=(p.clauses||[]).filter((_,j)=>j!==ci); if(next.length){ next[0]={...next[0]}; delete next[0].or; } return {...p, clauses:next}; }); return treeUpdate(f, path, { paths }); });
  // single add affordance → asks And (same group) / Or (new group)
  const openAndOr = (anchor, onAnd, onOr) => open(anchor, [{id:"and",label:"And",sub:"same group"},{id:"or",label:"Or",sub:"new group"}], (i)=> i.id==="and"?onAnd():onOr(), "Add condition", {noSearch:true});
  // CARD-based DNF: one card per OR-group; AND clauses stack as rows inside a card. Connectors are toggles
  // (or → splits into a new card, and → merges into the card above). One "+" opens the And/Or chooser.
  const groupClauses = (clauses) => { const g=[]; (clauses||[]).forEach((c,ci)=>{ if(ci===0||c.or) g.push([]); g[g.length-1].push(ci); }); return g; };
  // top-level condition logic: "any" → groups OR'd, AND within a group (DNF: [a&b] or [c&d]).
  //                            "all" → groups AND'd, OR within a group (CNF: [a|b] and [c|d]).
  // `.or` on a clause is just a GROUP BOUNDARY (start a new group); the displayed connectors derive from match.
  const matchOf = (node) => node.match || "any";
  const innerOpOf = (node) => matchOf(node)==="any" ? "and" : "or"; // connector WITHIN a group
  const outerOpOf = (node) => matchOf(node)==="any" ? "or" : "and"; // connector BETWEEN groups
  // chooser for "new condition": pick the connector. First clause sets all/any; afterwards the inner
  // connector extends the current group, the other one starts a new group.
  // pick the connector (and/or) for the next condition line; each line carries its own `conn`.
  const openNewCondition = (anchor, clauses, m, addFn, labels) => open(anchor, [{id:"and",label:(labels&&labels.and)||"And"},{id:"or",label:(labels&&labels.or)||"Or"}], (i)=>addFn(i.id), "New condition", {noSearch:true});
  const inlineClauses = (path, node, wide, noInlineAdd) => {
    const k = pathKey(path);
    const clauses = node.clauses || [];
    // GROUPING — cardMode model (FINALIZED RULE): the FIRST connector picked sets the group's STICKY type
    // (node.cardMode = "and"|"or"). The MAIN card = clause 0 + every clause whose connector MATCHES cardMode
    // (kept together even when non-adjacent); each OPPOSITE-connector clause = its own card. So a clause added
    // with the SAME type as the first connector STAYS in the same group — only the opposite type breaks out.
    const mode = node.cardMode || (clauses[1] && clauses[1].conn) || "and";
    const main = []; const groups = [];
    clauses.forEach((c,ci)=>{ if(ci===0 || (c.conn||"and")===mode) main.push(ci); else groups.push([ci]); });
    if(main.length) groups.unshift(main);
    // the connector badge is a plain and/or toggle on the clause's own `conn`; grouping just follows the rule above.
    const connBadge = (ci) => { const cur = node.clauses[ci].conn || "and";
      return <button onClick={(e)=>{ e.stopPropagation(); setFlow(f=>{ const n=nodeAt(f,path); const cls=(n&&n.clauses)||[]; const patch={ clauses: cls.map((c,j)=> j===ci ? {...c, conn:(c.conn||"and")==="and"?"or":"and"} : c) }; if(!n.cardMode && cls.length>=2) patch.cardMode=(cls[1]&&cls[1].conn)||"and"; return treeUpdate(f,path,patch); }); }} data-tip="Toggle AND / OR"
        className="shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-[0.1em] px-2 py-2 leading-none rounded-md whitespace-nowrap transition-colors hover:bg-[var(--pop-hover)] hover:text-[var(--text)]"
        style={{ color:"var(--muted)", background:"var(--panel2)" }}>{cur}{COND_CHEV}</button>; };
    const clauseEls = (ci) => {
      const c = node.clauses[ci]; const f = flowFD(node, c.field); const rel = f?.type==="date" && isRelDateOp(c.op);
      return (<>
        <Slot tone="cond" value={f?.label} placeholder="a field" open={openSlot===`${k}:c${ci}:field`} dataAnchor={`cond:${node.id}:${ci}`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseField(path,node,ci,e)} />
        {c.field && <> <Slot tone="cond" value={c.op} placeholder="is" open={openSlot===`${k}:c${ci}:op`} dataAnchor={`cop:${node.id}:${ci}`} onClick={(e)=>pickClauseOp(path,node,ci,e)} /> </>}
        {c.field && rel
          ? <> <Slot tone="cond" value={c.value} placeholder="0" open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseValue(path,node,ci,e)} /> <Slot tone="cond" value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:c${ci}:unit`} onClick={(e)=>pickClauseUnit(path,ci,e)} /> </>
          : (c.field && <Slot tone="cond" wrap={Array.isArray(c.value)} value={valueDisplay(c.value, openSlot===`${k}:c${ci}:value`)} smartKind={valueSmartKind(c, `${k}:c${ci}:value`)} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>reopenClauseSmart(path,node,ci,e)} onClear={()=>clearSmartValue((v)=>updateClause(path,ci,{value:v}), `${k}:c${ci}:value`)} />)}
      </>);
    };
    // one clause = one line. `first` (= first line of its group) left-aligns the badge ("Check if" / "or");
    // AND-lines right-align their badge so it sits next to the field.
    const clauseLine = (ci, first, gi=0) => {
      const dragOn = clauses.length>1;
      const showB = clauseHint && clauseHint.k===k && clauseHint.ci===ci && clauseHint.pos==="before";
      const showA = clauseHint && clauseHint.k===k && clauseHint.ci===ci && clauseHint.pos==="after";
      // alignment: only the very first line (CHECK IF, group 0) is flush-left. Every other badge — both the
      // group-boundary OR/AND (first line of groups 1+) and the within-group connectors — is right-aligned in
      // the 72px column so it sits next to its field. Within-group sub-conditions of later groups (gi>0) get a
      // little extra left indent so they read as nested under their group's boundary connector.
      const flushLeft = first && gi===0;
      const subIndent = (!first && gi>0) ? 20 : 0;
      // BETWEEN-group connector = the first line of an opposite-type card (gi>0): it sits RIGHT-ALIGNED in the 72px
      // badge gutter (next to "Check if") so the user can tell groups apart at a glance. WITHIN-group connectors
      // stay inline at the text's left margin (the first inline child of .clause-flow below).
      const isBoundary = first && gi>0;
      const lineActive = !!openSlot && openSlot.indexOf(`${k}:c${ci}:`)===0; // a popover anchored to THIS line is open → pin its cluster
      return (
      <div key={ci} className={"group/cl relative flex flex-wrap items-start gap-x-2.5 " + (dragOn ? "cursor-grab active:cursor-grabbing" : "")} style={{minHeight:`${HEAD}px`, paddingLeft:subIndent?`${subIndent}px`:undefined}}
        draggable={dragOn} onDragStart={dragOn?(e)=>clauseDragStart(k, ci, e):undefined} onDragEnd={dragOn?clauseDragEnd:undefined}
        onDragOver={dragOn?(e)=>clauseDragOver(k, ci, e):undefined} onDrop={dragOn?(e)=>clauseDrop(path, ci, e):undefined}>
        {(showB||showA) && <div className="absolute h-0.5 rounded-full pointer-events-none" style={{ left:0, right:0, [showB?"top":"bottom"]:-4, background:"var(--accent)" }}/>}
        {dragOn && <span title="Drag into another group"
          className="absolute flex items-center justify-center opacity-0 group-hover/cl:opacity-100 transition text-[var(--faint)]"
          style={{ left:"-15px", top:`${HEAD/2}px`, transform:"translateY(-50%)" }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </span>}
        {/* the "Check if" badge belongs ONLY to the real CHECK IF condition node (wide). Get "where" / flat shows nothing. */}
        {!(ci===0 && !wide) && <span className="shrink-0 flex items-center" style={{width:"72px", height:`${HEAD}px`, justifyContent: (flushLeft||isBoundary)?"flex-start":"flex-end"}}>
          {ci===0
            ? <span className="relative group/help inline-flex items-center">
                <Badge color="var(--c-if)" bg="var(--c-if-bg)" className="cursor-help">Check if</Badge>
                <div className="absolute z-30 left-0 top-full mt-2 w-72 p-3.5 rounded-xl opacity-0 pointer-events-none group-hover/help:opacity-100 transition-opacity" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}><HelpCard help={NODE_HELP.condition} /></div>
              </span>
            : (isBoundary ? connBadge(ci) : null)}
        </span>}
        {/* sentence tokens (field · op · value) flow as ONE inline run → wrapped lines (incl. a long multi-value
            list) return to the LEFT MARGIN like a paragraph, not a hanging indent under the value column.
            "+ new condition" is the LAST inline child → it sits at the end of the line, or flows onto the
            wrapped line after the value (moves WITH the content). The AND/OR connector (ci>0) is the FIRST inline
            child → it sits at the sentence's LEFT MARGIN (aligned with the field text), not in a side column. */}
        <span className="flex-1 min-w-0 self-center clause-flow" style={{minHeight:`${HEAD}px`, lineHeight:`${HEAD}px`}}>
          {ci!==0 && !isBoundary && <>{connBadge(ci)}{" "}</>}
          {clauseEls(ci)}
        </span>
        {/* right cluster — "+ new condition │ copy × " (matches the trigger node's "+ add trigger │ ⟳ ×"). */}
        <span className={"shrink-0 flex items-center gap-1 transition-opacity " + (lineActive ? "opacity-100" : "opacity-0 group-hover/cl:opacity-100")} style={{height:`${HEAD}px`}}>
          {!noInlineAdd && <>
            <button onClick={(e)=>{ e.stopPropagation(); setOpenSlot(`${k}:c${ci}:add`); openNewCondition(e.currentTarget, node.clauses, null, (c)=>addClauseAndPick(path,node,c,ci)); }} title="Add condition" className={"inline-flex items-center gap-1 text-[12px] font-medium whitespace-nowrap transition-colors " + (openSlot===`${k}:c${ci}:add` ? "text-[var(--c-if)]" : "text-[var(--muted)] hover:text-[var(--c-if)]")} style={{padding:"2px 5px"}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
              new condition
            </button>
            <span className="self-center shrink-0" style={{width:"1px", height:"14px", background:"var(--border2)"}} />
          </>}
          <button onClick={(e)=>{ e.stopPropagation(); copyClause(path, ci); }} title="Duplicate condition" className="rounded-md flex items-center justify-center transition-colors hover:bg-[var(--pop-hover)] text-[var(--faint)] hover:text-[var(--text)]" style={{padding:"5px"}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15V5a2 2 0 012-2h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
          <DeleteBtn onClick={(e)=>{ e.stopPropagation(); removeClause(path, ci); }} title={clauses.length>1?"Remove condition":"Clear condition"} />
        </span>
      </div>
      );
    };
    // FLAT form (Get "where"): flex-COL so each clause line stretches full-width (its ml-auto cluster reaches the
    // card's right edge); multiple clauses stack. No group cards.
    if (!wide) return (<div className="flex-1 min-w-0 flex flex-col gap-1.5">{clauses.map((c,ci)=>clauseLine(ci, ci===0))}</div>);
    // GROUPED form (the CHECK IF node): consecutive AND clauses share a card; an OR (conn==="or") starts a NEW card.
    // each card breaks out to the marker edge (−18 left / −12 right) and carries the node's vertical padding so it
    // is a full-height 42px card hugging the marker — identical to the trigger card. Tints on hover.
    return (
      <div className="flex flex-col gap-4 w-full">
        {groups.map((grp,gi)=>{ const grpActive = grp.some(ci => !!openSlot && openSlot.indexOf(`${k}:c${ci}:`)===0);
          return (
          <div key={gi} className={"flex flex-col gap-2.5 rounded-lg transition-colors " + (grpActive ? "bg-[var(--c-if-h)]" : "hover:bg-[var(--c-if-h)]")}
            style={{ marginLeft:"-18px", marginRight:"-12px", paddingLeft:"18px", paddingRight:"12px", paddingTop:`${PAD}px`, paddingBottom:`${PAD}px` }}>
            {grp.map((ci,j)=>clauseLine(ci, j===0, gi))}
          </div>
          ); })}
      </div>
    );
  };

  // WAIT clauses — its OWN renderer (NOT the gold condition one). 1:1 with the condition clause/group behaviour
  // (AND/OR, group cards, + new condition, copy/×, split-into-group, match any/all) but a NEUTRAL palette.
  // Reuses the colour-agnostic data handlers (addClauseAndPick/removeClause/copyClause/splitClauseToGroup/pickClause*).
  const waitClauses = (path, node) => {
    const k = pathKey(path);
    const clauses = node.clauses || [];
    // same grouping rule as the condition node — cardMode model: the FIRST connector sets the sticky type
    // (node.cardMode); main card = clause 0 + every clause whose connector MATCHES that type (non-adjacent OK);
    // each opposite-type clause = its own card. Mirrors inlineClauses exactly.
    const mode = node.cardMode || (clauses[1] && clauses[1].conn) || "and";
    const main = []; const groups = [];
    clauses.forEach((c,ci)=>{ if(ci===0 || (c.conn||"and")===mode) main.push(ci); else groups.push([ci]); });
    if(main.length) groups.unshift(main);
    const connBadge = (ci) => { const cur = node.clauses[ci].conn || "and";
      return <button onClick={(e)=>{ e.stopPropagation(); setFlow(f=>{ const n=nodeAt(f,path); const cls=(n&&n.clauses)||[]; const patch={ clauses: cls.map((c,j)=> j===ci ? {...c, conn:(c.conn||"and")==="and"?"or":"and"} : c) }; if(!n.cardMode && cls.length>=2) patch.cardMode=(cls[1]&&cls[1].conn)||"and"; return treeUpdate(f,path,patch); }); }} data-tip="Toggle AND / OR"
        className="shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-[0.1em] px-2 py-2 leading-none rounded-md whitespace-nowrap transition-colors hover:bg-[var(--pop-hover)] hover:text-[var(--text)]"
        style={{ color:"var(--muted)", background:"var(--panel2)" }}>{cur}{COND_CHEV}</button>; };
    const clauseEls = (ci) => {
      const c = node.clauses[ci]; const f = flowFD(node, c.field); const rel = f?.type==="date" && isRelDateOp(c.op);
      return (<>
        <Slot value={f?.label} placeholder="a field" open={openSlot===`${k}:c${ci}:field`} dataAnchor={`cond:${node.id}:${ci}`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseField(path,node,ci,e)} />
        {c.field && <> <Slot value={c.op} placeholder="is" open={openSlot===`${k}:c${ci}:op`} dataAnchor={`cop:${node.id}:${ci}`} onClick={(e)=>pickClauseOp(path,node,ci,e)} /> </>}
        {c.field && rel
          ? <> <Slot value={c.value} placeholder="0" open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseValue(path,node,ci,e)} /> <Slot value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:c${ci}:unit`} onClick={(e)=>pickClauseUnit(path,ci,e)} /> </>
          : (c.field && <Slot wrap={Array.isArray(c.value)} value={valueDisplay(c.value, openSlot===`${k}:c${ci}:value`)} smartKind={valueSmartKind(c, `${k}:c${ci}:value`)} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>reopenClauseSmart(path,node,ci,e)} onClear={()=>clearSmartValue((v)=>updateClause(path,ci,{value:v}), `${k}:c${ci}:value`)} />)}
      </>);
    };
    const clauseLine = (ci, first, gi=0) => {
      const dragOn = clauses.length>1;
      const showB = clauseHint && clauseHint.k===k && clauseHint.ci===ci && clauseHint.pos==="before";
      const showA = clauseHint && clauseHint.k===k && clauseHint.ci===ci && clauseHint.pos==="after";
      const subIndent = (!first && gi>0) ? 20 : 0;
      const isBoundary = first && gi>0; // first line of an opposite-type card → connector sits left-aligned in the gutter (under WAIT)
      const lineActive = !!openSlot && openSlot.indexOf(`${k}:c${ci}:`)===0; // a popover anchored to THIS line is open → pin its cluster
      return (
      <div key={ci} className={"group/cl relative flex flex-wrap items-start gap-x-2.5 " + (dragOn ? "cursor-grab active:cursor-grabbing" : "")} style={{minHeight:`${HEAD}px`, paddingLeft:subIndent?`${subIndent}px`:undefined}}
        draggable={dragOn} onDragStart={dragOn?(e)=>clauseDragStart(k, ci, e):undefined} onDragEnd={dragOn?clauseDragEnd:undefined}
        onDragOver={dragOn?(e)=>clauseDragOver(k, ci, e):undefined} onDrop={dragOn?(e)=>clauseDrop(path, ci, e):undefined}>
        {(showB||showA) && <div className="absolute h-0.5 rounded-full pointer-events-none" style={{ left:0, right:0, [showB?"top":"bottom"]:-4, background:"var(--accent)" }}/>}
        {dragOn && <span title="Drag into another group" className="absolute flex items-center justify-center opacity-0 group-hover/cl:opacity-100 transition text-[var(--faint)]" style={{ left:"-15px", top:`${HEAD/2}px`, transform:"translateY(-50%)" }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </span>}
        {ci===0
          ? <span className="shrink-0 flex items-center gap-x-2" style={{height:`${HEAD}px`}}><Badge color="var(--text)" bg="var(--panel2)">WAIT</Badge><Word>until</Word></span>
          : <span className="shrink-0 flex items-center" style={{width:"72px", height:`${HEAD}px`, justifyContent: isBoundary?"flex-start":"flex-end"}}>{isBoundary ? connBadge(ci) : null}</span>}
        {/* sentence tokens flow as ONE inline run; WITHIN-group connector is inline-left (first child); BETWEEN-group
            connector sits left in the gutter (above). "+ new condition" is the LAST inline child. */}
        <span className="flex-1 min-w-0 self-center clause-flow" style={{minHeight:`${HEAD}px`, lineHeight:`${HEAD}px`}}>
          {ci!==0 && !isBoundary && <>{connBadge(ci)}{" "}</>}
          {clauseEls(ci)}
        </span>
        {/* right cluster — "+ new condition │ copy ×" (matches the trigger node's cluster). */}
        <span className={"shrink-0 flex items-center gap-1 transition-opacity " + (lineActive ? "opacity-100" : "opacity-0 group-hover/cl:opacity-100")} style={{height:`${HEAD}px`}}>
          <button onClick={(e)=>{ e.stopPropagation(); setOpenSlot(`${k}:c${ci}:add`); openNewCondition(e.currentTarget, node.clauses, null, (c)=>addClauseAndPick(path,node,c,ci)); }} title="Add condition" className={"inline-flex items-center gap-1 text-[12px] font-medium whitespace-nowrap transition-colors " + (openSlot===`${k}:c${ci}:add` ? "text-[var(--text)]" : "text-[var(--muted)] hover:text-[var(--text)]")} style={{padding:"2px 5px"}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
            new condition
          </button>
          <span className="self-center shrink-0" style={{width:"1px", height:"14px", background:"var(--border2)"}} />
          <button onClick={(e)=>{ e.stopPropagation(); copyClause(path, ci); }} title="Duplicate condition" className="rounded-md flex items-center justify-center transition-colors hover:bg-[var(--pop-hover)] text-[var(--faint)] hover:text-[var(--text)]" style={{padding:"5px"}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15V5a2 2 0 012-2h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
          <DeleteBtn onClick={(e)=>{ e.stopPropagation(); removeClause(path, ci); }} title={clauses.length>1?"Remove condition":"Clear condition"} />
        </span>
      </div>
      );
    };
    // NO per-group card bg/breakout — the WAIT node's Station card is the single card; OR-groups separate via the "or" rows.
    return (
      <div className="flex flex-col gap-1.5 w-full">
        {groups.map((grp,gi)=>(
          <div key={gi} className="flex flex-col">
            {grp.map((ci,j)=>clauseLine(ci, j===0, gi))}
          </div>
        ))}
      </div>
    );
  };
  // render a BRANCH path's condition as DNF groups (same model as inlineClauses): a clause with .or
  // starts a new OR-group (a new "or" row); AND within a group; the joiner is an underlined toggle.
  const pathClauses = (path, node, pi, wide, noInlineAdd) => {
    const k = pathKey(path), pobj = node.paths[pi];
    const clauses = pobj.clauses || [];
    const connBadge = (ci) => { const cur = pobj.clauses[ci].conn || "and";
      return <button onClick={(e)=>{ e.stopPropagation(); updatePathClause(path, pi, ci, { conn: cur==="and"?"or":"and" }); }} data-tip="Toggle AND / OR"
        className="shrink-0 inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-[0.1em] px-2 py-2 leading-none rounded-md whitespace-nowrap transition-colors hover:bg-[var(--pop-hover)] hover:text-[var(--text)]"
        style={{ color:"var(--muted)", background:"var(--panel2)" }}>{cur}{COND_CHEV}</button>; };
    const clauseEls = (ci) => {
      const c = pobj.clauses[ci]; const f = flowFD(node, c.field); const rel = f?.type==="date" && isRelDateOp(c.op);
      return (<>
        <Slot tone="cond" value={f?.label} placeholder="a field" open={openSlot===`${k}:p${pi}:c${ci}:field`} dataAnchor={`pcond:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>pickPathField(path,node,pi,ci,e)} />
        {c.field && <> <Slot tone="cond" value={c.op} placeholder="is" open={openSlot===`${k}:p${pi}:c${ci}:op`} dataAnchor={`pcop:${pobj.id}:${ci}`} onClick={(e)=>pickPathOp(path,node,pi,ci,e)} /> </>}
        {c.field && rel
          ? <> <Slot tone="cond" value={c.value} placeholder="0" open={openSlot===`${k}:p${pi}:c${ci}:value`} dataAnchor={`pval:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>pickPathValue(path,node,pi,ci,e)} /> <Slot tone="cond" value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:p${pi}:c${ci}:unit`} onClick={(e)=>pickPathUnit(path,node,pi,ci,e)} /> </>
          : (c.field && <Slot tone="cond" wrap={Array.isArray(c.value)} value={valueDisplay(c.value, openSlot===`${k}:p${pi}:c${ci}:value`)} smartKind={valueSmartKind(c, `${k}:p${pi}:c${ci}:value`)} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:p${pi}:c${ci}:value`} dataAnchor={`pval:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>reopenPathSmart(path,node,pi,ci,e)} onClear={()=>clearSmartValue((v)=>updatePathClause(path,pi,ci,{value:v}), `${k}:p${pi}:c${ci}:value`)} />)}
      </>);
    };
    // each clause on its own line; line 0 = the lane's "Check if" / "Or if" badge, the rest convertible AND/OR.
    return (
      <div className="flex flex-col gap-1.5 w-full">
        {clauses.map((c, ci) => (
          <div key={ci} className="group/cl flex flex-wrap items-start gap-x-2.5 rounded-lg transition-colors hover:bg-[var(--c-if-h)]" style={{minHeight:`${HEAD}px`, padding:"0 8px", margin:"0 -8px"}}>
            <span className="shrink-0 flex items-center justify-end" style={{width:"72px", height:`${HEAD}px`}}>
              {ci===0
                ? <span className="relative group/help inline-flex items-center">
                    <Badge color="var(--c-if)" bg="var(--c-if-bg)" className="cursor-help">{pi===0?"Check if":"Or if"}</Badge>
                    <div className="absolute z-30 left-0 top-full mt-2 w-72 p-3.5 rounded-xl opacity-0 pointer-events-none group-hover/help:opacity-100 transition-opacity" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}><HelpCard help={NODE_HELP.branch} /></div>
                  </span>
                : connBadge(ci)}
            </span>
            {/* sentence tokens flow as ONE inline run → wrapped lines return to the LEFT MARGIN (paragraph wrap) */}
            <span className="flex-1 min-w-0 self-center clause-flow" style={{minHeight:`${HEAD}px`, lineHeight:`${HEAD}px`}}>{clauseEls(ci)}</span>
            {clauses.length>1 && <button onClick={(e)=>{ e.stopPropagation(); removePathClause(path, pi, ci); }} title="Remove" className="shrink-0 opacity-0 group-hover/cl:opacity-100 text-[15px] leading-none px-1" style={{color:"var(--faint)", height:`${HEAD}px`}}>×</button>}
          </div>
        ))}
        {!noInlineAdd && <button onClick={(e)=>{ e.stopPropagation(); openNewCondition(e.currentTarget, pobj.clauses, null, (c)=>addPathClauseAndPick(path,node,pi,c)); }} className="self-start inline-flex items-center gap-1 text-[12px] font-medium hover:brightness-110" style={{color:"var(--c-if)"}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>new condition</button>}
      </div>
    );
  };

  /* the ONE "Add step" affordance (reused at the flow end AND between nodes). Visual only — the
     wrapper element owns the click so it can be nested inside a full-width button. */
  const AddStepPill = () => (
    <span className="inline-flex items-center gap-1.5 px-3 rounded-lg text-[13px] font-medium transition-all hover:bg-[var(--pop-hover)] hover:text-[var(--text)] hover:border-[var(--border)]"
      style={{ height:`${HEAD}px`, color:"var(--muted)", border:"1px solid var(--border2)", background:"var(--panel2)", boxShadow:"var(--shadow-sm)" }}>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
      Add step
    </span>
  );

  /* between-node insert: a thin gap that EXPANDS on hover into a node-sized space; the connector line
     runs straight through (never breaks), a + marker sits on the line, and a ghost-node CARD (same
     height as a normal node) reads "Add step in the main path". */
  const InsertZone = ({ basePath, index }) => {
    const izOpen = openInsertKey === (pathKey(basePath)+":"+index); // this zone's add-menu is open → stay expanded
    return (
    // FULL-WIDTH target: open on mousedown + stopPropagation so clicking THIS zone while another menu is open
    // SWITCHES (the press opens this one and prevents the global close listener from just closing the old one).
    <button onMouseDown={(e)=>{ e.stopPropagation(); openInsert(basePath, index, e.currentTarget.querySelector('[data-iz-card]')||e.currentTarget); }} title="Add a step here"
      className="relative block w-full text-left group/iz cursor-pointer focus:outline-none" style={{ background:"transparent" }}>
      {/* continuous connector line — full height, grows with the zone */}
      <div className="absolute" style={{ left:"9px", top:0, bottom:0, width:"1px", background:"var(--border2)" }}/>
      {/* collapsed = the resting gap; opens on hover OR while its menu is open (izOpen → no collapse-jump) */}
      <div className={"relative overflow-hidden transition-[height] duration-200 ease-out " + (izOpen ? "h-[64px]" : "h-[31px] group-hover/iz:h-[64px]")}>
        {/* + marker, vertically centred */}
        <span className={"absolute flex items-center justify-center rounded-full transition-all duration-200 " + (izOpen ? "opacity-100" : "opacity-0 group-hover/iz:opacity-100")}
          style={{ left:"9px", top:"50%", transform:"translate(-50%,-50%)", width:"18px", height:"18px", border:"1px solid var(--border2)", background:"var(--panel2)", color:"var(--muted)", boxShadow:"0 0 0 3px var(--bg)", zIndex:2 }}>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/></svg>
        </span>
        {/* ghost-node card — same bg as the always-visible end "Add step" (--panel2) */}
        <div data-iz-card className={"absolute flex items-center transition-opacity duration-200 bg-[var(--panel2)] " + (izOpen ? "opacity-100" : "opacity-0 group-hover/iz:opacity-100")}
          style={{ left:"16px", right:"16px", top:"50%", transform:"translateY(-50%)", height:"42px", borderRadius:"10px", paddingLeft:"18px" }}>
          <span className="text-[13px] font-medium" style={{ color:"var(--muted)" }}>Add step in the main path</span>
        </div>
      </div>
    </button>
    );
  };

  /* recursive flow renderer */
  function renderFlow(nodes, basePath, opts={}) {
    let acted = false;
    const isTrunk = basePath.length===0;
    const rendered = nodes.map((node, i) => {
      const path = [...basePath, i];
      const k = pathKey(path);
      // insert affordance ONLY between nodes — the LAST node is followed by a dedicated add affordance
      // (the trunk "Add step" pill / a branch's "+") so it needs no extra insert chip (avoids the double-+).
      const insertBelow = i < nodes.length-1 ? (el)=>openInsert(basePath, i+1, el) : null;

      // ── ACTION ──────────────────────────────────────────────────────────
      if (node.kind === "action") {
        const def = actionCatAll.byId[node.action];
        const head = acted ? "And" : "Then"; acted = true;
        const isLast = opts.last && i===nodes.length-1;
        const scope = recordsInScope(path);
        const showRec = true; // record is ALWAYS a clickable slot, even with one source (S6) — reads as a conscious source
        // node-level "good to go": has a form/card, every required field filled, AND confirmed via Done
        const _spec = formSpecFor(node.action), _data = node.data||{}, _rows = node.fields||[];
        const _stagesOK = !_spec || !_spec.stages || ((_data.stages||[]).length>0 && (_data.stages||[]).every(st=>_spec.stages.fields.filter(f3=>!f3.opt).every(f3=>st[f3.k])));
        const _complete = _spec ? (_spec.fields.filter(fd=>!fd.opt && (!fd.showIf || fd.showIf(_data))).every(fd=>_data[fd.k]) && _stagesOK) : (_rows.length>0 && _rows.every(rw=>rw.field && rw.value));
        const _hasCard = ((def && def.details) || _spec) && !(def && def.arg && !node.arg);
        const nodeGood = !!(_hasCard && _complete && node.confirmed);
        return (
          <Station key={node.id} marker={MARK.action} isLast={isLast} head={head} headColor="var(--c-then)" headBg="var(--c-then-bg)" hoverBg="var(--c-then-h)" help={NODE_HELP.action} editing={drawer===node.id}
            innerRef={(el)=>setRowRef(k, el)} removeLabel="Remove action" onCopy={()=>copyNode(path)} onInsert={isTrunk ? null : insertBelow} gapBottom={isTrunk?0:undefined} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={()=>remove(path)}>
            {node.action === "assign" ? (<>
              {/* multi-slot "sentence" action: assign {record?} to {target} */}
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Slot tone="action" value="assign" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                {showRec
                  ? <Slot tone="action" value={recordLabel(scope, node.record)} placeholder="the record" open={openSlot===`${k}:record`} onClick={(e)=>pickRecord(path,scope,e)} />
                  : <Word>it</Word>}
                <Word>to</Word>
                <Slot tone="action" value={node.arg} placeholder="user/group" open={openSlot===`${k}:arg`} dataAnchor={`aarg:${node.id}`} innerRef={(el)=>{ if(el) argSlotRefs.current[k]=el; }} onClick={(e)=>pickArg(path,node,e)} />
              </span>
              {/* assignee card — shows WHO with an initials avatar (display only; click re-opens the picker) */}
              {node.arg && (()=>{
                const usr = SAMPLE_USERS.find(x=>x.name===node.arg);
                const sub = usr ? usr.email : SAMPLE_GROUPS.includes(node.arg) ? "Group" : node.arg.endsWith("'s manager") ? "Group manager" : "Person";
                const initials = node.arg.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
                return (
                  <span onClick={(e)=>{ e.stopPropagation(); pickArg(path,node,e); }}
                    onMouseEnter={(e)=>{ e.currentTarget.style.background="var(--pop-hover)"; e.currentTarget.style.boxShadow="var(--shadow-sm)"; }}
                    onMouseLeave={(e)=>{ e.currentTarget.style.background="var(--panel)"; e.currentTarget.style.boxShadow="none"; }}
                    className="mt-2.5 flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition-all max-w-[420px]"
                    style={{ borderColor:"var(--border2)", background:"var(--panel)" }}>
                    <span className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold shrink-0" style={{background:"var(--avatar-bg)", color:"var(--avatar-fg)"}}>{initials}</span>
                    <span className="flex flex-col min-w-0 flex-1 gap-0.5">
                      <span className="text-[13px] font-medium leading-tight truncate" style={{color:"var(--text)"}}>{node.arg}</span>
                      <span className="text-[11.5px] leading-tight truncate" style={{color:"var(--muted)"}}>{sub}</span>
                    </span>
                  </span>
                );
              })()}
            </>) : node.action === "archive" ? (
              // archive {record} — the record is selectable once more than one is in scope
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Slot tone="action" value="archive" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                {showRec
                  ? <Slot tone="action" value={recordLabel(scope, node.record)} placeholder="the record" open={openSlot===`${k}:record`} onClick={(e)=>pickRecord(path,scope,e)} />
                  : <Word>{scope.length ? scope[0].label : "the record"}</Word>}
              </span>
            ) : (()=>{
              // record-acting actions (update/close/priority-matrix/smart-suggestion/auto-assign/send_*)
              // render as a sentence with the record embedded; everything else uses the default verb + arg.
              const sent = def && recordActionSentence(node, def, showRec);
              return sent
                ? renderRecordSentence(sent, node, def, path, scope, showRec, k)
                : (<>
                    <Slot tone="action" value={def?.label} placeholder="choose an action" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                    {def && def.arg && <> <Slot tone="action" value={node.arg} placeholder={def.argPlaceholder || "…"} open={openSlot===`${k}:arg`} dataAnchor={`aarg:${node.id}`} innerRef={(el)=>{ if(el) argSlotRefs.current[k]=el; }} onClick={(e)=>pickArg(path,node,e)} /></>}
                  </>);
            })()}
            {/* detail card — actions that carry extra data get an attached card (click → side drawer):
                create/update use field rows (node.fields); task/approval/http/plugin/notifications use a
                form spec (node.data). Shown only once the sentence's own slot is filled. */}
            {(()=>{
              const spec = formSpecFor(node.action);
              if (!((def && def.details) || spec) || (def && def.arg && !node.arg)) return null;
              const data = node.data || {}, rows = node.fields || [], nf = rows.length;
              const filled = spec ? spec.fields.filter(fd=>data[fd.k]).length : nf;
              const title = spec ? spec.title : (node.action==="create" ? (node.arg||"Record")+" details" : "Fields to update");
              // state: complete = every required form field filled (incl. every stage) / every row filled
              const stagesOK = !spec || !spec.stages || ((data.stages||[]).length>0 && (data.stages||[]).every(st=>spec.stages.fields.filter(f3=>!f3.opt).every(f3=>st[f3.k])));
              const complete = spec ? (spec.fields.filter(fd=>!fd.opt && (!fd.showIf || fd.showIf(data))).every(fd=>data[fd.k]) && stagesOK)
                                    : (nf>0 && rows.every(rw=>rw.field && rw.value));
              const countLine = spec ? ((filled ? `${filled} of ${spec.fields.length} filled` : "Not configured") + (spec.stages ? ` · ${(data.stages||[]).length} stage${(data.stages||[]).length===1?"":"s"}` : ""))
                                    : (nf ? `${nf} field${nf>1?"s":""} set` : "No fields yet");
              // a plain-text summary (same sentence as the form's overview) for the card subtitle — truncated + tooltip
              const cardSummary = (()=>{
                if (spec) return spec.overview ? spec.overview(data).map(s=>s.t).join(" ") : null;
                const sc = recordsInScope(path);
                const modName = node.action==="create" ? node.arg : (()=>{ const r=sc.find(x=>x.id===node.record)||sc[sc.length-1]; return r?r.label.replace(/^the\s+/i,""):(triggers[0]&&triggers[0].vals&&triggers[0].vals.module); })();
                const recF = recordFieldsFor(modName);
                // field CHANGES as a compact readable run: "Field → Value · Field → Value · +N more" (first 2 + count).
                const fl = rows.filter(fv=>fv.field);
                if (!fl.length) return "";
                const changes = fl.map(fv=>{ const fd=recF.find(x=>x.id===fv.field); const val=Array.isArray(fv.value)?fv.value.join(", "):fv.value; return (fd?fd.label:"field")+" → "+(val||"…"); });
                const N=2;
                return changes.slice(0,N).join("  ·  ") + (changes.length>N ? `  ·  +${changes.length-N} more` : "");
              })();
              const subtitle = cardSummary || countLine;
              // when not configured: ONE line, just the prompt (no subtext)
              const prompt = spec ? "Choose options" : "Choose fields";
              // "Good to go" only once the user has confirmed the form via Done (and it is still complete)
              const good = complete && node.confirmed;
              const cardEditing = drawer===node.id; // this card's form is open → highlight it, lift above the dim
              return (
                <span onClick={(e)=>{ e.stopPropagation(); setDrawer(cardEditing ? null : node.id); }}
                  onMouseEnter={(e)=>{ if(!cardEditing){ e.currentTarget.style.background="var(--pop-hover)"; e.currentTarget.style.boxShadow="var(--shadow-sm)"; } }}
                  onMouseLeave={(e)=>{ if(!cardEditing){ e.currentTarget.style.background="var(--panel)"; e.currentTarget.style.boxShadow="none"; } }}
                  className="mt-2.5 relative flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition-all max-w-[420px]"
                  style={{ borderColor: cardEditing?"var(--text)":(good?"var(--rdy-bd)":"var(--border2)"), borderWidth: cardEditing?"1.5px":"1px", background:"var(--panel)", ...(cardEditing?{zIndex:40, boxShadow:"var(--shadow-pop)"}:{}) }}>
                  {/* left icon: a CHECK once configured (the tick lives HERE, not next to "Edit"); the GEAR while not set up (accent = action). */}
                  <span className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{background: good?"var(--rdy-bg)":"var(--panel2)", color: good?"var(--rdy-fg)":"var(--muted)"}}>
                    {good
                      ? <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      : <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="1.7"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>}
                  </span>
                  {/* ONE readable line — configured shows the field-change summary, not-configured shows the prompt (no title/subtitle split, so it reads linearly) */}
                  <span className="flex-1 min-w-0">
                    <span className="block text-[13px] leading-tight truncate" style={{color:"var(--text)"}} title={good?subtitle:undefined}>{good ? subtitle : prompt}</span>
                  </span>
                  {/* RIGHT = an ACTION: while this form is OPEN → "Close ×"; else "Set up ›" (not configured) → "✓ Edit" (done). */}
                  {cardEditing ? (
                    <span className="shrink-0 inline-flex items-center gap-1 text-[12px] font-medium rounded-md px-2 py-1 -mr-1 transition-colors hover:bg-[var(--pop-hover)] hover:text-[var(--text)]" style={{color:"var(--muted)"}}>
                      Close
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                    </span>
                  ) : good ? (
                    <span className="shrink-0 inline-flex items-center gap-1 text-[12px] font-medium" style={{color:"var(--muted)"}}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 00-3-3L5 17v3z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><path d="M13.5 8.5l2 2" stroke="currentColor" strokeWidth="1.7"/></svg>
                      Edit
                    </span>
                  ) : (
                    <span className="shrink-0 inline-flex items-center gap-0.5 text-[12px] font-semibold" style={{color:"var(--accent2)"}}>
                      Set up
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </span>
                  )}
                </span>
              );
            })()}
          </Station>
        );
      }

      // ── CONDITION (inline gate) ─────────────────────────────────────────
      if (node.kind === "condition") {
        // a condition gates the steps AFTER it (its following siblings, rendered by this same .map);
        // it never has children of its own. It is the rail's last node only if it's literally last.
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.cond} isLast={isLast} hoverBg="transparent" wideContent
            padY={0} markerY={PAD + HEAD/2}
            innerRef={(el)=>setRowRef(k, el)} onInsert={isTrunk ? null : insertBelow} gapBottom={isTrunk?0:undefined}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)}>
            {inlineClauses(path, node, true, false)}
          </Station>
        );
      }

      // ── DELAY (wait) ────────────────────────────────────────────────────
      if (node.kind === "delay") {
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.delay} isLast={isLast} head={node.mode==="event"?undefined:"Wait"} headColor="var(--text)" headBg="var(--panel2)" hoverBg={node.mode==="event"?"transparent":"var(--panel2)"} wideContent={node.mode==="event"} help={NODE_HELP.delay}
            padY={node.mode==="event"?0:undefined} markerY={node.mode==="event"?(PAD+HEAD/2):undefined}
            innerRef={(el)=>setRowRef(k, el)} removeLabel={node.mode==="event"?undefined:"Remove wait"} onCopy={node.mode==="event"?undefined:()=>copyNode(path)} onInsert={isTrunk ? null : insertBelow} gapBottom={isTrunk?0:undefined} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={node.mode==="event"?undefined:()=>remove(path)}>
            {node.mode==="event"
              /* the WHOLE wait node is ONE card (breakout to hug the marker, pop-hover highlight). Hovering it GROWS the
                 card to reveal the "add max timeout" affordance inside (collapsed at rest). */
              ? <div onMouseEnter={()=>setHovWaitKey(k)} onMouseLeave={()=>setHovWaitKey(null)}
                  className="flex flex-col rounded-lg transition-colors"
                  style={{ marginLeft:"-18px", marginRight:"-12px", paddingLeft:"18px", paddingRight:"12px", paddingTop:`${PAD}px`, paddingBottom:`${PAD}px`, background: hovWaitKey===k ? "var(--pop-hover)" : "transparent" }}>
                  {waitClauses(path, node)}
                  {hovWaitKey===k &&
                    <button onClick={(e)=>{ e.stopPropagation(); /* TODO: sprout the timeout as a second branch */ }}
                      className="mt-1.5 inline-flex items-center gap-1.5 text-[12px] font-medium rounded-md px-2 py-1 transition-colors text-[var(--muted)] hover:text-[var(--text)]" style={{background:"var(--border2)"}}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="7.5" stroke="currentColor" strokeWidth="1.8"/><path d="M12 9.5V13l2.5 1.5M9.5 3h5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                      add max timeout
                    </button>}
                </div>
              : node.mode==null
                ? <span className="inline-flex items-baseline gap-x-1.5">
                    <Slot value={null} placeholder="time or date" open={openSlot===`${k}:kind`} dataAnchor={`wkind:${node.id}`} onClick={(e)=>pickWaitKind(path,node,e)} />
                  </span>
                : node.mode==="until"
                  ? <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                      <button onClick={(e)=>{ e.stopPropagation(); pickWaitKind(path,node,e); }} title="Change to a duration / date" className="slot align-baseline font-medium" style={{color:"var(--text)"}}>till</button>
                      <Slot value={node.date} placeholder="a date" open={openSlot===`${k}:date`} dataAnchor={`wdate:${node.id}`} onClick={(e)=>pickWaitDate(path,node,e)} />
                      <Word>&</Word>
                      <Slot value={node.time} placeholder="a time" open={openSlot===`${k}:time`} dataAnchor={`wtime:${node.id}`} onClick={(e)=>pickWaitTime(path,node,e)} />
                    </span>
                  : <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                      <button onClick={(e)=>{ e.stopPropagation(); pickWaitKind(path,node,e); }} title="Change to a date / duration" className="slot align-baseline font-medium" style={{color:"var(--text)"}}>for</button>
                      <Slot value={valueDisplay(node.amount, openSlot===`${k}:amount`)} smartKind={smartKindOf(node.amount)} placeholder="0" open={openSlot===`${k}:amount`} dataAnchor={`damt:${node.id}`} onClick={(e)=>pickDelayAmount(path,node,e)} onClear={smartKindOf(node.amount)?()=>update(path,{amount:null}):undefined} />
                      <Slot value={node.unit} placeholder="hours" open={openSlot===`${k}:unit`} onClick={(e)=>pickDelayUnit(path,node,e)} />
                      <Word>as per</Word>
                      <Slot value={node.hours==="business"?"business hours":"calendar hours"} placeholder="calendar hours" open={openSlot===`${k}:hours`} onClick={(e)=>pickDelayHours(path,node,e)} />
                      {node.hours==="business" && <Slot value={node.bizHours} placeholder="select business hours" open={openSlot===`${k}:biz`} onClick={(e)=>{ setOpenSlot(`${k}:biz`); open(e.currentTarget, [{id:"24x7",label:"24×7"},{id:"weekday",label:"Weekday 9–6"},{id:"custom",label:"Custom…"}], (x)=>update(path,{bizHours:x.label}), "Business hours", {noSearch:true, selected:node.bizHours}); }} />}
                    </span>}
          </Station>
        );
      }

      // ── GET (fetch many records → steps below run per record) ───────────
      if (node.kind === "get") {
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.get} isLast={isLast} head="Get" headColor="var(--text)" headBg="var(--panel2)" hoverBg="var(--panel2)" wideContent help={NODE_HELP.get}
            innerRef={(el)=>setRowRef(k, el)} onInsert={isTrunk ? null : insertBelow} gapBottom={isTrunk?0:undefined} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)}>
            {(() => { const single = String(node.qty).trim()==="1"; // single record (qty 1) → no sort; "where" inline
              const showWhere = node.qty!=null && node.module!=null && (single || node.sort!=null);
              return (
            <span className="flex flex-col gap-y-1 w-full">
              <span className="flex flex-wrap items-start gap-x-1.5 gap-y-1">
                {/* SINGLE record → the WHOLE sentence "{qty} {module} where {field} {op} {value}" flows as ONE
                    inline run (.clause-flow) so a wrapped multi-value returns to the LEFT MARGIN under "{qty} {module}",
                    not under the value column. The node controls stay anchored top-right. */}
                {single ? (()=>{ const c=(node.clauses||[])[0]||{}; const f=flowFD(node, c.field); const rel=f?.type==="date" && isRelDateOp(c.op);
                  return (
                  <span className="flex-1 min-w-0 self-center clause-flow" style={{minHeight:`${HEAD}px`, lineHeight:`${HEAD}px`}}>
                    {/* ONE inline run (display:block) → literal {" "} spaces between slots (word-spacing styles them); the flex gap doesn't reach inside here */}
                    <Slot value={node.qty} placeholder="how many" open={openSlot===`${k}:qty`} dataAnchor={`gqty:${node.id}`} onClick={(e)=>pickGetQty(path,node,e)} />{" "}
                    <Slot value={node.module} placeholder="records" open={openSlot===`${k}:module`} dataAnchor={`gmod:${node.id}`} onClick={(e)=>pickGetModule(path,node,e)} />
                    {showWhere && <>{" "}
                      <Word>where</Word>{" "}
                      <Slot value={f?.label} placeholder="a field" open={openSlot===`${k}:c0:field`} dataAnchor={`cond:${node.id}:0`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${node.id}:0`]=el; }} onClick={(e)=>pickClauseField(path,node,0,e)} />
                      {c.field && <>{" "}<Slot value={c.op} placeholder="is" open={openSlot===`${k}:c0:op`} dataAnchor={`cop:${node.id}:0`} onClick={(e)=>pickClauseOp(path,node,0,e)} /></>}
                      {c.field && (rel
                        ? <>{" "}<Slot value={c.value} placeholder="0" open={openSlot===`${k}:c0:value`} dataAnchor={`cval:${node.id}:0`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:0`]=el; }} onClick={(e)=>pickClauseValue(path,node,0,e)} />{" "}<Slot value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:c0:unit`} onClick={(e)=>pickClauseUnit(path,0,e)} /></>
                        : <>{" "}<Slot wrap={Array.isArray(c.value)} value={valueDisplay(c.value, openSlot===`${k}:c0:value`)} smartKind={valueSmartKind(c, `${k}:c0:value`)} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:c0:value`} dataAnchor={`cval:${node.id}:0`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:0`]=el; }} onClick={(e)=>reopenClauseSmart(path,node,0,e)} onClear={()=>clearSmartValue((v)=>updateClause(path,0,{value:v}), `${k}:c0:value`)} /></>)}
                    </>}
                  </span>
                  ); })() : <>
                <Slot value={node.qty} placeholder="how many" open={openSlot===`${k}:qty`} dataAnchor={`gqty:${node.id}`} onClick={(e)=>pickGetQty(path,node,e)} />
                <Slot value={node.module} placeholder="records" open={openSlot===`${k}:module`} dataAnchor={`gmod:${node.id}`} onClick={(e)=>pickGetModule(path,node,e)} />
                {/* sorting is meaningless for a single record — only offer it when fetching >1 */}
                {node.qty!=null && node.module!=null && <>
                  <Word>sorted by name</Word>
                  <Slot value={node.sort==="desc"?"descending":(node.sort==="asc"?"ascending":null)} placeholder="ascending" open={openSlot===`${k}:sort`} dataAnchor={`gsort:${node.id}`} onClick={(e)=>pickGetSort(path,node,e)} />
                </>}
                </>}
                <span className={"ml-auto shrink-0 flex items-center gap-1 transition-opacity " + ((focusKey===k && pop) ? "opacity-100" : "opacity-0 group-hover:opacity-100")} style={{height:`${HEAD}px`}}>
                  {single && (node.clauses||[])[0]?.field && <>
                    <button onClick={(e)=>{ e.stopPropagation(); setOpenSlot(`${k}:c0:add`); openNewCondition(e.currentTarget, node.clauses, null, (c2)=>addClauseAndPick(path,node,c2,0)); }} title="Add condition" className={"inline-flex items-center gap-1 text-[12px] font-medium whitespace-nowrap transition-colors " + (openSlot===`${k}:c0:add` ? "text-[var(--c-if)]" : "text-[var(--muted)] hover:text-[var(--c-if)]")} style={{padding:"2px 5px"}}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
                      new condition
                    </button>
                    <span className="self-center shrink-0" style={{width:"1px", height:"16px", background:"var(--border2)"}} />
                  </>}
                  <button onClick={(e)=>{ e.stopPropagation(); copyNode(path); }} title="Duplicate" className="rounded-md flex items-center justify-center transition-colors hover:bg-[var(--pop-hover)] text-[var(--faint)] hover:text-[var(--text)]" style={{padding:"5px"}}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15V5a2 2 0 012-2h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                  </button>
                  <DeleteBtn onClick={(e)=>{ e.stopPropagation(); remove(path); }} title="Remove get" />
                </span>
              </span>
              {/* MULTI record (sort shown) → "where …" stays on its own SECOND line (existing layout) */}
              {showWhere && !single && <span className="flex flex-wrap items-center gap-x-1.5 gap-y-1">
                <Word>where</Word>
                {inlineClauses(path, node)}
              </span>}
            </span>
              ); })()}
          </Station>
        );
      }

      // ── BRANCH (explicit fork) ──────────────────────────────────────────
      const lanes = [];
      const branchIsTerminal = !!opts.last && i===nodes.length-1; // nothing (not even the End cap) follows → stop the trunk rail at the fork
      (node.paths||[]).forEach((pobj, pi) => {
        const lanePath = [...path, {path:pi}];
        const branchActive = branchMenuPath === pathKey(lanePath);
        lanes.push(
          <div key={pobj.id} className="relative" style={{marginLeft:"60px"}}>
            {branchActive && <div className="absolute pointer-events-none rounded-xl" style={{ top:`-${PAD}px`, bottom:"2px", left:"-56px", right:"8px", background:"var(--c-if-h)", boxShadow:"inset 0 0 0 1px var(--c-if-bg)" }}/>}
            {/* parent rail continues straight down behind the fork (stops at the last lane) */}
            <div className="absolute" style={{ left:"-51px", top:0, bottom: (pi===(node.paths||[]).length-1 && !node.otherwise && branchIsTerminal) ? `calc(100% - ${MC}px)` : 0, width:"1px", background:"var(--border2)" }}/>
            {/* family-tree elbow into this lane */}
            <div className="absolute" style={{ left:"-51px", top:0, width:"60px", height:`${MC}px`,
              borderLeft:"1px solid var(--border2)", borderBottom:"1px solid var(--border2)", borderBottomLeftRadius:"12px" }}/>
            {/* this lane's condition header */}
            <Station marker={MARK.cond} isFirst hoverBg="transparent" wideContent
              innerRef={(el)=>setRowRef(pathKey(lanePath), el)} removeLabel="Remove path" onRemove={()=>removePath(path,pi)}>
              {pathClauses(path, node, pi, true, false)}
            </Station>
            {renderFlow(pobj.children||[], lanePath)}
            <BranchAdd path={lanePath} branchId={pobj.id} />
          </div>
        );
      });
      if (node.otherwise) {
        const owPath = [...path, {otherwise:true}];
        const owActive = branchMenuPath === pathKey(owPath);
        lanes.push(
          <div key={node.otherwise.id} className="relative" style={{marginLeft:"60px"}}>
            {owActive && <div className="absolute pointer-events-none rounded-xl" style={{ top:`-${PAD}px`, bottom:"2px", left:"-56px", right:"8px", background:"var(--c-if-h)", boxShadow:"inset 0 0 0 1px var(--c-if-bg)" }}/>}
            <div className="absolute" style={{ left:"-51px", top:0, bottom: branchIsTerminal ? `calc(100% - ${MC}px)` : 0, width:"1px", background:"var(--border2)" }}/>
            <div className="absolute" style={{ left:"-51px", top:0, width:"60px", height:`${MC}px`,
              borderLeft:"1px solid var(--border2)", borderBottom:"1px solid var(--border2)", borderBottomLeftRadius:"12px" }}/>
            <Station marker={MARK.cond} isFirst head="Otherwise" headColor="var(--c-if)" headBg="var(--c-if-bg)" hoverBg="var(--c-if-h)" help={NODE_HELP.condition}
              innerRef={(el)=>setRowRef(pathKey(owPath), el)} removeLabel="Remove otherwise" onRemove={()=>removeOtherwise(path)}>
              <span className="text-[15px]" style={{color:"var(--muted)"}}>nothing above matched</span>
            </Station>
            {renderFlow(node.otherwise.children||[], owPath)}
            <BranchAdd path={owPath} branchId={node.otherwise.id} />
          </div>
        );
      }
      return (
        <React.Fragment key={node.id}>
          {lanes}
          {/* branch-level affordances */}
          <div className="relative flex items-center gap-3" style={{ marginLeft:"60px", paddingLeft:"4px", paddingBottom:`${GAP}px` }}>
            {!branchIsTerminal && <div className="absolute" style={{ left:"-51px", top:0, bottom:0, width:"1px", background:"var(--border2)" }}/>}
            <button onClick={()=>addPath(path)} className="text-[12px] font-medium transition-colors hover:brightness-110" style={{color:"var(--c-if)"}}>+ add branch</button>
          </div>
        </React.Fragment>
      );
    });
    if (!isTrunk) return rendered;
    // trunk only: weave hover-expand InsertZones between nodes (and one after the trigger, before node 0)
    const out = [];
    if (hasTrigger && nodes.length>0) out.push(<InsertZone key="iz-lead" basePath={basePath} index={0} />);
    rendered.forEach((el, i) => { out.push(el); if (i < rendered.length-1) out.push(<InsertZone key={"iz-"+i} basePath={basePath} index={i+1} />); });
    return out;
  }

  const moduleListBody = (
    <>
      <div className="h-14 shrink-0 flex items-center px-4 text-[15px] font-semibold border-b" style={{color:"var(--text)", borderColor:"var(--side-bd)"}}>{suiteDef.label}</div>
      <div className="flex-1 overflow-auto py-2 px-2">
        {suiteDef.modules.map(m=>{
          const on = m.id===activeModule;
          return (
            <React.Fragment key={m.id}>
              {m.sep && (
                <div className="mt-2 pt-2 mb-1 px-3" style={{borderTop:"1px solid var(--side-bd)"}}>
                  <div className="text-[10px] font-semibold uppercase tracking-[0.12em]" style={{color:"var(--faint)"}}>Test cases</div>
                </div>
              )}
              <button onClick={()=>setActiveModule(m.id)}
                className="w-full text-left px-3 py-2 rounded-lg text-[13px] font-medium transition-colors mb-0.5"
                style={{background: on?"var(--side-item-active-bg)":"transparent", color: on?"var(--side-item-active-fg)":"var(--side-item)"}}>
                {m.label}
              </button>
            </React.Fragment>
          );
        })}
        {activeSuite==="automation" && QA_TESTS.some(t=>!qaDone.includes(t.id)) && (
          <div className="mt-3 pt-2" style={{borderTop:"1px solid var(--side-bd)"}}>
            <div className="px-3 mb-1.5 flex items-center justify-between">
              <div className="text-[10px] font-semibold uppercase tracking-[0.12em]" style={{color:"var(--faint)"}}>QA — load &amp; verify</div>
              <span className="text-[10px] font-semibold" style={{color:"var(--faint)"}}>{QA_TESTS.filter(t=>!qaDone.includes(t.id)).length}</span>
            </div>
            {QA_TESTS.filter(t=>!qaDone.includes(t.id)).map(t=>(
              <div key={t.id} className="group/qa mb-1 rounded-lg px-2.5 py-2 transition-colors hover:bg-[var(--side-item-active-bg)]">
                <div className="flex items-start gap-2">
                  <button onClick={()=>setDoc(JSON.parse(JSON.stringify(t.doc)))} className="flex-1 min-w-0 text-left">
                    <div className="text-[12.5px] font-medium leading-snug" style={{color:"var(--side-item)"}}>{t.label}</div>
                    <div className="text-[11px] leading-snug mt-0.5" style={{color:"var(--faint)"}}>{t.note}</div>
                  </button>
                  <button onClick={()=>setQaDone(d=>[...d,t.id])} title="Mark verified — remove" className="shrink-0 w-5 h-5 rounded-md flex items-center justify-center opacity-0 group-hover/qa:opacity-100 transition-opacity hover:bg-[var(--pop-hover)]" style={{color:"var(--faint)"}}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </>
  );
  return (
    <div className="flex h-screen w-screen overflow-hidden" style={{background:"var(--shell-bg)"}}>
      {/* ── Left sidebar group (rail + collapsible module list) ── */}
      <div className="relative h-full flex shrink-0" onMouseEnter={()=>setRailHover(true)} onMouseLeave={()=>setRailHover(false)}>
      {/* ── Sidebar 1: Suites (thin icon rail) ── */}
