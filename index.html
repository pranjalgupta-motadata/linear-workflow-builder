                  <span className="w-4 h-4 rounded flex items-center justify-center shrink-0" style={{ border:"1.5px solid "+(on?"var(--accent)":"var(--border2)"), background:on?"var(--accent)":"transparent" }}>{on && <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}</span>
                  {v}
                </button>; })}
            </div>}
        <button onClick={done} className="mt-2 w-full rounded-lg py-1.5 text-sm font-medium transition-shadow" style={{background:"var(--accent)",color:"#fff", ...(inputType==="multi" && kbIdx===(choices||[]).length ? {boxShadow:"0 0 0 2px var(--pop-bg), 0 0 0 4px var(--accent)"} : {})}}>Done</button>
      </div>
      {smartExprFooter}
    </>, smart ? SMART_W : "w-56");
  }
  if (inputType) {
    return wrap(<>
      {smartHeader}
      <div className="p-3">
        {title && <div className="text-[10px] uppercase tracking-wider mb-2" style={{color:"var(--faint)"}}>{title}</div>}
        <input type={inputType} autoFocus value={val} onChange={e=>setVal(e.target.value)}
          className="w-full rounded-lg px-2.5 py-1.5 text-sm outline-none"
          style={{background:"var(--panel)",border:"1px solid var(--border2)",color:"var(--text)"}}/>
        <button onClick={()=>{ if(val){ onPick({id:val,label:val}); onClose(); } }}
          className="mt-2.5 w-full rounded-lg py-1.5 text-sm font-medium" style={{background:"var(--accent)",color:"#fff"}}>Set</button>
      </div>
      {smartExprFooter}
    </>, smart ? SMART_W : "w-56");
  }

  // browse vs flat-search: when the user types AND a `flat` leaf index is provided, search across the
  // FLAT list (every sub-action, matched by label/sub/keywords) instead of the grouped categories.
  const q2 = q.toLowerCase().trim();
  const base = (q2 && flat) ? flat : items;
  const filtered0 = noSearch ? base : base.filter(i => i.header || i.label.toLowerCase().includes(q2) || (i.sub && i.sub.toLowerCase().includes(q2)) || (i.keywords && i.keywords.toLowerCase().includes(q2)));
  // when SEARCHING, hide category headers (and dividers) whose group has no matching results, so no empty
  // category headers linger. A header is kept only if a real item follows it before the next header.
  const pruneEmptyHeaders = (arr) => arr.filter((i,k)=>{
    if (i.header){ for (let j=k+1; j<arr.length; j++){ if (arr[j].header) break; if (!arr[j].divider) return true; } return false; }
    if (i.divider){ // drop a divider that isn't between two real items
      let prevReal=false; for (let j=k-1;j>=0;j--){ if(arr[j].header)break; if(!arr[j].divider){prevReal=true;break;} }
      let nextReal=false; for (let j=k+1;j<arr.length;j++){ if(arr[j].header)break; if(!arr[j].divider){nextReal=true;break;} }
      return prevReal && nextReal; }
    return true; });
  const filtered = (q2 && !noSearch) ? pruneEmptyHeaders(filtered0) : filtered0;
  const selectable = filtered.filter(i=>!i.header && !i.disabled && !i.divider);
  const selCount = selectable.length;
  let si = -1;
  // item content — rich (icon tile + label + one-line subtext) when the item has a `sub`, else the plain row
  const TONES = { when:["var(--c-when)","var(--c-when-bg)"], if:["var(--c-if)","var(--c-if-bg)"], then:["var(--c-then)","var(--c-then-bg)"], util:["var(--accent)","var(--panel2)"] };
  // solidIcons (the "what happens next" menu): keep the light tinted tile, but render the glyph FILLED
  const tileStyle = (i) => ({ background:(TONES[i.tone]||["var(--muted)","var(--panel2)"])[1], color:(TONES[i.tone]||["var(--muted)","var(--panel2)"])[0] });
  const itemBody = (i) => i.sub ? (
    <span className="flex items-center gap-2.5 min-w-0 flex-1">
      {i.avatar
        ? <span className="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0" style={{background:"var(--avatar-bg)", color:"var(--avatar-fg)"}}>{i.avatar}</span>
        : i.icon && <span className={"w-8 h-8 rounded-lg flex items-center justify-center shrink-0" + (solidIcons?" solid-ico":"")} style={tileStyle(i)}>{i.icon}</span>}
      <span className="flex flex-col min-w-0">
        <span className="text-[12.5px] font-medium leading-tight" style={{color:"var(--text)"}}>{i.label}</span>
        <span className="text-[11px] leading-tight truncate" style={{color:"var(--faint)"}}>{i.sub}</span>
      </span>
    </span>
  ) : (
    <span className="flex items-center gap-3 min-w-0 flex-1">{i.icon && <span style={{color:"var(--muted)"}}>{i.icon}</span>}<span className="truncate">{i.label}</span></span>
  );
  // Quick Help (rendered in the rail by the parent): base = the menu's node help; item = the specific
  // hovered/highlighted option (only when it differs from base).
  const activeItem = selectable[Math.min(active, Math.max(0, selCount-1))];
  const curItem = hovItem || activeItem || null;        // the option whose help/icon the rail shows
  if (itemsAsNodes) {
    // the items ARE main nodes (e.g. the "what happens next" menu) → the hovered item drives the BASE
    // (big graphic) node help; no "this option" sub-layer.
    helpRptRef.current = { base: (curItem && curItem.help) || help || null, item: null, itemIcon: null };
  } else {
    // the items are SUB-OPTIONS of this node (e.g. trigger types) → base = node help, item = the option.
    const baseHelp = help || null;
    const itemHelp = (curItem && curItem.help) || null;
    const showItem = itemHelp && itemHelp!==baseHelp;
    helpRptRef.current = { base: baseHelp, item: showItem ? itemHelp : null, itemIcon: showItem ? (curItem.icon||null) : null };
  }
  return (<>
    {wrap(<>
    {(help||title||back||smart) && <div className={"px-3.5 pt-3 pb-2 flex items-center gap-1.5" + (smart?" sticky top-0 z-10":"")} style={smart?{background:"var(--pop-bg)", borderBottom:"1px solid var(--border)"}:undefined}>
      {back && <button onClick={back} title="Back" className="flex items-center justify-center w-5 h-5 rounded-md hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>}
      <span className="text-[12px] font-semibold truncate" style={{color:"var(--text)"}}>{(help && help.title) || title}</span>
      {smart && <span className="ml-auto shrink-0">{smartTabs}</span>}
    </div>}
    {!noSearch &&
      <div className="px-2.5 pt-1 pb-2">
        <SearchBox autoFocus value={q} onChange={e=>{setQ(e.target.value); setActive(0);}} onKeyDown={e=>{ if(e.key==="Backspace" && q==="" && back){ e.preventDefault(); back(); } }} />
      </div>}
    <div className="max-h-72 overflow-y-auto overscroll-contain py-1 px-1.5">
      {filtered.length===0 && <div className="px-3 py-2 text-[12px]" style={{color:"var(--faint)"}}>No matches</div>}
      {filtered.map((i,k)=>{
        if (i.divider) return <div key={"d"+k} className="my-1.5 mx-2" style={{borderTop:"1px solid var(--border2)"}} />;
        if (i.header) return <div key={"h"+k} className="px-2.5 pt-3 pb-1 text-[11px] font-medium" style={{color:"var(--faint)"}}>{i.header}</div>;
        if (i.disabled) return (
          <button key={i.id} onMouseEnter={()=>setHovItem(i)} onMouseLeave={()=>setHovItem(null)}
            className="relative group/dis w-full text-left px-2 py-1.5 text-[12px] rounded-lg flex items-center justify-between gap-2 cursor-default" style={{color:"var(--text)"}}>
            <span className="flex items-center justify-between gap-2 flex-1 min-w-0 opacity-50">{itemBody(i)}
            {i.tag && <span className="text-[10px] px-1.5 py-0.5 rounded shrink-0" style={{background:"var(--border)",color:"var(--muted)"}}>{i.tag}</span>}</span>
            {i.hint && <span className="pointer-events-none absolute right-2 bottom-full mb-1 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/dis:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.hint}</span>}
            {i.rightIcon && <span className="relative group/ri shrink-0 flex items-center justify-center w-5 h-5" style={{color:"var(--muted)"}}>{i.rightIcon}
              {i.rightHint && <span className="pointer-events-none absolute right-0 bottom-full mb-2 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/ri:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.rightHint}</span>}</span>}
          </button>);
        si++; const myi = si; const isActive = si === Math.min(active, selCount-1);
        const isSel = selected!=null && (i.id===selected || i.label===selected);
        return (
          <button key={i.id} ref={isActive ? activeRef : null} onClick={()=>{ if(!onPick(i, myi)) onClose(); }}
            onMouseEnter={()=>{ setHovItem(i); if(!noHover) setActive(myi); }}
            className={"w-full text-left pl-3 pr-2 py-1.5 text-[12px] rounded-lg flex items-center justify-between gap-2 transition-colors " + (noHover ? "" : (!isSel && isActive ? "bg-[var(--pop-hover)]" : (!isSel ? "hover:bg-[var(--pop-hover)]" : "")))}
            style={{ color: isSel ? "var(--accent2)" : "var(--text)", fontWeight: isSel ? 600 : undefined,
              ...(isSel && !noHover ? { background: isActive ? "color-mix(in srgb, var(--accent) 24%, transparent)" : "color-mix(in srgb, var(--accent) 14%, transparent)" } : {}) }}>
            {itemBody(i)}
            {isSel && <svg className="shrink-0 ml-auto" width="14" height="14" viewBox="0 0 24 24" fill="none" style={{color:"var(--accent2)"}}><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            {i.tag && <span className="text-[10px] px-1.5 py-0.5 rounded shrink-0" style={{background:"var(--border)",color:"var(--muted)"}}>{i.tag}</span>}
            {i.rightIcon && <span className="relative group/ri shrink-0 flex items-center justify-center w-5 h-5" style={{color:"var(--muted)"}}>{i.rightIcon}
              {i.rightHint && <span className="pointer-events-none absolute right-0 bottom-full mb-2 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/ri:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.rightHint}</span>}</span>}
          </button>);
      })}
    </div>
    {footer && <div className="border-t p-1.5" style={{borderColor:"var(--border)"}}>{footer}</div>}
    {smartExprFooter}
    </>)}
    {/* contextual Quick Help — floats next to the picker (hidden for plain input popovers; fully suppressed
        during the guided tour to avoid competing highlights) */}
    {!inputType && !hideHelp && (()=>{
      const baseHelp = itemsAsNodes ? ((curItem && curItem.help) || help || null) : (help || null);
      const itemHelp = itemsAsNodes ? null : ((curItem && curItem.help && curItem.help!==help) ? curItem.help : null);
      const itemIco  = itemHelp ? (curItem.icon || null) : null;
      if (!baseHelp && !itemHelp) return null;
      const accent = (baseHelp && baseHelp.color) || (itemHelp && itemHelp.color) || "var(--accent)";
      // "View more" deep-links the QUICK HELP card to the fuller per-node reference side section. Resolve the
      // node-type's doc by matching the base help's title against NODE_DOCS (Trigger/Condition/Action/…).
      const refDoc = (onViewMore && baseHelp && baseHelp.title) ? NODE_DOCS.find(d=>d.name===baseHelp.title) : null;
      const CW = 264, GAP = 12, popW = wide ? 340 : 256;
      let hl = left + popW + GAP;
      if (hl + CW > window.innerWidth - 12) hl = Math.max(12, left - CW - GAP);
      return (
        <div className="pop-enter fixed z-50 rounded-xl overflow-hidden flex flex-col" style={{ top, left: hl, width: CW, maxHeight:"66vh", background:"var(--pop-bg)", border:"1px solid var(--border2)", borderTop:`3px solid ${accent}`, boxShadow:"var(--shadow-pop)" }}>
          <div className="px-3.5 pt-3 pb-1.5 shrink-0">
            <div className="text-[9.5px] uppercase tracking-[0.14em] flex items-center gap-1.5" style={{color:"var(--faint)"}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 11v5M12 7.5v.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
              Quick help
            </div>
          </div>
          <div className="flex-1 overflow-y-auto px-3.5 pb-3.5 flex flex-col gap-2.5">
            {/* only the node → BIG graphic banner + heading + description; once a sub-option is active → compact icon + heading */}
            {baseHelp && (itemHelp ? (
              <div className="flex items-center gap-2.5">
                {baseHelp.graphic && <span className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background:baseHelp.bg||"var(--panel2)", color:baseHelp.color||"var(--text)" }}>{baseHelp.graphic}</span>}
                <div className="text-[14px] font-semibold leading-tight" style={{color:baseHelp.color||"var(--text)"}}>{baseHelp.title}</div>
              </div>
            ) : (
              <div className="flex flex-col gap-2.5">
                <div className="text-[14px] font-semibold leading-tight" style={{color:baseHelp.color||"var(--text)"}}>{baseHelp.title}</div>
                {baseHelp.graphic && (
                  <div className="w-full rounded-xl flex items-center justify-center" style={{ height:"84px", background:baseHelp.bg||"var(--panel2)", color:baseHelp.color||"var(--text)", overflow:"hidden" }}>
                    <span style={{ transform:"scale(2.1)" }}>{baseHelp.graphic}</span>
                  </div>
                )}
                {baseHelp.body && <div className="text-[12px] leading-relaxed" style={{color:"var(--muted)"}}>{baseHelp.body}</div>}
              </div>
            ))}
            {/* then the hovered/current option: name + its description as subtext */}
            {itemHelp && (<>
              <div className="h-px shrink-0" style={{background:"var(--border)"}}/>
              <div className="flex items-start gap-2">
                {(itemIco || itemHelp.graphic) && <span className="w-6 h-6 rounded-md flex items-center justify-center shrink-0 mt-0.5" style={{ background:"var(--panel)", color:"var(--muted)" }}>{itemIco || itemHelp.graphic}</span>}
                <div className="min-w-0">
                  <div className="text-[12.5px] font-semibold leading-tight" style={{color:"var(--text)"}}>{itemHelp.title}</div>
                  {itemHelp.body && <div className="text-[11.5px] leading-snug mt-1" style={{color:"var(--muted)"}}>{itemHelp.body}</div>}
                </div>
              </div>
            </>)}
          </div>
          {/* deep-link to the fuller per-node reference side section (closes this popover so they don't overlap) */}
          {refDoc && (
            <button onMouseDown={(e)=>{ e.stopPropagation(); e.preventDefault(); onViewMore(refDoc.id); }}
              className="shrink-0 flex items-center justify-end gap-1 px-3.5 py-2.5 text-[11.5px] font-medium border-t transition-colors text-[var(--muted)] hover:text-[var(--accent2)]"
              style={{ borderColor:"var(--border)" }}>
              View more
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          )}
        </div>
      );
    })()}
  </>);
}

/* ---------------------------------------------------------------------------
   Inline editable slot — underlined text, colored by role
--------------------------------------------------------------------------- */
const SLOT_COLOR = { trigger:"var(--c-when)", action:"var(--c-then)", value:"var(--c-then)", cond:"var(--c-if)" };
function Slot({ value, placeholder, onClick, onClear, innerRef, open, dataAnchor, beckon, tourCue, smartKind, wrap }) {
  const filled = !!value;
  const [hovBadge, setHovBadge] = React.useState(false);
  // SMART VALUE → a rounded, neutral, editable BADGE inline in the sentence (reference / expression).
  if (smartKind) {
    // open = this badge's editor (the rail) is active → lift it ABOVE the focus-dim (z-40) + ring, like a form card.
    // A SET badge (a real ref/expr value, not the transient "smart" preview) behaves like a TAG: click reopens its
    // editor (onClick), and a hover-only × on the right removes the value (onClear, stopPropagation). The no-×
    // rule applies only INSIDE the expression editor — this × is for these sentence badges only.
    const removable = !!(onClear && (smartKind==="ref" || smartKind==="expr"));
    const labelText = value || (smartKind==="expr"?"expression": smartKind==="ref"?"a field":"smart value");
    const showX = removable && (hovBadge || open);
    return (
      <button ref={innerRef} data-anchor={dataAnchor} onClick={onClick} title={labelText}
        onMouseEnter={()=>setHovBadge(true)} onMouseLeave={()=>setHovBadge(false)}
        className="relative inline-flex items-center gap-1.5 rounded-lg pl-2 pr-2 py-1 text-[0.95em] font-medium align-middle transition-all hover:brightness-105 max-w-full"
        style={{ background: open ? "var(--panel)" : "var(--panel2)", border:"1.5px solid "+(open?"var(--accent2)":"var(--border2)"), color:"var(--text)", lineHeight:1.35,
                 ...(open ? { zIndex:40, boxShadow:"0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow-sm)" } : {}) }}>
        {/* glyph (left, never clipped) · label (middle, clips with ellipsis) · × (right, never clipped, animated) */}
        <span className="shrink-0 inline-flex items-center text-[0.9em] leading-none" style={{ color: open?"var(--accent2)":"var(--muted)" }}>{smartKind==="expr" ? <FxGlyph/> : smartKind==="ref" ? <BracesGlyph/> : "✦"}</span>
        <span className="min-w-0 flex-1 leading-none" style={{ maxWidth: open ? "none" : "150px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{labelText}</span>
        {removable && (
          <span role="button" aria-label="Remove value" title="Remove"
            onClick={(e)=>{ e.stopPropagation(); e.preventDefault(); onClear(); }}
            className="shrink-0 inline-flex items-center justify-center rounded-full overflow-hidden hover:bg-[var(--pop-hover)]"
            style={{ color:"var(--muted)", height:"16px",
                     maxWidth:"16px", width:"16px", marginLeft:"2px",   // ALWAYS reserve the ×'s footprint so hovering
                     opacity: showX ? 1 : 0,                            // only fades it in — the badge width never grows,
                     pointerEvents: showX ? "auto" : "none",            // so it can't reflow onto a 2nd line on hover.
                     transition:"opacity .15s ease, background-color .12s ease" }}>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" style={{display:"block"}}><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg>
          </span>
        )}
      </button>
    );
  }
  // WRAP (multi-select value list): render as a TRUE inline <span> (not a <button>) so its text flows as part of
  // the surrounding paragraph and wrapped lines return to the BLOCK's left margin — a <button> is an atomic
  // inline-block that hang-indents. Still ONE clickable control (role=button + keyboard) → click-to-edit intact.
  if (wrap) {
    return (
      <span ref={innerRef} data-anchor={dataAnchor} role="button" tabIndex={0} onClick={onClick}
        onKeyDown={(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onClick && onClick(e); } }}
        className={"slot " + (filled ? "font-medium" : "font-normal") + (beckon ? " slot-beckon" : "") + (tourCue ? " slot-tourcue" : "")}
        style={{ color: filled ? "var(--text)" : "var(--faint)", whiteSpace:"normal", overflowWrap:"anywhere", wordBreak:"normal", cursor:"pointer",
                 ...(open ? { textDecorationStyle:"solid", textDecorationColor:"var(--accent2)" } : {}) }}>
        {filled ? value : placeholder}
      </span>
    );
  }
  return (
    <button ref={innerRef} data-anchor={dataAnchor} onClick={onClick} className={"slot " + (filled ? "font-medium" : "font-normal") + (beckon ? " slot-beckon" : "") + (tourCue ? " slot-tourcue" : "")}
      style={{ color: filled ? "var(--text)" : "var(--faint)",
               ...(open ? { textDecorationStyle:"solid", textDecorationColor:"var(--accent2)" } : {}) }}>
      {filled ? value : placeholder}
    </button>
  );
}
const Word = ({children}) => <span className="font-normal" style={{color:"var(--ink-mid)"}}>{children}</span>;
function Template({ tpl, vals, onSlot, slotRef, ph, openKey }) {
  return tpl.split(/(\{[^}]+\})/).filter(p=>p!=="").map((p,i)=>{
    const m = p.match(/^\{(.+)\}$/);
    if (m) { const k = m[1];
      return <Slot key={i} value={vals[k]} placeholder={(ph && ph[k]) || PLACEHOLDER[k] || k} open={k===openKey}
        innerRef={slotRef ? (el)=>slotRef(k, el) : undefined} onClick={(e)=>onSlot(k,e)} />; }
    return <Word key={i}>{p}</Word>;
  });
}

/* ---------------------------------------------------------------------------
   Expression Builder — the right-rail editor for a smart EXPRESSION value. The canvas is a FREELY-
   TYPABLE contentEditable surface: the expression is a STRING. Type & Backspace work natively; the
   ONLY removal affordances are Backspace and Clear (no × buttons). Functions/operators insert as
   plain text at the caret; field references insert as ATOMIC #{Record > field} chips (deleted whole).
   Props: text, setText (App state — the expression string), onAddRef(anchorEl, onPicked) (drills
   record→field → onPicked("Record > field")), onDone (commit), onClose (cancel), label (the field).
--------------------------------------------------------------------------- */
function ExpressionBuilder({ text, setText, onAddRef, onDone, onClose, label }) {
  const [tab, setTab] = useState("all");      // all | functions | operators
  const [mode, setMode] = useState("build");  // build | test
  const [q, setQ] = useState("");
  const [selId, setSelId] = useState(null);   // nothing selected → detail shows the empty-state prompt
  const edRef = useRef(null);                  // the contentEditable canvas element
  // TEST mode — provide a value for each #{ref} and Run a (structure-only) validation
  const [refVals, setRefVals] = useState({});
  const [result, setResult] = useState(null); // null | {ok, msg, value}
  const refList = [...new Set((text||"").match(/#\{[^}]+\}/g) || [])].map(r=>({ raw:r, label:r.replace(/^#\{\s*|\s*\}$/g,"") }));
  const runTest = ()=>{
    const t = (text||"").trim();
    if(!t){ setResult({ok:false, msg:"The expression is empty — build it first."}); return; }
    let depth=0, bad=false; for(const ch of t){ if(ch==="(")depth++; else if(ch===")"){ depth--; if(depth<0){bad=true;break;} } }
    if(bad || depth!==0){ setResult({ok:false, msg:"Unbalanced parentheses — check your ( ) pairs."}); return; }
    const missing = refList.filter(r=> !((refVals[r.raw]||"").trim()));
    if(missing.length){ setResult({ok:false, msg:`Provide a test value for: ${missing.map(m=>m.label).join(", ")}.`}); return; }
    setResult({ok:true, msg:"Structure & references look valid. Live result evaluation isn't wired yet.", value:"—"});
  };
  // ACCORDION: one category open at a time (null = all collapsed). Search force-opens all. The open
  // category's items scroll internally (hidden scrollbar) so every category header stays in view.
  const [openCat, setOpenCat] = useState(null);
  const searching = !!q.trim();
  const catOpen = (cat) => searching || openCat===cat;
  const addRefBtn = useRef(null);
  // -------- unified INSERT MENU ------------------------------------------------
  // One simple popover, reused in two places: (a) clicking a param chip, (b) typing "/" in the editor.
  // Shape: { mode:"chip", el, top, left }  OR  { mode:"caret", top, left }.  null = closed.
  // The three top-level options (Function / Reference a field / Input field) show first; picking
  // "Function" reveals an inline searchable function list (a back chevron returns to the options).
  const [insertMenu, setInsertMenu] = useState(null);
  const [insertView, setInsertView] = useState("root");  // "root" (options) | "fn" (function search) | "op" (operator list)
  const [insertFnQ, setInsertFnQ] = useState("");          // the search query (function/operator views)
  const [insertHi, setInsertHi] = useState(0);             // highlighted-row index for keyboard nav within the open view
  // whether the editor currently has un-filled param chips flagged invalid (red border + red empty chips)
  const [invalid, setInvalid] = useState(false);
  const hiRowRef = useRef(null);                            // the highlighted row element → scrolled into view
  const searchInputRef = useRef(null);                      // the fn/op search input → auto-focused on drill-in
  // A saved caret Range, captured when opening in "caret" mode, so the option actions insert at the
  // ORIGINAL caret position even though focus moved into the popover's inputs/buttons.
  const insertRangeRef = useRef(null);
  // clamp an anchor rect → a {top,left} for the ~240px popover, kept inside the viewport.
  const placeMenu = (r) => ({
    top: Math.max(8, Math.min(r.bottom + 6, window.innerHeight - 300)),
    left: Math.max(8, Math.min(r.left, window.innerWidth - 252)),
  });
  // open the menu anchored to a clicked param chip (chip mode).
  const openMenuForChip = (chip) => {
    setInsertView("root"); setInsertFnQ(""); setInsertHi(0); insertRangeRef.current = null;
    setInsertMenu({ mode:"chip", el:chip, ...placeMenu(chip.getBoundingClientRect()) });
  };
  // open the menu at the current caret (caret mode). `rect` is the caret's client rect.
  const openMenuAtCaret = (rect) => {
    const sel = window.getSelection();
    insertRangeRef.current = (sel && sel.rangeCount) ? sel.getRangeAt(0).cloneRange() : null;
    setInsertView("root"); setInsertFnQ(""); setInsertHi(0);
    setInsertMenu({ mode:"caret", ...placeMenu(rect) });
  };
  const closeMenu = () => { setInsertMenu(null); setInsertView("root"); setInsertFnQ(""); setInsertHi(0); insertRangeRef.current = null; };

  const restoreCaret = () => {
    const ed = edRef.current; if(!ed) return;
    ed.focus();
    const r = insertRangeRef.current, sel = window.getSelection();
    if (r && sel){ sel.removeAllRanges(); sel.addRange(r); }
  };

  // mid-type in ANOTHER literal chip, finalize that one first. Clicking the chip that's already being typed
  // into does nothing (let the caret stay so they can keep editing).
  const onEditorClick = (e) => {
    const chip = e.target.closest && e.target.closest(".exprparam");
    if (chip && chip.getAttribute("data-editing")) return;   // already editing this chip — leave it
    finalizeEditingChips(chip);                              // commit any other in-progress literal chip
    if (chip && edRef.current && edRef.current.contains(chip)) openMenuForChip(chip);
  };

  // elsewhere so an in-progress typed value becomes a committed atomic chip again.
  const finalizeEditingChips = (skip) => { const ed=edRef.current; if(!ed) return;
    ed.querySelectorAll('.exprparam[data-editing]').forEach(c=>{ if(c!==skip) finishChipLiteral(c); }); };

  const caretRect = () => {
    const ed = edRef.current; const sel = window.getSelection();

      marker.textContent = "​";   // zero-width space so it has a box

      const mr = marker.getBoundingClientRect();
      const parent = marker.parentNode; if (parent) parent.removeChild(marker);

  };
  // The navigable rows for the CURRENT view, as {key, run} — used for ArrowUp/Down + Enter keyboard control.
  // Root rows differ by mode: caret (slash) → Function·Operator·Reference·Input field; chip (param) →
  // Specific value·Expression·Reference. The "fn"/"op" views list the (filtered) catalog entries.
  const currentMenuItems = () => {
    const m = insertMenu; if(!m) return [];
    if (insertView==="fn") return insertFnMatches.slice(0,40).map(f=>({ key:"fn:"+f.id, run:()=>insertMenuFn(f) }));
    if (insertView==="op") return insertOpMatches.map(o=>({ key:"op:"+o.id, run:()=>insertMenuOp(o) }));
    // chip root — three drill-ins, order: Reference · Functions · Operators. Literal values are typed
    // directly into the chip (type-to-literal at root), so there's no "Specific value" row / view.
    // This flat order MUST mirror the render order below so insertHi stays aligned.
    if (m.mode==="chip") return [
      { key:"ref", run:insertMenuRef },
      { key:"fn",  run:()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("fn"); } },
      { key:"op",  run:()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("op"); } },
    ];
    return [
      { key:"fn",    run:()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("fn"); } },
      { key:"op",    run:()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("op"); } },
      { key:"ref",   run:insertMenuRef },
      { key:"value", run:insertMenuValue },
    ];
  };
  // Full keyboard control of the open insert menu. Captured so keys NEVER leak to the contentEditable
  // or the App-level keydown (which already bails while exprEdit is open). Returns true if it handled the key.
  const onMenuKeyDown = (e) => {
    if (!insertMenu) return false;
    // TYPE-TO-LITERAL: a printable key at the CHIP root is NOT a filter — it dismisses the menu and types
    // straight into the chip as the literal value. Detect a single visible character with no modifiers and,
    // crucially, do NOT preventDefault (so the browser inserts that very keystroke into the now-editable chip).
    if (insertView==="root" && insertMenu.mode==="chip"
        && e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){

    }

    if (e.key === "ArrowDown" && n){ e.preventDefault(); e.stopPropagation(); setInsertHi(i=> (i+1)%n); return true; }
    if (e.key === "ArrowUp" && n){ e.preventDefault(); e.stopPropagation(); setInsertHi(i=> (i-1+n)%n); return true; }
    if (e.key === "Enter"){
      e.preventDefault(); e.stopPropagation();

    }

      if (insertView!=="root"){ setInsertView("root"); setInsertHi(0); } else closeMenu(); return true; }

  // SLASH command: typing "/" opens the insert menu at the caret. We preventDefault so the "/" is never
  // inserted (avoids any later removal) and open in caret mode. (Per spec, dismissing leaves the text as
  // typed — here nothing was typed, which is also fine.) When the menu is open, all nav keys are routed
  // through onMenuKeyDown (and stopped) so the editor never sees them.
  const onEditorKeyDown = (e) => {
    if (insertMenu){ if (onMenuKeyDown(e)) return; }
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      openMenuAtCaret(caretRect());
    }
  };
  // ---- the three insert actions, mode-aware -----------------------------------
  // FUNCTION: chip mode → replace the chip with the call; caret mode → insert at caret.
  const insertMenuFn = (f) => {
    if (insertMenu && insertMenu.mode==="chip" && insertMenu.el){ insertMenu.el.replaceWith(fnFragment(f)); closeMenu(); syncFromDom(); }
    else { restoreCaret(); closeMenu(); insertFn(f); }
  };
  // REFERENCE A FIELD: drill record→field, then chip mode → replace chip; caret mode → insert ref chip.
  const insertMenuRef = () => {
    const m = insertMenu; if(!m) return;
    const anchor = m.mode==="chip" ? m.el : edRef.current;
    if (m.mode==="chip"){ const chip = m.el; closeMenu(); onAddRef(anchor, (refStr)=>{ chip.replaceWith(makeRefChip(refStr)); syncFromDom(); }); }
    else { const r = insertRangeRef.current; closeMenu(); onAddRef(anchor, (refStr)=>{ const ed=edRef.current; if(ed&&r){ ed.focus(); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); } insertRefChip(refStr); }); }
  };
  // INPUT FIELD: insert a blank editable `value` chip. Chip mode → keep the existing chip, just close
  // (the user can type into it / re-open). Caret mode → insert a fresh blank value chip at the caret.
  const insertMenuValue = () => {
    const m = insertMenu; if(!m) return;
    if (m.mode==="chip"){ closeMenu(); /* existing chip already accepts a typed value via re-open */ }
    else { restoreCaret(); closeMenu(); insertNode(makeParamChip("value", "")); }
  };
  // OPERATOR: chip mode → replace the chip with the operator text (" symbol "); caret mode → insert at caret.
  const insertMenuOp = (o) => {
    if (insertMenu && insertMenu.mode==="chip" && insertMenu.el){ insertMenu.el.replaceWith(document.createTextNode(" "+o.name+" ")); closeMenu(); syncFromDom(); }
    else { restoreCaret(); closeMenu(); insertOp(o); }
  };
  // TYPE-TO-LITERAL: from the chip-menu ROOT, a printable key makes the chip directly editable and lets the
  // keystroke land inside it as the literal value. We mark the chip data-editing so syncFromDom keeps its
  // data-val in lock-step with its text (so serialize + emptyParamChips read it consistently). Caret is
  // placed at the END (and the placeholder text cleared) so the very first typed char becomes the value.
  const beginChipLiteral = (chip) => {

    chip.setAttribute("data-editing", "1");
    chip.textContent = "";                 // drop the placeholder so typing replaces it
    chip.setAttribute("data-val", "");
    chip.style.cssText = PARAM_FILLED_CSS;
    chip.classList.remove("exprparam-error");
    const ed = edRef.current; if(ed) ed.focus();

  const finishChipLiteral = (chip) => {

  };
  const insertFnMatches = EXPR_FUNCS.filter(f=>{ const s=insertFnQ.toLowerCase().trim(); return !s || f.name.toLowerCase().includes(s) || (f.display||"").toLowerCase().includes(s); });
  const insertOpMatches = EXPR_OPS.filter(o=>{ const s=insertFnQ.toLowerCase().trim(); return !s || o.name.includes(s) || (o.display||"").toLowerCase().includes(s) || o.desc.toLowerCase().includes(s); });
  // a category header — borderless at rest, a subtle card + white text appear only on hover
  const CatHeader = (cat) => { const open = catOpen(cat);
    const n = EXPR_FUNCS.filter(f=>f.cat===cat).length + EXPR_OPS.filter(op=>op.cat===cat).length;
    return <button onClick={()=>setOpenCat(c=> c===cat ? null : cat)} className="w-full shrink-0 flex items-center gap-2 px-2.5 py-2 rounded-lg text-[12px] font-semibold uppercase tracking-wider transition-colors"
      style={{ background:"transparent", color: open?"var(--text)":"var(--muted)" }}
      onMouseEnter={e=>{ e.currentTarget.style.background="var(--panel2)"; e.currentTarget.style.color="var(--text)"; }} onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; e.currentTarget.style.color= open?"var(--text)":"var(--muted)"; }}>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style={{transform:open?"rotate(90deg)":"none", transition:"transform .15s", flexShrink:0}}><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
      <span className="flex-1 text-left truncate">{cat}</span>
      <span className="text-[10.5px] font-medium tracking-normal" style={{color:"var(--faint)"}}>{n}</span></button>; };
  const ql = q.toLowerCase().trim();
  const funcs = EXPR_FUNCS.filter(f=> !ql || f.name.toLowerCase().includes(ql) || (f.display||"").toLowerCase().includes(ql) || f.cat.toLowerCase().includes(ql));
  const ops   = EXPR_OPS.filter(o=> !ql || o.name.includes(ql) || (o.display||"").toLowerCase().includes(ql) || o.desc.toLowerCase().includes(ql));
  const showFns = tab!=="operators", showOps = tab!=="functions";
  const cats = [...new Set(funcs.map(f=>f.cat))];
  const opCats = [...new Set(ops.map(o=>o.cat))];
  const sel = EXPR_FUNCS.find(f=>f.id===selId) || EXPR_OPS.find(o=>o.id===selId) || null;

  // ---- contentEditable canvas -------------------------------------------------
  // The expression is a STRING. The canvas (edRef) is an UNCONTROLLED contentEditable:
  // we seed its innerHTML ONCE (on mount / when the builder opens for a different clause)
  // and never write `text` back into it on render — that would reset the caret. Edits
  // (typing, Backspace, inserts) are serialized DOM→string and pushed up via setText.

  // make the atomic reference-chip element. `ref` is "Record > field" (no #{ } wrapper).
  const makeRefChip = (ref) => {
    const el = document.createElement("span");
    el.className = "exprref";
    el.setAttribute("contenteditable", "false");
    el.setAttribute("data-ref", ref);
    el.textContent = "#{" + ref + "}";
    el.style.cssText = "background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent2);border-radius:6px;padding:1px 6px;margin:0 1px;font-size:12.5px;font-weight:500;";
    return el;
  };

  // styles for a param chip in its EMPTY (placeholder) vs FILLED state.
  const PARAM_EMPTY_CSS = "border:1px dashed var(--border2); color:var(--muted); border-radius:6px; padding:1px 7px; margin:0 1px; font-size:12.5px; cursor:pointer;";
  const PARAM_FILLED_CSS = "background:var(--panel2); border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:1px 7px; margin:0 1px; font-size:12.5px; cursor:pointer;";
  // make an atomic param-slot chip. `name` is the placeholder (param name); `val` is the filled value

  const makeParamChip = (name, val) => {
    const el = document.createElement("span");
    el.className = "exprparam";
    el.setAttribute("contenteditable", "false");
    el.setAttribute("data-param", name);
    el.setAttribute("data-val", val || "");

  };

  // serialize the editor DOM → expression string. text nodes verbatim; ref chips → #{…};
  // param chips → their data-val if filled else their placeholder name; <br> → \n.
  const serialize = (root) => {
    let out = "";
    root.childNodes.forEach(n=>{

        else if (n.classList && n.classList.contains("exprparam")) out += (n.getAttribute("data-val") || n.getAttribute("data-param") || "");
        else if (n.nodeName==="BR") out += "\n";

  const setEmptyFlag = (ed, serialized) => { if(!ed) return;

  // insert a Node OR a DocumentFragment. For a fragment we grab its LAST child before insertion

  const insertNode = (node) => {
    const ed = edRef.current; if(!ed) return;

  };

  // build a DocumentFragment for a function call: `name(` + param chips (joined by `, `) + `)`.

  const fnFragment = (f) => {
    const frag = document.createDocumentFragment();
    const params = f.params || [];
    if (!params.length){ frag.appendChild(document.createTextNode(f.name + "()")); return frag; }
    frag.appendChild(document.createTextNode(f.name + "("));

  // ---- DESERIALIZER (the inverse of serialize) --------------------------------
  // Rebuild the editor DOM from a stored expression STRING so an editable param chip round-trips as an
  // editable param chip, a #{…} token as an atomic reference chip, and a nested fn(…) as a nested call with
  // its own chips. Operators + free text become plain text nodes (exactly as serialize would round-trip them).
  // Parsing is unambiguous because serialize emits each FUNCTION ARGUMENT as ONE atomic unit: the param

  const _fnByName = (n) => EXPR_FUNCS.find(f=>f.name===n) || null;
  // scan from an identifier start; return {name, end} if `str` has a known function name immediately followed

  const _fnHeadAt = (str, i) => {
    let j=i; while(j<str.length && /[A-Za-z0-9_]/.test(str[j])) j++;
    if (j<=i || str[j] !== "(") return null;
    const name = str.slice(i,j); return _fnByName(name) ? { name, paren:j } : null;

  // index of the ")" matching the "(" at `open`, respecting nested parens and quoted strings; -1 if none.

    let depth=0, q=null;
    for (let k=open; k<str.length; k++){ const ch=str[k];
      if (q){ if (ch==="\\"){ k++; continue; } if (ch===q) q=null; continue; }
      if (ch==='"' || ch==="'"){ q=ch; continue; }
      if (ch==="(") depth++;

    return -1;

  const _splitArgs = (body) => {
    if (!body.trim().length) return [];
    const out=[]; let depth=0, q=null, start=0;
    for (let k=0; k<body.length; k++){ const ch=body[k];
      if (q){ if (ch==="\\"){ k++; continue; } if (ch===q) q=null; continue; }
      if (ch==='"' || ch==="'"){ q=ch; continue; }

      else if (ch===")") depth--;

  const _wholeFnCall = (s) => {
    const t=s.trim(); const head=_fnHeadAt(t,0); if(!head) return null;
    const close=_matchParen(t, head.paren); if(close!==t.length-1) return null;

  const _wholeRef = (s) => { const t=s.trim(); const m=t.match(/^#\{([^}]*)\}$/); return m ? m[1] : null; };

  const _fnCallFragment = (name, body) => {
    const f = _fnByName(name); const params = (f && f.params) || [];
    const frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode(name + "("));
    const args = _splitArgs(body);

      if (i>0) frag.appendChild(document.createTextNode(", "));
      frag.appendChild(_argNode(arg, (params[i] && params[i].name) || "value"));

    frag.appendChild(document.createTextNode(")"));
    return frag;
  };
  // build the single DOM node for ONE function argument, given the catalog placeholder name for its slot.
  const _argNode = (arg, placeholder) => {
    const t = (arg||"").trim();
    const ref = _wholeRef(t);            if (ref!==null) return makeRefChip(ref);
    const call = _wholeFnCall(t);        if (call) return _fnCallFragment(call.name, call.body);
    if (t === placeholder) return makeParamChip(placeholder, "");   // unfilled slot → empty (red) chip
    return makeParamChip(placeholder, t);                            // typed literal → filled chip
  };
  // build a fragment for an arbitrary TOP-LEVEL sequence: refs → ref chips, known fn calls → nested calls,
  // everything else (operators, spaces, free text) → plain text. (Top level has no bare param chips.)
  const deserialize = (src) => {
    const frag = document.createDocumentFragment();
    const s = src || ""; let i=0, buf="";
    const flush = ()=>{ if(buf){ frag.appendChild(document.createTextNode(buf)); buf=""; } };
    while (i < s.length){
      if (s[i]==="#" && s[i+1]==="{"){ const close=s.indexOf("}", i+2);
        if (close>=0){ flush(); frag.appendChild(makeRefChip(s.slice(i+2, close))); i=close+1; continue; } }
      if (/[A-Za-z_]/.test(s[i])){ const head=_fnHeadAt(s,i);
        if (head){ const close=_matchParen(s, head.paren);
          if (close>=0){ flush(); frag.appendChild(_fnCallFragment(head.name, s.slice(head.paren+1, close))); i=close+1; continue; } } }
      buf += s[i]; i++;
    }
    flush();
    return frag;
  };

  // ---- empty-field validation -------------------------------------------------
  // An editable param chip is "empty" when its committed data-val is blank. emptyParamChips() lists them.
  const emptyParamChips = () => { const ed=edRef.current; if(!ed) return [];
    return Array.from(ed.querySelectorAll(".exprparam")).filter(c=> !((c.getAttribute("data-val")||"").trim())); };
  // paint the invalid state: red border on the editor box (via `invalid` state) + red bg on every empty param chip.
  const markInvalid = () => { const ed=edRef.current; if(!ed) return;
    emptyParamChips().forEach(c=> c.classList.add("exprparam-error"));
    setInvalid(true); };
  // re-evaluate: if no empty chips remain, drop ALL invalid styling; otherwise keep flagging only the empties.

    ed.querySelectorAll(".exprparam-error").forEach(c=>{ if(!empties.includes(c)) c.classList.remove("exprparam-error"); });
    if (empties.length===0){ setInvalid(false); }
    else if (invalid){ empties.forEach(c=> c.classList.add("exprparam-error")); } };
  // TEST gating: closing test always allowed. Opening test first requires EVERY editable param chip to be
  // filled — otherwise flag the empties red and stay in build mode.
  const tryToggleTest = () => {
    if (mode==="test"){ setMode("build"); return; }
    if (emptyParamChips().length){ markInvalid(); return; }
    setInvalid(false); setMode("test");
  };

  // seed the editor DOM ONCE per opened clause. Keyed on `label` (the clause changes when a different value
  // slot opens the builder). The stored expression STRING is DESERIALIZED back into the exact chip structure
  // (param chips, reference chips, nested function calls) so reopening round-trips faithfully — not flat text.
  useEffect(()=>{
    const ed = edRef.current; if(!ed) return;
    const src = text || "";
    ed.innerHTML = "";
    ed.appendChild(deserialize(src));
    setInvalid(false);   // a fresh clause starts valid
    setEmptyFlag(ed, src);   // seed the ghost-placeholder flag for the freshly opened clause
    // AUTO-FOCUS on open: drop the caret at the END of the editor so the user can type immediately.
    // Only when the builder is in BUILD mode (don't steal focus when reopening into test mode). This runs
    // on the open transition (keyed on `label`), not on every re-render.
    if (mode!=="test"){
      try {
        ed.focus();
        const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      } catch(_e){}
    }
  }, [label]);   // eslint-disable-line — seed only when the clause changes, not on every keystroke
  // keep the highlighted insert-menu row scrolled into view as ArrowUp/Down move it
  useEffect(()=>{ if (hiRowRef.current && hiRowRef.current.scrollIntoView) hiRowRef.current.scrollIntoView({block:"nearest"}); }, [insertHi, insertView, insertMenu]);
  // AUTO-FOCUS the search bar whenever the menu enters the fn/op search view (so typing filters immediately).
  useEffect(()=>{ if ((insertView==="fn"||insertView==="op") && searchInputRef.current && searchInputRef.current.focus){ try{ searchInputRef.current.focus(); }catch(_e){} } }, [insertView, insertMenu]);

  return (
    <div className="h-full w-full flex flex-col">
      {/* header */}
      <div className="px-4 h-14 shrink-0 flex items-center gap-2 border-b" style={{borderColor:"var(--border)"}}>
        <div className="text-[14px] font-semibold" style={{color:"var(--text)"}}>Expression Builder</div>
        <a href="#" onClick={e=>e.preventDefault()} className="inline-flex items-center gap-0.5 text-[12px] font-medium" style={{color:"var(--accent2)"}}>Doc
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M9 5H5v14h14v-4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></a>
        <CloseBtn onClick={onClose} kbd="Esc" className="ml-auto" />
      </div>
      {/* expression canvas — the HERO of the panel: a recessed code-editor surface, labelled + roomy */}
      <div className="px-4 pt-3 pb-3.5 shrink-0 border-b" style={{borderColor:"var(--border)"}}>
        <div className="flex items-center justify-between mb-2 px-0.5">
          <span className="text-[11px] font-semibold uppercase tracking-[0.12em]" style={{color:"var(--muted)"}}>Expression</span>
          <div className="flex items-center gap-3">
            <button ref={addRefBtn} onClick={()=>onAddRef(addRefBtn.current, (refStr)=> insertRefChip(refStr))} className="inline-flex items-center gap-1 text-[12px] font-semibold" style={{color:"var(--accent2)"}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>Add ref</button>
          </div>
        </div>
        <div className={"exprbox rounded-xl px-4 py-3 flex flex-col" + (invalid ? " expredit-error" : "")} style={{ background:"var(--bg)", minHeight:"128px", boxShadow:"inset 0 1px 3px rgba(0,0,0,0.18)" }}>
          <div className="relative flex-1 flex">
            <div ref={edRef} contentEditable suppressContentEditableWarning onInput={syncFromDom} onClick={onEditorClick} onKeyDown={onEditorKeyDown} onBlur={onEditorBlur}
              data-ph="Type '/' for functions, operators, references…"
              className="exprcanvas flex-1 w-full outline-none text-[14px] font-mono leading-relaxed"
              style={{color:"var(--text)", minHeight:"72px", whiteSpace:"pre-wrap", wordBreak:"break-word"}} spellCheck={false} />
          </div>
          <div className="flex justify-end mt-1"><button onClick={clearAll} className="text-[12px] font-medium hover:text-[var(--text)] transition-colors" style={{color:"var(--muted)"}}>Clear</button></div>
        </div>
      </div>
      {/* build vs test — the middle region is a FULL-AREA SWAP: build = function browser, test = test panel */}
      <div className="flex-1 min-h-0 flex flex-col">
        {/* function browser — shown only in BUILD mode (Test replaces this whole region) */}
        {mode!=="test" && (
        <div className="flex-1 min-h-0 flex">
          {/* left: search + tabs + list */}
          <div className="w-[38%] shrink-0 border-r flex flex-col min-h-0" style={{borderColor:"var(--border)"}}>
            <div className="p-2.5 shrink-0">
              <SearchBox value={q} onChange={e=>setQ(e.target.value)} />
              <div className="flex gap-3 mt-2 px-0.5">
                {[["all","All"],["functions","Functions"],["operators","Operators"]].map(([id,lab])=>{ const on=tab===id;
                  return <button key={id} onClick={()=>setTab(id)} className="text-[12.5px] font-medium pb-1 transition-colors" style={{ color:on?"var(--accent2)":"var(--muted)", borderBottom:on?"2px solid var(--accent2)":"2px solid transparent" }}>{lab}</button>; })}
              </div>
            </div>
            <div className={"flex-1 min-h-0 px-1.5 pb-2 " + (searching ? "overflow-y-auto thin-scroll" : "flex flex-col overflow-hidden")}>
              {tab==="all" && showFns && cats.length>0 && <div className="shrink-0 px-2.5 pt-1.5 pb-1 text-[10px] font-bold uppercase tracking-[0.16em]" style={{color:"var(--faint)"}}>Functions</div>}
              {showFns && cats.map(cat=>(
                <div key={cat} className="flex flex-col min-h-0" style={!searching ? {flexShrink: catOpen(cat)?1:0, flexGrow:0, flexBasis:"auto"} : undefined}>
                  {CatHeader(cat)}
                  {catOpen(cat) && <div className={"pl-1 pb-1.5 " + (searching ? "" : "flex-1 min-h-0 overflow-y-auto thin-scroll")}>{funcs.filter(f=>f.cat===cat).map(f=>{ const on=selId===f.id;
                    // HOVER previews this function in the right pane (setSelId); CLICK inserts it directly.
                    return <div key={f.id} onMouseEnter={()=>setSelId(f.id)} onClick={()=>insertFn(f)} title="Click to insert" className="group/row flex items-center gap-2.5 pl-2.5 pr-2 py-1.5 rounded-lg text-[13px] cursor-pointer transition-colors" style={ on?{background:"var(--pop-hover)", color:"var(--text)", fontWeight:600}:{color:"var(--muted)"} }>
                      <span className="w-7 h-7 shrink-0 rounded-md flex items-center justify-center text-[12px] font-mono" style={{background:"color-mix(in srgb, var(--text) 10%, var(--panel))"}}><FxGlyph/></span>
                      <span className="flex-1 truncate">{f.name}</span>
                      {/* hover-only "+" — a visual hint that clicking the row inserts (not a separate button) */}
                      <span aria-hidden="true" className="shrink-0 w-5 h-5 rounded flex items-center justify-center opacity-0 group-hover/row:opacity-100 transition-opacity" style={{color:"var(--accent2)"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg></span>
                    </div>; })}</div>}
                </div>
              ))}
              {tab==="all" && showOps && opCats.length>0 && <div className="shrink-0 px-2.5 pt-3 pb-1 text-[10px] font-bold uppercase tracking-[0.16em]" style={{color:"var(--faint)"}}>Operators</div>}
              {showOps && opCats.map(cat=>(
                <div key={cat} className="flex flex-col min-h-0" style={!searching ? {flexShrink: catOpen(cat)?1:0, flexGrow:0, flexBasis:"auto"} : undefined}>
                  {CatHeader(cat)}
                  {catOpen(cat) && <div className={"pl-1 pb-1.5 " + (searching ? "" : "flex-1 min-h-0 overflow-y-auto thin-scroll")}>{ops.filter(o=>o.cat===cat).map(o=>{ const on=selId===o.id;
                    // HOVER previews this operator in the right pane (setSelId); CLICK inserts it directly.
                    return <div key={o.id} onMouseEnter={()=>setSelId(o.id)} onClick={()=>insertOp(o)} title="Click to insert" className="group/row flex items-center gap-2.5 pl-2.5 pr-2 py-1.5 rounded-lg text-[13px] cursor-pointer transition-colors" style={ on?{background:"var(--pop-hover)", color:"var(--text)", fontWeight:600}:{color:"var(--muted)"} }>
                      <span className="w-7 h-7 shrink-0 rounded-md flex items-center justify-center text-[11.5px] font-mono font-semibold" style={{background:"color-mix(in srgb, var(--text) 10%, var(--panel))"}}>{o.name}</span>
                      <span className="flex-1 truncate">{o.display}</span>
                      {/* hover-only "+" — a visual hint that clicking the row inserts (not a separate button) */}
                      <span aria-hidden="true" className="shrink-0 w-5 h-5 rounded flex items-center justify-center opacity-0 group-hover/row:opacity-100 transition-opacity" style={{color:"var(--accent2)"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg></span>
                    </div>; })}</div>}
                </div>
              ))}
            </div>
          </div>
          {/* right: detail */}
          <div className="flex-1 min-w-0 overflow-y-auto p-4">
            {sel ? (
              <div key={sel.id} className="stepin">
                {/* preview header — the redundant "Insert" button is gone; click a row on the left to insert. */}
                <div className="flex items-center gap-2 mb-1">
                  <div className="text-[15px] font-semibold font-mono truncate" style={{color:"var(--text)"}}>{sel.name}</div>
                  <span className="ml-auto shrink-0 text-[11px] font-medium" style={{color:"var(--faint)"}}>Click in the list to insert</span>
                </div>
                {(sel.display||sel.cat) && <div className="text-[12px] mb-3" style={{color:"var(--faint)"}}>{sel.display}{sel.cat?` · ${sel.cat}`:""}</div>}
                <div className="text-[12.5px] leading-relaxed mb-4" style={{color:"var(--muted)"}}>{sel.desc}</div>
                <div className="text-[12px] font-medium mb-1.5" style={{color:"var(--ink-mid)"}}>Syntax</div>
                <div className="rounded-lg px-3 py-2 mb-4 text-[12.5px] font-mono break-all" style={{background:"color-mix(in srgb, var(--text) 15%, var(--panel))", color:"var(--text)"}}>{sel.syntax}</div>
                {sel.returns && <>
                  <div className="text-[12px] font-medium mb-1.5" style={{color:"var(--ink-mid)"}}>Returns</div>
                  <div className="rounded-lg px-3 py-2 mb-4 text-[12.5px]" style={{background:"color-mix(in srgb, var(--text) 15%, var(--panel))", color:"var(--text)"}}>{sel.returns}</div>
                </>}
                {sel.params.length>0 && <>
                  <div className="text-[12px] font-medium mb-1.5" style={{color:"var(--ink-mid)"}}>Parameters</div>
                  <div className="rounded-lg overflow-hidden mb-4" style={{border:"1px solid var(--border2)"}}>
                    <div className="grid grid-cols-[1fr_84px_1.5fr] text-[11px] font-semibold px-2.5 py-1.5" style={{background:"var(--panel2)", color:"var(--ink-mid)"}}><div>Name</div><div>Type</div><div>Description</div></div>
                    {sel.params.map((p,i)=>(
                      <div key={i} className="grid grid-cols-[1fr_84px_1.5fr] items-center text-[12px] px-2.5 py-2 gap-1" style={{borderTop:"1px solid var(--border2)", color:"var(--text)"}}>
                        <div className="font-medium font-mono break-all">{p.name}</div>
                        <div>{p.type && <span className="text-[10.5px] px-1.5 py-0.5 rounded" style={{background:"var(--panel)", border:"1px solid var(--border2)", color:"var(--muted)"}}>{p.type}</span>}</div>
                        <div style={{color:"var(--muted)"}}>{p.desc}</div>
                      </div>
                    ))}
                  </div>
                </>}
                {sel.examples.length>0 && <>
                  <div className="text-[12px] font-medium mb-1.5" style={{color:"var(--ink-mid)"}}>Examples</div>
                  <div className="flex flex-col gap-2">
                    {sel.examples.map((ex,i)=>(<div key={i} className="rounded-lg px-3 py-2 text-[12px] font-mono break-all" style={{background:"color-mix(in srgb, var(--text) 15%, var(--panel))", color:"var(--text)"}}>{ex}</div>))}
                  </div>
                </>}
              </div>
            ) : (
              <div className="h-full min-h-[420px] flex flex-col items-center justify-center text-center px-10">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style={{color:"var(--border2)", marginBottom:"12px"}}><path d="M14 3l-4 18M7 8l-4 4 4 4M17 8l4 4-4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                <div className="text-[13px] font-medium" style={{color:"var(--muted)"}}>Select a function or operator</div>
                <div className="text-[12px] mt-1" style={{color:"var(--faint)"}}>Pick one from the left to see its details.</div>
              </div>
            )}
          </div>
        </div>
        )}
        {/* test panel — FULLY REPLACES the function browser when in test mode (Reference Value | Test Expression) */}
        {mode==="test" && (
          <div className="flex-1 min-h-0 flex">
            {/* left: Reference Value — one input per #{ref} in the expression */}
            <div className="w-1/2 shrink-0 border-r flex flex-col min-h-0" style={{borderColor:"var(--border)"}}>
              <div className="px-4 pt-4 pb-2 shrink-0 text-[14px] font-semibold" style={{color:"var(--text)"}}>Reference Value</div>
              <div className="flex-1 overflow-y-auto thin-scroll px-4 pb-4">
                {refList.length===0
                  ? <div className="text-[12.5px] mt-2" style={{color:"var(--faint)"}}>No <span className="font-mono">#{"{…}"}</span> references in the expression. Add one with <span style={{color:"var(--accent2)"}}>Add ref</span> to provide a test value.</div>
                  : refList.map(r=>(
                    <div key={r.raw} className="mb-3">
                      <div className="text-[12px] font-medium mb-1 inline-flex items-center rounded-md px-1.5 py-0.5" style={{background:"color-mix(in srgb, var(--accent) 14%, transparent)", color:"var(--accent2)"}}>{r.label}</div>
                      <input value={refVals[r.raw]||""} onChange={e=>{ setRefVals(v=>({...v, [r.raw]:e.target.value})); setResult(null); }} placeholder="test value…"
                        className="w-full rounded-lg px-3 py-2 text-[13px] outline-none" style={{background:"var(--panel)", border:"1px solid var(--border2)", color:"var(--text)"}}/>
                    </div>
                  ))}
              </div>
            </div>
            {/* right: Test Expression — Run + result */}
            <div className="flex-1 min-w-0 flex flex-col min-h-0">
              <div className="px-4 pt-4 pb-2 shrink-0 flex items-start gap-2">
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] font-semibold" style={{color:"var(--text)"}}>Test Expression</div>
                  <div className="text-[12px] mt-0.5" style={{color:"var(--faint)"}}>Provide test values to validate your expression.</div>
                </div>
                <button onClick={runTest} className="shrink-0 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-[13px] font-semibold transition-colors hover:brightness-110" style={{background:"var(--accent)", color:"#fff"}}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 5l11 7-11 7V5z" fill="currentColor"/></svg>Run</button>
              </div>
              <div className="flex-1 overflow-y-auto thin-scroll px-4 pb-4">
                {!result ? <div className="text-[12.5px] mt-2" style={{color:"var(--faint)"}}>Press <span className="font-semibold" style={{color:"var(--muted)"}}>Run</span> to validate the expression and references.</div>
                  : <div className="rounded-xl p-3.5" style={ result.ok
                      ? { background:"color-mix(in srgb, var(--c-then) 12%, transparent)", border:"1px solid color-mix(in srgb, var(--c-then) 40%, transparent)" }
                      : { background:"color-mix(in srgb, #ef4444 12%, transparent)", border:"1px solid color-mix(in srgb, #ef4444 40%, transparent)" } }>
                      <div className="flex items-center gap-2 mb-1.5">
                        {result.ok
                          ? <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style={{color:"var(--c-then)"}}><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M8 12l3 3 5-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          : <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style={{color:"#ef4444"}}><path d="M12 8v5M12 16.5v.5M10.3 3.9 2.4 18a1.8 1.8 0 001.6 2.7h16a1.8 1.8 0 001.6-2.7L13.7 3.9a1.8 1.8 0 00-3.1 0z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                        <span className="text-[13.5px] font-semibold" style={{color: result.ok?"var(--c-then)":"#ef4444"}}>{result.ok?"Valid Expression":"Invalid Expression"}</span>
                      </div>
                      {result.ok && <div className="text-[13px] font-mono mb-1" style={{color:"var(--text)"}}>Result: {result.value}</div>}
                      <div className="text-[12.5px] leading-relaxed" style={{color:"var(--muted)"}}>{result.msg}</div>
                    </div>}
              </div>
            </div>
          </div>
        )}
      </div>
      {/* footer */}
      <div className="px-4 py-3.5 border-t shrink-0 flex items-center gap-2" style={{borderColor:"var(--border)"}}>
        <div className="flex-1 min-w-0 text-[12px] truncate" style={{color:"var(--faint)"}}>Setting <span style={{color:"var(--muted)", fontWeight:600}}>{label}</span></div>
        {/* ONE ghost/secondary toggle in a fixed slot left of Done: ▶ Test (build) ⇄ ✕ Close test (test).
            Enabling test still gates on validation via tryToggleTest(); closing just toggles. NOT a filled
            primary — Done is the only accent-filled button in the footer. */}
        <button onClick={tryToggleTest} title={mode==="test" ? "Close test" : "Test the expression"}
          className="shrink-0 inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-[13px] font-semibold transition-colors hover:bg-[var(--pop-hover)]"
          style={{background:"transparent", border:"1px solid var(--border2)", color:"var(--muted)"}}>
          {mode==="test"
            ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>
            : <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 5l11 7-11 7V5z" fill="currentColor"/></svg>}
          {mode==="test" ? "Close test" : "Test"}</button>
        <button onClick={onDone} className="shrink-0 px-4 py-2 rounded-lg text-[13px] font-semibold transition-colors hover:brightness-110" style={{background:"var(--accent)", color:"#fff"}}>Done</button>
      </div>

      {/* unified INSERT MENU — one simple popover reused by (a) clicking a param chip and (b) typing "/".
          Top level shows three option rows; "Function" reveals an inline searchable list (back chevron
          returns). Backdrop click or Escape dismisses. No × buttons (removal = Backspace + Clear). */}
      {insertMenu && (()=>{
        // a highlighted-row style helper + ref wiring for keyboard nav (ArrowUp/Down/Enter).
        const rowStyle = (on)=> on ? {background:"var(--pop-hover)"} : undefined;
        const rowProps = (i)=> ({ style:rowStyle(i===insertHi), ref:(i===insertHi)?hiRowRef:null,
          onMouseEnter:()=>setInsertHi(i) });
        const isChip = insertMenu.mode==="chip";
        // small uppercase muted section label (matches the FUNCTIONS/OPERATORS super-headers in the accordion)
        const SecLabel = (txt, mt)=> <div className={"px-2.5 pb-1 text-[10px] font-bold uppercase tracking-[0.16em] " + (mt?"pt-1.5":"pt-0.5")} style={{color:"var(--faint)"}}>{txt}</div>;
        return (
        <>
          <div onClick={closeMenu} style={{position:"fixed", inset:0, zIndex:60}}/>
          <div className="stepin" onKeyDown={onMenuKeyDown} style={{ position:"fixed", top:insertMenu.top, left:insertMenu.left, width:240, zIndex:61,
            background:"var(--pop-bg)", border:"1px solid var(--border2)", borderRadius:12, boxShadow:"var(--shadow-pop)", padding:6 }}>
            {insertView==="root" ? (
              isChip ? (
              <>
                {/* CHIP MODE — fill THIS param. A clean TEXT hierarchy (no icon tiles, no section labels, no
                    kbd hints): Reference a field · divider · Functions · Operators. Literal values are typed
                    straight into the chip (type-to-literal at root), so there's no "Specific value" row. */}
                <div className="px-2.5 pt-0.5 pb-1.5 text-[10.5px]" style={{color:"var(--faint)"}}>Type to enter a value, or pick:</div>
                {/* Reference a field — flat idx 0 */}
                <button {...rowProps(0)} onClick={insertMenuRef} className="w-full text-left px-2.5 py-2 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                  <span className="block text-[12.5px] font-medium truncate" style={{color:"var(--text)"}}>Reference a field</span>
                  <span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>another record's value</span>
                </button>
                <div className="my-1.5 h-px" style={{background:"var(--border2)"}}/>
                {/* Functions — flat idx 1 */}
                <button {...rowProps(1)} onClick={()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("fn"); }} className="w-full text-left px-2.5 py-2 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                  <span className="block text-[12.5px] font-medium truncate" style={{color:"var(--text)"}}>Functions</span>
                  <span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>nest a function call</span>
                </button>
                {/* Operators — flat idx 2 */}
                <button {...rowProps(2)} onClick={()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("op"); }} className="w-full text-left px-2.5 py-2 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                  <span className="block text-[12.5px] font-medium truncate" style={{color:"var(--text)"}}>Operators</span>
                  <span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>compare, logic or math</span>
                </button>
              </>
              ) : (
              <>
                {/* CARET MODE — slash menu, grouped: INSERT EXPRESSION (function / operator) · INSERT VALUE (reference / input). */}
                {SecLabel("Insert expression", false)}
                {/* fx Function — flat idx 0 */}
                <button {...rowProps(0)} onClick={()=>{ setInsertFnQ(""); setInsertHi(0); setInsertView("fn"); }} className="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                  <span className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 font-mono text-[14px]" style={{background:"var(--panel2)", color:"var(--accent2)"}}><FxGlyph/></span>
                  <span className="min-w-0 text-left"><span className="block text-[12.5px] font-medium truncate" style={{color:"var(--text)"}}>Function</span><span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>insert a function</span></span>

                {/* ✎ Input field — flat idx 3 */}

                </button>
              </>
              )
            ) : (
              <>
                {/* function / operator search — CANONICAL dropdown layout: [‹ back + heading] on top, search below */}
                <div className="flex items-center gap-1.5 mb-2">
                  <button onClick={()=>{ setInsertView("root"); setInsertHi(0); }} title="Back" className="shrink-0 flex items-center justify-center w-5 h-5 rounded-md transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></button>
                  <span className="text-[12px] font-semibold truncate" style={{color:"var(--text)"}}>{insertView==="op" ? "Operators" : "Functions"}</span>
