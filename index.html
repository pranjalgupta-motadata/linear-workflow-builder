              : <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" strokeWidth="2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>}
          </button>
          <button onClick={reset} title="Reset (⇧R)"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125"
            style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M3 3v5h5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <button onClick={undo} title="Undo (Ctrl/⌘+Z)"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125"
            style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 14L4 9l5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M4 9h11a5 5 0 010 10h-3" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <button onClick={redo} title="Redo (Ctrl/⌘+Shift+Z)"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125"
            style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 14l5-5-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M20 9H9a5 5 0 000 10h3" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <button onClick={()=>setGuideOpen(g=>{ if(!g) setStep(0); return !g; })} title="Show guide"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125"
            style={{background:guideOpen?"var(--accent)":"var(--panel2)",border:"1px solid var(--border2)",color:guideOpen?"#fff":"var(--muted)"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.6.6 1 1.3 1 2.1h6c0-.8.4-1.5 1-2.1A6 6 0 0012 3z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <button onClick={()=>setHelpOpen(true)} title="Keyboard shortcuts (?)"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125 text-[13px] font-semibold"
            style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>⌘</button>
          <button className="px-3 py-1.5 rounded-lg text-sm font-medium" style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--text)"}}>Test</button>
        </div>
      </header>

      {/* canvas — two columns: flow (left) + context rail (right) */}
      <div className="flex-1 overflow-hidden flex">

        {/* left: the flow */}
        <div className="flex-1 overflow-y-auto relative">
          <div className="canvas-layer"></div>
          <div className="relative z-10 mx-auto w-full px-8 pb-0 min-h-full flex flex-col" style={{maxWidth:"720px", paddingTop:"20vh"}}>
            {/* while a form editor is open: dim + block the whole canvas; the edited node (z-40) stays above this */}
            {drawer && <div className="absolute inset-0 z-30" style={{ background:"color-mix(in srgb, var(--bg) 62%, transparent)", cursor:"default" }} onMouseDown={(e)=>e.stopPropagation()} />}

            {/* WHEN — multiple triggers, OR'd */}
            {!hasTrigger
              ? <Station marker={MARK.trigger} isFirst head="When" headColor="var(--c-when)" headBg="var(--c-when-bg)" hoverBg="var(--c-when-h)" help={NODE_HELP.when}
                  innerRef={(el)=>setRowRef("T", el)}
                  focused={focusKey==="T"} onFocus={()=>setFocusKey("T")}>
                  <Slot value={null} placeholder="when this happens…" open={openSlot==="Twhen"} innerRef={(el)=>setRowRef("Twhen", el)} onClick={(e)=>pickTriggerType(e.currentTarget)} />
                </Station>
              : triggers.map((t,i)=>(
                  <Station key={t.id} marker={i===0 ? MARK.trigger : null} isFirst={i===0} dense={i>0}
                    gapBottom={i < triggers.length-1 ? 4 : 10}
                    bgLeft={i===0 ? "16px" : "34px"} bgRight="16px" padLeft={i===0 ? "34px" : "50px"} padRight="28px"
                    head={i===0?"When":"Or"} headColor="var(--c-when)" headBg="var(--c-when-bg)" hoverBg="var(--c-when-h)" help={NODE_HELP.when}
                    innerRef={(el)=>setRowRef(`trig:${t.id}`, el)} removeLabel="Clear trigger"
                    focused={focusKey===`trig:${t.id}`} onFocus={()=>setFocusKey(`trig:${t.id}`)} onRemove={()=>removeTrigger(t.id)}>
                    <Template tpl={triggerView(t).tpl} vals={t.vals}
                      openKey={openSlot && openSlot.startsWith(`trig:${t.id}:`) ? openSlot.slice(`trig:${t.id}:`.length) : null}
                      onSlot={(key,e)=>pickTriggerSlot(t,key,e)} slotRef={(k,el)=>setTriggerSlotRef(t.id,k,el)} />
                  </Station>
                ))}

            {/* trunk flow + terminal "End" cap (once the workflow has an action) */}
            {(() => {
              const openerShown = !anyAction(flow); // "do this…" opener shows until an action exists
              const showEnd = hasTrigger && anyAction(flow);
              return (<>
                {renderFlow(flow, [], { last: showEnd ? false : !openerShown })}
                {showEnd && (
                  <div className="relative" style={{ paddingLeft:"34px", paddingTop:`${PAD}px`, paddingBottom:"4px" }}>
                    <div className="absolute" style={{ left:"9px", top:0, height:`${MC}px`, width:"1px", background:"var(--border2)" }}/>
                    <span className="absolute flex items-center justify-center" style={{ left:"9px", top:`${MC}px`, transform:"translate(-50%,-50%)" }}>
                      <span className="block w-3 h-3 rounded-full" style={{ border:"2px solid var(--border2)", background:"var(--bg)", boxShadow:"0 0 0 4px var(--bg)" }}/>
                    </span>
                    <span className="text-[11px] font-semibold uppercase tracking-[0.12em]" style={{ color:"var(--faint)", lineHeight:`${HEAD}px` }}>End</span>
                  </div>
                )}
              </>);
            })()}

            {/* trunk opener — the green "Then do this…" prompt for the first action */}
            <Opener path={[]} />

            {/* CTAs — always present, aligned to the rail line; sticky to bottom when the flow scrolls */}
            <div className="sticky bottom-0 flex items-center gap-3 -mx-8 px-8 pt-6 pb-8 mt-16"
              style={{ paddingLeft:"34px", background:"linear-gradient(to top, var(--bg) 70%, transparent)" }}>
              <button ref={addStepBtnRef} onClick={(e)=>openMain([], e)} title="Add a step"
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-[13px] font-medium transition-colors hover:bg-[var(--pop-hover)]"
                style={{ background:"transparent", border:"1px solid var(--border2)", color:"var(--muted)" }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                Add step
              </button>
              <button onClick={()=>setPublished(p=>!p)}
                className="inline-flex items-center px-4 py-2 rounded-lg text-[13px] font-semibold transition-colors hover:brightness-110"
                style={ published
                  ? { background:"transparent", border:"1px solid var(--border2)", color:"var(--muted)" }
                  : { background:"var(--accent)", border:"1px solid var(--accent)", color:"#fff" } }>
                {published ? "Unpublish" : "Publish workflow"}
              </button>
            </div>

          </div>
        </div>

        {/* right: context rail — overview normally; swaps to an action's DETAIL FORM (wider) when a
            detail card is clicked. Back chevron returns to the overview. */}
        <aside className={(drawer ? "w-[440px]" : "w-[340px]") + " shrink-0 flex flex-col relative transition-[width] duration-300 ease-in-out"} style={{ borderLeft:"1px solid var(--border)", background:"var(--panel)" }}>
          {drawer && (()=>{
            const dpath = treeFindPath(flow, drawer);
            const dnode = dpath ? nodeAt(flow, dpath) : null;
            if (!dnode) return null;
            const dfields = dnode.fields || [];
            // which record this action acts on → its module decides which system fields show
            const dScope = recordsInScope(dpath);
            const dModName = dnode.action==="create" ? dnode.arg
              : (()=>{ const r = dScope.find(x=>x.id===dnode.record) || dScope[dScope.length-1]; return r ? r.label.replace(/^the\s+/i,"") : (triggers[0] && triggers[0].vals && triggers[0].vals.module); })();
            const recFields = recordFieldsFor(dModName);
            const setF = (i, patch) => update(dpath, { fields: dfields.map((x,ix)=>ix===i?{...x,...patch}:x) });
            const addF = () => update(dpath, { fields: [...dfields, { field:null, value:null }] });
            const rmF  = (i) => update(dpath, { fields: dfields.filter((_,ix)=>ix!==i) });
            const dspec = formSpecFor(dnode.action);
            const ddata = dnode.data || {};
            const setD = (kk,v) => update(dpath, { data: { ...ddata, [kk]: v } });
            // repeatable STAGES (multi-stage approval etc.) — stored as ddata.stages[]
            const dstages = ddata.stages || [];
            const setStage = (i2, kk, val) => setD("stages", dstages.map((s3,ix)=> ix===i2 ? { ...s3, [kk]: val } : s3));
            const addStage = () => { setD("stages", [...dstages, { dtype:"Unanimous" }]); setOpenSecs(s2=>({ ...s2, ["stage:"+dstages.length]:true })); };
            const rmStage = (i2) => setD("stages", dstages.filter((_,ix)=>ix!==i2));
            const inCls = "w-full rounded-lg px-2.5 py-2 text-[13px] outline-none";
            const inSty = { background:"var(--panel2)", border:"1px solid var(--border2)", color:"var(--text)" };
            const title = dspec ? dspec.title : (dnode.action==="create" ? `Create ${dnode.arg||"record"}` : dnode.action==="update" ? "Update record" : "Details");
            const sub   = dspec ? dspec.sub   : (dnode.action==="update" ? "Choose the fields to change and their new values" : "Fill the fields for this action");
            // unified plain-English summary (shown as its own bordered section right below the header)
            const summarySegs = dspec
              ? (dspec.overview ? dspec.overview(ddata) : null)
              : (()=>{ const isC = dnode.action==="create";
                  const segs=[{t:isC?"Create a":"Update the"},{t:(isC?(dnode.arg||"record"):(dModName||"record")),em:true},{t:isC?"with":"— set"}];
                  const rows2 = dfields.length ? dfields : [{}];
                  rows2.forEach((fv,i)=>{ if(i>0) segs.push({t:"·"});
                    const fd = fv.field && recFields.find(x=>x.id===fv.field); const val = Array.isArray(fv.value)?fv.value.join(", "):fv.value;
                    segs.push(fd ? {t:fd.label,em:true} : {t:"field",dim:true});
                    segs.push({t:"to"});
                    segs.push(val ? {t:val,em:true} : {t:"a value",dim:true}); });
                  return segs; })();
            return (
              <div className="absolute inset-0 z-10 flex flex-col" style={{background:"var(--panel)"}}>
                <div className="px-4 h-16 shrink-0 flex items-center gap-2.5 border-b" style={{borderColor:"var(--border)"}}>
                  <div className="min-w-0">
                    <div className="text-[14.5px] font-semibold truncate" style={{color:"var(--text)"}}>{title}</div>
                    <div className="text-[11.5px] truncate" style={{color:"var(--muted)"}}>{sub}</div>
                  </div>
                  <button onClick={()=>setDrawer(null)} title="Close"
                    className="ml-auto w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
                {/* SUMMARY — its own section right below the header, separated by a bottom border */}
                {summarySegs && (
                  <div className="px-4 pt-3.5 pb-4 shrink-0 border-b" style={{borderColor:"var(--border)"}}>
                    <div className="text-[10px] uppercase tracking-[0.13em] mb-1.5" style={{color:"var(--faint)"}}>Summary</div>
                    <div className="rounded-lg px-3.5 py-3" style={{ background:"color-mix(in srgb, var(--accent) 9%, transparent)", minHeight:"74px" }}>
                      <div className="flex flex-wrap items-baseline gap-x-1.5 gap-y-1 text-[14.5px] leading-relaxed">
                        {summarySegs.map((s,i)=> s.j
                          ? <span key={i} className="text-[12.5px] font-semibold" style={{color:"var(--c-if)"}}>{s.t}</span>
                          : <span key={i} style={{ color: s.em?"var(--text)":(s.dim?"var(--faint)":"var(--muted)"), fontWeight:s.em?600:400 }}>{s.t}</span>)}
                      </div>
                    </div>
                  </div>
                )}
                <div className="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3">
                  {dspec ? (()=>{
                    // spec-driven form. Required fields (no `sec`) stay always visible; optional fields are
                    // grouped into COLLAPSIBLE sections with a fill-count — progressive-disclosure-ish.
                    const renderField = (fd, dd, sd)=>{
                      const D = dd || ddata, SET = sd || setD; // bindable: top-level data or a stage's data
                      if (fd.showIf && !fd.showIf(D)) return null; // conditional field (e.g. relation type only for Asset/CI)
                      const v = D[fd.k] || "";
                      const set = (val)=>SET(fd.k, val||null);
                      let ctrl;
                      if (fd.type==="select")
                        ctrl = (<select className={inCls} style={inSty} value={v} onChange={e=>set(e.target.value)}>
                          <option value="">Select…</option>
                          {(fd.options||[]).map(o=><option key={o} value={o}>{o}</option>)}
                        </select>);
                      else if (fd.type==="user")
                        ctrl = (<select className={inCls} style={inSty} value={v} onChange={e=>set(e.target.value)}>
                          <option value="">Unassigned</option>
                          {SAMPLE_USERS.map(u2=><option key={u2.name} value={u2.name}>{u2.name}</option>)}
                        </select>);
                      else if (fd.type==="textarea")
                        ctrl = <textarea rows={3} className={inCls} style={inSty} value={v} placeholder={fd.ph||""} onChange={e=>set(e.target.value)}/>;
                      else if (fd.type==="richtext")
                        ctrl = (<div className="rounded-lg overflow-hidden" style={{border:"1px solid var(--border2)", background:"var(--panel2)"}}>
                          <textarea rows={5} className="w-full px-2.5 py-2 text-[13px] outline-none bg-transparent resize-y" style={{color:"var(--text)"}} value={v} placeholder={fd.ph||""} onChange={e=>set(e.target.value)}/>
                          <div className="flex items-center gap-3 px-3 py-1.5 border-t text-[12px] select-none" style={{borderColor:"var(--border2)", color:"var(--faint)"}}>
                            <span className="font-bold">B</span><span className="italic">I</span><span className="underline">U</span><span>H1</span><span>≡</span><span>⛓</span>
                          </div>
                        </div>);
                      else if (fd.type==="segment")
                        ctrl = (<div className="flex flex-wrap gap-1 rounded-lg p-1" style={{background:"var(--panel2)", border:"1px solid var(--border2)"}}>
                          {(fd.options||[]).map(o=>(
                            <button key={o} onClick={()=>set(o)} className="flex-1 px-2 py-1.5 rounded-md text-[12px] font-medium whitespace-nowrap transition-colors"
                              style={ v===o ? {background:"var(--accent)", color:"#fff"} : {color:"var(--muted)"} }>{o}</button>
                          ))}
                        </div>);
                      else if (fd.type==="duration")
                        ctrl = (<div className="flex gap-2">
                          <input type="number" className={inCls+" flex-1 min-w-0"} style={inSty} value={v} placeholder="0" onChange={e=>set(e.target.value)}/>
                          <select className={inCls+" w-24 shrink-0"} style={inSty} value={D[fd.k+"_unit"]||"Hours"} onChange={e=>SET(fd.k+"_unit", e.target.value)}>
                            {["Minutes","Hours","Days"].map(u2=><option key={u2}>{u2}</option>)}
                          </select>
                        </div>);
                      else if (fd.type==="daterange") {
                        const v2 = D[fd.k2] || "";
                        const days = (v && v2) ? Math.round((new Date(v2) - new Date(v)) / 86400000) : null;
                        ctrl = (
                          <div className="rounded-xl border px-3.5 py-2.5 flex items-center gap-3" style={{borderColor:"var(--border2)", background:"var(--panel2)"}}>
                            <div className="flex flex-col gap-0.5 min-w-0 flex-1">
                              <span className="text-[10.5px]" style={{color:"var(--faint)"}}>From</span>
                              <input type="date" className="bg-transparent outline-none text-[13px] font-medium w-full" style={{color:"var(--text)"}} value={v} onChange={e=>set(e.target.value)}/>
                            </div>
                            {days!==null && days>=0 &&
                              <span className="shrink-0 px-2.5 py-1 rounded-lg border text-[12px] font-medium" style={{borderColor:"var(--border2)", color:"var(--muted)", background:"var(--panel)"}}>{days} {days===1?"day":"days"}</span>}
                            <div className="flex flex-col gap-0.5 min-w-0 flex-1 items-end">
                              <span className="text-[10.5px]" style={{color:"var(--faint)"}}>To</span>
                              <input type="date" className="bg-transparent outline-none text-[13px] font-medium w-full text-right" style={{color:"var(--text)"}} value={v2} onChange={e=>SET(fd.k2, e.target.value||null)}/>
                            </div>
                          </div>
                        );
                      }
                      else if (fd.type==="tokens")
                        ctrl = <TokenInput value={Array.isArray(v)?v:[]} onChange={set} placeholder={fd.ph}/>;
                      else if (fd.type==="multi")
                        ctrl = <MultiSelect options={fd.options||[]} value={Array.isArray(v)?v:[]} onChange={set} placeholder={fd.ph||"choose one or more…"}/>;
                      else if (fd.type==="radio")
                        ctrl = (<div className="flex flex-col gap-1.5">
                          {(fd.options||[]).map(o=>{ const on=v===o;
                            return (<button key={o} type="button" onClick={()=>set(o)}
                              onMouseEnter={e=>{ if(!on) e.currentTarget.style.background="var(--pop-hover)"; }}
                              onMouseLeave={e=>{ if(!on) e.currentTarget.style.background="transparent"; }}
                              className="flex items-center justify-between gap-2.5 rounded-lg border px-3.5 py-2.5 text-left transition-colors"
                              style={{ borderColor:on?"var(--accent)":"var(--border2)", background:on?"color-mix(in srgb, var(--accent) 10%, transparent)":"transparent" }}>
                              <span className="text-[13.5px] font-medium" style={{color:on?"var(--text)":"var(--muted)"}}>{o}</span>
                              {on && <svg className="shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none" style={{color:"var(--accent)"}}><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                            </button>); })}
                        </div>);
                      else if (fd.type==="condition")
                        ctrl = <AttachedCondition value={Array.isArray(v)?v:[]} onChange={set} open={open} fields={fd.fieldsFrom ? fd.fieldsFrom(D) : undefined}/>;
                      else if (fd.type==="keyval")
                        ctrl = <KeyValRows value={Array.isArray(v)?v:[]} onChange={set} keyPh={fd.keyPh} valPh={fd.valPh}/>;
                      else if (fd.type==="attach")
                        ctrl = (<button type="button" className="inline-flex items-center justify-center gap-2 rounded-lg border border-dashed px-3 py-2 text-[12.5px] font-medium transition-colors hover:bg-[var(--pop-hover)]" style={{borderColor:"var(--border2)", color:"var(--muted)"}}>
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M8 8l4-4 4 4M5 20h14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          Attach files
                        </button>);
                      else
                        ctrl = <input className={inCls} style={inSty} type={fd.type==="date"?"date":fd.type==="datetime"?"datetime-local":fd.type==="number"?"number":"text"} value={v} placeholder={fd.ph||""} onChange={e=>set(e.target.value)}/>;
                      return (
                        <div key={fd.k} className={(fd.half?"col-span-1":"col-span-2")+" flex flex-col gap-1.5 min-w-0"}>
                          {fd.type!=="daterange" && <label className="text-[11px] font-semibold uppercase tracking-[0.08em]" style={{color:"var(--faint)"}}>{fd.label}{!fd.opt && <span className="ml-0.5" style={{color:"var(--red)"}}>*</span>}</label>}
                          {ctrl}
                        </div>
                      );
                    };
                    const grid = (fs, dd, sd)=>(<div className="grid grid-cols-2 gap-x-3 gap-y-4">{fs.map(f3=>renderField(f3, dd, sd))}</div>);
                    const secs = [...new Set(dspec.fields.filter(f2=>f2.sec).map(f2=>f2.sec))];
                    return (<>
                      {grid(dspec.fields.filter(f2=>!f2.sec))}
                      {secs.map(sn=>{
                        const fs = dspec.fields.filter(f2=>f2.sec===sn);
                        const openS = !!openSecs[sn];
                        const n = fs.filter(f2=>ddata[f2.k]).length;
                        return (
                          <div key={sn} className="rounded-xl border overflow-hidden" style={{borderColor:"var(--border2)"}}>
                            <button onClick={()=>setOpenSecs(s2=>({...s2,[sn]:!s2[sn]}))}
                              className="w-full flex items-center gap-2 px-3 py-2.5 transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
                              <svg className={"transition-transform "+(openS?"rotate-90":"")} width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                              <span className="text-[12.5px] font-semibold" style={{color:"var(--text)"}}>{sn}</span>
                              <span className="ml-auto text-[11px]" style={{color: n?"var(--rdy-fg)":"var(--faint)"}}>{n ? `${n} filled` : "Optional"}</span>
                            </button>
                            {openS && <div className="px-3 pb-3.5 pt-2.5">{grid(fs)}</div>}
                          </div>
                        );
                      })}
                      {/* repeatable STAGES — accordion cards with add/remove (e.g. multi-stage approval) */}
                      {dspec.stages && (<>
                        <span className="mt-1 text-[11px] font-semibold uppercase tracking-[0.08em]" style={{color:"var(--faint)"}}>{dspec.stages.label}<span className="ml-0.5" style={{color:"var(--red)"}}>*</span></span>
                        {dstages.map((st,i2)=>{
                          const skey = "stage:"+i2, sOpen = !!openSecs[skey];
                          return (
                            <div key={i2} className="rounded-xl border overflow-hidden" style={{borderColor: sOpen?"color-mix(in srgb, var(--accent) 45%, transparent)":"var(--border2)"}}>
                              <div onClick={()=>setOpenSecs(s2=>({...s2,[skey]:!s2[skey]}))}
                                className="w-full flex items-center gap-2 px-3 py-2.5 cursor-pointer transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
                                <svg className={"transition-transform "+(sOpen?"rotate-90":"")} width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                <span className="text-[12.5px] font-semibold" style={{color:"var(--text)"}}>Stage {i2+1}</span>
                                <span className="text-[11px]" style={{color:"var(--faint)"}}>{st.dtype||"—"}</span>
                                <button onClick={(e)=>{ e.stopPropagation(); rmStage(i2); }} className="ml-auto text-[11px] font-medium hover:brightness-125" style={{color:"var(--red)"}}>remove</button>
                              </div>
                              {sOpen && <div className="px-3 pb-3.5 pt-2.5">{grid(dspec.stages.fields, st, (kk,val)=>setStage(i2,kk,val))}</div>}
                            </div>
                          );
                        })}
                        <button onClick={addStage} className="rounded-xl border border-dashed px-3 py-2.5 text-[13px] font-medium transition-colors hover:bg-[var(--pop-hover)]" style={{borderColor:"var(--border2)", color:"var(--muted)"}}>+ Add stage</button>
                      </>)}
                    </>);
                  })() : (<>
                    {dfields.length===0 && <div className="text-[12.5px] leading-relaxed" style={{color:"var(--faint)"}}>{dnode.action==="update" ? "No fields yet. Add the fields you want to change on the record." : `No fields yet. Add one or more fields to fill on the new ${dnode.arg||"record"}.`}</div>}
                    {dfields.map((fv,i)=>{
                      const fd = recFields.find(x=>x.id===fv.field);
                      const used = dfields.map(x=>x.field).filter((x,ix)=>ix!==i); // hide fields already chosen in other rows
                      return (
                        <div key={i} className="rounded-xl border p-3 flex flex-col gap-2" style={{borderColor:"var(--border2)", background:"var(--panel2)"}}>
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-semibold uppercase tracking-[0.1em]" style={{color:"var(--faint)"}}>Field {i+1}</span>
                            <button onClick={()=>rmF(i)} className="text-[11px] font-medium hover:brightness-125" style={{color:"var(--red)"}}>remove</button>
                          </div>
                          <select className={inCls} style={inSty} value={fv.field||""} onChange={e=>setF(i,{field:e.target.value||null, value:null})}>
                            <option value="">choose a field…</option>
                            {recFields.filter(f=>!used.includes(f.id)).map(f=><option key={f.id} value={f.id}>{f.label}{f.req?" *":""}</option>)}
                          </select>
                          {fd && (
                            fd.multi  // predefined multi-select dropdown
                            ? <MultiSelect options={fd.values||[]} value={fv.value} onChange={v=>setF(i,{value:v})} placeholder="choose one or more…" />
                            : fd.type==="tokens"  // free type-and-add chips (cc emails, tags)
                            ? <TokenInput value={fv.value} onChange={v=>setF(i,{value:v})} placeholder={fd.placeholder} />
                            : fd.type==="toggle"  // yes / no
                            ? <div className="flex rounded-lg overflow-hidden self-start" style={{border:"1px solid var(--border2)"}}>
                                {["Yes","No"].map(opt=>{ const on=fv.value===opt;
                                  return <button key={opt} onClick={()=>setF(i,{value:opt})} className="px-4 py-1.5 text-[13px] font-medium transition-colors"
                                    style={{ background:on?"var(--c-then)":"var(--panel)", color:on?"#fff":"var(--muted)" }}>{opt}</button>; })}
                              </div>
                            : fd.type==="textarea"
                            ? <textarea className={inCls} style={{...inSty, minHeight:"72px", resize:"vertical"}} value={fv.value||""} placeholder="enter text…" onChange={e=>setF(i,{value:e.target.value||null})}/>

              <div key={i} className="flex items-center justify-between py-1.5 text-sm" style={{color:"var(--muted)"}}>
                <span>{desc}</span>
                <span className="ml-4 px-2 py-0.5 rounded-md text-[12px] font-medium whitespace-nowrap" style={{background:"var(--panel)",border:"1px solid var(--border)",color:"var(--text)"}}>{keys}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
      )}
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
