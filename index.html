                <div className="mb-1.5"><SearchBox inputRef={searchInputRef} autoFocus value={insertFnQ} onChange={e=>{ setInsertFnQ(e.target.value); setInsertHi(0); }} placeholder={insertView==="op" ? "Search operators" : "Search functions"} /></div>
                <div className="overflow-y-auto thin-scroll" style={{maxHeight:180}}>
                  {insertView==="op" ? (
                    insertOpMatches.length===0
                      ? <div className="text-[12px] px-2 py-1.5" style={{color:"var(--faint)"}}>No operators match</div>
                      : /* GROUP by cat (Comparison/Logical/Arithmetic). EXPR_OPS is authored in cat order so the
                           filtered slice is already grouped — emit a header on cat change; `i` (running flat index)
                           stays aligned with currentMenuItems(). Headers are non-navigable divs. */
                        insertOpMatches.map((o,i)=>(
                          <React.Fragment key={o.id}>
                            {(i===0 || insertOpMatches[i-1].cat!==o.cat) && <div className={"px-2.5 pb-1 text-[10px] font-bold uppercase tracking-[0.16em] "+(i===0?"pt-0.5":"pt-2")} style={{color:"var(--faint)"}}>{o.cat}</div>}
                            <button {...rowProps(i)} onClick={()=>insertMenuOp(o)} className="w-full flex items-center gap-2.5 text-left px-2.5 py-1.5 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                              <span className="w-7 h-6 shrink-0 rounded-md flex items-center justify-center text-[12px] font-mono font-semibold" style={{background:"color-mix(in srgb, var(--text) 10%, var(--panel))", color:"var(--text)"}}>{o.name}</span>
                              <span className="min-w-0"><span className="block text-[12.5px] truncate" style={{color:"var(--text)"}}>{o.display}</span><span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>{o.desc}</span></span>
                            </button>
                          </React.Fragment>
                        ))
                  ) : (
                    insertFnMatches.length===0
                      ? <div className="text-[12px] px-2 py-1.5" style={{color:"var(--faint)"}}>No functions match</div>
                      : /* GROUP by cat (String/Date/Math). EXPR_FUNCS is authored in cat order so the (sliced)
                           filtered list is already grouped — emit a header on cat change; running flat `i` stays
                           aligned with currentMenuItems(). Headers are non-navigable divs. */
                        insertFnMatches.slice(0,40).map((f,i,arr)=>(
                          <React.Fragment key={f.id}>
                            {(i===0 || arr[i-1].cat!==f.cat) && <div className={"px-2.5 pb-1 text-[10px] font-bold uppercase tracking-[0.16em] "+(i===0?"pt-0.5":"pt-2")} style={{color:"var(--faint)"}}>{f.cat}</div>}
                            <button {...rowProps(i)} onClick={()=>insertMenuFn(f)} className="w-full text-left px-2.5 py-1.5 rounded-lg transition-colors hover:bg-[var(--pop-hover)]">
                              <span className="block text-[12.5px] font-mono truncate" style={{color:"var(--text)"}}>{f.name}</span>
                              {f.display && <span className="block text-[11px] truncate" style={{color:"var(--faint)"}}>{f.display}</span>}
                            </button>
                          </React.Fragment>
                        ))
                  )}
                </div>
              </>
            )}
          </div>
        </>
        );
      })()}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   App
--------------------------------------------------------------------------- */
function App() {
  // app shell: which suite/module is selected (default Automation → Workflows = the builder)
  const [activeSuite, setActiveSuite] = useState("automation");
  const [activeModule, setActiveModule] = useState("workflows");
  const [sideCollapsed, setSideCollapsed] = useState(false);
  const [drawer, setDrawer] = useState(null); // node id whose detail form is open in the right rail
  // Expression Builder (smart value → Expression): exprEdit = {setVal,prev,label,scope} for the clause being edited;
  // exprStr = the working expression as a STRING (the contentEditable canvas serializes to this).
  const [exprEdit, setExprEdit] = useState(null);
  const [exprStr, setExprStr] = useState("");
  const [openSecs, setOpenSecs] = useState({}); // which optional form sections are expanded
  // apply spec field DEFAULTS (e.g. a radio's default option) when a form drawer opens
  useEffect(() => {
    if (!drawer) return;
    const p = treeFindPath(flow, drawer); const n = p && nodeAt(flow, p); if (!n) return;
    const spec = formSpecFor(n.action);
    if (spec) { const data = n.data || {}, patch = {};
      spec.fields.forEach(f => { if (f.default!=null && data[f.k]==null) patch[f.k] = f.default; });
      if (Object.keys(patch).length) update(p, { data: { ...data, ...patch } });
    } else if ((n.action==="create" || n.action==="update") && !(n.fields && n.fields.length)) {
      update(p, { fields: [{ field:null, value:null }] }); // start create/update with one empty field row
    }
  }, [drawer]);
  const [railHover, setRailHover] = useState(false);
  const toggleSide = () => { setSideCollapsed(c=>!c); setRailHover(false); };
  const suiteDef = SUITES.find(s=>s.id===activeSuite) || SUITES[SUITES.length-1];
  const isUsecase = activeSuite==="automation" && USECASE_IDS.includes(activeModule);
  const showBuilder = activeSuite==="automation" && (activeModule==="workflows" || isUsecase);
  const pickSuite = (s) => { setActiveSuite(s.id); setActiveModule((s.modules[0]||{}).id); };
  // editable document (trigger + flow tree) behind an undo/redo history
  const [doc, setDoc] = useState({ triggers:[], flow:[] });
  const [qaDone, setQaDone] = useState([]); // dismissed QA-checklist item ids (sidebar dev aid)
  const triggers = doc.triggers, flow = doc.flow;
  const flowRef = useRef(flow); flowRef.current = flow; // always-current flow → deferred callbacks (rAF/popovers) never read a stale closure
  // the workflow's module (from the first trigger) gates the action menu, recipients and channels (§5.3)
  const workflowModuleId = () => moduleIdFromName(triggers[0] && triggers[0].vals && triggers[0].vals.module);
  const actionCat = actionCatalogFor(workflowModuleId());
  // ALL-modules catalog — for resolving an action's def regardless of which module it belongs to (an action
  // can come from a record fetched via Get / created above, not just the trigger module).
  const actionCatAll = (()=>{ const byId={}; [...RECORD_MODULES, ...FUNCTIONAL_AREAS].forEach(m=>{ Object.assign(byId, actionCatalogFor(m.id).byId); }); return { byId }; })();
  // modules IN SCOPE at a path = trigger module + every Create/Get above on the trunk. Availability of
  // module-specific actions (warranty sync, barcode, priority matrix, …) follows THIS, not just the trigger.
  const moduleIdsInScope = (path) => { const ids=new Set(); const t=workflowModuleId(); if(t) ids.add(t);
    const topIdx = (path && typeof path[0]==="number") ? path[0] : flow.length;
    for(let j=0;j<topIdx;j++){ const n=flow[j];
      if(n.kind==="action"&&n.action==="create"&&n.arg){ const id=moduleIdFromName(n.arg); if(id) ids.add(id); }
      else if(n.kind==="get"&&n.module){ const id=moduleIdFromName(n.module); if(id) ids.add(id); } }
    return ids; };
  const availActionIds = (path) => { const set=new Set(); moduleIdsInScope(path).forEach(mid=>Object.keys(actionCatalogFor(mid).byId).forEach(a=>set.add(a))); return set; };
  // CONDITION field catalog for a node: a Get filters its OWN module; everything else (CHECK IF / branch /
  // delay-event) filters the workflow's trigger module. Drives the field menu + value picker + labels.
  const flowCat = (node) => conditionFieldsFor(node && node.kind==="get" ? node.module : (triggers[0] && triggers[0].vals && triggers[0].vals.module));
  const flowFD = (node, id) => flowCat(node).find(f=>f.id===id);
  const flowMenu = (node) => flowCat(node).map(f=>({ id:f.id, label:f.label }));
  const past = useRef([]); const future = useRef([]);
  const commit = (updater) => setDoc(prev => { past.current.push(prev); if(past.current.length>200) past.current.shift(); future.current=[]; return updater(prev); });
  const setTriggers = (upd) => commit(prev => ({ ...prev, triggers: typeof upd==="function" ? upd(prev.triggers) : upd }));
  const setFlow = (upd) => commit(prev => ({ ...prev, flow: typeof upd==="function" ? upd(prev.flow) : upd }));
  const undo = () => setDoc(prev => { if(!past.current.length) return prev; future.current.push(prev); return past.current.pop(); });
  const redo = () => setDoc(prev => { if(!future.current.length) return prev; past.current.push(prev); return future.current.pop(); });
  const reset = () => {
    const base = isUsecase && USECASE_DOCS[activeModule]
      ? JSON.parse(JSON.stringify(USECASE_DOCS[activeModule]))
      : { triggers:[], flow:[] };
    commit(() => base); guidingRef.current = null; setFocusKey("T"); setPop(null); setDesc(null);
  };
  const [ucPopup, setUcPopup] = useState(false);
  const [desc, setDesc] = useState(null); // editable workflow description; null = show the auto linguistic summary
  // onboarding: the floating "How it works" card shows only for not-yet-onboarded users and retires once they
  // build their first trigger (persisted). Returning users get a clean canvas; they replay via the top-bar 💡.
  const [onboarded, setOnboarded] = useState(()=>{ try { return !!(localStorage.getItem("lwb_onboarded") || localStorage.getItem("lwb_intro_seen")); } catch(e){ return false; } });
  // Usecase modules auto-load their prebuilt workflow on switch (deep clone, fresh history).
  // Plain "workflows" is left untouched.
  useEffect(() => {
    setUcPopup(false);
    if (isUsecase && USECASE_DOCS[activeModule]) {
      setDoc(JSON.parse(JSON.stringify(USECASE_DOCS[activeModule])));
      past.current = []; future.current = []; guidingRef.current = null;
      setFocusKey("T"); setPop(null); setDesc(null);
    }
  }, [activeSuite, activeModule]);
  // switch between saved experiment builds (separate HTML files)
  const openVersions = (anchor) => open(anchor,
    BUILDS.map(b=>({ id:b.file, label:b.label })),
    (i)=>{ if (i.id!==currentBuild) window.location.href = i.id; },
    "Experiments", { noSearch:true, selected: currentBuild, initActive: -1 });
  const [pop, setPop] = useState(null);
  const [railHelp, setRailHelp] = useState(null); // Quick Help shown in the context rail while a menu is open
  const [name, setName] = useState("Untitled rule");
  const [editingName, setEditingName] = useState(false); // header name: click-to-edit
  const [enabled, setEnabled] = useState(true);
  const [theme, setTheme] = useState("dark");
  const [focusKey, setFocusKey] = useState("T"); // "T" = trigger, else path.join('.')
  const [branchMenuPath, setBranchMenuPath] = useState(null); // path.join('.') of the branch whose "add step" menu is open
  const [helpOpen, setHelpOpen] = useState(false);
  const [guideOpen, setGuideOpen] = useState(false); // "How it works" multi-step stepper (from the help menu)
  const [step, setStep] = useState(0); // active step in the stepper
  const [introOpen, setIntroOpen] = useState(false); // one-time "new way to build" announcement → guided walkthrough
  // show the intro announcement ONCE to every user (new + existing); remember via localStorage
  useEffect(() => {
    // one-time gating: show the intro ONCE per browser, then remember via localStorage
    try {
      if (!localStorage.getItem("lwb_intro_v5")) {
        setIntroOpen(true);
        localStorage.setItem("lwb_intro_v5", "1");
      }
    } catch (e) { /* localStorage unavailable — skip */ }
  }, []); // run once on mount
  const [refOpen, setRefOpen] = useState(false); // "Node reference" dialogue
  const [refSel, setRefSel] = useState("trigger"); // selected node id in the reference
  const [toastHidden, setToastHidden] = useState(false); // user dismissed the bottom intro toast
  const [published, setPublished] = useState(false);
  const currentBuild = decodeURIComponent((location.pathname.split("/").pop()) || "index.html") || "index.html";
  const idRef = useRef(1);
  const nid = () => idRef.current++;
  const rowRefs = useRef({});
  const addStepBtnRef = useRef(null); // the bottom "Add step" CTA — stable anchor for the keyboard-opened add menu
  const publishBtnRef = useRef(null); // the Publish button — final tour coachmark points here
  const floatBarRef = useRef(null);   // the bottom floating toolbar — final tour step frames the WHOLE bar
  const setRowRef = (key, el) => { if (el) rowRefs.current[key] = el; };
  const triggerSlotRefs = useRef({});
  const setTriggerSlotRef = (tid, key, el) => { if (el) triggerSlotRefs.current[`${tid}:${key}`] = el; };
  // AUTO-COLLAPSE the left sidebar while ANY right-side panel is open (Expression Builder rail `exprEdit`,
  // the node form editor `drawer`, the Node-reference dialogue `refOpen`, the help panel `helpOpen`), then
  // RESTORE the pre-open sidebar state when the last right panel closes. A ref stashes the prior collapsed
  // state across nested/sequential opens; we only act on the closed↔open TRANSITION (not every render), so a
  // user manually expanding while a panel is open is left alone and the pre-open state is restored on close.
  const anyRightPanel = !!(exprEdit || drawer || refOpen || helpOpen);
  const rightPanelWasOpen = useRef(false);
  const sideBeforePanel = useRef(false);
  useEffect(() => {
    if (anyRightPanel && !rightPanelWasOpen.current) {        // closed → open: remember & collapse
      sideBeforePanel.current = sideCollapsed;
      if (!sideCollapsed) setSideCollapsed(true);
    } else if (!anyRightPanel && rightPanelWasOpen.current) { // open → closed: restore pre-open state
      setSideCollapsed(sideBeforePanel.current);
    }
    rightPanelWasOpen.current = anyRightPanel;
  }, [anyRightPanel]);   // eslint-disable-line — transition-driven; sideCollapsed read via ref-stashed snapshot
  const guidingRef = useRef(null); // id of the trigger currently auto-advancing (or null)
  const actionSlotRefs = useRef({}); // action node id -> its "choose an action" element
  const condSlotRefs = useRef({});   // condition node id -> its "a field" element
  const valueSlotRefs = useRef({});  // condition node id -> its value element
  const argSlotRefs = useRef({});    // action path -> its arg element
  const branchAddRefs = useRef({});  // branch path -> its "+" element
  useEffect(()=>{ document.documentElement.dataset.theme = theme; }, [theme]);

  const [openSlot, setOpenSlot] = useState(null); // unique key of the slot whose popover is open
  const [smartPreview, setSmartPreview] = useState(null); // slotKey whose value popover is on the "Smart value" tab → preview a badge in the sentence
  const [openInsertKey, setOpenInsertKey] = useState(null); // which InsertZone's add-menu is open → keep that zone expanded (no collapse-jump)
  const [hovWaitKey, setHovWaitKey] = useState(null); // wait-event node being hovered → reveal its "add max timeout" affordance
  useEffect(()=>{ if(!pop) setOpenInsertKey(null); }, [pop]); // clear once the menu closes
  const open = (anchor, items, onPick, title, opts={}) => setPop({ anchor, items, onPick, title, ...opts });
  // pick the first anchor that's actually laid out (non-zero rect) — skips stale/detached refs
  // (e.g. the removed "do this…" opener) whose 0×0 rect would leave a popover unable to position.
  const isVisibleEl = (el) => { if(!el || !el.getBoundingClientRect) return false; const r = el.getBoundingClientRect(); return r.width>0 || r.height>0; };
  const firstVisibleEl = (...els) => els.find(isVisibleEl) || null;
  const close = () => { setPop(null); setOpenSlot(null); setBranchMenuPath(null); setSmartPreview(null); };
  const hasTrigger = triggers.length > 0;
  // once the user builds their first trigger, retire the onboarding helper for good
  useEffect(()=>{ if (hasTrigger && !onboarded) { try { localStorage.setItem("lwb_onboarded","1"); } catch(e){} setOnboarded(true); } }, [hasTrigger]);

  // ── INTERACTIVE SPOTLIGHT WALKTHROUGH (from the one-time intro CTA) ───────────────────────────────
  // NOT a scripted auto-build: the USER builds their real first workflow. Each step spotlights the live
  // target element and advances ONLY when the user actually completes it (trigger set → condition added →
  // action added). No snapshot/restore — the workflow they build is theirs and is kept.
  const [tourStep, setTourStep] = useState(-1); // -1 = tour inactive; 0..2 = steps; 3 = success
  const tourActive = tourStep >= 0;
  const [tourRect, setTourRect] = useState(null); // the highlighted FRAME rect (whole card or whole menu) — viewport coords
  const [tourBeacon, setTourBeacon] = useState(null); // {x,y} of the exact click point for the pulsing beacon
  const [tourAllow, setTourAllow] = useState(null); // the ONE allowed-to-click element's rect → the click-through hole
  const [tourTick, setTourTick] = useState(0);    // bump to force a rect recompute (doc/scroll/resize)
  const tourLastRect = useRef(null);              // last good FRAME rect → overlay never vanishes mid-step
  const tourPrevStep = useRef(-1);                // detect step changes to drop the cross-step last-rect cache
  // EASED display values — the frame/beacon/connector all render from these, so they move in LOCKSTEP and never
  // snap. A rAF loop interpolates them toward the measured targets; the first frame (and step change) snaps.
  const [tourDisp, setTourDisp] = useState(null); // { rect:{top,left,width,height}, bx, by }
  const tourTarget = useRef(null);                // latest measured target {rect, bx, by}
  const tourSnap = useRef(true);                  // true → next update jumps (no ease): first show / step change
  const tourRaf = useRef(0);
  const tourAutoOpen = useRef(false);             // true during the brief auto-open window after a handoff → suppress
                                                  //   the new step's card phase until the add-step menu opens (no flash)
  // top-level helpers reused for completion checks
  const flowHasCondition = (nodes) => (nodes||[]).some(n => n.kind==="condition" || n.kind==="branch");
  // a menu/popover is open right now → the tour RETARGETS its single spotlight to the open dropdown.
  const tourMenuEl = () => (typeof document!=="undefined") ? document.querySelector('[data-pop-root]') : null;
  const tourMenuOpen = () => !!pop && !!tourMenuEl();
  // the LIVE add-step CLICK TARGET (beacon) for the trunk: the "do this…" opener SLOT while the flow is empty,
  // else the bottom "Add step" card. Condition + Action steps point the BEACON here.
  const tourAddStepEl = () => firstVisibleEl(rowRefs.current["__thenSlot"], rowRefs.current["__then"], addStepBtnRef.current);
  // the FULL add-step NODE ROW (frame): the whole THEN node row (__then) while the flow is empty, else the
  // "Add step" card. The condition/action FRAME wraps this whole node — not just the small opener slot.
  const tourAddStepRowEl = () => firstVisibleEl(rowRefs.current["__then"], addStepBtnRef.current, rowRefs.current["__thenSlot"]);
  // ── completion predicates for the ONE target workflow we guide:
  //    When an Incident is created → IF category is Hardware → THEN assign to the Hardware Team. ──
  // walk all flow levels (incl. branch paths) for an action matching a predicate.
  const someActionDeep = (nodes, pred) => (nodes||[]).some(n => (n.kind==="action" && pred(n)) || someActionDeep(branchKids(n), pred));
  const someCondDeep = (nodes, pred) => (nodes||[]).some(n => ((n.kind==="condition"||n.kind==="branch") && pred(n)) || someCondDeep(branchKids(n), pred));
  const triggerIsIncidentCreated = (d) => (d.triggers||[]).some(t => t.typeId==="created" && t.vals && t.vals.module==="Incident");
  const condHasCategoryHardware = (d) => someCondDeep(d.flow, n => {
    const cls = n.kind==="branch" ? (n.paths||[]).flatMap(p=>p.clauses||[]) : (n.clauses||[]);
    return cls.some(c => c.field==="category" && c.value==="Hardware");
  });
  const actionAssignHardware = (d) => someActionDeep(d.flow, n => n.action==="assign" && n.arg==="Hardware Team");
  // find a menu option row inside the open popover whose visible text matches `label` (case-insensitive).
  // Prefer an EXACT/startsWith match (so "category" doesn't get pre-empted by "subcategory"); fall back to substring.
  // EXCLUDES the back button + header rows so we never resolve to "back"/menu-top.
  const tourMenuItemEl = (label) => {
    const root = tourMenuEl(); if (!root || !label) return null;
    const want = String(label).trim().toLowerCase();
    const rows = Array.from(root.querySelectorAll('button, [role="option"], [role="button"]'))
      .filter(el => !el.getAttribute('title') || el.getAttribute('title').toLowerCase()!=="back"); // never the back arrow
    const txt = (el) => (el.textContent||"").trim().toLowerCase();
    return rows.find(el => txt(el)===want)
        || rows.find(el => txt(el).startsWith(want))
        || rows.find(el => txt(el).indexOf(want)>-1)
        || null;
  };
  // does the OPEN menu contain a row whose text matches `label`? → used to detect WHICH sub-menu is showing.
  const tourMenuHas = (label) => !!tourMenuItemEl(label);
  // is the matched option row CHECKED? (multi-select rows render a checkmark <svg> only when selected) — lets the
  // value step know whether "Hardware" is ticked yet, to switch the beacon from the value row to the Done button.
  const tourItemChecked = (label) => { const el = tourMenuItemEl(label); return !!(el && el.querySelector('svg')); };
  // STATE-DRIVEN sub-phase map. For each step, an ORDERED list of phases; the resolver picks the FIRST whose
  // `when(d,os)` holds. Each phase declares: the SPECIFIC item label to point at (in a menu) OR a card element
  // (cardKey), the instruction copy, and whether it's a menu phase. This mirrors the REAL click sequence:
  //   trigger: blank → "When a record is created" → module blank → "Incident"
  //   condition: add-step → "Add condition" → "Inline condition" → "category" → "is" → "Hardware"
  //   action: add-step → "Assign" → "A whole group…" → "Hardware Team"
  // The beacon/click-hole always resolve to the phase's exact element; we NEVER fall back to the menu top.
  const TOUR_STEPS = [
    { key:"trigger", accent:"var(--c-when)", done:(d)=> triggerIsIncidentCreated(d),
      // the whole trigger card (dim region) — once a trigger row exists the empty-state refs (T/Twhen) are gone,
      // so fall back to the LIVE trigger row (trig:<id>) so the frame/line/beacon never lose their anchor.
      cardTarget:()=> { const t=(triggers||[])[0]; return rowRefs.current["T"] || rowRefs.current["Twhen"] || (t && rowRefs.current[`trig:${t.id}`]) || null; },
      phases:[
        // a) menu open showing trigger types → pick "When a record is created"
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("When a record is created"), menu:true, label:"When a record is created",
          title:"Pick a trigger", instr:<>Choose <b style={{color:"var(--c-when)"}}>When a record is created</b>.</> },
        // b) module picker open → pick "Incident"
        { when:(d,os)=> tourMenuOpen() && (String(os||"").indexOf(":module")>-1 || tourMenuHas("Incident")), menu:true, label:"Incident",
          title:"Pick the module", instr:<>Pick <b style={{color:"var(--c-when)"}}>Incident</b>.</> },
        // c) type chosen (created) but module unset, NO menu → beacon on the module SLOT, but the FRAME is the
        //    trigger ROW (frameEl) so the highlight tightly wraps the WHEN row, not a big empty flow box (Bug F).
        { when:(d,os)=> (d.triggers||[]).some(t=>t.typeId==="created" && !(t.vals&&t.vals.module)),
          card:()=> { const t=(triggers||[]).find(x=>x.typeId==="created"); return (t && triggerSlotRefs.current[`${t.id}:module`]) || rowRefs.current["trig:"+(t&&t.id)] || rowRefs.current["T"]; },
          frameEl:()=> { const t=(triggers||[]).find(x=>x.typeId==="created"); return (t && rowRefs.current[`trig:${t.id}`]) || rowRefs.current["T"]; },
          title:"Pick the module", instr:<>Click here, then pick <b style={{color:"var(--c-when)"}}>Incident</b>.</> },
        // d) default card phase: nothing yet → click the slot the cursor points at
        { when:()=>true, card:()=> rowRefs.current["Twhen"] || rowRefs.current["T"],
          title:"Pick a trigger", instr:"Click here to start." },
      ] },
    { key:"condition", accent:"var(--c-if)", done:(d)=> condHasCategoryHardware(d),
      cardTarget:()=> tourAddStepEl(),
      phases:[
        // VALUE picker is a MULTI-SELECT (enum): the field's values list ("Hardware"/"Software"/…) + a Done button.
        // It does NOT commit on click — toggling a value just ticks it; the clause commits only on Done. We gate
        // to EXACTLY TWO holes — the Hardware row + the Done button — so no other category can be ticked. The
        // beacon sequences: Hardware (until ticked) → Done.
        // 5b) value menu, Hardware already ticked → point at Done to COMMIT.
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Hardware") && !tourMenuHas("priority") && tourItemChecked("Hardware"),
          menu:true, holes:["Hardware","Done"], label:"Done",
          title:"Confirm the value", instr:<>Click <b style={{color:"var(--c-if)"}}>Done</b>.</> },
        // 5a) value menu open, Hardware not yet ticked → point at the Hardware row.
        { when:(d,os)=> tourMenuOpen() && (String(os||"").endsWith(":value") || (tourMenuHas("Hardware") && !tourMenuHas("priority"))),
          menu:true, holes:["Hardware","Done"], label:"Hardware",
          title:"Set the value", instr:<>Pick <b style={{color:"var(--c-if)"}}>Hardware</b>.</> },
        // 4) OP picker (Comparison) → "is". Detect by openSlot OR an "is" row without the field list.
        { when:(d,os)=> tourMenuOpen() && (String(os||"").endsWith(":op") || (tourMenuHas("is") && !tourMenuHas("category") && !tourMenuHas("Hardware"))), menu:true, label:"is",
          title:"Set the operator", instr:<>Keep <b style={{color:"var(--c-if)"}}>is</b>.</> },
        // 3) FIELD picker ("Which field") → "category". Detect by openSlot OR the field list (has both category + priority).
        { when:(d,os)=> tourMenuOpen() && (String(os||"").endsWith(":field") || (tourMenuHas("category") && tourMenuHas("priority"))), menu:true, label:"category",
          title:"Pick the field", instr:<>Pick <b style={{color:"var(--c-if)"}}>category</b>.</> },
        // 2) condition-type submenu (Inline / Branching) — detect by the "Inline condition" row.
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Inline condition"), menu:true, label:"Inline condition",
          title:"Condition type", instr:<>Choose <b style={{color:"var(--c-if)"}}>Inline condition</b>.</> },
        // 1) add-step menu (has "Add condition").
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Add condition"), menu:true, label:"Add condition",
          title:"Add a condition", instr:<>Choose <b style={{color:"var(--c-if)"}}>Add condition</b>.</> },
        // 0) no menu → beacon on the add-step opener SLOT; FRAME wraps the whole THEN node row.
        { when:()=>true, card:()=> tourAddStepEl(), frameEl:()=> tourAddStepRowEl(),
          title:"Add a condition", instr:"Click here to add a condition." },
      ] },
    { key:"action", accent:"var(--c-then)", done:(d)=> actionAssignHardware(d),
      cardTarget:()=> tourAddStepEl(),
      phases:[
        // group list (Choose a group) → "Hardware Team"
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Hardware Team"), menu:true, label:"Hardware Team",
          title:"Pick the group", instr:<>Pick <b style={{color:"var(--c-then)"}}>Hardware Team</b>.</> },
        // assign-target picker → "A whole group…"
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("A whole group"), menu:true, label:"A whole group",
          title:"Assign to", instr:<>Choose <b style={{color:"var(--c-then)"}}>A whole group…</b></> },
        // action category picker ("Do this") → "Assign"
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Assign") && !tourMenuHas("Add action"), menu:true, label:"Assign",
          title:"Choose an action", instr:<>Choose <b style={{color:"var(--c-then)"}}>Assign</b>.</> },
        // add-step menu → "Add action"
        { when:(d,os)=> tourMenuOpen() && tourMenuHas("Add action"), menu:true, label:"Add action",
          title:"Add an action", instr:<>Choose <b style={{color:"var(--c-then)"}}>Add action</b>.</> },
        { when:()=>true, card:()=> tourAddStepEl(), frameEl:()=> tourAddStepRowEl(),
          title:"Add an action", instr:"Click here to add an action." },
      ] },
    // FINAL step — INFORMATIONAL only: frame the WHOLE floating toolbar, no beacon, and no click holes (card:null
    // → the catcher blocks the whole canvas, Publish is NOT interactive). The user finishes via the coachmark's
    // "Finish" button (above the catcher). done:()=>false so it never auto-advances.
    { key:"publish", accent:"var(--accent2)", done:(d)=> false, finalStep:true, noBeacon:true,
      cardTarget:()=> floatBarRef.current,
      phases:[
        { when:()=>true, card:()=> null, frameEl:()=> floatBarRef.current,
          title:"You're all set", instr:<>Hit <b style={{color:"var(--accent2)"}}>Publish</b> to go live.</> },
      ] },
  ];
  // resolve the CURRENT sub-phase for the active step (first phase whose `when` holds). While a step is COMPLETE
  // but the 420ms advance hasn't fired, show a brief "Done!" — NOT the card phase (avoids the add-step re-flash, C/E).
  const TOUR_DONE_PHASE = { done:true, title:"Done", instr:"Nice — that's done." };
  const tourPhase = () => {
    if (tourStep<0 || tourStep>=TOUR_STEPS.length) return null;
    const st = TOUR_STEPS[tourStep];
    if (!st.finalStep) { try { if (st.done(doc) && !tourMenuOpen()) return TOUR_DONE_PHASE; } catch(_e){} }
    // during the auto-open handoff window, before the add-step menu has opened, DON'T show the card phase — hold
    // the neutral "Done" so there's no "Click here to add a condition/action" flash before the menu appears.
    if (tourAutoOpen.current && !tourMenuOpen()) return TOUR_DONE_PHASE;
    return (st.phases||[]).find(p => { try { return p.when(doc, openSlot); } catch(_e){ return false; } }) || null;
  };
  // the element the BEACON points at (the precise actionable option / button / card element).
  const tourBeaconEl = () => {
    const ph = tourPhase(); if (!ph) return null;
    if (ph.menu) return tourMenuItemEl(ph.label);
    return ph.card ? ph.card() : null;
  };
  // the CLICK-GATE element for a SINGLE-hole phase (the hole = the beacon target). Phases with `holes` (a list
  // of labels → multiple holes, e.g. Hardware row + Done button) are gated directly in the render, not here.
  const tourAllowedEl = () => {
    const ph = tourPhase(); if (!ph) return null;
    return tourBeaconEl();
  };
  const startWalk = () => { setIntroOpen(false); setTourStep(0); };
  // end the tour, keep the user's nodes, mark onboarded.
  const endTour = () => {
    setTourStep(-1); setTourRect(null); setTourBeacon(null); setTourAllow(null); setTourDisp(null);
    tourLastRect.current = null; tourTarget.current = null; tourSnap.current = true; tourAutoOpen.current = false;
    try { localStorage.setItem("lwb_onboarded","1"); } catch(e){}
    setOnboarded(true);
  };
  // recompute the spotlight rect from the live target on each step / doc change / scroll / resize.
  React.useLayoutEffect(() => {
    // STEP CHANGED → synchronously drop the previous step's cached rect BEFORE measuring, so this pass can't
    // fall back to the prior step's frame (the trigger). Smoothing's last-rect only applies within a step.
    if (tourPrevStep.current !== tourStep) { tourPrevStep.current = tourStep; tourLastRect.current = null; }
    if (tourStep < 0 || tourStep >= TOUR_STEPS.length) { setTourRect(null); setTourBeacon(null); setTourAllow(null); tourLastRect.current = null; return; }
    // FRAME = dim around the OPEN MENU (whole menu) or the whole card; ALLOWED = the single clickable element.
    // STEP-SCOPED: a step's frame must resolve to an element WITHIN that step — never another step's node. Only
    // the TRIGGER step may fall back to the live trigger row; condition/action only ever use their own add-step.
    const liveFrame = () => {
      if (tourMenuOpen()) return tourMenuEl();
      const st = TOUR_STEPS[tourStep];
      const ph = tourPhase();
      // a phase may declare its OWN frame element (e.g. the module-slot phase frames the trigger ROW — Bug F).
      if (ph && ph.frameEl && ph.frameEl()) return ph.frameEl();
      const own = st.cardTarget();
      if (own) return own;
      if (st.key==="trigger") { const t0=(triggers||[])[0]; return (t0 && rowRefs.current[`trig:${t0.id}`]) || rowRefs.current["T"] || null; }
      return null; // step's own target not mounted yet → show nothing this instant (a rAF/tick resolves it), never another step's node
    };
    const measure = () => {
      const fEl = liveFrame();
      const inMenu = tourMenuOpen();
      let fr = (fEl && fEl.getBoundingClientRect) ? fEl.getBoundingClientRect() : null;
      if (!fr || (fr.width===0 && fr.height===0)) fr = tourLastRect.current; // NEVER vanish → reuse last good rect
      if (!fr) { return; } // truly nothing yet (first frame) → leave whatever's there; a rAF/tick will resolve it
      tourLastRect.current = { top:fr.top, left:fr.left, width:fr.width, height:fr.height };
      const rect = { top:fr.top, left:fr.left, width:fr.width, height:fr.height };
      setTourRect(rect);
      // the ONE allowed-to-click element for the current sub-phase (its rect = the click-through hole).
      const aEl = tourAllowedEl();
      let ar = (aEl && aEl.getBoundingClientRect) ? aEl.getBoundingClientRect() : null;
      // SAFETY: if a menu is open but the specific item wasn't found, allow the WHOLE menu (don't trap the user).
      if ((!ar || (!ar.width && !ar.height)) && inMenu) ar = fr;
      if (ar && (ar.width||ar.height)) setTourAllow({ top:ar.top, left:ar.left, width:ar.width, height:ar.height });
      else setTourAllow(null); // not in a menu and no card el yet → resolves on the next rAF/tick
      // BEACON: point at the PRECISE item, anchored to its LEFT so it never covers the label.
      const stp = TOUR_STEPS[tourStep];
      let bx, by;
      if (stp.noBeacon) { bx = null; by = null; } // final step → no beacon
      else { const bEl = tourBeaconEl();
        const br = (bEl && bEl.getBoundingClientRect) ? bEl.getBoundingClientRect() : (ar && (ar.width||ar.height) ? ar : null);
        if (br && (br.width||br.height)) { bx = Math.min(br.left + (inMenu ? 16 : 8), br.left + br.width - 4); by = br.top + br.height/2; }
        else { bx = fr.left + 16; by = fr.top + 16; } }
      setTourBeacon(bx==null ? null : { x:bx, y:by });
      // feed the EASED display tween (frame + beacon + connector all read from tourDisp → move in lockstep).
      tourTarget.current = { rect, bx, by };
      if (tourSnap.current) { tourSnap.current = false; setTourDisp({ rect, bx, by }); }
    };
    measure();
    // the popover mounts/positions in its OWN layout effect and may grow to full height a frame later, so
    // recompute on the next two animation frames to capture the WHOLE menu (ring hugs all items, not just the top).
    let raf1=0, raf2=0;
    raf1 = requestAnimationFrame(()=>{ measure(); raf2 = requestAnimationFrame(measure); });
    // scroll the target into view when a step begins (only the card phase — the menu is already on-screen)
    const el0 = TOUR_STEPS[tourStep].cardTarget();
    if (!tourMenuOpen() && el0 && el0.scrollIntoView) { try { el0.scrollIntoView({ block:"center", behavior:"smooth" }); } catch(_e){} }
    const onMove = () => requestAnimationFrame(measure);
    window.addEventListener("scroll", onMove, true);
    window.addEventListener("resize", onMove);
    return () => { cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); window.removeEventListener("scroll", onMove, true); window.removeEventListener("resize", onMove); };
  }, [tourStep, tourTick, pop, openSlot]); // pop/openSlot → re-measure synchronously when the dropdown opens/closes
  // ON STEP CHANGE: clear the last-rect cache so a new step NEVER inherits the previous step's frame/rect (the
  // last-rect smoothing must apply only to sub-phase transitions WITHIN a step). Then re-measure on the next few
  // frames so the step's own target (e.g. addStepBtnRef, which mounts after the flow gains its first node) resolves
  // cleanly — no flicker back to the prior step's node.
  useEffect(() => {
    if (tourStep < 0) return;
    tourLastRect.current = null; tourTarget.current = null; tourSnap.current = true; // next measure snaps (no ease across steps)
    setTourRect(null); setTourBeacon(null); setTourAllow(null); setTourDisp(null);
    let r1=0,r2=0,r3=0; const bump=()=>setTourTick(t=>t+1);
    r1 = requestAnimationFrame(()=>{ bump(); r2 = requestAnimationFrame(()=>{ bump(); r3 = requestAnimationFrame(bump); }); });
    return () => { cancelAnimationFrame(r1); cancelAnimationFrame(r2); cancelAnimationFrame(r3); };
  }, [tourStep]);
  // TWEEN: ease the DISPLAYED frame/beacon toward the measured target every frame, so the frame + beacon + the
  // connector (all computed from tourDisp) move together with NO snapping. First show / step change snaps (above).
  useEffect(() => {
    if (!tourActive) { cancelAnimationFrame(tourRaf.current); setTourDisp(null); return; }
    const lerp = (a,b,t)=> a + (b-a)*t;
    const step = () => {
      const tgt = tourTarget.current;
      if (tgt) setTourDisp(d => {
        if (!d || !d.rect) return { rect:{...tgt.rect}, bx:tgt.bx, by:tgt.by }; // snap if we had nothing
        const k = 0.28; // easing factor per frame (~smooth, settles quickly)
        const nr = { top:lerp(d.rect.top,tgt.rect.top,k), left:lerp(d.rect.left,tgt.rect.left,k), width:lerp(d.rect.width,tgt.rect.width,k), height:lerp(d.rect.height,tgt.rect.height,k) };
        const nbx = (tgt.bx==null||d.bx==null) ? tgt.bx : lerp(d.bx,tgt.bx,k);
        const nby = (tgt.by==null||d.by==null) ? tgt.by : lerp(d.by,tgt.by,k);
        return { rect:nr, bx:nbx, by:nby };
      });
      tourRaf.current = requestAnimationFrame(step);
    };
    tourRaf.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(tourRaf.current);
  }, [tourActive]);
  // While a MENU is open, poll so DOM-only changes (e.g. ticking a multi-select value, which doesn't touch React
  // state) re-evaluate the sub-phase → the beacon/copy follow (Hardware → Done). Cheap, only runs during a menu.
  useEffect(() => {
    if (!tourActive || !pop) return;
    const id = setInterval(()=> setTourTick(t=>t+1), 280);
    return () => clearInterval(id);
  }, [tourActive, pop]);
  // bump the rect when the doc changes (elements appear/move as the user builds)
  useEffect(() => { if (tourActive) setTourTick(t=>t+1); }, [doc, drawer]);
  // advance ONLY when the current step is genuinely complete (watch the real doc). On advance: CLOSE any open
  // menu, move to the NEXT step, THEN auto-open the "what happens next" add-step menu so the new step lands
  // straight on its menu sub-phase ("Choose Add condition" / "Choose Add action") — skipping the card phase.
  // Sequencing: setTourStep FIRST, then open the menu on a later tick, so the open menu is read as the NEW
  // step's menu (never the previous step's card/menu phase → no copy flash).
  useEffect(() => {
    if (tourStep < 0 || tourStep >= TOUR_STEPS.length) return;
    const st = TOUR_STEPS[tourStep];
    if (!st.finalStep && st.done(doc)) {
      const t = setTimeout(()=> {
        try { close(); } catch(_e){}
        setTourStep(s => {
          const ns = s+1; const nstep = TOUR_STEPS[ns];
          // the next step builds a trunk node via the add-step menu → auto-open it (after the step state commits).
          if (nstep && (nstep.key==="condition" || nstep.key==="action")) {
            tourAutoOpen.current = true; // hold the card phase (show neutral "Done") until the menu actually opens
            setTimeout(()=>{ const anchor = firstVisibleEl(rowRefs.current["__thenSlot"], rowRefs.current["__then"], addStepBtnRef.current); if (anchor) openMainAt([], anchor); setTourTick(x=>x+1); }, 60);
            // fallback clear so the card phase still appears if the auto-open ever fails (anchor missing, etc.)
            setTimeout(()=>{ tourAutoOpen.current = false; setTourTick(x=>x+1); }, 700);
          }
          return ns;
        });
      }, 420); // brief beat to see the result
      return () => clearTimeout(t);
    }
  }, [doc, tourStep]);
  // Esc skips the tour
  useEffect(() => {
    if (!tourActive) return;
    const onKey = (e) => { if (e.key==="Escape") endTour(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [tourActive]);

  /* triggers (multiple, OR'd) */
  // event triggers (record-based) can be OR'd together; periodic triggers (time-based) must stand alone.
  const isPeriodicType = (t) => t==="date_reached" || t==="periodically";
  const firstIsPeriodic = () => triggers.length>0 && isPeriodicType(triggers[0].typeId);
  // trigger-type picker config. `back` (when present) = adding an OR trigger → restrict to event types only.
  const triggerMenuConfig = (anchor, back, replaceId) => ({
    anchor,
    // periodic (time-based) is allowed ONLY when it would be the SOLE trigger: hide it when adding an OR
    // trigger (`back`) or when changing one of several triggers (replace + >1) — both would mix periodic + events.
    items: ((back || (replaceId && triggers.length>1)) ? TRIGGER_MENU.filter(it => it.id ? !isPeriodicType(it.id) : it.header!=="Time based") : TRIGGER_MENU)
      .map(it => it.id ? { ...it, help:TRIGGER_HELP[it.id] } : it),
    wide:true, back, title: back ? "Add trigger" : (replaceId ? "Change trigger" : null), help: NODE_HELP.when,
    selected: replaceId ? (triggers.find(t=>t.id===replaceId)||{}).typeId : undefined,
    onPick:(i)=>{
      if (replaceId) { setTriggers(ts=>ts.map(t=>t.id===replaceId ? {...t, typeId:i.id, vals:{}} : t)); guidingRef.current = replaceId; setFocusKey(`trig:${replaceId}`); }
      else { const nt = { id:nid(), typeId:i.id, vals:{} }; setTriggers(ts=>[...ts, nt]); guidingRef.current = nt.id; setFocusKey(`trig:${nt.id}`); }
    },
    footer:(
      <button className="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-[12px] rounded-lg hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
        <span style={{color:"var(--accent2)"}}>{I.ai}</span> Generate with AI
      </button>
    ),
  });
  const pickTriggerType = (anchor) => { setFocusKey("T"); setOpenSlot("Twhen"); setPop(triggerMenuConfig(anchor, null)); };
  // "add trigger" affordance on the trigger node (mirrors the condition node's "+ new condition"): opens the
  // trigger menu in ADD mode (back→close), so a NEW OR-trigger is created via the existing add path.
  const addAnotherTrigger = (anchor) => { setFocusKey("T"); setOpenSlot("Tadd"); setPop(triggerMenuConfig(anchor, ()=>close())); };
  // re-open the picker on an EXISTING trigger to swap its type in place (keeps the row; resets its slots, then re-advances)
  const changeTriggerType = (tid, anchor) => { setFocusKey(`trig:${tid}`); setOpenSlot(null); setPop(triggerMenuConfig(anchor, null, tid)); };

  const updateTrigger = (tid, key, val) => setTriggers(ts=>ts.map(t=>t.id===tid?{...t, vals:{...t.vals,[key]:val}}:t));
  const removeTrigger = (tid) => setTriggers(ts=>ts.filter(t=>t.id!==tid));

  // Guided chain: open the next empty slot of trigger `tid`; when all are filled, open the action menu.
  // Each pick just sets the value — the [triggers] effect re-runs this, so it works for mouse AND keyboard.
  const advanceTrigger = (tid) => {
    const t = triggers.find(x=>x.id===tid);
    if (!t) { guidingRef.current = null; return; }
    const view = triggerView(t);
    const next = view.slots.find(s => !t.vals[s.key]);
    if (next) {
      const el = triggerSlotRefs.current[`${tid}:${next.key}`] || rowRefs.current[`trig:${tid}`];
      setOpenSlot(`trig:${tid}:${next.key}`);
      const setter = (i) => updateTrigger(tid, next.key, i.id);
      if (next.options==="__date") return open(el, [], setter, "Pick a date", {inputType:"date"});
      if (next.options==="__time") return open(el, [], setter, "Pick a time", {inputType:"time"});
      return open(el, next.options.map(o=>typeof o==="string"?{id:o,label:o}:o), setter, PLACEHOLDER[next.key]||next.key);
    }
    // this trigger is complete — auto-open the "do this…" menu (normal guided build). During the TOUR the
    // tour's advance effect opens it instead (sequenced AFTER the step advances to condition), so we skip the
    // app's immediate open here to avoid a double-open / step-0 menu-flash.
    guidingRef.current = null;
    if (!hasAction(flow) && !tourActive) setTimeout(()=>openMainAt([], firstVisibleEl(rowRefs.current["__thenSlot"], rowRefs.current["__then"], addStepBtnRef.current)), 0);
  };
  // drive the chain off trigger changes so it advances no matter how a value was picked
  useEffect(() => { if (guidingRef.current) advanceTrigger(guidingRef.current); }, [triggers]);

  // insert an action at `path` (at `index`, or appended) and immediately open its picker
  const addActionAndPick = (path, fallbackEl, index) => {
    const node = { id:nid(), kind:"action", action:null, arg:null };
    const idx = index===undefined ? childrenAt(flow, path).length : index;
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    setFocusKey(pathKey(newPath));
    setOpenSlot(`${pathKey(newPath)}:action`);
    // rAF lets the closing menu's onClose settle first; the grouped menu self-measures via anchorKey
    requestAnimationFrame(() => setPop(actionMenuConfig(newPath, fallbackEl, null, `act:${node.id}`)));
  };
  // open the field picker for clause `ci` of the condition at `condPath` (id `cid`)
  const openCondFieldPicker = (condPath, cid, ci, fallbackEl) => {
    setFocusKey(pathKey(condPath));
    setOpenSlot(`${pathKey(condPath)}:c${ci}:field`);
    const node = nodeAt(flow, condPath);
    requestAnimationFrame(() => open(fallbackEl, flowMenu(node),
      (i)=>{ const t = flowFD(node,i.id)?.type || "enum"; updateClause(condPath, ci, {field:i.id,op:defaultOp(t),value:null});
             requestAnimationFrame(()=>openClauseOpByKey(condPath, cid, ci, i.id, t)); },
      "Which field", {wide:true, help:NODE_HELP.condition, anchorKey:`cond:${cid}:${ci}`}));
  };
  // insert an inline condition at `path`/`index`. AUTO-GROUP: if the step directly before is a
  // condition, fold this in as a new AND clause of that group instead of creating a separate row.
  const addConditionAndPick = (path, fallbackEl, index) => {
    const siblings = childrenAt(flow, path);
    const idx = index===undefined ? siblings.length : index;
    const prev = siblings[idx-1];
    if (prev && prev.kind==="condition") {
      const condPath = [...path, idx-1];
      const ci = (prev.clauses||[]).length;
      setFlow(f => { const n = nodeAt(f, condPath); return treeUpdate(f, condPath, { clauses:[...(n.clauses||[]), { field:null, op:"is", value:null }] }); });
      openCondFieldPicker(condPath, prev.id, ci, fallbackEl);
      return;
    }
    const node = { id:nid(), kind:"condition", clauses:[{ field:null, op:"is", value:null }], combiner:"and" };
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    openCondFieldPicker(newPath, node.id, 0, fallbackEl);
  };
  // "Condition group": add an OR-group (a clause flagged .or) to the adjacent CHECK IF — or start a
  // new condition if there's none. The OR-group renders as a new "or" row of the same gate.
  const addOrGroupAndPick = (path, fallbackEl, index) => {
    const siblings = childrenAt(flow, path);
    const idx = index===undefined ? siblings.length : index;
    const prev = siblings[idx-1];
    if (!prev || prev.kind!=="condition") { addConditionAndPick(path, fallbackEl, index); return; }
    const condPath = [...path, idx-1];
    const ci = (prev.clauses||[]).length;
    setFlow(f => { const n = nodeAt(f, condPath); return treeUpdate(f, condPath, { clauses:[...(n.clauses||[]), { field:null, op:"is", value:null, or:true }] }); });
    openCondFieldPicker(condPath, prev.id, ci, fallbackEl);
  };
  const addBranchAndPick = (path, fallbackEl, index) => {
    const node = { id:nid(), kind:"branch",
      paths:[{ id:nid(), clauses:[{ field:null, op:"is", value:null }], combiner:"and", children:[] }],
      otherwise:null };
    const idx = index===undefined ? childrenAt(flow, path).length : index;
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    setFocusKey(pathKey(newPath));
    // auto-open the first path's field picker (matches condition/get/delay add). rAF so it opens AFTER
    // the add-menu's onClose fires (a synchronous open() gets cleared instantly); anchorKey re-resolves
    // to the new branch's field slot once it renders. [S3 fix]
    const _pid = node.paths[0].id;
    setOpenSlot(`${pathKey(newPath)}:p0:c0:field`);
    requestAnimationFrame(()=> open(null, flowMenu(node),
      (i)=>{ const t=flowFD(node,i.id)?.type||"enum"; updatePathClause(newPath, 0, 0, {field:i.id, op:defaultOp(t), value:null});
             requestAnimationFrame(()=>openPathOpByKey(newPath, node, 0, 0, _pid, i.id, t)); },
      "Which field", {wide:true, help:NODE_HELP.condition, anchorKey:`pcond:${_pid}:0`}));
  };
  // ── DELAY — two types: mode "time" ("wait for {n}{unit}" / "wait until {date|field}") and
  //    mode "event" ("wait until {condition} becomes true"). ──
  const DELAY_UNITS = ["minutes","hours","days"];
  const pickDelayAmount = (path, node, e) => { // amount accepts a Specific number OR a smart value ({ref}/{expr}) — same taxonomy as condition values
    const slotKey = `${pathKey(path)}:amount`; setOpenSlot(slotKey);
    const el = e?.currentTarget||null; const ak = `damt:${node.id}`; const commit = (v)=>update(path,{amount:v});
    const smart = smartCfg(path, node.amount, slotKey, el, e?null:ak, commit, "Amount", ()=>pickDelayAmount(path,node,e));
    open(el, [], (i)=>commit(i.id), "Amount", { inputType:"number", ...(e?{}:{anchorKey:ak}), ...(smart?{smart}:{}) }); };
  const pickDelayUnit = (path, node, e) => { setOpenSlot(`${pathKey(path)}:unit`); open(e.currentTarget, DELAY_UNITS.map(u=>({id:u,label:u})), (i)=>update(path,{unit:i.id}), "Unit", {noSearch:true, selected:node.unit}); };
  // condition-mode timeout ("up to {N} {unit}") + calendar/business-hours (the Advanced disclosure)
  const pickDelayMaxAmount = (path, node, e) => { setOpenSlot(`${pathKey(path)}:maxamt`); open(e?.currentTarget||null, [], (i)=>update(path,{maxAmount:i.id}), "Up to", e?{inputType:"number"}:{inputType:"number", anchorKey:`dmax:${node.id}`}); };
  const pickDelayMaxUnit = (path, node, e) => { setOpenSlot(`${pathKey(path)}:maxunit`); open(e.currentTarget, DELAY_UNITS.map(u=>({id:u,label:u})), (i)=>update(path,{maxUnit:i.id}), "Unit", {noSearch:true, selected:node.maxUnit}); };
  const pickDelayHours = (path, node, e) => { setOpenSlot(`${pathKey(path)}:hours`); open(e.currentTarget, [{id:"calendar",label:"calendar hours"},{id:"business",label:"business hours"}], (i)=>update(path,{hours:i.id}), "Counted on", {noSearch:true, selected:node.hours||"calendar"}); };
  // TIME/DATE first choice: "a duration of time" (→ wait for {N} {unit} as per {hours}) or "a date & time" (→ wait till {date} & {time}).
  const pickWaitKind = (path, node, e, fallbackEl) => { setOpenSlot(`${pathKey(path)}:kind`);
    open(e?.currentTarget||fallbackEl||null, [{id:"for",label:"a duration of time"},{id:"until",label:"a date & time"}],
      (i)=>{ update(path,{mode:i.id});
        if(i.id==="for"){ requestAnimationFrame(()=>pickDelayAmount(path,node,null)); }
        else { setOpenSlot(`${pathKey(path)}:date`); requestAnimationFrame(()=>open(null, [], (x)=>update(path,{date:x.id}), "Pick a date", {inputType:"date", anchorKey:`wdate:${node.id}`})); }
      }, "Wait for…", {noSearch:true, selected:node.mode||undefined, anchorKey:`wkind:${node.id}`});
  };
  const pickWaitDate = (path, node, e) => { setOpenSlot(`${pathKey(path)}:date`); open(e?.currentTarget||null, [], (x)=>update(path,{date:x.id}), "Pick a date", e?{inputType:"date"}:{inputType:"date", anchorKey:`wdate:${node.id}`}); };
  const pickWaitTime = (path, node, e) => { setOpenSlot(`${pathKey(path)}:time`); open(e?.currentTarget||null, [], (x)=>update(path,{time:x.id}), "Pick a time", e?{inputType:"time"}:{inputType:"time", anchorKey:`wtime:${node.id}`}); };
  const addDelayAndPick = (path, fallbackEl, index) => { // TIME/DATE type — first asks "time or date", THEN duration / date&time (no auto-jump to amount)
    const node = { id:nid(), kind:"delay", mode:null, amount:null, unit:"hours", hours:"calendar", bizHours:null, date:null, time:null };
    const idx = index===undefined ? childrenAt(flow, path).length : index;
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    setFocusKey(pathKey(newPath)); setOpenSlot(`${pathKey(newPath)}:kind`);
    requestAnimationFrame(()=> pickWaitKind(newPath, node, null, fallbackEl));
  };
  const addDelayEventAndPick = (path, fallbackEl, index) => { // "Wait until {condition} · up to {N} {unit}"
    const node = { id:nid(), kind:"delay", mode:"event", clauses:[{ field:null, op:"is", value:null }], maxAmount:null, maxUnit:"hours", hours:"calendar" };
    const idx = index===undefined ? childrenAt(flow, path).length : index;
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    openCondFieldPicker(newPath, node.id, 0, fallbackEl);
  };
  // ── GET ("get {qty} {module} sorted by name {sort} where {condition}") — PROGRESSIVE: qty → module → sort → where,
  //    each step revealed only once the prior is filled. The pickers auto-chain to guide the user.
  const pickGetQty = (path, node, e) => { setOpenSlot(`${pathKey(path)}:qty`);
    open(e?.currentTarget||null, [{id:"1",label:"1 Record"},{id:"10",label:"10 Records"},{id:"100",label:"100 Records"},{id:"500",label:"500 Records"},{divider:true},{id:"all",label:"All Records"},{id:"__num",label:"Custom Number"}],
      (i)=>{ if(i.id==="__num"){ requestAnimationFrame(()=>open(null, [], (x)=>{ update(path,{qty:x.id}); requestAnimationFrame(()=>pickGetModule(path,node,null)); }, "How many", {inputType:"number", anchorKey:`gqty:${node.id}`})); return true; } update(path,{qty:i.id}); requestAnimationFrame(()=>pickGetModule(path,node,null)); },
      "How many", e?{noSearch:true, selected:node.qty}:{noSearch:true, selected:node.qty, anchorKey:`gqty:${node.id}`}); };
  const pickGetModule = (path, node, e) => { setOpenSlot(`${pathKey(path)}:module`); open(e?.currentTarget||null, MODULE_NAMES.map(m=>({id:m,label:m})), (i)=>{ update(path,{module:i.id});
    // single record (qty 1) → sorting is meaningless, skip straight to the "where" field picker
    if (String(node.qty).trim()==="1") requestAnimationFrame(()=>openCondFieldPicker(path, node.id, 0, null));
    else requestAnimationFrame(()=>pickGetSort(path,node,null)); }, "Record type", e?{selected:node.module}:{selected:node.module, anchorKey:`gmod:${node.id}`}); };
  const pickGetSort = (path, node, e) => { setOpenSlot(`${pathKey(path)}:sort`); open(e?.currentTarget||null, [{id:"asc",label:"ascending (A → Z)"},{id:"desc",label:"descending (Z → A)"}], (i)=>{ update(path,{sort:i.id}); requestAnimationFrame(()=>openCondFieldPicker(path, node.id, 0, null)); }, "Sort order", e?{noSearch:true, selected:node.sort}:{noSearch:true, selected:node.sort, anchorKey:`gsort:${node.id}`}); };
  const addGetAndPick = (path, fallbackEl, index) => {
    const node = { id:nid(), kind:"get", module:null, qty:null, sort:null, clauses:[{ field:null, op:"is", value:null }] };
    const idx = index===undefined ? childrenAt(flow, path).length : index;
    const newPath = [...path, idx];
    setFlow(f => treeInsertAt(f, path, idx, node));
    setFocusKey(pathKey(newPath)); setOpenSlot(`${pathKey(newPath)}:qty`);
    requestAnimationFrame(()=> pickGetQty(newPath, node, null));
  };
  // insert menu shown by the between-steps "+" — the SAME full add-step menu (action/condition→branch/
   // delay/get, and "Add trigger" only when inserting right after the trigger), but at a specific index.
  const openInsert = (parentPath, index, anchor) => { setFocusKey("__then"); setOpenSlot("__then"); setOpenInsertKey(pathKey(parentPath)+":"+index); setPop(mainMenuConfig(parentPath, anchor, index)); };

  // manual edit of a single slot (clicking it) — no auto-advance
  const pickTriggerSlot = (t, key, e) => {
    const slot = triggerView(t).slots.find(s=>s.key===key); if(!slot) return;
    setOpenSlot(`trig:${t.id}:${key}`);
    const setter = (i)=>updateTrigger(t.id, key, i.id);
    if (slot.options==="__date") return open(e.currentTarget, [], setter, "Pick a date", {inputType:"date"});
    if (slot.options==="__time") return open(e.currentTarget, [], setter, "Pick a time", {inputType:"time"});
    open(e.currentTarget, slot.options.map(o=>typeof o==="string"?{id:o,label:o}:o), setter, PLACEHOLDER[key]||key, {selected:t.vals[key]});
  };

  // INVARIANT: adjacent inline conditions are always ONE group. After a structural removal,
  // merge any conditions that became neighbours (e.g. the action between them was deleted),
  // keeping the earlier group's combiner. Recurses into branch paths / otherwise.
  const mergeAdjacentConditions = (nodes) => {
    const out = [];
    for (const raw of nodes) {
      let node = raw;
      if (node.kind==="branch") {
        node = { ...node,
          paths:(node.paths||[]).map(p=>({ ...p, children:mergeAdjacentConditions(p.children||[]) })),
          otherwise: node.otherwise ? { ...node.otherwise, children:mergeAdjacentConditions(node.otherwise.children||[]) } : null };
      } else if (node.children) {
        node = { ...node, children:mergeAdjacentConditions(node.children) };
      }
      const last = out[out.length-1];
      if (node.kind==="condition" && last && last.kind==="condition") {
        out[out.length-1] = { ...last, clauses:[...(last.clauses||[]), ...(node.clauses||[])] };
      } else out.push(node);
    }
    return out;
  };
  /* tree ops */
  const update = (path, patch) => setFlow(f => treeUpdate(f, path, patch));
  const remove = (path) => setFlow(f => mergeAdjacentConditions(treeRemove(f, path)));
  const nodeAt = (nodes, path) => { let n=null, arr=nodes;
    for(let j=0;j<path.length;j++){ const seg=path[j];
      if (isBranchSeg(seg)) { arr = segChildren(n, seg); continue; }
      n = arr[seg]; arr = (n && n.children) || [];
    } return n; };
  const cloneWithIds = (node) => {
    const c = { ...node, id:nid() };
    if (node.children) c.children = node.children.map(cloneWithIds);
    if (node.paths) c.paths = node.paths.map(p=>({ ...p, id:nid(), children:(p.children||[]).map(cloneWithIds) }));
    if (node.otherwise) c.otherwise = { ...node.otherwise, id:nid(), children:(node.otherwise.children||[]).map(cloneWithIds) };
    return c;
  };
  // Copy: duplicate the node (with fresh ids) directly below the original; the user can then drag the copy.
  const copyNode = (path) => {
    const src = nodeAt(flow, path); if(!src) return;
    const clone = cloneWithIds(src);
    const parent = path.slice(0,-1), idx = path[path.length-1] + 1;
    setFlow(f => treeInsertAt(f, parent, idx, clone));
    setFocusKey(pathKey([...parent, idx]));
  };
  /* drag & drop — move a whole branch or a single node, by id (paths shift on remove, ids don't) */
  const dragIdRef = useRef(null);
  const [dropHint, setDropHint] = useState(null); // { id, pos:"before"|"after" } — where the drop line shows
  const moveNode = (srcId, target) => setFlow(f => {
    const srcPath = treeFindPath(f, srcId); if(!srcPath) return f;
    const refId = target.into!==undefined ? target.into : (target.before!==undefined ? target.before : target.after);
    if (refId===srcId) return f;
    if (refId!==undefined) { // never drop a branch into itself / its own descendant
      const rp = treeFindPath(f, refId);
      if (rp && rp.length>=srcPath.length && srcPath.every((v,i)=>v===rp[i])) return f;
    }
    const srcNode = nodeAt(f, srcPath);
    let t = treeRemove(f, srcPath);
    if (target.into!==undefined) {
      const p = treeFindPath(t, target.into); if(!p) return f;
      t = treeSetLevel(t, p, [ ...(nodeAt(t,p).children||[]), srcNode ]);
    } else if (target.before!==undefined || target.after!==undefined) {
      const rp = treeFindPath(t, refId); if(!rp) return f;
      t = treeInsertAt(t, rp.slice(0,-1), rp[rp.length-1] + (target.after!==undefined?1:0), srcNode);
    } else {
      t = [...t, srcNode]; // trunk end
    }
    return t;
  });
  const dragStart = (id, e) => { dragIdRef.current = id; if (e && e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", String(id)); }catch(_){} } };
  const dragOverRow = (id, e) => { e.preventDefault(); const r=e.currentTarget.getBoundingClientRect(); setDropHint({ id, pos: e.clientY < r.top + r.height/2 ? "before" : "after" }); };
  const dropRow = (id, e) => { e.preventDefault(); const src=dragIdRef.current; const pos=(dropHint&&dropHint.id===id)?dropHint.pos:"after"; if(src!=null) moveNode(src, pos==="before"?{before:id}:{after:id}); setDropHint(null); dragIdRef.current=null; };
  const dropInto = (branchId, e) => { e.preventDefault(); const src=dragIdRef.current; if(src!=null) moveNode(src, {into:branchId}); setDropHint(null); dragIdRef.current=null; };
  const dragEnd = () => { setDropHint(null); dragIdRef.current=null; };
  const dnd = (id) => ({ id, start:dragStart, over:dragOverRow, drop:dropRow, end:dragEnd, hint:dropHint });

  // ── CLAUSE drag-and-drop (move a condition line into any OR-group of the SAME node) ──
  // Clauses live in a flat array; groups are derived from the `conn` flag (a clause with conn:"or"
  // starts a new group). Moving a clause = reorder the array + recompute conn so groups stay valid.
  const dragClauseRef = useRef(null);                  // { k, ci } — k = pathKey of the node being edited
  const [clauseHint, setClauseHint] = useState(null);  // { k, ci, pos:"before"|"after" } — drop indicator
  const moveClause = (path, fromCi, toCi, pos) => setFlow(f => {
    const n = nodeAt(f, path); const cls = (n && n.clauses) || [];
    const dragObj = cls[fromCi], tgtObj = cls[toCi];
    if (!dragObj || !tgtObj || dragObj===tgtObj) return f;
    // build 2D groups of clause OBJECTS (so identity survives the reorder)
    const G = []; cls.forEach((c,ci)=>{ if(ci===0 || (c.conn||"and")==="or") G.push([]); G[G.length-1].push(c); });
    // locate the target slot (group array + within-index) BEFORE removing the dragged clause
    let tgArr=null, tw=-1; for (const g of G){ const idx=g.indexOf(tgtObj); if(idx>=0){ tgArr=g; tw=idx; break; } }
    if (!tgArr) return f;
    if (pos==="after") tw+=1;
    // remove the dragged clause from its group; if it sat before the target in the SAME group, shift tw left
    for (const g of G){ const idx=g.indexOf(dragObj); if(idx>=0){ g.splice(idx,1); if (g===tgArr && idx<tw) tw-=1; break; } }
    tgArr.splice(tw, 0, dragObj);
    // flatten, dropping now-empty groups, and rewrite conn so the first line of each non-first group is the boundary
    const next=[]; G.filter(g=>g.length).forEach((g,gi)=>{ g.forEach((c,j)=>{ next.push({ ...c, conn: (gi>0 && j===0) ? "or" : "and" }); }); });
    return treeUpdate(f, path, { clauses: next });
  });
  const clauseDragStart = (k, ci, e) => { dragClauseRef.current = { k, ci }; if (e){ e.stopPropagation(); if (e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain","clause"); }catch(_){} } } };
  const clauseDragOver  = (k, ci, e) => { const d=dragClauseRef.current; if (!d || d.k!==k || d.ci===ci) return; e.preventDefault(); e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); setClauseHint({ k, ci, pos: e.clientY < r.top + r.height/2 ? "before" : "after" }); };
  const clauseDrop = (path, ci, e) => { const k=pathKey(path); const d=dragClauseRef.current; if (!d || d.k!==k){ setClauseHint(null); return; } e.preventDefault(); e.stopPropagation(); const pos=(clauseHint && clauseHint.k===k && clauseHint.ci===ci)?clauseHint.pos:"after"; if (d.ci!==ci) moveClause(path, d.ci, ci, pos); setClauseHint(null); dragClauseRef.current=null; };
  const clauseDragEnd = () => { setClauseHint(null); dragClauseRef.current=null; };
  // Split ONE clause out of its group into a new single-clause group (right after the source group).
  // The other clauses of that group stay together — only the clicked clause pops out. (Used by the
  // within-group "or" connector: turning a middle clause into "or" must not drag its followers along.)
  const splitClauseToGroup = (path, ci) => setFlow(f => {
    const n = nodeAt(f, path); const cls = (n && n.clauses) || [];
    const obj = cls[ci]; if (!obj) return f;
    const G=[]; cls.forEach((c,i)=>{ if (i===0 || (c.conn||"and")==="or") G.push([]); G[G.length-1].push(c); });
    let gi=-1, wi=-1; G.forEach((g,k)=>{ const idx=g.indexOf(obj); if (idx>=0){ gi=k; wi=idx; } });
    if (gi<0) return f;
    G[gi].splice(wi, 1);        // remove the clause from its current group
    G.splice(gi+1, 0, [obj]);   // …and give it its own new group, right after the source group
    const next=[]; G.filter(g=>g.length).forEach((g,k)=>{ g.forEach((c,j)=>{ next.push({ ...c, conn:(k>0 && j===0)?"or":"and" }); }); });
    return treeUpdate(f, path, { clauses: next });
  });
  // "Add condition" swaps the menu in place to choose the condition's shape (inline vs branching)
  const condKindMenuConfig = (path, anchor, back, index) => {
    // VERTICAL graphics (the workflow flows top→bottom). Diamond = the check, with sharp/slightly-rounded
    // corners to match the canvas condition marker.
    const gxInline = (
      <svg width="18" height="24" viewBox="0 0 18 24" fill="none">
        <path d="M9 1.5V6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
        <rect x="4" y="7" width="10" height="10" rx="2" transform="rotate(45 9 12)" fill="currentColor"/>
        <path d="M9 18V22.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
      </svg>
    );
    const gxBranch = (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 1.5V4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
        <rect x="7.5" y="3.5" width="9" height="9" rx="1.9" transform="rotate(45 12 8)" fill="currentColor"/>
        <path d="M12 12.5V15.5M5 15.5h14M5 15.5V22M19 15.5V22" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );
    // per-type help — eyebrow "CONDITION ›" + the type, so you feel you've stepped into Condition
    const COND_HELP = {
      inline: { eyebrow:"Condition", title:"Inline", color:"var(--c-if)", bg:"var(--c-if-bg)", graphic:gxInline,
        body:"A single check that gates the steps after it — they run only when it passes. Adjacent conditions stack into an AND/OR group." },
      branch: { eyebrow:"Condition", title:"Branching", color:"var(--c-if)", bg:"var(--c-if-bg)", graphic:gxBranch,
        body:"Splits the flow into parallel paths, each with its own condition and steps, plus an Otherwise path when none match." },
    };
    return {
      anchor, back, title:"Add condition", wide:true,
      items: COND_KIND_MENU.map(it=> it.id ? {...it, help:COND_HELP[it.id], icon: it.id==="inline"?gxInline:gxBranch} : it),
      help: NODE_HELP.condition, // base = the Condition node; the type (Inline/Branching) shows as "This option"
      onPick:(i)=>{ if (i.id==="inline") addConditionAndPick(path, anchor, index); else addBranchAndPick(path, anchor, index); },
    };
  };
  // "Add delay" swaps to choose the delay TYPE (time-based vs event-based)
  const delayKindMenuConfig = (path, anchor, back, index) => ({
    anchor, back, title:"Wait", wide:true,
    items: [
      { id:"time",  label:"for time or date", icon:I.hourglass, sub:"Pause for a duration, or until a date/time",
        help:{ title:"for time or date", color:"var(--ink-mid)", bg:"var(--panel2)", graphic:G.action, body:"Pause for a fixed duration (e.g. “wait for 2 hours”, counted on calendar or business hours) — or wait till a specific date & time." } },
      { id:"event", label:"for event", icon:I.bolt,     sub:"Resume when a condition becomes true",
        help:{ title:"for event", color:"var(--ink-mid)", bg:"var(--panel2)", graphic:G.action, body:"Pause until a condition you define becomes true. Reads “Wait until {condition}”." } },
    ],
    help: ADD_HELP.delay, // base = the Wait node; the kind (time/date vs condition) shows as "This option"
    onPick:(i)=>{ if (i.id==="time") addDelayAndPick(path, anchor, index); else addDelayEventAndPick(path, anchor, index); },
  });
  const mainMenuConfig = (path, anchor, index) => ({
    // "Add trigger" shows ONLY in the add-step directly after the trigger (trunk, insert index 0) — and never
    // when the start is periodic. "Condition group" shows only when the step BEFORE the insert point is a CHECK IF.
    anchor,
    items: (()=>{ const sibs = childrenAt(flow, path); const insIdx = index===undefined ? sibs.length : index;
      const atTrigger = path.length===0 && insIdx===0; const canGroup = !!(sibs[insIdx-1] && sibs[insIdx-1].kind==="condition");

  const flatItems = (avail) => { const ls=actionLeafIndex(avail);

  // sub-action menu for ONE group. Heading shows the group name (breadcrumb so you know where you are).

  const actionGroupConfig = (path, anchor, g, back, anchorKey, opts={}) => ({

    if (recordActionSentence({action:actionId}, def, true) && scope.length) {
      setOpenSlot(`${pathKey(path)}:record`);
      open(null, scope.map(r=>({id:r.id, label:r.label})),
        (i)=>{ update(path, { record:i.id }); requestAnimationFrame(()=>setDrawer(nodeId)); },
        "Which record?", { anchorKey:`act:${nodeId}`, noSearch:true, selected: nodeAt(flow,path)?.record });
    } else {
      setDrawer(nodeId);
    }
  };

  const isComplete = hasTrigger && hasAction(flow);
  /* context-rail summary helpers */
  const fillTrigger = (t) => triggerView(t).tpl.replace(/\{(\w+)\}/g, (_,k)=> (t.vals && t.vals[k]) ? t.vals[k] : "…");
  // describe a single clause as text
  const clauseText = (c, cat) => { const f = (cat||FIELDS).find(x=>x.id===c.field); const v = valueDisplay(c.value); return `${f?f.label:"a field"} ${c.op||"is"} ${v||"…"}${(isRelDateOp(c.op)&&v)?(" "+(c.unit||"days")):""}`; };
  const condText = (n) => { const cat = flowCat(n); return (n.clauses||[]).map((c,i)=> (i>0 ? (c.or?" OR ":" AND ") : "") + clauseText(c, cat)).join(""); };
  const summaryLines = (nodes, depth) => {
    const out = [];
    (nodes||[]).forEach(n=>{
      if (n.kind==="action") { const d = actionCatAll.byId[n.action];
        out.push({ type:"action", depth, text: d ? (d.label + (n.arg ? ` ${n.arg}` : "")) : "choose an action" });
      } else if (n.kind==="delay") {
        out.push({ type:"action", depth, text: n.mode==="event" ? `wait until ${condText(n)}${n.maxAmount?` (up to ${n.maxAmount} ${n.maxUnit||""})`:""}` : (n.mode==="until" ? `wait till ${n.date||"…"}${n.time?` ${n.time}`:""}` : (n.mode==="for" ? `wait for ${n.amount||"…"} ${n.unit||""}` : "wait …")) });
      } else if (n.kind==="get") {
        out.push({ type:"cond", depth, text: `get ${n.qty||"all"} ${n.module||"records"}${(n.clauses||[]).some(c=>c.field) ? " where "+condText(n) : ""}` });
      } else if (n.kind==="condition") {
        out.push({ type:"cond", depth, text: condText(n) });
      } else if (n.kind==="branch") {
        (n.paths||[]).forEach((p,pi)=>{ out.push({ type:"cond", depth, text: (pi===0?"":"or path: ") + condText(p) });
          summaryLines(p.children, depth+1).forEach(x=>out.push(x)); });
        if (n.otherwise) { out.push({ type:"cond", depth, text:"otherwise" });
          summaryLines(n.otherwise.children, depth+1).forEach(x=>out.push(x)); }
      }
    });
    return out;
  };
  const countKind = (nodes, kind) => (nodes||[]).reduce((a,n)=> a + (n.kind===kind?1:0) + countKind(branchKids(n), kind), 0);

  // Auto "linguistic form" of the whole workflow — the default (editable) description.
  const autoDesc = (() => {
    if (!hasTrigger) return "";
    const trg = triggers.map(t=>fillTrigger(t)).filter(Boolean);
    const parts = ["When " + trg.join(", or ") + "."];
    summaryLines(flow, 0).forEach(ln => { parts.push((ln.type==="cond" ? "If " + ln.text + ":" : "Then " + ln.text + ".")); });
    return parts.join(" ");
  })();
  const descVal = desc != null ? desc : autoDesc;

  /* ---- keyboard navigation for power users ---- */
  const navList = () => {
    const out = [];
    if (!hasTrigger) out.push({ key:"T", kind:"trigger", path:null });
    else triggers.forEach(t => out.push({ key:`trig:${t.id}`, kind:"trigger", path:null }));
    const walk = (nodes, base) => nodes.forEach((n,i)=>{ const p=[...base,i];
      out.push({ key:pathKey(p), kind:n.kind, path:p, node:n });
      if (n.kind==="branch") { (n.paths||[]).forEach((pp,k)=>walk(pp.children||[], [...p,{path:k}]));
        if (n.otherwise) walk(n.otherwise.children||[], [...p,{otherwise:true}]); }
      else if (n.children) walk(n.children, p); });
    walk(flow, []); return out;
  };
  const isTriggerKey = (k) => k==="T" || k.startsWith("trig:");
  const focusScope = () => {
    if (isTriggerKey(focusKey)) return [];
    const cur = navList().find(n=>n.key===focusKey);
    if (!cur || !cur.node) return [];
    // a branch: add steps into its first path; everything else: add as a sibling
    if (cur.node.kind === "branch") return [...cur.path, {path:0}];
    return cur.path.slice(0,-1);
  };
  const addToScope = (kind) => {
    const scope = focusScope();
    const anchor = rowRefs.current[focusKey];
    if (kind==="action") openAddActionMenu(scope, anchor, null); // pick the action first; create the row on pick
    else addConditionAndPick(scope, anchor);
  };
  const removeFocused = () => {
    const nav = navList(); const i = nav.findIndex(n=>n.key===focusKey);
    if (focusKey.startsWith("trig:")) { removeTrigger(focusKey.slice(5)); }
    else if (focusKey==="T") { return; }
    else if (i>=0) { setFlow(f => treeRemove(f, nav[i].path)); }
    const prev = nav[Math.max(0, i-1)];
    setFocusKey(prev ? prev.key : "T");
  };
  useEffect(() => {
    const onKey = (e) => {
      if (pop || exprEdit || drawer || refOpen || helpOpen) return; // a popover / any right-side panel owns the keyboard while open
      const tag = (e.target.tagName||"").toLowerCase();
      if (tag==="input" || tag==="textarea") return;
      const nav = navList();
      const idx = Math.max(0, nav.findIndex(n=>n.key===focusKey));
      const k = e.key.toLowerCase();
      if (e.metaKey || e.ctrlKey) {
        if (k==="z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
        else if (k==="y") { e.preventDefault(); redo(); }
        else if (k==="b") { e.preventDefault(); toggleSide(); }
        return; // don't let other Ctrl/⌘ combos trigger single-key actions
      }
      if (k==="arrowdown" || k==="j") { e.preventDefault(); setFocusKey(nav[Math.min(nav.length-1, idx+1)].key); }
      else if (k==="arrowup" || k==="k") { e.preventDefault(); setFocusKey(nav[Math.max(0, idx-1)].key); }
      else if (e.key==="Enter") { e.preventDefault();
        // contextual: no trigger → trigger picker; else → the "do this / add steps" menu
        if (!hasTrigger) pickTriggerType(rowRefs.current["Twhen"] || rowRefs.current["T"]);
        else openMainAt([], firstVisibleEl(rowRefs.current["__thenSlot"], rowRefs.current["__then"], addStepBtnRef.current)); }
      else if (k==="a") { if (!hasTrigger) return; e.preventDefault(); addToScope("action"); }
      else if (k==="c") { if (!hasTrigger) return; e.preventDefault(); addToScope("condition"); }
      else if (k==="x" || k==="delete" || k==="backspace") { e.preventDefault(); removeFocused(); }
      else if (e.shiftKey && k==="r") { e.preventDefault(); reset(); }
      else if (k==="t") { setTheme(t=>t==="dark"?"light":"dark"); }
      else if (e.key==="?") { setHelpOpen(h=>!h); }
      else if (k==="escape") { setHelpOpen(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  // Esc = the UNIVERSAL side-section closer — works for the form drawer, the Expression rail, Node reference, and
  // Keyboard shortcuts (whichever is open). The main keydown handler bails while a right panel owns the keyboard, and
  // the backdrop blocks click-outside by design, so Esc was the missing dismissal. Guarded by !pop so a popover layered
  // over a panel (e.g. a reference drill) closes FIRST; closeAnyRightPanel mirrors each panel's own cancel (the
  // Expression rail reverts to its prior value). Internal panel menus (the Expression `/`-menu) stopPropagation, so
  // their Esc is handled before this window listener fires.
  useEffect(() => {
    if (!(drawer || exprEdit || refOpen || helpOpen)) return;
    const onEsc = (e) => { if (e.key==="Escape" && !pop) { e.preventDefault(); closeAnyRightPanel(); } };
    window.addEventListener("keydown", onEsc);
    return () => window.removeEventListener("keydown", onEsc);
  }, [drawer, exprEdit, refOpen, helpOpen, pop]);

  /* ---- markers ---- */
  const MARK = {
    trigger:<span className="block w-3.5 h-3.5 rounded-full" style={{border:"2px solid var(--c-when)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    cond:   <span className="block w-2.5 h-2.5 rotate-45" style={{background:"var(--c-if)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    action: <span className="block w-2.5 h-2.5 rounded-full" style={{background:"var(--c-then)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    delay:  <span className="flex w-3.5 h-3.5 items-center justify-center" style={{color:"var(--muted)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 3h10M7 21h10M8 3v3l4 4 4-4V3M8 21v-3l4-4 4 4v3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></span>,
    get:    <span className="flex w-3.5 h-3.5 items-center justify-center" style={{color:"var(--muted)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg></span>,
    add:    <span className="flex items-center justify-center w-5 h-5 rounded-full" style={{border:"1px dashed var(--border2)",color:"var(--faint)",background:"var(--bg)"}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg></span>,
  };

  const HEAD = 28, PAD = 7, GAP = 10, MC = PAD + HEAD/2; // MC = marker center from row top
