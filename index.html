    if (slot.options==="__time") return open(e.currentTarget, [], setter, "Pick a time", {inputType:"time"});
    open(e.currentTarget, slot.options.map(o=>typeof o==="string"?{id:o,label:o}:o), setter, PLACEHOLDER[key]||key, {selected:t.vals[key]});
  };

  // INVARIANT: adjacent inline conditions are always ONE group. After a structural removal,
  // merge any conditions that became neighbours (e.g. the action between them was deleted),
  // keeping the earlier group's combiner. Recurses into branch paths / otherwise.
  const mergeAdjacentConditions = (nodes) => {
    const out = [];
    for (const raw of nodes) {
      let node = raw;
      if (node.kind==="branch") {
        node = { ...node,
          paths:(node.paths||[]).map(p=>({ ...p, children:mergeAdjacentConditions(p.children||[]) })),
          otherwise: node.otherwise ? { ...node.otherwise, children:mergeAdjacentConditions(node.otherwise.children||[]) } : null };
      } else if (node.children) {
        node = { ...node, children:mergeAdjacentConditions(node.children) };
      }
      const last = out[out.length-1];
      if (node.kind==="condition" && last && last.kind==="condition") {
        out[out.length-1] = { ...last, clauses:[...(last.clauses||[]), ...(node.clauses||[])] };
      } else out.push(node);
    }
    return out;
  };
  /* tree ops */
  const update = (path, patch) => setFlow(f => treeUpdate(f, path, patch));
  const remove = (path) => setFlow(f => mergeAdjacentConditions(treeRemove(f, path)));
  const nodeAt = (nodes, path) => { let n=null, arr=nodes;
    for(let j=0;j<path.length;j++){ const seg=path[j];
      if (isBranchSeg(seg)) { arr = segChildren(n, seg); continue; }
      n = arr[seg]; arr = (n && n.children) || [];
    } return n; };
  const cloneWithIds = (node) => {
    const c = { ...node, id:nid() };
    if (node.children) c.children = node.children.map(cloneWithIds);
    if (node.paths) c.paths = node.paths.map(p=>({ ...p, id:nid(), children:(p.children||[]).map(cloneWithIds) }));
    if (node.otherwise) c.otherwise = { ...node.otherwise, id:nid(), children:(node.otherwise.children||[]).map(cloneWithIds) };
    return c;
  };
  // Copy: duplicate the node (with fresh ids) directly below the original; the user can then drag the copy.
  const copyNode = (path) => {
    const src = nodeAt(flow, path); if(!src) return;
    const clone = cloneWithIds(src);
    const parent = path.slice(0,-1), idx = path[path.length-1] + 1;
    setFlow(f => treeInsertAt(f, parent, idx, clone));
    setFocusKey(pathKey([...parent, idx]));
  };
  /* drag & drop — move a whole branch or a single node, by id (paths shift on remove, ids don't) */
  const dragIdRef = useRef(null);
  const [dropHint, setDropHint] = useState(null); // { id, pos:"before"|"after" } — where the drop line shows
  const moveNode = (srcId, target) => setFlow(f => {
    const srcPath = treeFindPath(f, srcId); if(!srcPath) return f;
    const refId = target.into!==undefined ? target.into : (target.before!==undefined ? target.before : target.after);
    if (refId===srcId) return f;
    if (refId!==undefined) { // never drop a branch into itself / its own descendant
      const rp = treeFindPath(f, refId);
      if (rp && rp.length>=srcPath.length && srcPath.every((v,i)=>v===rp[i])) return f;
    }
    const srcNode = nodeAt(f, srcPath);
    let t = treeRemove(f, srcPath);
    if (target.into!==undefined) {
      const p = treeFindPath(t, target.into); if(!p) return f;
      t = treeSetLevel(t, p, [ ...(nodeAt(t,p).children||[]), srcNode ]);
    } else if (target.before!==undefined || target.after!==undefined) {
      const rp = treeFindPath(t, refId); if(!rp) return f;
      t = treeInsertAt(t, rp.slice(0,-1), rp[rp.length-1] + (target.after!==undefined?1:0), srcNode);
    } else {
      t = [...t, srcNode]; // trunk end
    }
    return t;
  });
  const dragStart = (id, e) => { dragIdRef.current = id; if (e && e.dataTransfer){ e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", String(id)); }catch(_){} } };
  const dragOverRow = (id, e) => { e.preventDefault(); const r=e.currentTarget.getBoundingClientRect(); setDropHint({ id, pos: e.clientY < r.top + r.height/2 ? "before" : "after" }); };
  const dropRow = (id, e) => { e.preventDefault(); const src=dragIdRef.current; const pos=(dropHint&&dropHint.id===id)?dropHint.pos:"after"; if(src!=null) moveNode(src, pos==="before"?{before:id}:{after:id}); setDropHint(null); dragIdRef.current=null; };
  const dropInto = (branchId, e) => { e.preventDefault(); const src=dragIdRef.current; if(src!=null) moveNode(src, {into:branchId}); setDropHint(null); dragIdRef.current=null; };
  const dragEnd = () => { setDropHint(null); dragIdRef.current=null; };
  const dnd = (id) => ({ id, start:dragStart, over:dragOverRow, drop:dropRow, end:dragEnd, hint:dropHint });
  // "Add condition" swaps the menu in place to choose the condition's shape (inline vs branching)
  const condKindMenuConfig = (path, anchor, back) => {

  const openMainAt = (path, anchor) => { if (anchor) { setFocusKey("__then"); setOpenSlot("__then"); setPop(mainMenuConfig(path, anchor)); } };
  const openMain = (path, e) => openMainAt(path, e.currentTarget);
  const openBranchAddAt = (path, anchor) => {

  const openClauseValueByKey = (path, ci, fieldId, key, opOverride) => openClauseValue(path, ci, fieldId, null, false, key, opOverride);
  const pickClauseField = (path, node, ci, e) => { setOpenSlot(`${pathKey(path)}:c${ci}:field`); open(e.currentTarget, flowMenu(node),

  const pickClauseOp = (path, node, ci, e) => {

  const pickClauseUnit = (path, ci, e) => { setOpenSlot(`${pathKey(path)}:c${ci}:unit`); open(e.currentTarget, REL_DATE_UNITS.map(u=>({id:u,label:u})), (i)=>updateClause(path, ci, {unit:i.id}), "Unit", {noSearch:true, selected:nodeAt(flow,path)?.clauses?.[ci]?.unit}); };
  const pickPathUnit = (path, node, pi, ci, e) => { setOpenSlot(`${pathKey(path)}:p${pi}:c${ci}:unit`); open(e.currentTarget, REL_DATE_UNITS.map(u=>({id:u,label:u})), (i)=>updatePathClause(path, pi, ci, {unit:i.id}), "Unit", {noSearch:true, selected:node.paths[pi].clauses[ci].unit}); };
  const pickClauseValue = (path, node, ci, e) => openClauseValue(path, ci, node.clauses[ci].field, e.currentTarget, false);
  // append a clause to a condition (inline AND/OR) and open its field picker
  const addClauseAndPick = (path, node, orGroup) => {
    const ci = (node.clauses||[]).length;
    setFlow(f => treeUpdate(f, path, (()=>{ const n=nodeAt(f,path); return { clauses:[...(n.clauses||[]), {field:null,op:"is",value:null, ...(orGroup?{or:true}:{})}] }; })()));
    setOpenSlot(`${pathKey(path)}:c${ci}:field`);
    requestAnimationFrame(()=> open(condSlotRefs.current[`${node.id}:0`], flowMenu(node),
      (i)=>{ const t = flowFD(node,i.id)?.type || "enum"; updateClause(path, ci, {field:i.id,op:defaultOp(t),value:null});
             requestAnimationFrame(()=>openClauseValueByKey(path, ci, i.id, `cval:${node.id}:${ci}`, defaultOp(t))); },
      "Which field", {wide:true, help:NODE_HELP.condition, anchorKey:`cond:${node.id}:${ci}`}));
  };
  const toggleCombiner = (path, node) => update(path, { combiner: node.combiner==="or" ? "and" : "or" });

  /* escalation: convert an inline condition → a branch (a fork) */
  // path1 keeps this condition's clauses+combiner and ABSORBS the steps that followed it at the same level.
  const convertToBranch = (path, node, { otherwise }) => setFlow(f => {
    const parent = path.slice(0,-1), idx = path[path.length-1];
    const siblings = childrenAt(f, parent);
    const following = siblings.slice(idx+1); // steps after this condition move into path1
    const path1 = { id:nid(), clauses:node.clauses, combiner:node.combiner, children: following };
    const branch = { id:nid(), kind:"branch",
      paths: otherwise ? [path1] : [path1, { id:nid(), clauses:[{field:null,op:"is",value:null}], combiner:"and", children:[] }],
      otherwise: otherwise ? { id:nid(), children:[] } : null };

  });
  const addPath = (path) => setFlow(f => treeUpdate(f, path, (()=>{ const n=nodeAt(f,path);
    return { paths:[...(n.paths||[]), { id:nid(), clauses:[{field:null,op:"is",value:null}], combiner:"and", children:[] }] }; })()));
  const addOtherwise = (path) => setFlow(f => treeUpdate(f, path, { otherwise:{ id:nid(), children:[] } }));
  // clause ops on a branch path's condition (paths[pi].clauses)
  const updatePathClause = (path, pi, ci, patch) => setFlow(f => treeUpdate(f, path, (()=>{ const n=nodeAt(f,path);
    const paths = n.paths.map((p,k)=> k===pi ? {...p, clauses:p.clauses.map((c,j)=> j===ci?{...c,...patch}:c)} : p); return { paths }; })()));
  const togglePathCombiner = (path, node, pi) => setFlow(f => treeUpdate(f, path, (()=>{ const n=nodeAt(f,path);

  const removePath = (path, pi) => setFlow(f => {
    const n = nodeAt(f, path); if(!n) return f;
    let paths = n.paths.filter((_,k)=>k!==pi);
    // collapse a branch back to an inline condition when it's down to one path and no otherwise
    if (paths.length===1 && !n.otherwise) {
      const only = paths[0];

      const parent = path.slice(0,-1), idx = path[path.length-1];

  const removeOtherwise = (path) => setFlow(f => {

    setOpenSlot(`${pathKey(path)}:p${pi}:c${ci}:field`);

  const pickPathField = (path, node, pi, ci, e) => { setOpenSlot(`${pathKey(path)}:p${pi}:c${ci}:field`); open(e.currentTarget, flowMenu(node),
    (i)=>{ const t=flowFD(node,i.id)?.type||"enum"; updatePathClause(path,pi,ci,{field:i.id,op:defaultOp(t),value:null});
           setTimeout(()=>pickPathValueEl(path,node,pi,ci,valueSlotRefs.current[`${node.paths[pi].id}:${ci}`],i.id,defaultOp(t)),40); },

  const pickPathValueEl = (path, node, pi, ci, el, fieldId, opOverride) => {

  };
  const pickPathOp = (path, node, pi, ci, e) => { setOpenSlot(`${pathKey(path)}:p${pi}:c${ci}:op`);
    const t=flowFD(node, node.paths[pi].clauses[ci].field)?.type||"enum";
    open(e.currentTarget,(TYPE_OPS[t]||TYPE_OPS.enum).map(o=>({id:o,label:o})),(i)=>updatePathClause(path,pi,ci,{op:i.id}),"Comparison",{selected:node.paths[pi].clauses[ci].op}); };

  // assign target picker — two categories: relative People (pick directly) and "Pick specific"

  const TGT_CHEV = (<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>);

      if (i.id.startsWith("auto:")) { update(path,{ action:"set_auto_assignment", arg:i.id.slice(5) }); return; } // becomes "set auto assignment using {method}"

  const openArg = (path, actionId, el, anchorKey) => {
    const a = actionCatAll.byId[actionId]; if(!a || !a.arg || (!el && !anchorKey)) return;
    setOpenSlot(`${pathKey(path)}:arg`);

    open(el, a.arg.map(v=>({id:v,label:v})), (i)=>update(path,{arg:i.id}), a.label, {...(anchorKey?{anchorKey}:{}), selected:nodeAt(flow,path)?.arg});
  };
  const openArgByKey = (path, actionId, key) => openArg(path, actionId, null, key);
  // pick an action; if it takes a value, auto-open the arg picker next
  // pick a leaf action → set it on the node and open its first slot (keyed to the row; works for both
  // adding a new action and re-picking an existing one). Form-editor leaves wire up later.
  const pickLeaf = (path, leaf) => {
    const n = nodeAt(flow, path); const nodeId = n && n.id;
    update(path, { action: leaf.a, arg:null });
    if (actionCatAll.byId[leaf.a] && actionCatAll.byId[leaf.a].arg) requestAnimationFrame(()=>openArgByKey(path, leaf.a, `aarg:${nodeId}`));
  };
  const leafAvail = (lf, avail) => avail ? avail.has(lf.a) : !!actionCatAll.byId[lf.a]; // available given the modules in scope
  // tooltip text for an unavailable item: which modules it IS available for
  const availHint = (ids) => { const mods = RECORD_MODULES.filter(m=>{ const cat=actionCatalogFor(m.id); return ids.some(a=>cat.byId[a]); }).map(m=>m.label); return mods.length ? "Available for: "+mods.join(" · ") : "Not available yet"; };
  // flat index of EVERY leaf (available + unavailable) — unavailable ones render disabled at the bottom
  const actionLeafIndex = (avail) => { const out=[]; ACTION_GROUPS.forEach(g=>g.leaves.forEach(lf=>out.push({ ...lf, group:g.label, avail:leafAvail(lf, avail) }))); return out; };
  const flatItems = (avail) => { const ls=actionLeafIndex(avail);
    const mk=(lf)=> lf.avail ? { id:"f:"+lf.a, label:lf.label, sub:lf.group, keywords:lf.kw, _leaf:lf, help:ACTION_HELP[lf.a] }
                             : { id:"fx:"+lf.a, label:lf.label, sub:lf.group, keywords:lf.kw, disabled:true, tag:"unavailable", hint:availHint([lf.a]), help:ACTION_HELP[lf.a] };
    return [...ls.filter(l=>l.avail).map(mk), ...ls.filter(l=>!l.avail).map(mk)]; };
  const ACT_CHEV = (<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>);
  // sub-action menu for ONE group. Heading shows the group name (breadcrumb so you know where you are).
  // Leaves grouped by `sub` (e.g. Manual / Automatic) if any are set; available first, disabled last.
  // opts.onLeaf overrides what a leaf does (used by ADD mode = create the row on pick); opts.selected
  // overrides the "current value" highlight (null in add mode, since no node exists yet).
  const actionGroupConfig = (path, anchor, g, back, anchorKey, opts={}) => ({
    anchor, anchorKey, back, wide:true, title:g.label, help: ACTION_HELP["grp_"+g.id] || ACTION_HELP[g.id] || { ...NODE_HELP.action, title:g.label },
    items: (()=>{ const avail=availActionIds(path); const ls=g.leaves.map(lf=>({...lf, avail:leafAvail(lf, avail)}));
      const mk=(lf)=> lf.avail ? { id:lf.a, label:lf.label, keywords:lf.kw, _leaf:lf, help:ACTION_HELP[lf.a]||ACTION_HELP["grp_"+g.id]||ACTION_HELP[g.id] } : { id:"x:"+lf.a, label:lf.label, disabled:true, tag:"unavailable", hint:availHint([lf.a]), help:ACTION_HELP[lf.a]||ACTION_HELP["grp_"+g.id]||ACTION_HELP[g.id] };
      const ord=(arr)=>[...arr.filter(l=>l.avail), ...arr.filter(l=>!l.avail)];
      if (!ls.some(l=>l.sub)) return ord(ls).map(mk);
      const subs=[...new Set(ls.map(l=>l.sub||"Other"))]; const out=[];
      subs.forEach(sc=>{ const inSub=ls.filter(l=>(l.sub||"Other")===sc); if(!inSub.length) return; out.push({header:sc}); ord(inSub).forEach(lf=>out.push(mk(lf))); });
      return out; })(),
    flat: flatItems(availActionIds(path)),
    selected: opts.selected!==undefined ? opts.selected : nodeAt(flow,path)?.action,
    onPick:(i)=>{ (opts.onLeaf || ((lf)=>pickLeaf(path, lf)))(i._leaf); },
  });
  // top action menu: BROWSE categories (grouped under SECTION headers) when empty; typing flat-searches
  // every sub-action. Single-leaf group = direct one-line action; multi-leaf = name + chevron. Anything
  // unavailable for this module drops to a "Unavailable here" group at the bottom (disabled).
  const actionMenuConfig = (path, anchor, back, anchorKey, opts={}) => ({
    anchor, anchorKey, back, wide:true, title:"Do this", help:NODE_HELP.action,
    items: (()=>{
      const avail = availActionIds(path);
      const row = (g)=>{ const total=g.leaves; const anyAvail=total.some(l=>leafAvail(l, avail));
        if (total.length===1) { const lf=total[0]; return leafAvail(lf, avail) ? { id:"leaf:"+lf.a, label:lf.label, _leaf:lf, _sec:g.section, help:ACTION_HELP[lf.a]||ACTION_HELP[g.id] } : { id:"gx:"+g.id, label:lf.label, disabled:true, tag:"unavailable", hint:availHint([lf.a]), _sec:g.section, help:ACTION_HELP[lf.a]||ACTION_HELP[g.id] }; }
        const ghelp = ACTION_HELP["grp_"+g.id] || ACTION_HELP[g.id];
        return anyAvail ? { id:"grp:"+g.id, label:g.label, cat:true, _g:g, rightIcon:ACT_CHEV, _sec:g.section, help:ghelp } : { id:"gx:"+g.id, label:g.label, disabled:true, tag:"unavailable", hint:availHint(total.map(l=>l.a)), _sec:g.section, help:ghelp }; };
      const rows = ACTION_GROUPS.map(row);
      const enabled = rows.filter(r=>!r.disabled), disabled = rows.filter(r=>r.disabled);
      const sections = [...new Set(ACTION_GROUPS.map(g=>g.section))]; const out=[];
      sections.forEach(sec=>{ const inSec=enabled.filter(r=>r._sec===sec); if(!inSec.length) return; out.push({header:sec}); inSec.forEach(r=>out.push(r)); });
      if (disabled.length){ out.push({header:"Unavailable here"}); disabled.forEach(r=>out.push(r)); }
      return out;
    })(),
    flat: flatItems(availActionIds(path)),
    selected: opts.selected!==undefined ? opts.selected : (()=>{ const a=nodeAt(flow,path)?.action; return a?"leaf:"+a:null; })(),
    onPick:(i, idx)=>{ if (i.cat) { setPop(actionGroupConfig(path, anchor, i._g, ()=>setPop({ ...actionMenuConfig(path, anchor, back, anchorKey, opts), initActive: idx }), undefined, opts)); return true; } (opts.onLeaf || ((lf)=>pickLeaf(path, lf)))(i._leaf); },
  });
  const pickActionChain = (path, el) => { setOpenSlot(`${pathKey(path)}:action`); setPop(actionMenuConfig(path, el)); };
  const pickAction = (path, e) => pickActionChain(path, e.currentTarget);
  // ADD mode: pick an action FIRST (swaps the add-menu in place, with a back chevron); only when a specific
  // action is chosen do we create the row. `index` lets it insert at a position (insert-below).
  const addActionLeaf = (parentPath, leaf, index) => {
    const idx = index===undefined ? childrenAt(flow, parentPath).length : index;
    const node = { id:nid(), kind:"action", action:leaf.a, arg:null };
    const newPath = [...parentPath, idx];
    setFlow(f => treeInsertAt(f, parentPath, idx, node));
    setFocusKey(pathKey(newPath));
    if (actionCatAll.byId[leaf.a] && actionCatAll.byId[leaf.a].arg) requestAnimationFrame(()=>openArgByKey(newPath, leaf.a, `aarg:${node.id}`));
  };
  const openAddActionMenu = (parentPath, anchor, back, index) => {
    setOpenSlot(null);
    setPop(actionMenuConfig(parentPath, anchor, back, undefined, { onLeaf:(leaf)=>addActionLeaf(parentPath, leaf, index), selected:null }));
  };
  const pickArg = (path, node, e) => openArg(path, node.action, e.currentTarget);
  // RECORD CONTEXT ("where"): records in scope at `path` = the trigger record + any create/get on the
  // trunk above this step. An action's {record} slot picks one; default = the most recent (contextual),
  // and the slot is HIDDEN when there's only one record (nothing to choose — reads "it").
  const recordsInScope = (path) => {
    const recs = [];
    const mod = triggers[0] && triggers[0].vals && triggers[0].vals.module;
    if (mod) recs.push({ id:"__trigger", label:`the ${mod}` });
    const topIdx = typeof path[0]==="number" ? path[0] : flow.length;
    for (let j=0; j<topIdx; j++){ const n = flow[j];
      if (n.kind==="action" && n.action==="create" && n.arg) recs.push({ id:n.id, label:`the ${n.arg}` });
      else if (n.kind==="get" && n.module) recs.push({ id:n.id, label:`the ${n.module}` });
    }
    return recs;
  };
  const recordLabel = (scope, recId) => { const r = scope.find(x=>x.id===recId); return r ? r.label : (scope.length ? scope[scope.length-1].label : null); };
  const pickRecord = (path, scope, e) => { setOpenSlot(`${pathKey(path)}:record`); open(e.currentTarget, scope.map(r=>({id:r.id,label:r.label})), (i)=>update(path,{record:i.id}), "Which record", {noSearch:true, selected:nodeAt(flow,path)?.record}); };
  // Record-acting actions read as a SENTENCE with the record embedded in the verb phrase. When there's only
  // one record source (the trigger), the record is implicit (no slot, reads "the {module}"); when 2+ sources
  // exist (a Create/Get added one upstream), it becomes a pickable {record} slot. Returns {verb, tpl} (tpl
  // has {record}/{arg} tokens) or null = not record-acting (fall back to the default action rendering).
  const recordActionSentence = (node, def, showRec) => {
    const id = node.action;
    if (id==="update")  return { verb:"update", tpl:" {record}" };
    if (id==="close")   return { verb:"close",  tpl:" {record}" };
    if (id==="add_relation") return { verb:"add", tpl:" a relation from {record}" };
    if (id==="priority_matrix")    return showRec ? { verb:"update", tpl:" {record} priority as per Priority Matrix" } : { verb:"set", tpl:" the priority as per Priority Matrix" };
    if (id==="smart_suggestion")   return showRec ? { verb:"update", tpl:" {record} field by Smart Suggestion" }   : { verb:"set", tpl:" the suggested field by Smart Suggestion" };
    if (id==="set_auto_assignment")return showRec ? { verb:"set",    tpl:" auto assignment on {record} using {arg}" } : { verb:"set", tpl:" auto assignment using {arg}" };
    if (id && id.startsWith("send_")) {
      const chan = (def?.label||"send to").replace(/^send\s+/i,"").replace(/\s+to$/i,""); // "Email" / "an approval-reminder email"
      return showRec ? { verb:"send", tpl:` ${chan} about {record} to {arg}` } : { verb:"send", tpl:` ${chan} to {arg}` };
    }
    return null;
  };
  // render the {verb, tpl} sentence into slots/words: leading verb = clickable action slot; {record} = the
  // record slot (or an implicit Word); {arg} = the action's arg slot; everything else = fixed Words.
  const renderRecordSentence = (sent, node, def, path, scope, showRec, k) => {
    const recEl = showRec
      ? <Slot tone="action" value={recordLabel(scope, node.record)} placeholder="the record" open={openSlot===`${k}:record`} onClick={(e)=>pickRecord(path,scope,e)} />
      : <Word>{scope.length ? scope[scope.length-1].label : "the record"}</Word>;
    const argEl = <Slot tone="action" value={node.arg} placeholder={def.argPlaceholder || "…"} open={openSlot===`${k}:arg`} dataAnchor={`aarg:${node.id}`} innerRef={(el)=>{ if(el) argSlotRefs.current[k]=el; }} onClick={(e)=>pickArg(path,node,e)} />;
    const parts = sent.tpl.split(/(\{record\}|\{arg\})/).filter(p=>p!=="");
    return (
      <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
        <Slot tone="action" value={sent.verb} open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
        {parts.map((p,pi)=> p==="{record}" ? <React.Fragment key={pi}>{recEl}</React.Fragment>
          : p==="{arg}" ? <React.Fragment key={pi}>{argEl}</React.Fragment>
          : <Word key={pi}>{p.trim()}</Word>)}
      </span>
    );
  };

  const isComplete = hasTrigger && hasAction(flow);
  /* context-rail summary helpers */
  const fillTrigger = (t) => triggerView(t).tpl.replace(/\{(\w+)\}/g, (_,k)=> (t.vals && t.vals[k]) ? t.vals[k] : "…");
  // describe a single clause as text
  const clauseText = (c, cat) => { const f = (cat||FIELDS).find(x=>x.id===c.field); const v = Array.isArray(c.value)?c.value.join(", "):c.value; return `${f?f.label:"a field"} ${c.op||"is"} ${v||"…"}${(isRelDateOp(c.op)&&v)?(" "+(c.unit||"days")):""}`; };
  const condText = (n) => { const cat = flowCat(n); return (n.clauses||[]).map((c,i)=> (i>0 ? (c.or?" OR ":" AND ") : "") + clauseText(c, cat)).join(""); };
  const summaryLines = (nodes, depth) => {
    const out = [];
    (nodes||[]).forEach(n=>{
      if (n.kind==="action") { const d = actionCatAll.byId[n.action];
        out.push({ type:"action", depth, text: d ? (d.label + (n.arg ? ` ${n.arg}` : "")) : "choose an action" });
      } else if (n.kind==="delay") {
        out.push({ type:"action", depth, text: n.mode==="event" ? `wait until ${condText(n)}` : (n.timeMode==="until" ? `wait until ${n.until||"…"}` : `wait for ${n.amount||"…"} ${n.unit||""}`) });
      } else if (n.kind==="get") {
        out.push({ type:"cond", depth, text: `get ${n.qty||"all"} ${n.module||"records"}${(n.clauses||[]).some(c=>c.field) ? " where "+condText(n) : ""}` });
      } else if (n.kind==="condition") {
        out.push({ type:"cond", depth, text: condText(n) });
      } else if (n.kind==="branch") {
        (n.paths||[]).forEach((p,pi)=>{ out.push({ type:"cond", depth, text: (pi===0?"":"or path: ") + condText(p) });
          summaryLines(p.children, depth+1).forEach(x=>out.push(x)); });
        if (n.otherwise) { out.push({ type:"cond", depth, text:"otherwise" });
          summaryLines(n.otherwise.children, depth+1).forEach(x=>out.push(x)); }
      }
    });
    return out;
  };
  const countKind = (nodes, kind) => (nodes||[]).reduce((a,n)=> a + (n.kind===kind?1:0) + countKind(branchKids(n), kind), 0);

  /* ---- keyboard navigation for power users ---- */
  const navList = () => {
    const out = [];
    if (!hasTrigger) out.push({ key:"T", kind:"trigger", path:null });
    else triggers.forEach(t => out.push({ key:`trig:${t.id}`, kind:"trigger", path:null }));
    const walk = (nodes, base) => nodes.forEach((n,i)=>{ const p=[...base,i];
      out.push({ key:pathKey(p), kind:n.kind, path:p, node:n });
      if (n.kind==="branch") { (n.paths||[]).forEach((pp,k)=>walk(pp.children||[], [...p,{path:k}]));
        if (n.otherwise) walk(n.otherwise.children||[], [...p,{otherwise:true}]); }
      else if (n.children) walk(n.children, p); });
    walk(flow, []); return out;
  };
  const isTriggerKey = (k) => k==="T" || k.startsWith("trig:");
  const focusScope = () => {
    if (isTriggerKey(focusKey)) return [];
    const cur = navList().find(n=>n.key===focusKey);
    if (!cur || !cur.node) return [];
    // a branch: add steps into its first path; everything else: add as a sibling
    if (cur.node.kind === "branch") return [...cur.path, {path:0}];
    return cur.path.slice(0,-1);
  };
  const addToScope = (kind) => {
    const scope = focusScope();
    const anchor = rowRefs.current[focusKey];
    if (kind==="action") openAddActionMenu(scope, anchor, null); // pick the action first; create the row on pick
    else addConditionAndPick(scope, anchor);
  };
  const removeFocused = () => {
    const nav = navList(); const i = nav.findIndex(n=>n.key===focusKey);
    if (focusKey.startsWith("trig:")) { removeTrigger(focusKey.slice(5)); }
    else if (focusKey==="T") { return; }
    else if (i>=0) { setFlow(f => treeRemove(f, nav[i].path)); }
    const prev = nav[Math.max(0, i-1)];
    setFocusKey(prev ? prev.key : "T");
  };
  useEffect(() => {
    const onKey = (e) => {
      if (pop) return; // popover owns the keyboard while open
      const tag = (e.target.tagName||"").toLowerCase();
      if (tag==="input" || tag==="textarea") return;
      const nav = navList();
      const idx = Math.max(0, nav.findIndex(n=>n.key===focusKey));
      const k = e.key.toLowerCase();
      if (e.metaKey || e.ctrlKey) {
        if (k==="z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
        else if (k==="y") { e.preventDefault(); redo(); }
        else if (k==="b") { e.preventDefault(); toggleSide(); }
        return; // don't let other Ctrl/⌘ combos trigger single-key actions
      }
      if (k==="arrowdown" || k==="j") { e.preventDefault(); setFocusKey(nav[Math.min(nav.length-1, idx+1)].key); }
      else if (k==="arrowup" || k==="k") { e.preventDefault(); setFocusKey(nav[Math.max(0, idx-1)].key); }
      else if (e.key==="Enter") { e.preventDefault();
        // contextual: no trigger → trigger picker; else → the "do this / add steps" menu
        if (!hasTrigger) pickTriggerType(rowRefs.current["Twhen"] || rowRefs.current["T"]);
        else openMainAt([], firstVisibleEl(rowRefs.current["__thenSlot"], rowRefs.current["__then"], addStepBtnRef.current)); }
      else if (k==="a") { if (!hasTrigger) return; e.preventDefault(); addToScope("action"); }
      else if (k==="c") { if (!hasTrigger) return; e.preventDefault(); addToScope("condition"); }
      else if (k==="x" || k==="delete" || k==="backspace") { e.preventDefault(); removeFocused(); }
      else if (e.shiftKey && k==="r") { e.preventDefault(); reset(); }
      else if (k==="t") { setTheme(t=>t==="dark"?"light":"dark"); }
      else if (e.key==="?") { setHelpOpen(h=>!h); }
      else if (k==="escape") { setHelpOpen(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  /* ---- markers ---- */
  const MARK = {
    trigger:<span className="block w-3.5 h-3.5 rounded-full" style={{border:"2px solid var(--c-when)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    cond:   <span className="block w-2.5 h-2.5 rotate-45" style={{background:"var(--c-if)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    action: <span className="block w-2.5 h-2.5 rounded-full" style={{background:"var(--c-then)",boxShadow:"0 0 0 4px var(--bg)"}}/>,
    delay:  <span className="flex w-3.5 h-3.5 items-center justify-center" style={{color:"var(--muted)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 3h10M7 21h10M8 3v3l4 4 4-4V3M8 21v-3l4-4 4 4v3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg></span>,
    get:    <span className="flex w-3.5 h-3.5 items-center justify-center" style={{color:"var(--muted)",background:"var(--bg)",boxShadow:"0 0 0 4px var(--bg)"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg></span>,
    add:    <span className="flex items-center justify-center w-5 h-5 rounded-full" style={{border:"1px dashed var(--border2)",color:"var(--faint)",background:"var(--bg)"}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg></span>,
  };

  const HEAD = 28, PAD = 7, GAP = 10, MC = PAD + HEAD/2; // MC = marker center from row top
  const Station = ({ marker, isFirst, isLast, head, headColor, headBg, hoverBg, onRemove, removeLabel, onInsert, onCopy, dnd, onFocus, onClick, focused, help, innerRef, dense, gapBottom, okBorder, editing, bgLeft="16px", bgRight="16px", padLeft="34px", padRight="28px", children }) => {
    const [xHover, setXHover] = useState(false);
    const pt = dense ? 6 : PAD, bgBottom = gapBottom!==undefined ? gapBottom : (dense ? 12 : GAP), pb = pt + bgBottom, mc = pt + HEAD/2;
    const active = focused && !!pop; // row's popover is open → keep its tint on (focus state)
    // row is the DROP target; the grip handle (below) is the drag SOURCE so slots stay clickable
    const dndProps = dnd ? { onDragOver:(e)=>dnd.over(dnd.id, e), onDrop:(e)=>dnd.drop(dnd.id, e), onDragEnd:()=>dnd.end() } : {};
    const showBefore = dnd && dnd.hint && dnd.hint.id===dnd.id && dnd.hint.pos==="before";
    const showAfter  = dnd && dnd.hint && dnd.hint.id===dnd.id && dnd.hint.pos==="after";
    return (
    <div ref={innerRef} className="relative group" onMouseDown={onFocus} {...dndProps}
      style={{paddingLeft:padLeft, paddingRight:padRight, paddingTop:`${pt}px`, paddingBottom:`${pb}px`}}>
      {/* drop indicator line while dragging another node over this row */}
      {(showBefore||showAfter) && <div className="absolute h-0.5 rounded-full pointer-events-none" style={{ left:bgLeft, right:bgRight, top: showBefore?0:`calc(100% - ${bgBottom}px)`, background:"var(--accent)" }}/>}
      {/* role-tinted background: on hover, and while this row's popover is open */}
      <div className={"absolute rounded-lg transition-opacity pointer-events-none " + (active ? "opacity-100" : "opacity-0 group-hover:opacity-100")}
        style={{ top:0, bottom:`${bgBottom}px`, left:bgLeft, right:bgRight, background:hoverBg||"var(--panel2)" }}/>
      {/* persistent green border once the node's form is confirmed "Good to go" */}
      {okBorder && <div className="absolute rounded-lg pointer-events-none" style={{ top:0, bottom:`${bgBottom}px`, left:bgLeft, right:bgRight, border:"1px solid var(--rdy-bd)" }}/>}
      {/* rail */}
      <div className="absolute w-px" style={{ left:"9px", top:isFirst?`${mc}px`:0, bottom:isLast?`calc(100% - ${mc}px)`:0, background:"var(--border2)" }}/>
      {/* marker (optional) */}
      {marker && <span className="absolute flex items-center justify-center" style={{ left:"9px", top:`${mc}px`, transform:"translate(-50%,-50%)" }}>{marker}</span>}
      <div onClick={onClick} className={"relative flex items-start gap-4 " + (onClick ? "cursor-pointer" : "")}>
        <div className="flex-1 min-w-0 text-[16px]" style={{lineHeight:`${HEAD}px`}}>
          {head && <span className="relative group/help inline-flex items-center align-top mr-2.5" style={{height:`${HEAD}px`}}>
            <span className={"text-[10px] font-semibold uppercase tracking-[0.1em] px-2 py-[3px] rounded-md whitespace-nowrap " + (help ? "cursor-help" : "")}
              style={{color:headColor||"var(--faint)", background:headBg||"var(--panel2)"}}>{head}</span>
            {help && <div className="absolute z-30 left-0 top-full mt-2 w-72 p-3.5 rounded-xl opacity-0 pointer-events-none group-hover/help:opacity-100 transition-opacity"
              style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}>
              <HelpCard help={help} />
            </div>}
          </span>}
          <span className={"inline align-top " + (xHover ? "striking" : "")}>
            {children}
          </span>
        </div>
        {/* row actions on the right: drag handle + copy + remove (revealed on hover) */}
        <div className="relative shrink-0 flex items-center gap-0.5" style={{height:`${HEAD}px`}}>
          {dnd &&
            <span draggable onDragStart={(e)=>dnd.start(dnd.id, e)} onDragEnd={()=>dnd.end()} title="Drag to move"
              className="flex items-center justify-center transition-colors opacity-0 group-hover:opacity-100 hover:text-[var(--text)] cursor-grab active:cursor-grabbing"
              style={{ color:"var(--faint)", padding:"6px" }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
            </span>}
          {xHover && removeLabel &&
            <div className="absolute right-0 px-2 py-1 rounded-md text-[11px] whitespace-nowrap" style={{ bottom:"28px", background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)" }}>{removeLabel}</div>}
          {onCopy &&
            <button onMouseDown={(e)=>{ e.stopPropagation(); onCopy(); }} title="Duplicate"
              className="rounded-md flex items-center justify-center transition-colors opacity-0 group-hover:opacity-100 hover:bg-[var(--pop-hover)]"
              style={{ color:"var(--faint)", padding:"6px" }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 15V5a2 2 0 012-2h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
            </button>}
          <button onMouseDown={(e)=>{ if(!onRemove) return; e.stopPropagation(); setPop(null); onRemove(); }}
            onMouseEnter={()=>setXHover(true)} onMouseLeave={()=>setXHover(false)}
            className={"rounded-md flex items-center justify-center transition-colors " + (onRemove ? "opacity-0 group-hover:opacity-100" : "opacity-0 pointer-events-none")}
            style={{ color: xHover ? "var(--red)" : "var(--faint)", background: xHover ? "rgba(248,81,73,0.18)" : "transparent", padding:"6px" }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>
      </div>
      {/* subtle "insert step below" — only on row hover, bland (no bg/border), inside the card's bottom edge */}
      {onInsert &&
        <button onMouseDown={(e)=>{ e.stopPropagation(); onInsert(e.currentTarget); }} title="Insert step below"
          className="absolute flex items-center justify-center opacity-0 group-hover:opacity-40 hover:!opacity-90 transition-opacity"
          style={{ left:bgLeft, right:bgRight, bottom:`${bgBottom-3}px`, height:"12px", color:"var(--faint)" }}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
        </button>}
    </div>
    );
  };

  /* trunk opener — the green "Then do this…" prompt for the FIRST action. Once any action exists (or we've
     branched, where steps are added inside branches), it disappears; "add step" then lives in the bottom CTA bar. */
  const Opener = ({ path }) => {
    if (!hasTrigger)
      return (
        <Station marker={MARK.action} isLast head="Then" headColor="var(--c-then)" headBg="var(--c-then-bg)" hoverBg="var(--c-then-h)" help={NODE_HELP.action}>
          <span className="text-[16px]" style={{color:"var(--faint)", opacity:.55}} title="Add a trigger first">do this…</span>
        </Station>
      );
    if (anyAction(flow)) return null; // an ACTION exists → requirement met, drop the opener (add-step lives in the bottom bar)
    return (
      <Station marker={MARK.action} isLast head="Then" headColor="var(--c-then)" headBg="var(--c-then-bg)" hoverBg="var(--c-then-h)" help={NODE_HELP.action} innerRef={(el)=>setRowRef("__then", el)}
        focused={focusKey==="__then"} onFocus={()=>setFocusKey("__then")}>
        <Slot tone="action" value={null} placeholder="do this…" open={openSlot==="__then"} innerRef={(el)=>setRowRef("__thenSlot", el)} onClick={(e)=>openMain(path,e)} />
      </Station>
    );
  };

  /* branch opener — subtle + that expands to "add step in this branch" */
  const BranchAdd = ({ path, branchId }) => (
    <div ref={(el)=>{ if(el) branchAddRefs.current[pathKey(path)]=el; }} onClick={(e)=>openBranchAdd(path,e)}
      onDragOver={branchId!=null ? (e)=>{ e.preventDefault(); } : undefined} onDrop={branchId!=null ? (e)=>dropInto(branchId, e) : undefined}
      className="group/add relative cursor-pointer" style={{paddingLeft:"34px", paddingTop:`${PAD}px`, paddingBottom:`${PAD+GAP}px`}}>
      <div className="absolute w-px" style={{ left:"9px", top:0, bottom:`calc(100% - ${MC}px)`, background:"var(--border2)" }}/>
      <span className="absolute flex items-center justify-center w-5 h-5 rounded-full transition-colors group-hover/add:text-[var(--accent2)]"
        style={{ left:"9px", top:`${MC}px`, transform:"translate(-50%,-50%)", border:"1px dashed var(--border2)", color:"var(--faint)", background:"var(--bg)" }}>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg>
      </span>
      <div className="flex items-center" style={{height:`${HEAD}px`}}>
        <span className="text-[13px] max-w-0 overflow-hidden whitespace-nowrap opacity-0 group-hover/add:max-w-[220px] group-hover/add:opacity-100 transition-all duration-200" style={{color:"var(--faint)"}}>add step in this branch</span>
      </div>
    </div>
  );

  /* a small clickable AND/OR combiner chip (gold) shown between condition clauses */
  // the AND/OR joiner shown between clauses — an underlined editable word (like a slot), not a badge.
  // Click to toggle and ↔ or.
  const CombinerChip = ({ combiner, onClick }) => (
    <button onClick={onClick} title="Switch and / or"
      className="slot mx-1 align-baseline font-medium" style={{ color:"var(--c-if)" }}>
      {(combiner||"and")}
    </button>
  );
  /* inline gold escalation affordance (a small chip button on a condition row) */
  const Escalate = ({ label, onClick }) => (
    <button onClick={(e)=>{ e.stopPropagation(); onClick(); }}
      className="ml-2 align-middle inline-flex items-center text-[11px] font-medium px-2 py-[2px] rounded-full opacity-80 hover:opacity-100 transition-all hover:brightness-110"
      style={{ color:"var(--c-if)", background:"var(--c-if-bg)", border:"1px solid color-mix(in srgb, var(--c-if) 28%, transparent)" }}>{label}</button>
  );

  // render the clause chain for an INLINE condition node
  // INLINE condition = DNF. clauses is a flat array; a clause with `.or` starts a NEW or-group.
  // AND within a group (rendered inline), OR between groups (rendered as stacked "or" rows). The
  // joiner word is an underlined toggle: click "and"↔"or" to merge/split groups.
  // remove one clause from an inline condition / a branch path; keep the new first clause as a group start
  const removeClause = (path, ci) => setFlow(f => { const n=nodeAt(f,path); const next=(n.clauses||[]).filter((_,k)=>k!==ci); if(next.length){ next[0]={...next[0]}; delete next[0].or; } return treeUpdate(f, path, { clauses: next }); });
  const removePathClause = (path, pi, ci) => setFlow(f => { const n=nodeAt(f,path); const paths=n.paths.map((p,k)=>{ if(k!==pi) return p; const next=(p.clauses||[]).filter((_,j)=>j!==ci); if(next.length){ next[0]={...next[0]}; delete next[0].or; } return {...p, clauses:next}; }); return treeUpdate(f, path, { paths }); });
  // single add affordance → asks And (same group) / Or (new group)
  const openAndOr = (anchor, onAnd, onOr) => open(anchor, [{id:"and",label:"And",sub:"same group"},{id:"or",label:"Or",sub:"new group"}], (i)=> i.id==="and"?onAnd():onOr(), "Add condition", {noSearch:true});
  // CARD-based DNF: one card per OR-group; AND clauses stack as rows inside a card. Connectors are toggles
  // (or → splits into a new card, and → merges into the card above). One "+" opens the And/Or chooser.
  const groupClauses = (clauses) => { const g=[]; (clauses||[]).forEach((c,ci)=>{ if(ci===0||c.or) g.push([]); g[g.length-1].push(ci); }); return g; };
  const inlineClauses = (path, node) => {
    const k = pathKey(path);
    const clauses = node.clauses || [];
    const groups = groupClauses(clauses);
    const chip = (ci, label) => <button onClick={(e)=>{ e.stopPropagation(); updateClause(path, ci, { or: !node.clauses[ci].or }); }} title="Click to switch and / or" className="shrink-0 inline-flex items-center gap-0.5 text-[11px] font-semibold rounded-md px-1.5 py-0.5 transition-colors hover:bg-[var(--pop-hover)]" style={{ color:"var(--muted)" }}>{label}{COND_CHEV}</button>;
    const clauseEls = (ci) => {
      const c = node.clauses[ci]; const f = flowFD(node, c.field); const rel = f?.type==="date" && isRelDateOp(c.op);
      return (<>
        <Slot tone="cond" value={f?.label} placeholder="a field" open={openSlot===`${k}:c${ci}:field`} dataAnchor={`cond:${node.id}:${ci}`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseField(path,node,ci,e)} />
        {c.field && <> <Slot tone="cond" value={c.op} placeholder="is" open={openSlot===`${k}:c${ci}:op`} onClick={(e)=>pickClauseOp(path,node,ci,e)} /> </>}
        {c.field && rel
          ? <> <Slot tone="cond" value={c.value} placeholder="0" open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseValue(path,node,ci,e)} /> <Slot tone="cond" value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:c${ci}:unit`} onClick={(e)=>pickClauseUnit(path,ci,e)} /> </>
          : (c.field && <Slot tone="cond" value={Array.isArray(c.value)?c.value.join(", "):c.value} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:c${ci}:value`} dataAnchor={`cval:${node.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${node.id}:${ci}`]=el; }} onClick={(e)=>pickClauseValue(path,node,ci,e)} />)}
      </>);
    };
    return (
      <span className="inline-flex flex-col gap-1.5 align-top" style={{minWidth:"220px"}}>
        {groups.map((g, gi) => (
          <div key={gi} className="rounded-lg flex flex-col gap-1" style={{ background:"color-mix(in srgb, var(--c-if) 7%, transparent)", padding:"5px 10px" }}>
            {g.map((ci, idx) => (
              <div key={ci} className="group/cl flex flex-wrap items-baseline gap-x-1.5">
                {idx===0 ? (gi>0 ? chip(g[0], "or") : null) : chip(ci, "and")}
                {clauseEls(ci)}
                {clauses.length>1 && <button onClick={(e)=>{ e.stopPropagation(); removeClause(path, ci); }} title="Remove" className="ml-auto opacity-0 group-hover/cl:opacity-100 text-[13px] leading-none px-1" style={{color:"var(--faint)"}}>×</button>}
              </div>
            ))}
          </div>
        ))}
        <button onClick={(e)=>{ e.stopPropagation(); openAndOr(e.currentTarget, ()=>addClauseAndPick(path,node,false), ()=>addClauseAndPick(path,node,true)); }} className="self-start inline-flex items-center gap-1 text-[12px] font-medium hover:brightness-110" style={{color:"var(--c-if)"}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>add condition</button>
      </span>
    );
  };
  // render a BRANCH path's condition as DNF groups (same model as inlineClauses): a clause with .or
  // starts a new OR-group (a new "or" row); AND within a group; the joiner is an underlined toggle.
  const pathClauses = (path, node, pi) => {
    const k = pathKey(path), pobj = node.paths[pi];
    const clauses = pobj.clauses || [];
    const groups = groupClauses(clauses);
    const chip = (ci, label) => <button onClick={(e)=>{ e.stopPropagation(); updatePathClause(path, pi, ci, { or: !pobj.clauses[ci].or }); }} title="Click to switch and / or" className="shrink-0 inline-flex items-center gap-0.5 text-[11px] font-semibold rounded-md px-1.5 py-0.5 transition-colors hover:bg-[var(--pop-hover)]" style={{ color:"var(--muted)" }}>{label}{COND_CHEV}</button>;
    const clauseEls = (ci) => {
      const c = pobj.clauses[ci]; const f = flowFD(node, c.field); const rel = f?.type==="date" && isRelDateOp(c.op);
      return (<>
        <Slot tone="cond" value={f?.label} placeholder="a field" open={openSlot===`${k}:p${pi}:c${ci}:field`} dataAnchor={`pcond:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) condSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>pickPathField(path,node,pi,ci,e)} />
        {c.field && <> <Slot tone="cond" value={c.op} placeholder="is" open={openSlot===`${k}:p${pi}:c${ci}:op`} onClick={(e)=>pickPathOp(path,node,pi,ci,e)} /> </>}
        {c.field && rel
          ? <> <Slot tone="cond" value={c.value} placeholder="0" open={openSlot===`${k}:p${pi}:c${ci}:value`} dataAnchor={`pval:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>pickPathValue(path,node,pi,ci,e)} /> <Slot tone="cond" value={c.unit||"days"} placeholder="days" open={openSlot===`${k}:p${pi}:c${ci}:unit`} onClick={(e)=>pickPathUnit(path,node,pi,ci,e)} /> </>
          : (c.field && <Slot tone="cond" value={Array.isArray(c.value)?c.value.join(", "):c.value} placeholder={valuePlaceholder(f?.type)} open={openSlot===`${k}:p${pi}:c${ci}:value`} dataAnchor={`pval:${pobj.id}:${ci}`} innerRef={(el)=>{ if(el) valueSlotRefs.current[`${pobj.id}:${ci}`]=el; }} onClick={(e)=>pickPathValue(path,node,pi,ci,e)} />)}
      </>);
    };
    return (
      <span className="inline-flex flex-col gap-1.5 align-top" style={{minWidth:"220px"}}>
        {groups.map((g, gi) => (
          <div key={gi} className="rounded-lg flex flex-col gap-1" style={{ background:"color-mix(in srgb, var(--c-if) 7%, transparent)", padding:"5px 10px" }}>
            {g.map((ci, idx) => (
              <div key={ci} className="group/cl flex flex-wrap items-baseline gap-x-1.5">
                {idx===0 ? (gi>0 ? chip(g[0], "or") : null) : chip(ci, "and")}
                {clauseEls(ci)}
                {clauses.length>1 && <button onClick={(e)=>{ e.stopPropagation(); removePathClause(path, pi, ci); }} title="Remove" className="ml-auto opacity-0 group-hover/cl:opacity-100 text-[13px] leading-none px-1" style={{color:"var(--faint)"}}>×</button>}
              </div>
            ))}
          </div>
        ))}
        <button onClick={(e)=>{ e.stopPropagation(); openAndOr(e.currentTarget, ()=>addPathClauseAndPick(path,node,pi,false), ()=>addPathClauseAndPick(path,node,pi,true)); }} className="self-start inline-flex items-center gap-1 text-[12px] font-medium hover:brightness-110" style={{color:"var(--c-if)"}}><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>add condition</button>
      </span>
    );
  };

  /* recursive flow renderer */
  function renderFlow(nodes, basePath, opts={}) {
    let acted = false;
    return nodes.map((node, i) => {
      const path = [...basePath, i];
      const k = pathKey(path);
      const insertBelow = (el)=>openInsert(basePath, i+1, el); // subtle hover "+" inside the row card

      // ── ACTION ──────────────────────────────────────────────────────────
      if (node.kind === "action") {
        const def = actionCatAll.byId[node.action];
        const head = acted ? "And" : "Then"; acted = true;
        const isLast = opts.last && i===nodes.length-1;
        const scope = recordsInScope(path);
        const showRec = scope.length > 1; // hide the "where" slot when there's only one record
        // node-level "good to go": has a form/card, every required field filled, AND confirmed via Done
        const _spec = formSpecFor(node.action), _data = node.data||{}, _rows = node.fields||[];
        const _stagesOK = !_spec || !_spec.stages || ((_data.stages||[]).length>0 && (_data.stages||[]).every(st=>_spec.stages.fields.filter(f3=>!f3.opt).every(f3=>st[f3.k])));
        const _complete = _spec ? (_spec.fields.filter(fd=>!fd.opt && (!fd.showIf || fd.showIf(_data))).every(fd=>_data[fd.k]) && _stagesOK) : (_rows.length>0 && _rows.every(rw=>rw.field && rw.value));
        const _hasCard = ((def && def.details) || _spec) && !(def && def.arg && !node.arg);
        const nodeGood = !!(_hasCard && _complete && node.confirmed);
        return (
          <Station key={node.id} marker={MARK.action} isLast={isLast} head={head} headColor="var(--c-then)" headBg="var(--c-then-bg)" hoverBg="var(--c-then-h)" help={NODE_HELP.action} editing={drawer===node.id}
            innerRef={(el)=>setRowRef(k, el)} removeLabel="Clear action" onCopy={()=>copyNode(path)} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={()=>remove(path)}>
            {node.action === "assign" ? (<>
              {/* multi-slot "sentence" action: assign {record?} to {target} */}
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Slot tone="action" value="assign" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                {showRec
                  ? <Slot tone="action" value={recordLabel(scope, node.record)} placeholder="the record" open={openSlot===`${k}:record`} onClick={(e)=>pickRecord(path,scope,e)} />
                  : <Word>it</Word>}
                <Word>to</Word>
                <Slot tone="action" value={node.arg} placeholder="user/group" open={openSlot===`${k}:arg`} dataAnchor={`aarg:${node.id}`} innerRef={(el)=>{ if(el) argSlotRefs.current[k]=el; }} onClick={(e)=>pickArg(path,node,e)} />
              </span>
              {/* assignee card — shows WHO with an initials avatar (display only; click re-opens the picker) */}
              {node.arg && (()=>{
                const usr = SAMPLE_USERS.find(x=>x.name===node.arg);
                const sub = usr ? usr.email : SAMPLE_GROUPS.includes(node.arg) ? "Group" : node.arg.endsWith("'s manager") ? "Group manager" : "Person";
                const initials = node.arg.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
                return (
                  <span onClick={(e)=>{ e.stopPropagation(); pickArg(path,node,e); }}
                    onMouseEnter={(e)=>{ e.currentTarget.style.background="var(--pop-hover)"; e.currentTarget.style.boxShadow="var(--shadow-sm)"; }}
                    onMouseLeave={(e)=>{ e.currentTarget.style.background="var(--panel)"; e.currentTarget.style.boxShadow="none"; }}
                    className="mt-2.5 flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition-all max-w-[420px]"
                    style={{ borderColor:"var(--border2)", background:"var(--panel)" }}>
                    <span className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold shrink-0" style={{background:"var(--avatar-bg)", color:"var(--avatar-fg)"}}>{initials}</span>
                    <span className="flex flex-col min-w-0 flex-1 gap-0.5">
                      <span className="text-[13px] font-medium leading-tight truncate" style={{color:"var(--text)"}}>{node.arg}</span>
                      <span className="text-[11.5px] leading-tight truncate" style={{color:"var(--muted)"}}>{sub}</span>
                    </span>
                  </span>
                );
              })()}
            </>) : node.action === "archive" ? (
              // archive {record} — the record is selectable once more than one is in scope
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Slot tone="action" value="archive" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                {showRec
                  ? <Slot tone="action" value={recordLabel(scope, node.record)} placeholder="the record" open={openSlot===`${k}:record`} onClick={(e)=>pickRecord(path,scope,e)} />
                  : <Word>{scope.length ? scope[0].label : "the record"}</Word>}
              </span>
            ) : (()=>{
              // record-acting actions (update/close/priority-matrix/smart-suggestion/auto-assign/send_*)
              // render as a sentence with the record embedded; everything else uses the default verb + arg.
              const sent = def && recordActionSentence(node, def, showRec);
              return sent
                ? renderRecordSentence(sent, node, def, path, scope, showRec, k)
                : (<>
                    <Slot tone="action" value={def?.label} placeholder="choose an action" open={openSlot===`${k}:action`} dataAnchor={`act:${node.id}`} innerRef={(el)=>{ if(el) actionSlotRefs.current[node.id]=el; }} onClick={(e)=>pickAction(path,e)} />
                    {def && def.arg && <> <Slot tone="action" value={node.arg} placeholder={def.argPlaceholder || "…"} open={openSlot===`${k}:arg`} dataAnchor={`aarg:${node.id}`} innerRef={(el)=>{ if(el) argSlotRefs.current[k]=el; }} onClick={(e)=>pickArg(path,node,e)} /></>}
                  </>);
            })()}
            {/* detail card — actions that carry extra data get an attached card (click → side drawer):
                create/update use field rows (node.fields); task/approval/http/plugin/notifications use a
                form spec (node.data). Shown only once the sentence's own slot is filled. */}
            {(()=>{
              const spec = formSpecFor(node.action);
              if (!((def && def.details) || spec) || (def && def.arg && !node.arg)) return null;
              const data = node.data || {}, rows = node.fields || [], nf = rows.length;
              const filled = spec ? spec.fields.filter(fd=>data[fd.k]).length : nf;
              const title = spec ? spec.title : (node.action==="create" ? (node.arg||"Record")+" details" : "Fields to update");
              // state: complete = every required form field filled (incl. every stage) / every row filled
              const stagesOK = !spec || !spec.stages || ((data.stages||[]).length>0 && (data.stages||[]).every(st=>spec.stages.fields.filter(f3=>!f3.opt).every(f3=>st[f3.k])));
              const complete = spec ? (spec.fields.filter(fd=>!fd.opt && (!fd.showIf || fd.showIf(data))).every(fd=>data[fd.k]) && stagesOK)
                                    : (nf>0 && rows.every(rw=>rw.field && rw.value));
              const countLine = spec ? ((filled ? `${filled} of ${spec.fields.length} filled` : "Not configured") + (spec.stages ? ` · ${(data.stages||[]).length} stage${(data.stages||[]).length===1?"":"s"}` : ""))
                                    : (nf ? `${nf} field${nf>1?"s":""} set` : "No fields yet");
              // a plain-text summary (same sentence as the form's overview) for the card subtitle — truncated + tooltip
              const cardSummary = (()=>{
                if (spec) return spec.overview ? spec.overview(data).map(s=>s.t).join(" ") : null;
                const sc = recordsInScope(path);
                const modName = node.action==="create" ? node.arg : (()=>{ const r=sc.find(x=>x.id===node.record)||sc[sc.length-1]; return r?r.label.replace(/^the\s+/i,""):(triggers[0]&&triggers[0].vals&&triggers[0].vals.module); })();
                const recF = recordFieldsFor(modName);
                const verb = node.action==="create" ? ("Create a "+(node.arg||"record")) : ("Update the "+(modName||"record"));
                const fl = rows.filter(fv=>fv.field);
                return verb + (fl.length ? " with " + fl.map(fv=>{ const fd=recF.find(x=>x.id===fv.field); const val=Array.isArray(fv.value)?fv.value.join(", "):fv.value; return (fd?fd.label:"field")+" = "+(val||"…"); }).join(", ") : "");
              })();
              const subtitle = cardSummary || countLine;
              // "Good to go" only once the user has confirmed the form via Done (and it is still complete)
              const good = complete && node.confirmed;
              const cardEditing = drawer===node.id; // this card's form is open → highlight it, lift above the dim
              return (
                <span onClick={(e)=>{ e.stopPropagation(); setDrawer(node.id); }}
                  onMouseEnter={(e)=>{ if(!cardEditing){ e.currentTarget.style.background="var(--pop-hover)"; e.currentTarget.style.boxShadow="var(--shadow-sm)"; } }}
                  onMouseLeave={(e)=>{ if(!cardEditing){ e.currentTarget.style.background="var(--panel)"; e.currentTarget.style.boxShadow="none"; } }}
                  className="mt-2.5 relative flex items-center gap-3 rounded-xl border px-3 py-2.5 cursor-pointer transition-all max-w-[420px]"
                  style={{ borderColor: cardEditing?"var(--text)":(good?"var(--rdy-bd)":"var(--border2)"), borderWidth: cardEditing?"1.5px":"1px", background:"var(--panel)", ...(cardEditing?{zIndex:40, boxShadow:"var(--shadow-pop)"}:{}) }}>
                  <span className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{background:"var(--panel2)", color:"var(--muted)"}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="3" width="15" height="18" rx="2.5" stroke="currentColor" strokeWidth="1.6"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
                  </span>
                  <span className="flex flex-col min-w-0 flex-1 gap-0.5">
                    <span className="text-[13px] font-medium leading-tight truncate" style={{color:"var(--text)"}}>{title}</span>
                    <span className="text-[11.5px] leading-tight truncate" style={{color:"var(--muted)"}} title={subtitle}>{subtitle}</span>
                  </span>
                  <span className="shrink-0 text-xs px-2 py-0.5 rounded-full"
                    style={{ background: good?"var(--rdy-bg)":"var(--drf-bg)", color: good?"var(--rdy-fg)":"var(--drf-fg)", border:`1px solid ${good?"var(--rdy-bd)":"var(--drf-bd)"}` }}>
                    {good ? "Good to go" : "Incomplete"}
                  </span>
                </span>
              );
            })()}
          </Station>
        );
      }

      // ── CONDITION (inline gate) ─────────────────────────────────────────
      if (node.kind === "condition") {
        // a condition gates the steps AFTER it (its following siblings, rendered by this same .map);
        // it never has children of its own. It is the rail's last node only if it's literally last.
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.cond} isLast={isLast} head="Check if" headColor="var(--c-if)" headBg="var(--c-if-bg)" hoverBg="var(--c-if-h)" help={NODE_HELP.condition}
            innerRef={(el)=>setRowRef(k, el)} removeLabel="Clear condition" onCopy={()=>copyNode(path)} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={()=>remove(path)}>
            {inlineClauses(path, node)}
            {/* escalation affordances removed — condition "kind" (inline vs branching) will be chosen up-front in the popover (redesign pending) */}
          </Station>
        );
      }

      // ── DELAY (wait) ────────────────────────────────────────────────────
      if (node.kind === "delay") {
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.delay} isLast={isLast} head="Wait" headColor="var(--text)" headBg="var(--panel2)" hoverBg="var(--panel2)"
            innerRef={(el)=>setRowRef(k, el)} removeLabel="Remove delay" onCopy={()=>copyNode(path)} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={()=>remove(path)}>
            {node.mode==="event"
              ? <span className="inline-flex flex-wrap items-baseline gap-x-1.5"><Word>until</Word>{inlineClauses(path, node)}</span>
              : <span className="inline-flex items-baseline gap-x-1.5">
                  <button onClick={(e)=>{ e.stopPropagation(); toggleDelayTimeMode(path,node); }} title="Switch for / until" className="slot align-baseline font-medium" style={{color:"var(--ink-mid)"}}>{node.timeMode==="until"?"until":"for"}</button>
                  {node.timeMode==="until"
                    ? <Slot value={node.until} placeholder="a date / field" open={openSlot===`${k}:until`} dataAnchor={`duntil:${node.id}`} onClick={(e)=>pickDelayUntil(path,node,e)} />
                    : <><Slot value={node.amount} placeholder="0" open={openSlot===`${k}:amount`} dataAnchor={`damt:${node.id}`} onClick={(e)=>pickDelayAmount(path,node,e)} />
                        <Slot value={node.unit} placeholder="hours" open={openSlot===`${k}:unit`} onClick={(e)=>pickDelayUnit(path,node,e)} /></>}
                </span>}
          </Station>
        );
      }

      // ── GET (fetch many records → steps below run per record) ───────────
      if (node.kind === "get") {
        const isLast = opts.last && i===nodes.length-1;
        return (
          <Station key={node.id} marker={MARK.get} isLast={isLast} head="Get" headColor="var(--text)" headBg="var(--panel2)" hoverBg="var(--panel2)"
            innerRef={(el)=>setRowRef(k, el)} removeLabel="Remove get" onCopy={()=>copyNode(path)} dnd={dnd(node.id)}
            focused={focusKey===k} onFocus={()=>setFocusKey(k)} onRemove={()=>remove(path)}>
            <span className="inline-flex flex-col gap-1.5 align-top">
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Slot value={node.qty||"all"} placeholder="all" open={openSlot===`${k}:qty`}
                  onClick={(e)=>{ setOpenSlot(`${k}:qty`); open(e.currentTarget, [{id:"all",label:"all"},{id:"a single",label:"a single"}], (i)=>update(path,{qty:i.id}), "How many", {noSearch:true, selected:node.qty||"all"}); }} />
                <Slot value={node.module} placeholder="records" open={openSlot===`${k}:module`} dataAnchor={`gmod:${node.id}`} onClick={(e)=>pickGetModule(path,node,e)} />
                <Word>where</Word>
                {inlineClauses(path, node)}
              </span>
              <span className="inline-flex flex-wrap items-baseline gap-x-1.5">
                <Word>sorted by name</Word>
                <Slot value={node.sort==="desc"?"descending":"ascending"} placeholder="ascending" open={openSlot===`${k}:sort`}
                  onClick={(e)=>{ setOpenSlot(`${k}:sort`); open(e.currentTarget, [{id:"asc",label:"ascending (A → Z)"},{id:"desc",label:"descending (Z → A)"}], (i)=>update(path,{sort:i.id}), "Sort order", {noSearch:true, selected:node.sort||"asc"}); }} />
              </span>
            </span>
          </Station>
        );
      }

      // ── BRANCH (explicit fork) ──────────────────────────────────────────
      const lanes = [];
      const branchIsTerminal = !!opts.last && i===nodes.length-1; // nothing (not even the End cap) follows → stop the trunk rail at the fork
      (node.paths||[]).forEach((pobj, pi) => {
        const lanePath = [...path, {path:pi}];
        const branchActive = branchMenuPath === pathKey(lanePath);
        lanes.push(
          <div key={pobj.id} className="relative" style={{marginLeft:"60px"}}>
            {branchActive && <div className="absolute pointer-events-none rounded-xl" style={{ top:`-${PAD}px`, bottom:"2px", left:"-56px", right:"8px", background:"var(--c-if-h)", boxShadow:"inset 0 0 0 1px var(--c-if-bg)" }}/>}
            {/* parent rail continues straight down behind the fork (stops at the last lane) */}
            <div className="absolute" style={{ left:"-51px", top:0, bottom: (pi===(node.paths||[]).length-1 && !node.otherwise && branchIsTerminal) ? `calc(100% - ${MC}px)` : 0, width:"1px", background:"var(--border2)" }}/>
            {/* family-tree elbow into this lane */}
            <div className="absolute" style={{ left:"-51px", top:0, width:"60px", height:`${MC}px`,
              borderLeft:"1px solid var(--border2)", borderBottom:"1px solid var(--border2)", borderBottomLeftRadius:"12px" }}/>
            {/* this lane's condition header */}
            <Station marker={MARK.cond} isFirst head={pi===0?"Check if":"Or if"} headColor="var(--c-if)" headBg="var(--c-if-bg)" hoverBg="var(--c-if-h)" help={NODE_HELP.condition}
              innerRef={(el)=>setRowRef(pathKey(lanePath), el)} removeLabel="Remove path" onRemove={()=>removePath(path,pi)}>
              {pathClauses(path, node, pi)}
            </Station>
            {renderFlow(pobj.children||[], lanePath)}
            <BranchAdd path={lanePath} branchId={pobj.id} />
          </div>
        );
      });
      if (node.otherwise) {
        const owPath = [...path, {otherwise:true}];
        const owActive = branchMenuPath === pathKey(owPath);
        lanes.push(
          <div key={node.otherwise.id} className="relative" style={{marginLeft:"60px"}}>
            {owActive && <div className="absolute pointer-events-none rounded-xl" style={{ top:`-${PAD}px`, bottom:"2px", left:"-56px", right:"8px", background:"var(--c-if-h)", boxShadow:"inset 0 0 0 1px var(--c-if-bg)" }}/>}
            <div className="absolute" style={{ left:"-51px", top:0, bottom: branchIsTerminal ? `calc(100% - ${MC}px)` : 0, width:"1px", background:"var(--border2)" }}/>
            <div className="absolute" style={{ left:"-51px", top:0, width:"60px", height:`${MC}px`,
              borderLeft:"1px solid var(--border2)", borderBottom:"1px solid var(--border2)", borderBottomLeftRadius:"12px" }}/>
            <Station marker={MARK.cond} isFirst head="Otherwise" headColor="var(--c-if)" headBg="var(--c-if-bg)" hoverBg="var(--c-if-h)" help={NODE_HELP.condition}
              innerRef={(el)=>setRowRef(pathKey(owPath), el)} removeLabel="Remove otherwise" onRemove={()=>removeOtherwise(path)}>
              <span className="text-[15px]" style={{color:"var(--muted)"}}>nothing above matched</span>
            </Station>
            {renderFlow(node.otherwise.children||[], owPath)}
            <BranchAdd path={owPath} branchId={node.otherwise.id} />
          </div>
        );
      }
      return (
        <React.Fragment key={node.id}>
          {lanes}
          {/* branch-level affordances */}
          <div className="relative flex items-center gap-3" style={{ marginLeft:"60px", paddingLeft:"4px", paddingBottom:`${GAP}px` }}>
            {!branchIsTerminal && <div className="absolute" style={{ left:"-51px", top:0, bottom:0, width:"1px", background:"var(--border2)" }}/>}
            <button onClick={()=>addPath(path)} className="text-[12px] font-medium transition-colors hover:brightness-125" style={{color:"var(--c-if)"}}>+ add branch</button>
          </div>
        </React.Fragment>
      );
    });
  }

  const moduleListBody = (
    <>
      <div className="h-14 shrink-0 flex items-center px-4 text-[15px] font-semibold border-b" style={{color:"var(--text)", borderColor:"var(--side-bd)"}}>{suiteDef.label}</div>
      <div className="flex-1 overflow-auto py-2 px-2">
        {suiteDef.modules.map(m=>{
          const on = m.id===activeModule;
          return (
            <React.Fragment key={m.id}>
              {m.sep && (
                <div className="mt-2 pt-2 mb-1 px-3" style={{borderTop:"1px solid var(--side-bd)"}}>
                  <div className="text-[10px] font-semibold uppercase tracking-[0.12em]" style={{color:"var(--faint)"}}>Test cases</div>
                </div>
              )}
              <button onClick={()=>setActiveModule(m.id)}
                className="w-full text-left px-3 py-2 rounded-lg text-[13px] font-medium transition-colors mb-0.5"
                style={{background: on?"var(--side-item-active-bg)":"transparent", color: on?"var(--side-item-active-fg)":"var(--side-item)"}}>
                {m.label}
              </button>
            </React.Fragment>
          );
        })}
      </div>
    </>
  );
  return (
    <div className="flex h-screen w-screen overflow-hidden" style={{background:"var(--shell-bg)"}}>
      {/* ── Left sidebar group (rail + collapsible module list) ── */}
      <div className="relative h-full flex shrink-0" onMouseEnter={()=>setRailHover(true)} onMouseLeave={()=>setRailHover(false)}>
      {/* ── Sidebar 1: Suites (thin icon rail) ── */}
      <nav className="relative z-30 w-16 shrink-0 h-full flex flex-col items-center py-3 gap-1 border-r" style={{background:"var(--rail-bg)", borderColor: (sideCollapsed && !railHover) ? "transparent" : "var(--side-bd)"}}>
        {/* Live (GitHub Pages) vs local tell: github.io → orange "G", elsewhere → purple "F". Code stays in source so it survives every push; only the RENDER differs by host. */}
        <div className="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm mb-2" style={{background: IS_LIVE?"linear-gradient(135deg,#d97757,#e89b82)":"linear-gradient(135deg,#5b6cff,#7c89ff)",color:"#fff"}}>{IS_LIVE?"G":"F"}</div>
        {SUITES.map(s=>{
          const on = s.id===activeSuite;
          return (
            <button key={s.id} onClick={()=>pickSuite(s)} title={s.label}
              className="relative w-11 h-11 rounded-xl flex items-center justify-center transition-colors group"
              style={{background: on?"var(--rail-active)":"transparent", color: on?"var(--rail-icon-active)":"var(--rail-icon)"}}>
              {on && <span className="absolute left-0 top-2 bottom-2 w-1 rounded-r" style={{background:"var(--accent)", marginLeft:"-10px"}}></span>}
              <span className="w-5 h-5 flex items-center justify-center">{s.icon}</span>
              <span className="pointer-events-none absolute left-full ml-2 px-2 py-1 rounded-md text-[11px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>{s.label}</span>
            </button>
          );
        })}
        <div className="mt-auto flex flex-col items-center gap-1">
          {RAIL_BOTTOM.map(b=>(
            <button key={b.id} title={b.label} className="relative w-11 h-11 rounded-xl flex items-center justify-center transition-colors group" style={{color:"var(--rail-icon)"}}>
              <span className="w-5 h-5 flex items-center justify-center">{b.icon}</span>
              <span className="pointer-events-none absolute left-full ml-2 px-2 py-1 rounded-md text-[11px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50" style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>{b.label}</span>
            </button>
          ))}
          <button title="Account" className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold mt-1" style={{background:"var(--avatar-bg)", color:"var(--avatar-fg)"}}>PG</button>
        </div>
      </nav>
      {/* ── Sidebar 2 (in-flow): width animates closed on collapse ── */}
      <aside className={"shrink-0 h-full overflow-hidden transition-[width] duration-300 ease-in-out " + (sideCollapsed ? "w-0" : "w-[220px]")} style={{background:"var(--side-bg)"}}>
        <div className="w-[220px] h-full flex flex-col">{moduleListBody}</div>
      </aside>
      {/* ── Sidebar 2 (floating): slides in over content when collapsed + rail hover ── */}
      <aside className={"absolute left-16 top-0 z-20 w-[220px] h-full flex flex-col border-r transition-transform duration-300 ease-in-out " + ((sideCollapsed && railHover) ? "translate-x-0" : "-translate-x-full pointer-events-none")}
        style={{background:"var(--side-bg)", borderColor:"var(--side-bd)", boxShadow:(sideCollapsed&&railHover)?"var(--inset-shadow)":"none"}}>
        {moduleListBody}
      </aside>
      </div>
      {/* ── Main pane = workflow area inside its own inset frame ── */}
      <div className="flex-1 min-w-0 h-full p-2 pl-1">
      <div className="h-full w-full rounded-xl overflow-hidden flex flex-col" style={{background:"var(--bg)", boxShadow:"var(--inset-shadow)"}}>
      {!showBuilder ? (
        <div className="h-full w-full flex flex-col items-center justify-center gap-3" style={{color:"var(--muted)"}}>
          <div className="w-12 h-12 opacity-60" style={{color:"var(--accent)"}}>{suiteDef.icon}</div>
          <div className="text-[17px] font-semibold" style={{color:"var(--text)"}}>{(suiteDef.modules.find(m=>m.id===activeModule)||{}).label || suiteDef.label}</div>
          <div className="text-[13px]">Coming soon</div>
        </div>
      ) : (
    <div className="flex flex-col h-full w-full overflow-hidden">
      {/* top bar */}
      <header className="h-14 shrink-0 flex items-center gap-3 px-6 border-b" style={{borderColor:"var(--border)",background:"var(--topbar)"}}>
        <button onClick={toggleSide}
          className="group relative w-8 h-8 -ml-1 rounded-lg flex items-center justify-center transition-colors hover:bg-[var(--pop-hover)] shrink-0"
          style={{color:"var(--muted)"}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M9 4v16" stroke="currentColor" strokeWidth="1.8"/></svg>
          <span className="pointer-events-none absolute top-full left-0 mt-2 flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-[12px] whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-50"
            style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", color:"var(--text)", boxShadow:"var(--shadow-sm)"}}>
            {sideCollapsed?"Expand sidebar":"Collapse sidebar"}
            <kbd className="px-1.5 py-0.5 rounded text-[11px] font-medium leading-none" style={{background:"var(--panel2)", border:"1px solid var(--border)", color:"var(--muted)"}}>Ctrl B</kbd>
          </span>
        </button>
        <span className="w-px h-5 shrink-0" style={{background:"var(--border)"}}></span>
        <div className="flex items-center gap-2 text-[15px] min-w-0">
          <button title="Workflows" className="font-medium shrink-0 transition-colors hover:brightness-110" style={{color:"var(--muted)"}}>Workflows</button>
          <span className="shrink-0" style={{color:"var(--faint)"}}>/</span>
          <div className="relative group/nm flex items-center gap-2 min-w-0">
            {editingName
              ? <input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="Untitled rule"
                  onFocus={e=>e.target.select()} onBlur={()=>setEditingName(false)}
                  onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Escape"){ e.preventDefault(); setEditingName(false); } }}
                  className="bg-transparent outline-none text-[15px] font-medium w-48 min-w-0 px-2.5 -mx-1 rounded-md"
                  style={{color:"var(--text)", height:"28px", lineHeight:"28px", borderBottom:"1px solid var(--accent)"}} />
              : <button onClick={()=>setEditingName(true)}
                  className="text-[15px] font-medium truncate rounded-md px-2.5 -mx-1 transition-colors hover:bg-[var(--pop-hover)]"
                  style={{color:"var(--text)", height:"28px", lineHeight:"28px", borderBottom:"1px solid transparent"}}>{name||"Untitled rule"}</button>}
            <span className="shrink-0 text-xs px-2 py-0.5 rounded-full"
              style={{background: isComplete?"var(--rdy-bg)":"var(--drf-bg)", color: isComplete?"var(--rdy-fg)":"var(--drf-fg)", border:`1px solid ${isComplete?"var(--rdy-bd)":"var(--drf-bd)"}`}}>{isComplete? "Ready" : "Draft"}</span>
            {!editingName &&
              <div className="absolute left-0 top-full mt-2 z-30 px-3 py-2 rounded-lg opacity-0 pointer-events-none group-hover/nm:opacity-100 transition-opacity whitespace-nowrap"
                style={{background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-sm)"}}>
                <div className="text-[12.5px] font-semibold" style={{color:"var(--text)"}}>{name||"Untitled rule"}</div>
                <div className="text-[11px]" style={{color:"var(--muted)"}}>Click to rename</div>
              </div>}
          </div>
        </div>
        <button onClick={(e)=>openVersions(e.currentTarget)} title="Switch experiment build"
          className="flex items-center gap-1 px-2.5 py-1 rounded-lg text-[12px] font-medium transition-colors hover:brightness-125"
          style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>
          {(BUILDS.find(b=>b.file===currentBuild)?.label) || "Working"}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <div className="ml-auto flex items-center gap-3">
          <label className="flex items-center gap-2 text-sm cursor-pointer" style={{color:"var(--muted)"}}>
            <button onClick={()=>setEnabled(!enabled)} className="w-9 h-5 rounded-full relative transition-colors"
              style={{background: enabled?"var(--accent)":"var(--border2)"}}>
              <span className="absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all" style={{left: enabled?"18px":"2px"}}></span>
            </button>{enabled?"Enabled":"Disabled"}
          </label>
          <button onClick={()=>setTheme(theme==="dark"?"light":"dark")} title="Toggle theme"
            className="w-8 h-8 rounded-lg flex items-center justify-center transition-colors hover:brightness-125"
            style={{background:"var(--panel2)",border:"1px solid var(--border2)",color:"var(--muted)"}}>
            {theme==="dark"
              ? <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
