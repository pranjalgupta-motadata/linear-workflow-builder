<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow · Workflow Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
<script src="builds.js"></script>
<style>
  :root, [data-theme="dark"]{
    color-scheme: dark; /* native controls (number spinners, date pickers, selects) render dark */
    --bg:#0a0a0c; --panel:#0f0f12; --panel2:#131317; --topbar:#0c0c0f; --border:#1f1f25;
    --border2:#2a2a32; --text:#e6e6ea; --muted:#86868f; --faint:#5a5a63; --ink-mid:#b0b0b8;
    --pop-bg:#16161b; --pop-hover:#20202a;
    --accent:#5b6cff; --accent2:#7c89ff; --green:#3fb950; --amber:#d6a531; --red:#f85149;
    --c-when:#7aa2ff; --c-when-bg:#16213d; --c-when-h:#10192b;
    --c-if:#e3b341;   --c-if-bg:#2a2410;   --c-if-h:#1d1a11;
    --c-then:#5fd07e; --c-then-bg:#13241b; --c-then-h:#101e16;
    --grain:#ffffff12;
    --canvas-glow:color-mix(in srgb, var(--accent) 7%, transparent);
    --rdy-bg:#16241c; --rdy-fg:#3fb950; --rdy-bd:#2c5237;
    --drf-bg:#2a2418; --drf-fg:#d29922; --drf-bd:#4a3f1f;
    --shadow-pop:0 12px 34px -14px rgba(0,0,0,.7), 0 3px 10px -4px rgba(0,0,0,.45);
    --shadow-sm:0 6px 18px -10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.35);
    --shell-bg:#17171d; --inset-bd:#26262e; --inset-shadow:0 6px 24px -12px rgba(0,0,0,.6); --side-bd:#2a2a32; --avatar-bg:#1c3a5e; --avatar-fg:#93c5fd;
    --rail-bg:var(--shell-bg); --rail-icon:#6b6b75; --rail-icon-active:#e6e6ea; --rail-active:color-mix(in srgb, var(--accent) 22%, transparent);
    --side-bg:var(--shell-bg); --side-item:#9a9aa3; --side-item-active-bg:color-mix(in srgb, var(--accent) 16%, transparent); --side-item-active-fg:#e6e6ea;
  }
  [data-theme="light"]{
    color-scheme: light;
    --bg:#ffffff; --panel:#ffffff; --panel2:#f1f5f9; --topbar:#ffffff; --border:#e8ecf1;
    --border2:#d6dde6; --text:#0f172a; --muted:#64748b; --faint:#94a3b8; --ink-mid:#475569;
    --pop-bg:#ffffff; --pop-hover:#f1f5f9;
    --accent:#4f5dff; --accent2:#5562e6; --green:#1a7f37; --amber:#9a6700; --red:#cf222e;
    --c-when:#2563eb; --c-when-bg:#e8f0ff; --c-when-h:#f4f8ff;
    --c-if:#c2820a;   --c-if-bg:#fbf1d6;   --c-if-h:#fcf8ee;
    --c-then:#15a04a; --c-then-bg:#e7f6ed; --c-then-h:#f3faf6;
    --grain:#0000000d;
    --canvas-glow:color-mix(in srgb, var(--accent) 4%, transparent);
    --rdy-bg:#e6f5ec; --rdy-fg:#1a7f37; --rdy-bd:#a7d8ba;
    --drf-bg:#fdf3d8; --drf-fg:#9a6700; --drf-bd:#ecd9a3;
    --shadow-pop:0 14px 36px -10px rgba(15,23,42,.16), 0 4px 12px -4px rgba(15,23,42,.08), 0 0 0 1px rgba(15,23,42,.04);
    --shadow-sm:0 4px 14px -6px rgba(15,23,42,.12), 0 1px 3px rgba(15,23,42,.06);
    --shell-bg:#f8fafc; --inset-bd:#e3e6ec; --inset-shadow:0 6px 24px -14px rgba(15,23,42,.12); --side-bd:#eceef2; --avatar-bg:#dbeafe; --avatar-fg:#1e40af;
    --rail-bg:var(--shell-bg); --rail-icon:#8a8a93; --rail-icon-active:#16161a; --rail-active:color-mix(in srgb, var(--accent) 16%, transparent);
    --side-bg:var(--shell-bg); --side-item:#6a6a73; --side-item-active-bg:color-mix(in srgb, var(--accent) 12%, transparent); --side-item-active-fg:#16161a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01";
    transition:background .2s ease,color .2s ease;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#26262e;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#33333d}
  .pop-enter{animation:pop .12s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .drawer-in{animation:drawerin .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes drawerin{from{transform:translateX(100%)}to{transform:translateX(0)}}
  .grain{background-image:radial-gradient(circle at 1px 1px,var(--grain) 1px,transparent 0);background-size:22px 22px}
  .canvas-layer{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,var(--grain) 1px,transparent 0);background-size:22px 22px}
  .canvas-glow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(ellipse 60% 55% at 50% 48%,var(--canvas-glow),transparent 60%)}
  .solid-ico svg path,.solid-ico svg rect{ fill:currentColor; stroke:none; }
  .slot{ display:inline; text-decoration-line:underline; text-decoration-style:dashed; text-decoration-thickness:1.5px; text-underline-offset:5px; text-decoration-skip-ink:none; }
  .slot:hover, .slot:focus, .slot:focus-visible{ text-decoration-style:solid; outline:none; }
  .striking{ text-decoration-line:line-through; text-decoration-color:var(--text); text-decoration-thickness:1px; text-decoration-style:solid; text-decoration-skip-ink:none; }
  .striking .slot{ text-decoration-line:underline line-through !important; text-decoration-color:var(--text) !important; text-decoration-style:solid !important; text-decoration-skip-ink:none !important; }
  input[type=time],input[type=date]{color-scheme:dark}
  [data-theme="light"] input[type=time],[data-theme="light"] input[type=date]{color-scheme:light}
  /* intro guide step cards — hover lifts + glows in the role color (--rc set per card) */
  .gstep{ transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease; border:1px solid var(--border2); }
  .gstep:hover{ transform:translateY(-5px); border-color:var(--rc); box-shadow:0 14px 32px -12px var(--rc); }
  .gstep:hover .gtile{ transform:scale(1.08) rotate(-3deg); }
  .gtile{ transition:transform .2s cubic-bezier(.2,.7,.3,1); }
  .gstep .geg{ opacity:0; transition:opacity .2s ease; }
  .gstep:hover .geg{ opacity:1; }
  @keyframes guidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .guidein{ animation:guidein .35s cubic-bezier(.2,.7,.3,1) both; }
  /* the empty start slot gently beckons — invites the first click without shouting */
  @keyframes beckon{0%,100%{color:var(--faint);text-decoration-color:var(--border2)}50%{color:var(--accent2);text-decoration-color:var(--accent2)}}
  .slot-beckon{ animation:beckon 2.4s ease-in-out infinite; }
  /* glassmorphism frosted card — used for the stepper builder mockups */
  .glass{ background:color-mix(in srgb, var(--pop-bg) 75%, transparent); backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3); border:1px solid var(--border);
    box-shadow:var(--shadow-pop); }
  /* step crossfade */
  @keyframes stepin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stepin{ animation:stepin .28s cubic-bezier(.2,.7,.3,1) both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useLayoutEffect } = React;

/* ---------------------------------------------------------------------------
   ITSM / ITIL vocabulary
--------------------------------------------------------------------------- */
// ── Module registry (WORKFLOW-SPEC §2) ──────────────────────────────────────
// Record modules support Create/Update/Archive/Get/Get Many; functional areas provide actions only.
const RECORD_MODULES = [
  { id:"request",        label:"Request",        recordTypes:["Incident","Service Request"] },
  { id:"problem",        label:"Problem" },
  { id:"change",         label:"Change" },
  { id:"release",        label:"Release" },
  { id:"hardware_asset", label:"Hardware Asset" },
  { id:"software_asset", label:"Software Asset" },
  { id:"nonit_asset",    label:"Non-IT Asset" },
  { id:"cmdb",           label:"CMDB (CI)" },
  { id:"asset_movement", label:"Asset Movement" },
  { id:"user",           label:"User" },
  { id:"task",           label:"Task" },
  { id:"announcement",   label:"Announcement" },
  { id:"deployment",     label:"Deployment" },
];
const FUNCTIONAL_AREAS = [
  { id:"approval",     label:"Approval" },
  { id:"notification", label:"Notification" },
  { id:"http",         label:"Http Request" },
  { id:"plugin",       label:"Plugin" },
];
const moduleDef  = (id) => RECORD_MODULES.find(m=>m.id===id) || FUNCTIONAL_AREAS.find(m=>m.id===id);
const moduleByLabel = (label) => RECORD_MODULES.find(m=>m.label===label);
// trigger {module} slot: a record event can target any record module OR a specific record type (Incident / Service Request)
const MODULE_NAMES = RECORD_MODULES.flatMap(m => m.recordTypes ? m.recordTypes : [m.label]);
const MODULES   = MODULE_NAMES; // back-compat alias used by trigger slots
// map a chosen trigger module-name (e.g. "Incident", "Problem") back to its record-module id
const moduleIdFromName = (name) => {
  if (!name) return null;
  const rt = RECORD_MODULES.find(m => m.recordTypes && m.recordTypes.includes(name));
  if (rt) return rt.id;
  const m = RECORD_MODULES.find(m => m.label===name);
  return m ? m.id : null;
};
// Fields of a record that can change (trigger "a record's {field} is updated").
// `input` is the field's UI type; only "dropdown" offers the from→to value chain in the trigger.
const TFIELDS = [
  { id:"status", label:"status", input:"dropdown", values:["New","Assigned","In Progress","On Hold","Pending","Resolved","Closed","Cancelled"] },
  { id:"priority", label:"priority", input:"dropdown", values:["Urgent","High","Medium","Low"] },
  { id:"category", label:"category", input:"dropdown", values:["Hardware","Software","Network","Access","Email","Database","Security","Other"] },
  { id:"impact", label:"impact", input:"dropdown", values:["High","Medium","Low"] },
  { id:"urgency", label:"urgency", input:"dropdown", values:["High","Medium","Low"] },
  { id:"assignment group", label:"assignment group", input:"dropdown", values:["Service Desk","Tier-2","Tier-3","Network Ops","Apps Team","Field Support"] },
  { id:"assignee", label:"assignee", input:"dropdown", values:["Unassigned","Current user","On-call agent"] },
  { id:"change type", label:"change type", input:"radio", values:["Standard","Normal","Emergency"] },
  { id:"subject", label:"subject", input:"text" },
  { id:"description", label:"description", input:"textarea" },
  { id:"VIP", label:"VIP", input:"checkbox" },
];
const CADENCE   = ["hourly","daily","weekly","monthly","on a specific date"];
const WEEKDAYS  = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DOM       = Array.from({length:28},(_,i)=>String(i+1)).concat(["last day"]);

const PLACEHOLDER = { module:"record", field:"field", value:"a value", change:"updated", from:"any", to:"a value", cadence:"how often",
  weekday:"a weekday", dom:"a day", time:"a time", date:"a date" };

const TRIGGER_TYPES = [
  { id:"created",       tpl:"a {module} is created",           slots:{ module:MODULES } },
  { id:"deleted",       tpl:"a {module} is deleted",           slots:{ module:MODULES } },
  { id:"field_updated", tpl:"a {module}'s {field} is updated", slots:{ module:MODULES, field:TFIELDS } },
  { id:"date_reached",  tpl:"{date} is reached",               slots:{ date:"__date" } },
  { id:"periodically",  tpl:"{cadence}",                       slots:{ cadence:CADENCE } },
];

const sv = (d) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none">{d}</svg>;
const COND_CHEV = <svg width="9" height="9" viewBox="0 0 24 24" fill="none" style={{opacity:.6}}><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const I = {
  plus:  sv(<><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" strokeWidth="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  // semantic node icons for the "what happens next" menu
  bolt:    sv(<path d="M13 2L5 13h5l-1 9 9-12h-5l1-8z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/>),
  play:    sv(<path d="M8 5l11 7-11 7V5z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/>),
  diamond: sv(<path d="M12 3l9 9-9 9-9-9 9-9z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/>),
  merge:   sv(<path d="M6 3v3a6 6 0 006 6 6 6 0 006-6V3M12 12v9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>),
  loop:    sv(<path d="M21 12a9 9 0 11-2.5-6.2M21 3v4h-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>),
  hourglass: sv(<path d="M7 3h10M7 21h10M8 3v3l4 4 4-4V3M8 21v-3l4-4 4 4v3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>),
  records: sv(<path d="M4 8l8-4 8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>),
  trash: sv(<><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  field: sv(<><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M9 4v16M15 4v16" stroke="currentColor" strokeWidth="1.8"/></>),
  cal:   sv(<><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M3 9h18M8 3v3M16 3v3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  repeat:sv(<><path d="M17 2l3 3-3 3M3 11V9a4 4 0 014-4h13M7 22l-3-3 3-3M21 13v2a4 4 0 01-4 4H4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  ai:    sv(<><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></>),
  group: sv(<><circle cx="9" cy="8" r="3" stroke="currentColor" strokeWidth="1.8"/><path d="M3 20a6 6 0 0112 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><path d="M16 7a3 3 0 010 6M21 20a6 6 0 00-5-5.9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  user:  sv(<><circle cx="12" cy="8" r="3.2" stroke="currentColor" strokeWidth="1.8"/><path d="M5 20a7 7 0 0114 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  flag:  sv(<><path d="M5 21V4h12l-2 4 2 4H5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  status:sv(<><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><path d="M18 6l1.4 1.4L22 5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  clock: sv(<><circle cx="12" cy="12" r="8.5" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  bell:  sv(<><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  mail:  sv(<><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M4 7l8 6 8-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  up:    sv(<><path d="M12 20V5M6 11l6-6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  task:  sv(<><path d="M4 7h9M4 12h9M4 17h6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><path d="M15.5 16l1.8 1.8L21 14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  link:  sv(<><path d="M10 6l1-1a4 4 0 016 6l-1 1M14 18l-1 1a4 4 0 01-6-6l1-1M9 15l6-6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
  tag:   sv(<><path d="M3 3h8l10 10-8 8L3 11V3z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><circle cx="7.5" cy="7.5" r="1.4" fill="currentColor"/></>),
  // suite (sidebar) icons
  grid:  sv(<><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8"/></>),
  ticket:sv(<><path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 6v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-6V7z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><path d="M13 5v14" stroke="currentColor" strokeWidth="1.5" strokeDasharray="2 2"/></>),
  box:   sv(<><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/></>),
  kanban:sv(<><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" strokeWidth="1.7"/><path d="M9 4v9M15 4v13" stroke="currentColor" strokeWidth="1.7"/></>),
  inbox: sv(<><path d="M3 13l3-8h12l3 8v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/><path d="M3 13h5l1 2h6l1-2h5" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/></>),
  gear:  sv(<><circle cx="12" cy="12" r="3.2" stroke="currentColor" strokeWidth="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></>),
  dl:    sv(<><path d="M12 4v10M8 11l4 4 4-4M5 20h14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></>),
};

// ── App shell: Suites (sidebar-1) → modules (sidebar-2) → main pane ──────────
const SUITES = [
  { id:"dashboard",  label:"Dashboard",    icon:I.grid,   modules:[{id:"dashboard", label:"Overview"}] },
  { id:"servicedesk",label:"Service Desk", icon:I.ticket, modules:[{id:"requests",label:"Requests"},{id:"problems",label:"Problems"},{id:"changes",label:"Changes"},{id:"releases",label:"Releases"},{id:"knowledge",label:"Knowledge"}] },
  { id:"assets",     label:"Assets & IT",  icon:I.box,    modules:[{id:"assets",label:"Assets"},{id:"cmdb",label:"CMDB"},{id:"patches",label:"Patches"},{id:"packages",label:"Packages"}] },
  { id:"projects",   label:"Projects",     icon:I.kanban, modules:[{id:"projects",label:"Projects"},{id:"reports",label:"Reports"},{id:"myteam",label:"My Team"}] },
  { id:"mywork",     label:"My Work",      icon:I.inbox,  modules:[{id:"approvals",label:"Approvals"},{id:"tasks",label:"Tasks"}] },
  { id:"automation", label:"Automation",   icon:I.gear,   modules:[{id:"flow_dashboard",label:"Flow Dashboard"},{id:"workflows",label:"Workflows"},{id:"usecase_1",label:"Use Case 1",sep:true},{id:"usecase_2",label:"Use Case 2"},{id:"usecase_3",label:"Use Case 3"}] },
];
const RAIL_BOTTOM = [
  { id:"settings",      label:"Settings",      icon:I.gear },
  { id:"notifications", label:"Notifications", icon:I.bell },
  { id:"download",      label:"Download",      icon:I.dl },
];

// ── Prebuilt "Use Case" workflows (loaded into the builder by the usecase modules) ──
// All faithful to the data model: trigger {id,typeId,vals:{module}}; flow nodes use real
// FIELDS ids (category/subject/requester_dept), real assign targets (ASSIGN_TARGETS) and
// the update node's field rows (REQUEST_FIELDS ids category/subcategory).
const USECASE_IDS = ["usecase_1","usecase_2","usecase_3"];
const USECASE_DOCS = {
  usecase_1: {
    triggers: [{ id:"t1", typeId:"created", vals:{ module:"Incident" } }],
    flow: [
      { id:"n1", kind:"branch",
        paths: [
          { id:"p1", combiner:"and", clauses:[{ field:"category", op:"is", value:"Network" }],
            children:[{ id:"a1", kind:"action", action:"assign", arg:"Network Ops" }] },
          { id:"p2", combiner:"and", clauses:[{ field:"category", op:"is", value:"Hardware" }],
            children:[{ id:"a2", kind:"action", action:"assign", arg:"Hardware Team" }] },
          { id:"p3", combiner:"and", clauses:[{ field:"category", op:"is", value:"Software" }],
            children:[{ id:"a3", kind:"action", action:"assign", arg:"Apps Team" }] },
        ],
        otherwise: null },
    ],
  },
  usecase_2: {
    triggers: [{ id:"t1", typeId:"created", vals:{ module:"Incident" } }],
    flow: [
      { id:"n1", kind:"condition", combiner:"and", clauses:[
        { field:"subject", op:"contains", value:"password" },
        { field:"subject", op:"contains", value:"login", or:true },
        { field:"subject", op:"contains", value:"access", or:true },
        { field:"subject", op:"contains", value:"locked out", or:true },
      ] },

// Returns the sentence template + an ORDERED list of slots ({key, options}) given current vals.
// options is an array, or "__date" / "__time" for native inputs.
function triggerView(trigger) {
  const v = trigger.vals, id = trigger.typeId;
  if (id==="created")  return { tpl:"a {module} is created",  slots:[{key:"module",options:MODULES}] };
  if (id==="archived") return { tpl:"a {module} is archived", slots:[{key:"module",options:MODULES}] };
  if (id==="changed") {
    const fld = TFIELDS.find(f=>f.id===v.field);
    if (fld && fld.input==="dropdown") {            // dropdown → offer the from→to value chain
      const vals = fld.values || [];
      return { tpl:"a {module}'s {field} is updated from {from} to {to}",
        slots:[{key:"module",options:MODULES},{key:"field",options:TFIELDS},
               {key:"from",options:["any",...vals]},{key:"to",options:vals.filter(x=>x!==v.from)}] };
    }
    return { tpl:"a {module}'s {field} is updated",      // text / textarea / checkbox / radio → just "is updated"
      slots:[{key:"module",options:MODULES},{key:"field",options:TFIELDS}] };
  }
  if (id==="date_reached") return { tpl:"{date} is reached", slots:[{key:"date",options:"__date"}] };
  // periodically — chain depends on the cadence
  const c = v.cadence, base = [{key:"cadence",options:CADENCE}];
  if (c==="daily")    return { tpl:"{cadence} at {time}", slots:[...base,{key:"time",options:"__time"}] };
  if (c==="weekly")   return { tpl:"{cadence} on {weekday} at {time}", slots:[...base,{key:"weekday",options:WEEKDAYS},{key:"time",options:"__time"}] };
  if (c==="monthly")  return { tpl:"{cadence} on day {dom} at {time}", slots:[...base,{key:"dom",options:DOM},{key:"time",options:"__time"}] };
  if (c==="on a specific date") return { tpl:"{cadence} — {date} at {time}", slots:[...base,{key:"date",options:"__date"},{key:"time",options:"__time"}] };
  return { tpl:"{cadence}", slots:base };
}

// resolve the CONDITION field catalog for a module (by name); default = the shared request set
function conditionFieldsFor(mod){
  const m = (mod||"").toLowerCase();
  if (m.includes("problem")) return PROBLEM_COND;
  if (m.includes("change")) return CHANGE_COND;
  if (m.includes("release")) return RELEASE_COND;
  if (m.includes("cmdb")) return CMDB_COND;
  if (m.includes("asset")) return ASSET_COND; // hardware / software / non-it
  if (m.includes("movement")) return ASSET_MOVEMENT_COND;
  if (m.includes("user")) return USER_COND;
  if (m.includes("task")) return TASK_COND;
  if (m.includes("announce")) return ANNOUNCEMENT_COND;
  if (m.includes("deployment")) return DEPLOYMENT_COND;
  return REQUEST_COND; // Incident, Service Request, default
}

// Build the action catalog (flat defs + categorized menu) for a given record-module id.
function actionCatalogFor(mid) {
  const m = moduleDef(mid);
  const label = m ? m.label : "record";
  const recs  = RECIPIENTS[mid] || RECIPIENTS_BASE;
  const chans = channelsFor(mid);
  // "create a new {record}" — any record type is creatable, not just the trigger's module.
  // menuLabel = how it reads in the action picker; label = the in-sentence verb (slot fills the type).
  const recordOps = [{ id:"create", label:"create a new", menuLabel:"Create record", arg:MODULE_NAMES, argPlaceholder:"record", icon:I.plus, details:true }];
  const defs = [
    // Record operations (§4.1)
    ...recordOps,
    { id:"update",   label:"update the record", icon:I.field, details:true },
    { id:"close",    label:"close the record", icon:I.flag },
    { id:"archive",  label:"archive the record", icon:I.trash },
    { id:"get",      label:"get a record from", arg:RECORD_MODULES.map(x=>x.label), icon:I.field },
    { id:"get_many", label:"get many records from", arg:RECORD_MODULES.map(x=>x.label), icon:I.field },
    // Assignment — the most common, user-facing action ("assign it to {user/group}")
    { id:"assign", label:"assign it to", arg:ASSIGN_TARGETS, argPlaceholder:"user/group", icon:I.user },
    { id:"set_auto_assignment", label:"set auto assignment using", arg:["Round Robin","Smart Balance"], argPlaceholder:"method", icon:I.user },
    // Cross-module (§4.2)
    { id:"execute_integration", label:"execute integration", arg:["Slack","Microsoft Teams","Jira","Azure AD","Okta","Zapier"], argPlaceholder:"app", icon:I.link },
    { id:"add_relation", label:"add a relation", icon:I.link },
    { id:"add_task",     label:"add a task", icon:I.task },
    // Communication (§4.3) — one action per channel, recipient is a module-gated arg
    ...chans.map(ch => ({ id:`send_${ch.toLowerCase().replace(/\s+/g,"_")}`, label:`send ${ch} to`, arg:recs, icon:ch==="Email"?I.mail:I.bell })),
    { id:"send_approval_reminder", label:"send an approval-reminder email to", arg:recs, icon:I.mail },
    // Module-specific (§4.4)
    ...(MODULE_ACTIONS[mid] || []).map(a=>({ ...a, icon:a.icon||I.flag })),
    // Functional areas (available to any workflow)
    { id:"run_approval", label:"run approval workflow", icon:I.status },
    { id:"ask_approval", label:"ask for Approval", icon:I.status },
    { id:"http_request", label:"make an HTTP request / webhook", icon:I.up },
    { id:"run_plugin",   label:"run a Plugin", icon:I.repeat },
  ];
  const byId = Object.fromEntries(defs.map(d=>[d.id, d]));
  const has = (...ids) => ids.filter(id=>byId[id]).map(id=>({ id, label:byId[id].menuLabel || byId[id].label, icon:byId[id].icon }));
  const menu = [
    { header:"Assignment" }, ...has("assign","set_auto_assignment"),
    { header:"Record operations" }, ...has("create","update","archive","get","get_many"),
    { header:"Cross-module" }, ...has("execute_integration","add_relation","add_task"),
    { header:"Communication" }, ...has(...chans.map(ch=>`send_${ch.toLowerCase().replace(/\s+/g,"_")}`), "send_approval_reminder"),
    ...((MODULE_ACTIONS[mid]||[]).length ? [{ header:`${label}-specific` }, ...has(...(MODULE_ACTIONS[mid]||[]).map(a=>a.id))] : []),
    { header:"Approval, HTTP & plugins" }, ...has("run_approval","ask_approval","http_request","run_plugin"),
  ];
  return { defs, byId, menu };
}

    ],
  },
  {

    meaning:"The fork a Condition escalates into — two or more paths, each with its own check and its own steps, plus an optional Otherwise.",
    function:"Divides the flow so different outcomes get different handling. Each path holds an independent condition plus the actions that follow it; the engine takes whichever path matches. An optional Otherwise path catches everything else.",
    use:"When the workflow should do meaningfully different things depending on the case — e.g. Urgent vs. routine, or per category.",
    avoid:"When a single inline Condition is enough. Don't branch just to gate one path — that adds visual noise.",
  },
  {

    meaning:"The actual work the workflow performs, automatically.",
    function:"Does one thing: assign a ticket, send a notification, update a field, create a record, call a webhook, run an approval, and so on. Add as many as you want in sequence; they run top to bottom, and different actions live inside different branch paths.",
    use:"In every workflow — actions are the point. Chain several to build up a complete response.",
    avoid:"Avoid piling unrelated actions into one rule; if logic differs, gate them with a Condition or split with a Branch.",
  },
  {
    id:"merge", name:"Merge", icon:I.merge, color:"var(--accent2)", bg:"var(--panel2)",
    meaning:"Rejoins separate branches back into one shared path.",
    function:"After a Branch has split the flow, a Merge brings the paths together so the steps that follow run once for every outcome — no need to duplicate them inside each branch.",
    use:"When several branches should converge on the same closing steps (e.g. always log and notify after the case-specific handling).",
    avoid:"When the paths never need to reunite, or when there was no branch to begin with.",
  },
  {
    id:"loop", name:"Loop", icon:I.loop, color:"var(--accent2)", bg:"var(--panel2)",
    meaning:"Repeats the steps inside it once for every item in a list.",
    function:"Takes a collection — typically the output of a Get-many — and runs its inner steps for each record in turn, so one rule can act on many items.",
    use:"When you fetched multiple records and need to do the same thing to each (e.g. close all related requests).",
    avoid:"When you're only ever acting on a single record — a plain Action is simpler and clearer.",

  {

    meaning:"Pauses the workflow for a set amount of time before continuing.",
    function:"Holds execution for a duration (minutes, hours, days) so later steps run after a wait — useful for follow-ups, reminders and grace periods.",
    use:"When something should happen later, not immediately — e.g. send a reminder if still unresolved after 4 hours.",

    function:"Queries a module and returns either a single record or a set. Get-many output is typically fed into a Loop; a single Get pulls in related data to reference downstream.",
    use:"When the workflow needs records other than the one that triggered it — related tickets, assets, users.",

              <GP.Badge label="Then" {...then_}>page on-call</GP.Badge>

            <GP.Chip icon={I.records}>related ticket #1</GP.Chip>
            <GP.Chip icon={I.records}>related ticket #2</GP.Chip>

          <GP.Badge label="Then" {...then_}>ticket opened</GP.Badge>

// Saved experiment builds — single shared source of truth in builds.js (window.BUILDS),
// so EVERY version file shows the full list and new snapshots appear everywhere automatically.
const BUILDS = (typeof window!=="undefined" && window.BUILDS) || [{ label:"Working", file:"index.html" }];

// Live-vs-local tell: true only when served from GitHub Pages (…github.io). Used to flip the
// top-left logo (orange "G" live / purple "F" local) so the deployed site is visually distinct.
const IS_LIVE = (typeof location!=="undefined") && /\.github\.io$/i.test(location.hostname || "");

/* tree helpers (path = array of segments).
   A segment is a NUMBER (index into a node's .children array) for action/condition siblings,
   OR a branch-descent object: {path:k} → branch.paths[k].children, {otherwise:true} → branch.otherwise.children.
   A branch-descent object always FOLLOWS the number that selected the branch node itself. */
const isBranchSeg = (s) => s && typeof s === "object";
// stable string key for a path (segments may be numbers or branch-descent objects)
const pathKey = (path) => (path||[]).map(s => isBranchSeg(s) ? (s.otherwise ? "ow" : "p"+s.path) : String(s)).join(".");
// read the child-array a node exposes for a given (branch-descent) segment
const segChildren = (node, seg) => {
  if (!isBranchSeg(seg)) return node.children || [];
  if (seg.otherwise) return (node.otherwise && node.otherwise.children) || [];
  return (node.paths && node.paths[seg.path] && node.paths[seg.path].children) || [];
};
// return a clone of `node` with its (branch-descent) child-array replaced by `arr`
const withSegChildren = (node, seg, arr) => {
  if (!isBranchSeg(seg)) return { ...node, children: arr };
  if (seg.otherwise) return { ...node, otherwise: { ...node.otherwise, children: arr } };
  const paths = node.paths.map((p,k)=> k===seg.path ? { ...p, children: arr } : p);
  return { ...node, paths };
};
// descend one level: returns [childArray, rebuild(newChildArray)->newNodes]
const treeInsert = (nodes, path, node) => treeInsertAt(nodes, path, undefined, node);
const treeInsertAt = (nodes, path, index, node) => {
  if (path.length === 0) { const c=[...nodes]; c.splice(index===undefined?c.length:index, 0, node); return c; }
  const [i, ...rest] = path;
  if (isBranchSeg(i)) { // descend into a branch path/otherwise of nodes[?] — but branch seg always follows a number
    return nodes; // unreachable: branch seg never leads a level array
  }
  return nodes.map((n, idx) => {
    if (idx!==i) return n;
    if (rest.length && isBranchSeg(rest[0])) {
      const seg = rest[0], deeper = rest.slice(1);
      return withSegChildren(n, seg, treeInsertAt(segChildren(n,seg), deeper, index, node));
    }
    return { ...n, children: treeInsertAt(n.children||[], rest, index, node) };
  });
};
const treeRemove = (nodes, path) => {
  const [i, ...rest] = path;
  if (rest.length === 0) return nodes.filter((_, idx) => idx!==i);
  return nodes.map((n, idx) => {
    if (idx!==i) return n;
    if (isBranchSeg(rest[0])) {
      const seg = rest[0], deeper = rest.slice(1);
      return withSegChildren(n, seg, treeRemove(segChildren(n,seg), deeper));
    }
    return { ...n, children: treeRemove(n.children||[], rest) };
  });
};
const treeUpdate = (nodes, path, patch) => {
  const [i, ...rest] = path;
  return nodes.map((n, idx) => {
    if (idx!==i) return n;
    if (rest.length===0) return {...n, ...patch};
    if (isBranchSeg(rest[0])) {
      const seg = rest[0], deeper = rest.slice(1);
      return withSegChildren(n, seg, treeUpdate(segChildren(n,seg), deeper, patch));
    }
    return {...n, children: treeUpdate(n.children||[], rest, patch)};
  });
};
const hasAction = (nodes) => (nodes||[]).some(n=>n.kind==="action");
// recursive — actions live in branch paths / otherwise too (branches have no .children, they have .paths/.otherwise)
const branchKids = (n) => n.kind==="branch" ? [...(n.paths||[]).flatMap(p=>p.children||[]), ...((n.otherwise&&n.otherwise.children)||[])] : (n.children||[]);
const anyAction = (nodes) => (nodes||[]).some(n => n.kind==="action" || anyAction(branchKids(n)));
const childrenAt = (nodes, path) => {
  if (!path.length) return nodes;
  const [i, ...rest] = path; const n = nodes[i]; if (!n) return [];
  if (rest.length && isBranchSeg(rest[0])) return childrenAt(segChildren(n, rest[0]), rest.slice(1));
  return childrenAt(n.children||[], rest);
};
// replace the sibling array living at `path` (path=[] → the whole array)
const treeSetLevel = (nodes, path, arr) => {
  if (path.length === 0) return arr;
  const [i, ...rest] = path;
  return nodes.map((n, idx)=> {
    if (idx!==i) return n;
    if (rest.length && isBranchSeg(rest[0])) return withSegChildren(n, rest[0], treeSetLevel(segChildren(n,rest[0]), rest.slice(1), arr));
    return {...n, children: treeSetLevel(n.children||[], rest, arr)};
  });
};
const treeFindPath = (nodes, id, base=[]) => {
  for (let i=0;i<nodes.length;i++) {
    const p=[...base,i];
    if (nodes[i].id===id) return p;
    if (nodes[i].kind==="branch") {
      (nodes[i].paths||[]).forEach(()=>{}); // searched below
      for (let k=0;k<(nodes[i].paths||[]).length;k++){ const r=treeFindPath(nodes[i].paths[k].children||[], id, [...p,{path:k}]); if(r) return r; }
      if (nodes[i].otherwise){ const r=treeFindPath(nodes[i].otherwise.children||[], id, [...p,{otherwise:true}]); if(r) return r; }
    } else if (nodes[i].children) { const r=treeFindPath(nodes[i].children,id,p); if(r) return r; }
  }
  return null;
};

/* MultiSelect — a multiple-selection dropdown (checklist). Expands INLINE (pushes content) so it is
   never clipped by the scrollable rail form. Value is stored as an array (or null when empty). */
function MultiSelect({ options, value, onChange, placeholder }) {
  const [open, setOpen] = React.useState(false);
  const sel = Array.isArray(value) ? value : [];
  const toggle = (v) => { const next = sel.includes(v) ? sel.filter(x=>x!==v) : [...sel, v]; onChange(next.length ? next : null); };
  return (
    <div className="flex flex-col gap-1">
      <button onClick={()=>setOpen(o=>!o)} className="w-full rounded-lg px-2.5 py-2 text-[13px] flex items-center gap-1.5 flex-wrap text-left"
        style={{ background:"var(--panel2)", border:"1px solid var(--border2)", color:"var(--text)" }}>
        {sel.length ? sel.map(v=><span key={v} className="text-[11.5px] px-1.5 py-0.5 rounded-md" style={{background:"var(--panel)", border:"1px solid var(--border2)", color:"var(--text)"}}>{v}</span>)
                    : <span style={{color:"var(--faint)"}}>{placeholder||"choose one or more…"}</span>}
        <svg className={"ml-auto shrink-0 transition-transform "+(open?"rotate-180":"")} width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>
      {open && (
        <div className="rounded-lg overflow-hidden" style={{ background:"var(--pop-bg)", border:"1px solid var(--border2)" }}>
          {options.map(v=>{ const on = sel.includes(v);
            return (
              <button key={v} onClick={()=>toggle(v)} className="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-[13px] text-left transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--text)"}}>
                <span className="w-4 h-4 rounded flex items-center justify-center shrink-0" style={{ border:"1.5px solid "+(on?"var(--accent)":"var(--border2)"), background:on?"var(--accent)":"transparent" }}>
                  {on && <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </span>
                {v}
              </button>
            ); })}
        </div>
      )}
    </div>
  );
}

/* TokenInput — free-form "type and add" multiple input (Cc emails, Tags). Value stored as an array. */
function TokenInput({ value, onChange, placeholder }) {
  const [draft, setDraft] = React.useState("");
  const toks = Array.isArray(value) ? value : [];
  const add = () => { const v = draft.trim(); if (!v || toks.includes(v)) { setDraft(""); return; } onChange([...toks, v]); setDraft(""); };
  const rm = (t) => { const next = toks.filter(x=>x!==t); onChange(next.length?next:null); };
  return (
    <div className="rounded-lg px-2 py-1.5 flex flex-wrap items-center gap-1.5" style={{ background:"var(--panel2)", border:"1px solid var(--border2)" }}>
      {toks.map(t=>(
        <span key={t} className="inline-flex items-center gap-1 text-[12px] px-2 py-0.5 rounded-md" style={{background:"var(--panel)", border:"1px solid var(--border2)", color:"var(--text)"}}>
          {t}<button onClick={()=>rm(t)} className="hover:text-[var(--red)]" style={{color:"var(--faint)"}}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg></button>
        </span>
      ))}
      <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder={toks.length ? "" : (placeholder||"type and press Enter…")}
        onKeyDown={e=>{ if(e.key==="Enter"||e.key===","){ e.preventDefault(); add(); } else if(e.key==="Backspace" && !draft && toks.length){ rm(toks[toks.length-1]); } }}
        onBlur={add} className="flex-1 min-w-[90px] bg-transparent outline-none text-[13px] py-0.5" style={{color:"var(--text)"}}/>
    </div>
  );
}

/* KeyValRows — repeatable key/value pairs (HTTP headers, query params). Value = array of {k,v}. */
function KeyValRows({ value, onChange, keyPh, valPh }) {
  const rows = Array.isArray(value) ? value : [];
  const set = (i,patch)=> onChange(rows.map((r,idx)=>idx===i?{...r,...patch}:r));
  const add = ()=> onChange([...rows,{k:"",v:""}]);
  const rm = (i)=>{ const n=rows.filter((_,idx)=>idx!==i); onChange(n.length?n:null); };
  const inCls = "min-w-0 flex-1 rounded-lg px-2.5 py-2 text-[13px] outline-none";
  const inSty = { background:"var(--panel2)", border:"1px solid var(--border2)", color:"var(--text)" };
  return (
    <div className="flex flex-col gap-1.5">
      {rows.map((r,i)=>(
        <div key={i} className="flex items-center gap-1.5">
          <input value={r.k} onChange={e=>set(i,{k:e.target.value})} placeholder={keyPh||"key"} className={inCls} style={inSty}/>
          <input value={r.v} onChange={e=>set(i,{v:e.target.value})} placeholder={valPh||"value"} className={inCls} style={inSty}/>
          <button onClick={()=>rm(i)} title="Remove" className="shrink-0 w-7 h-7 rounded-md flex items-center justify-center hover:bg-[var(--pop-hover)] hover:text-[var(--red)]" style={{color:"var(--faint)"}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
        </div>
      ))}
      <button onClick={add} className="self-start flex items-center gap-1.5 text-[12.5px] font-medium transition-colors" style={{color:"var(--muted)"}}
        onMouseEnter={e=>e.currentTarget.style.color="var(--text)"} onMouseLeave={e=>e.currentTarget.style.color="var(--muted)"}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
        Add {keyPh||"row"}
      </button>
    </div>
  );
}

/* AttachedCondition — a DNF condition (AND within a group, OR between groups) attached INSIDE an action form.
   Always expanded (the form's bottom button saves; no per-field Done). Each OR-group is a light card with a
   YELLOW left rail; rows read "Where field is value" with the field/value as pills. The and↔or connectors are
   toggles (chevron hint). Value = array of {field, op, value, or?}; `open(...)` is App's popover opener. */
function AttachedCondition({ value, onChange, open, fields }) {
  const FS = fields || FIELDS;                       // per-module condition field catalog
  const FD = (id) => FS.find(x=>x.id===id);
  const clauses = Array.isArray(value) ? value : [];
  const update = (ci, patch) => onChange(clauses.map((c,i)=> i===ci ? {...c,...patch} : c));
  const remove = (ci) => { const next = clauses.filter((_,i)=>i!==ci); onChange(next.length?next:null); };
  const toggleJoiner = (ci) => update(ci, { or: !clauses[ci].or });
  const pickField = (ci, el) => open(el, FS.map(f=>({id:f.id,label:f.label})), (it)=>{ const t=FD(it.id)?.type||"enum"; update(ci,{field:it.id, op:defaultOp(t), value:null}); }, "Which field", { wide:true, selected:clauses[ci].field });
  const pickOp = (ci, el) => { const t=FD(clauses[ci].field)?.type||"enum"; open(el, (TYPE_OPS[t]||TYPE_OPS.enum).map(o=>({id:o,label:o})), (it)=>update(ci,{op:it.id}), "Comparison", { selected:clauses[ci].op }); };
  const pickValue = (ci, el) => { const f=FD(clauses[ci].field); if(!f) return;
    if (f.type==="enum") open(el, (f.values||[]).map(x=>({id:x,label:x})), (it)=>update(ci,{value:it.id}), f.label, { selected:clauses[ci].value });
    else open(el, [], (it)=>update(ci,{value:it.id}), f.label, { inputType: f.type==="number"?"number":f.type==="date"?"date":"text" }); };
  const Chev = () => <svg width="11" height="11" viewBox="0 0 24 24" fill="none" style={{opacity:.65}}><path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  const Pill = ({ value, placeholder, onClick }) => (
    <button onClick={onClick} className="rounded-md px-2.5 py-1.5 text-[14px] leading-none font-medium transition-colors"
      style={{ background: value ? "var(--panel)" : "transparent", color: value ? "var(--text)" : "var(--faint)", border: "1px solid "+(value ? "var(--border2)" : "var(--border)") }}
      onMouseEnter={e=>e.currentTarget.style.background="var(--pop-hover)"} onMouseLeave={e=>e.currentTarget.style.background=value?"var(--panel)":"transparent"}>{value || placeholder}</button>
  );
  // and↔or toggle, styled so it clearly looks changeable (chevron + hover)
  const Toggle = ({ ci, label }) => (
    <button onClick={()=>toggleJoiner(ci)} title="Click to switch and / or"
      className="shrink-0 inline-flex items-center gap-0.5 text-[13px] font-semibold rounded-md px-1.5 py-0.5 transition-colors hover:bg-[var(--pop-hover)]" style={{color:"var(--c-if)"}}>{label}<Chev/></button>
  );
  const groups = [];
  clauses.forEach((c,ci)=>{ if(ci===0||c.or) groups.push([]); groups[groups.length-1].push(ci); });
  // add an AND clause to the END of a SPECIFIC group (so any card can grow); insert keeps it in that group
  const addToGroup = (gi) => { const g=groups[gi]; const last=g[g.length-1]; const next=[...clauses]; next.splice(last+1, 0, { field:null, op:"is", value:null }); onChange(next); };
  // add a new OR group at the end (first clause needs no `.or`; later groups start with `.or`)
  const addOrGroup = () => onChange([...clauses, { field:null, op:"is", value:null, ...(clauses.length?{or:true}:{}) }]);
  const rowEl = (ci, idx, gi) => { const c=clauses[ci]; const f=FD(c.field);
    return (
      <div key={ci} className="group/cl flex items-center gap-2 py-0.5">
        {ci===0 ? <span className="shrink-0 text-[13px] w-12" style={{color:"var(--muted)"}}>Where</span>
          : idx>0 ? <Toggle ci={ci} label="and" />
          : <span className="shrink-0 w-12"/>}
        <div className="flex items-center gap-2 flex-wrap flex-1 min-w-0">
          <Pill value={f?.label} placeholder="field" onClick={(e)=>pickField(ci,e.currentTarget)} />
          {c.field && <button onClick={(e)=>pickOp(ci,e.currentTarget)} className="text-[14px] px-0.5 rounded hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>{c.op||"is"}</button>}
          {c.field && <Pill value={c.value} placeholder={valuePlaceholder(f?.type)} onClick={(e)=>pickValue(ci,e.currentTarget)} />}
        </div>
        <button onClick={()=>remove(ci)} title="Remove" className="shrink-0 w-6 h-6 rounded-md flex items-center justify-center opacity-0 group-hover/cl:opacity-100 transition-opacity hover:bg-[var(--pop-hover)] hover:text-[var(--red)]" style={{color:"var(--faint)"}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
        </button>
      </div>
    );
  };
  return (
    <div className="flex flex-col gap-2">
      {groups.map((g,gi)=>(
        /* OR-group card — light bg, no border, YELLOW left rail. The OR connector lives INSIDE the card header. */
        <div key={gi} className="rounded-lg" style={{ background:"var(--panel2)", borderLeft:"2px solid var(--c-if)", padding:"7px 10px 8px 12px" }}>
          {gi>0 && (
            <button onClick={()=>toggleJoiner(g[0])} title="Click to switch or / and"
              className="inline-flex items-center gap-0.5 text-[11px] font-bold uppercase tracking-wider rounded px-1.5 py-0.5 mb-1.5 transition-colors hover:brightness-110" style={{color:"var(--c-if)", background:"var(--c-if-bg)"}}>or<Chev/></button>
          )}
          {g.map((ci, idx)=>rowEl(ci, idx, gi))}
          {/* add another AND condition to THIS group */}
          <button onClick={()=>addToGroup(gi)} className="flex items-center gap-1 text-[12px] font-medium mt-1 ml-12 transition-colors" style={{color:"var(--muted)"}}
            onMouseEnter={e=>e.currentTarget.style.color="var(--c-if)"} onMouseLeave={e=>e.currentTarget.style.color="var(--muted)"}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>and
          </button>
        </div>
      ))}
      {/* add a whole new OR group (or the first condition when empty) */}
      <button onClick={addOrGroup} className="self-start flex items-center gap-1.5 text-[13px] font-medium transition-colors pl-1" style={{color:"var(--muted)"}}
        onMouseEnter={e=>e.currentTarget.style.color="var(--text)"} onMouseLeave={e=>e.currentTarget.style.color="var(--text)"}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
        {clauses.length ? "Add OR group" : "Add condition"}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   Popover — list / grouped-menu / native time/date input
--------------------------------------------------------------------------- */
function Popover({ anchor, anchorKey, items, flat, onPick, onClose, title, inputType, noSearch, footer, wide, back, help, solidIcons, selected, onHelp, itemsAsNodes, initActive, choices }) {
  const ref = useRef(null);
  // report Quick-Help to the parent so it renders in the CONTEXT RAIL (not a floating card). Two layers:
  // `base` = the node/menu help (e.g. "Trigger"); `item` = the specific hovered/active option (e.g. "Record
  // created"). Only fire onHelp when a layer actually changes (by reference) — avoids a render loop.
  const helpRptRef = useRef({ base:null, item:null });   // set during render
  const lastRptRef = useRef({ base:undefined, item:undefined });
  useEffect(() => {
    if (!onHelp) return;
    const n = helpRptRef.current, l = lastRptRef.current;
    if (n.base!==l.base || n.item!==l.item || n.itemIcon!==l.itemIcon) { lastRptRef.current = { base:n.base, item:n.item, itemIcon:n.itemIcon }; onHelp({ base:n.base, item:n.item, itemIcon:n.itemIcon }); }
  });
  useEffect(() => () => { if (onHelp) onHelp(null); }, []);               // clear when the popover unmounts
  const activeRef = useRef(null); // the highlighted list item — kept scrolled into view during arrow nav
  const [hovItem, setHovItem] = useState(null); // the hovered item (incl. coming-soon) → drives rail help + its icon
  const [q, setQ] = useState("");
  const [val, setVal] = useState("");
  const [multiVal, setMultiVal] = useState(()=> Array.isArray(selected) ? [...selected] : []); // for tokens / multi value modes
  useEffect(()=>{ setMultiVal(Array.isArray(selected) ? [...selected] : []); }, [selected, inputType]); // reset when the popover reopens for a new value
  const [active, setActive] = useState(0);
  // when the MENU changes (drill in / back), reset the highlight: to the top by default, or to `initActive`
  // (used by "back" to land on the item you came from). Also clears any stale hover.
  useEffect(() => { setActive(initActive || 0); setHovItem(null); }, [items]);
  const helpRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const k = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", h);
    document.addEventListener("keydown", k);
    return () => { document.removeEventListener("mousedown", h); document.removeEventListener("keydown", k); };
  }, []);
  useEffect(() => {
    if (inputType) return;
    const onArrow = (e) => {
      if (!["ArrowDown","ArrowUp","Enter"].includes(e.key)) return;
      const qq = q.toLowerCase().trim(); const bb = (qq && flat) ? flat : items;
      const list = (noSearch ? bb : bb.filter(i => i.header || i.label.toLowerCase().includes(qq) || (i.sub && i.sub.toLowerCase().includes(qq)) || (i.keywords && i.keywords.toLowerCase().includes(qq))))
        .filter(i => !i.header && !i.disabled);
      if (!list.length) return;
      e.preventDefault();
      if (e.key === "Enter") { const ai = Math.min(active, list.length-1); const it = list[ai]; if (it) { if(!onPick(it, ai)) onClose(); } return; }
      setHovItem(null); // keyboard nav drives help via the highlighted item, not a stale hover
      setActive(a => { const cur = Math.min(a, list.length-1);
        return e.key === "ArrowDown" ? Math.min(list.length-1, cur+1) : Math.max(0, cur-1); });
    };
    document.addEventListener("keydown", onArrow);
    return () => document.removeEventListener("keydown", onArrow);
  }, [q, active, items, noSearch, inputType]);
  // keep the highlighted item visible as arrows move past the scroll viewport
  useEffect(() => { if (activeRef.current) activeRef.current.scrollIntoView({ block:"nearest" }); }, [active]);
  // Measure a DOM element's RAW anchor geometry, rejecting degenerate (detached / not-laid-out) rects.
  const measureEl = (el) => {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.top === 0) return null;
    return { below: r.bottom + 14, aTop: r.top, left: Math.min(r.left, window.innerWidth - 280) };
  };
  const measureKeyed = () => anchorKey ? measureEl(document.querySelector(`[data-anchor="${anchorKey}"]`)) : null;
  const measureFallback = () => measureEl(anchor);
  // Turn raw anchor geometry into the FINAL on-screen position: open below, but FLIP above (or clamp)
  // when the popover would overflow the viewport bottom; also clamp the docked help card. Computed
  // straight into posRef (no separate state) so it stays correct across reused popover instances.
  const placePos = (raw) => {
    if (!raw) return null;
    const M = 12, GAP = 14, vh = window.innerHeight;
    const h = ref.current ? ref.current.offsetHeight : 0;
    let top = raw.below;
    if (h && top + h > vh - M) { const above = raw.aTop - GAP - h; top = above >= M ? above : Math.max(M, vh - M - h); }
    const hh = helpRef.current ? helpRef.current.offsetHeight : 0;
    let helpTop = raw.aTop;
    if (hh && helpTop + hh > vh - M) helpTop = Math.max(M, vh - M - hh);
    return { top, left: raw.left, aTop: raw.aTop, helpTop };
  };
  const posRef = useRef(null);
  const [, bump] = useState(0);
  // Initial synchronous placement so the popover can paint immediately when the element is already available.
  if (!posRef.current) posRef.current = placePos(measureKeyed() || measureFallback());
  // CONTINUOUSLY re-place every frame while open: follows layout/scroll shifts, converges onto the keyed
  // slot once it commits, recomputes the flip as the popover's own height settles, keeps the last good
  // position if an anchor detaches. Only re-renders on a real move, so it idles once stable.
  useLayoutEffect(() => {
    let raf;
    const loop = () => {
      const p = placePos(measureKeyed() || measureFallback());
      if (p && (!posRef.current || Math.abs(p.top - posRef.current.top) > 0.5 || Math.abs(p.left - posRef.current.left) > 0.5 || Math.abs((p.helpTop||0) - (posRef.current.helpTop||0)) > 0.5)) {
        posRef.current = p; bump(n=>n+1);
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  // SAFETY: if the popover can't establish a position (anchor never resolves — common as a big flow
  // scrolls anchors off-screen), close it. Otherwise it sits invisibly and `if (pop) return` in the
  // global key handler swallows every shortcut (undo/redo/reset feel "stuck").
  useEffect(() => {
    const t = setTimeout(() => { if (!posRef.current) onClose(); }, 700);
    return () => clearTimeout(t);
  }, []);
  if (!posRef.current) return null;
  const { top, left, aTop, helpTop } = posRef.current;
  const wrap = (children, w=(wide?"w-[340px]":"w-64")) => (
    <div ref={ref} className={`pop-enter fixed z-50 ${w} rounded-2xl overflow-hidden`}
      style={{ top, left, background:"var(--pop-bg)", border:"1px solid var(--border2)", boxShadow:"var(--shadow-pop)" }}>{children}</div>
  );

  if (inputType==="tokens" || inputType==="multi") {
    // MULTI-VALUE: "any of" — tokens = free typed values; multi = pick several from `choices`
    const done = ()=>{ onPick({ id: multiVal.length?multiVal:null, label:"" }); onClose(); };
    return wrap(
      <div className="p-3">
        {title && <div className="text-[10px] uppercase tracking-wider mb-2" style={{color:"var(--faint)"}}>{title} <span style={{opacity:.7}}>· any of</span></div>}
        {inputType==="tokens"
          ? <TokenInput value={multiVal} onChange={v=>setMultiVal(v||[])} placeholder="type a value, Enter to add…" />
          : <MultiSelect options={choices||[]} value={multiVal} onChange={v=>setMultiVal(v||[])} placeholder="choose values…" />}
        <button onClick={done} className="mt-2.5 w-full rounded-lg py-1.5 text-sm font-medium" style={{background:"var(--accent)",color:"#fff"}}>Done</button>
      </div>, "w-64");
  }
  if (inputType) {
    return wrap(
      <div className="p-3">
        {title && <div className="text-[10px] uppercase tracking-wider mb-2" style={{color:"var(--faint)"}}>{title}</div>}
        <input type={inputType} autoFocus value={val} onChange={e=>setVal(e.target.value)}
          className="w-full rounded-lg px-2.5 py-1.5 text-sm outline-none"
          style={{background:"var(--panel)",border:"1px solid var(--border2)",color:"var(--text)"}}/>
        <button onClick={()=>{ if(val){ onPick({id:val,label:val}); onClose(); } }}
          className="mt-2.5 w-full rounded-lg py-1.5 text-sm font-medium" style={{background:"var(--accent)",color:"#fff"}}>Set</button>
      </div>, "w-56");
  }

  // browse vs flat-search: when the user types AND a `flat` leaf index is provided, search across the
  // FLAT list (every sub-action, matched by label/sub/keywords) instead of the grouped categories.
  const q2 = q.toLowerCase().trim();
  const base = (q2 && flat) ? flat : items;
  const filtered = noSearch ? base : base.filter(i => i.header || i.label.toLowerCase().includes(q2) || (i.sub && i.sub.toLowerCase().includes(q2)) || (i.keywords && i.keywords.toLowerCase().includes(q2)));
  const selectable = filtered.filter(i=>!i.header && !i.disabled);
  const selCount = selectable.length;
  let si = -1;
  // item content — rich (icon tile + label + one-line subtext) when the item has a `sub`, else the plain row
  const TONES = { when:["var(--c-when)","var(--c-when-bg)"], if:["var(--c-if)","var(--c-if-bg)"], then:["var(--c-then)","var(--c-then-bg)"], util:["var(--accent)","var(--panel2)"] };
  // solidIcons (the "what happens next" menu): keep the light tinted tile, but render the glyph FILLED
  const tileStyle = (i) => ({ background:(TONES[i.tone]||["var(--muted)","var(--panel2)"])[1], color:(TONES[i.tone]||["var(--muted)","var(--panel2)"])[0] });
  const itemBody = (i) => i.sub ? (
    <span className="flex items-center gap-2.5 min-w-0">
      {i.icon && <span className={"w-8 h-8 rounded-lg flex items-center justify-center shrink-0" + (solidIcons?" solid-ico":"")} style={tileStyle(i)}>{i.icon}</span>}
      <span className="flex flex-col min-w-0">
        <span className="text-[12.5px] font-medium leading-tight" style={{color:"var(--text)"}}>{i.label}</span>
        <span className="text-[11px] leading-tight truncate" style={{color:"var(--faint)"}}>{i.sub}</span>
      </span>
    </span>
  ) : (
    <span className="flex items-center gap-3 min-w-0">{i.icon && <span style={{color:"var(--muted)"}}>{i.icon}</span>}<span className="truncate">{i.label}</span></span>
  );
  // Quick Help (rendered in the rail by the parent): base = the menu's node help; item = the specific
  // hovered/highlighted option (only when it differs from base).
  const activeItem = selectable[Math.min(active, Math.max(0, selCount-1))];
  const curItem = hovItem || activeItem || null;        // the option whose help/icon the rail shows
  if (itemsAsNodes) {
    // the items ARE main nodes (e.g. the "what happens next" menu) → the hovered item drives the BASE
    // (big graphic) node help; no "this option" sub-layer.
    helpRptRef.current = { base: (curItem && curItem.help) || help || null, item: null, itemIcon: null };
  } else {
    // the items are SUB-OPTIONS of this node (e.g. trigger types) → base = node help, item = the option.
    const baseHelp = help || null;
    const itemHelp = (curItem && curItem.help) || null;
    const showItem = itemHelp && itemHelp!==baseHelp;
    helpRptRef.current = { base: baseHelp, item: showItem ? itemHelp : null, itemIcon: showItem ? (curItem.icon||null) : null };
  }
  return (<>
    {wrap(<>
    {(help||title||back) && <div className="px-3.5 pt-3 pb-1.5 flex items-center gap-1.5">
      {back && <button onClick={back} title="Back" className="flex items-center justify-center w-5 h-5 rounded-md hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>}
      <span className="text-[12px] font-semibold" style={{color:"var(--text)"}}>{(help && help.title) || title}</span>
    </div>}
    {!noSearch &&
      <div className="px-2.5 pt-1 pb-2">
        <div className="flex items-center gap-2 rounded-xl px-3 py-2" style={{border:"1px solid var(--accent)", background:"var(--pop-bg)"}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style={{color:"var(--faint)"}}><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/><path d="M21 21l-4-4" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          <input autoFocus value={q} onChange={e=>{setQ(e.target.value); setActive(0);}} placeholder="Search"
            onKeyDown={e=>{ if(e.key==="Backspace" && q==="" && back){ e.preventDefault(); back(); } }}
            className="w-full bg-transparent outline-none text-[12px] placeholder:text-[var(--faint)]" />
        </div>
      </div>}
    <div className="max-h-72 overflow-y-auto overscroll-contain py-1 px-1.5">
      {filtered.length===0 && <div className="px-3 py-2 text-[12px]" style={{color:"var(--faint)"}}>No matches</div>}
      {filtered.map((i,k)=>{
        if (i.header) return <div key={"h"+k} className="px-2.5 pt-3 pb-1 text-[11px] font-medium" style={{color:"var(--faint)"}}>{i.header}</div>;
        if (i.disabled) return (
          <button key={i.id} onMouseEnter={()=>setHovItem(i)} onMouseLeave={()=>setHovItem(null)}
            className="relative group/dis w-full text-left px-2 py-1.5 text-[12px] rounded-lg flex items-center justify-between gap-2 cursor-default" style={{color:"var(--text)"}}>
            <span className="flex items-center justify-between gap-2 flex-1 min-w-0 opacity-50">{itemBody(i)}
            {i.tag && <span className="text-[10px] px-1.5 py-0.5 rounded shrink-0" style={{background:"var(--border)",color:"var(--muted)"}}>{i.tag}</span>}</span>
            {i.hint && <span className="pointer-events-none absolute right-2 bottom-full mb-1 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/dis:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.hint}</span>}
            {i.rightIcon && <span className="relative group/ri shrink-0 flex items-center justify-center w-5 h-5" style={{color:"var(--muted)"}}>{i.rightIcon}
              {i.rightHint && <span className="pointer-events-none absolute right-0 bottom-full mb-2 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/ri:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.rightHint}</span>}</span>}
          </button>);
        si++; const myi = si; const isActive = si === Math.min(active, selCount-1);
        const isSel = selected!=null && (i.id===selected || i.label===selected);
        return (
          <button key={i.id} ref={isActive ? activeRef : null} onClick={()=>{ if(!onPick(i, myi)) onClose(); }}
            onMouseEnter={()=>{ setHovItem(i); setActive(myi); }}
            className={"w-full text-left px-2 py-1.5 text-[12px] rounded-lg flex items-center justify-between gap-2 " + (isActive ? "bg-[var(--pop-hover)]" : "hover:bg-[var(--pop-hover)]")}
            style={{ color:"var(--text)", fontWeight: isSel ? 600 : undefined, ...(isSel && !isActive ? { background:"var(--pop-hover)" } : {}) }}>
            {itemBody(i)}
            {isSel && <svg className="shrink-0 ml-auto" width="14" height="14" viewBox="0 0 24 24" fill="none" style={{color:"var(--muted)"}}><path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            {i.tag && <span className="text-[10px] px-1.5 py-0.5 rounded shrink-0" style={{background:"var(--border)",color:"var(--muted)"}}>{i.tag}</span>}
            {i.rightIcon && <span className="relative group/ri shrink-0 flex items-center justify-center w-5 h-5" style={{color:"var(--muted)"}}>{i.rightIcon}
              {i.rightHint && <span className="pointer-events-none absolute right-0 bottom-full mb-2 px-2 py-1 rounded-md text-[11px] font-medium whitespace-nowrap opacity-0 group-hover/ri:opacity-100 transition-opacity z-50" style={{background:"var(--text)", color:"var(--bg)", boxShadow:"var(--shadow-sm)"}}>{i.rightHint}</span>}</span>}
          </button>);
      })}
    </div>
    {footer && <div className="border-t p-1.5" style={{borderColor:"var(--border)"}}>{footer}</div>}
    </>)}
  </>);
}

/* ---------------------------------------------------------------------------
   Inline editable slot — underlined text, colored by role
--------------------------------------------------------------------------- */
const SLOT_COLOR = { trigger:"var(--c-when)", action:"var(--c-then)", value:"var(--c-then)", cond:"var(--c-if)" };
function Slot({ value, placeholder, onClick, innerRef, open, dataAnchor, beckon }) {
  const filled = !!value;
  return (
    <button ref={innerRef} data-anchor={dataAnchor} onClick={onClick} className={"slot " + (filled ? "font-medium" : "font-normal") + (beckon ? " slot-beckon" : "")}
      style={{ color: filled ? "var(--text)" : "var(--faint)",
               ...(open ? { textDecorationStyle:"solid", textDecorationColor:"var(--accent2)" } : {}) }}>
      {filled ? value : placeholder}
    </button>
  );
}
const Word = ({children}) => <span className="font-normal" style={{color:"var(--ink-mid)"}}>{children}</span>;
function Template({ tpl, vals, onSlot, slotRef, ph, openKey }) {
  return tpl.split(/(\{[^}]+\})/).filter(p=>p!=="").map((p,i)=>{
    const m = p.match(/^\{(.+)\}$/);
    if (m) { const k = m[1];
      return <Slot key={i} value={vals[k]} placeholder={(ph && ph[k]) || PLACEHOLDER[k] || k} open={k===openKey}
        innerRef={slotRef ? (el)=>slotRef(k, el) : undefined} onClick={(e)=>onSlot(k,e)} />; }
    return <Word key={i}>{p}</Word>;
  });
}

/* ---------------------------------------------------------------------------
   App
--------------------------------------------------------------------------- */
function App() {
  // app shell: which suite/module is selected (default Automation → Workflows = the builder)
  const [activeSuite, setActiveSuite] = useState("automation");
  const [activeModule, setActiveModule] = useState("workflows");
  const [sideCollapsed, setSideCollapsed] = useState(false);
  const [drawer, setDrawer] = useState(null); // node id whose detail form is open in the right rail
  const [openSecs, setOpenSecs] = useState({}); // which optional form sections are expanded
  // apply spec field DEFAULTS (e.g. a radio's default option) when a form drawer opens
  useEffect(() => {
    if (!drawer) return;

    const spec = formSpecFor(n.action);
    if (spec) { const data = n.data || {}, patch = {};

      if (Object.keys(patch).length) update(p, { data: { ...data, ...patch } });
    } else if ((n.action==="create" || n.action==="update") && !(n.fields && n.fields.length)) {

    }

  const [railHover, setRailHover] = useState(false);

  const suiteDef = SUITES.find(s=>s.id===activeSuite) || SUITES[SUITES.length-1];

  const showBuilder = activeSuite==="automation" && (activeModule==="workflows" || isUsecase);
  const pickSuite = (s) => { setActiveSuite(s.id); setActiveModule((s.modules[0]||{}).id); };
  // editable document (trigger + flow tree) behind an undo/redo history

  // the workflow's module (from the first trigger) gates the action menu, recipients and channels (§5.3)

  const actionCatAll = (()=>{ const byId={}; [...RECORD_MODULES, ...FUNCTIONAL_AREAS].forEach(m=>{ Object.assign(byId, actionCatalogFor(m.id).byId); }); return { byId }; })();
  // modules IN SCOPE at a path = trigger module + every Create/Get above on the trunk. Availability of

  const moduleIdsInScope = (path) => { const ids=new Set(); const t=workflowModuleId(); if(t) ids.add(t);
    const topIdx = (path && typeof path[0]==="number") ? path[0] : flow.length;

  const availActionIds = (path) => { const set=new Set(); moduleIdsInScope(path).forEach(mid=>Object.keys(actionCatalogFor(mid).byId).forEach(a=>set.add(a))); return set; };
  // CONDITION field catalog for a node: a Get filters its OWN module; everything else (CHECK IF / branch /
  // delay-event) filters the workflow's trigger module. Drives the field menu + value picker + labels.
  const flowCat = (node) => conditionFieldsFor(node && node.kind==="get" ? node.module : (triggers[0] && triggers[0].vals && triggers[0].vals.module));
  const flowFD = (node, id) => flowCat(node).find(f=>f.id===id);

  const past = useRef([]); const future = useRef([]);

  const undo = () => setDoc(prev => { if(!past.current.length) return prev; future.current.push(prev); return past.current.pop(); });

  const reset = () => {

  const [ucPopup, setUcPopup] = useState(false);

  // switch between saved experiment builds (separate HTML files)
  const openVersions = (anchor) => open(anchor,
    BUILDS.map(b=>({ id:b.file, label:b.label, tag: b.file===currentBuild ? "current" : undefined })),

  const [pop, setPop] = useState(null);
  const [railHelp, setRailHelp] = useState(null); // Quick Help shown in the context rail while a menu is open
  const [name, setName] = useState("Untitled rule");
  const [editingName, setEditingName] = useState(false); // header name: click-to-edit
  const [enabled, setEnabled] = useState(true);
  const [theme, setTheme] = useState("dark");
  const [focusKey, setFocusKey] = useState("T"); // "T" = trigger, else path.join('.')
  const [branchMenuPath, setBranchMenuPath] = useState(null); // path.join('.') of the branch whose "add step" menu is open
  const [helpOpen, setHelpOpen] = useState(false);
  const [guideOpen, setGuideOpen] = useState(false); // "How it works" stepper — opened on demand (toast / lightbulb)
  const [step, setStep] = useState(0); // active step in the "How it works" stepper

  useEffect(() => {

  const [refOpen, setRefOpen] = useState(false); // "Node reference" dialogue
  const [refSel, setRefSel] = useState("trigger"); // selected node id in the reference
  const [toastHidden, setToastHidden] = useState(false); // user dismissed the bottom intro toast
  const [published, setPublished] = useState(false);
  const currentBuild = decodeURIComponent((location.pathname.split("/").pop()) || "index.html") || "index.html";
  const idRef = useRef(1);
  const nid = () => idRef.current++;
  const rowRefs = useRef({});
  const addStepBtnRef = useRef(null); // the bottom "Add step" CTA — stable anchor for the keyboard-opened add menu
  const setRowRef = (key, el) => { if (el) rowRefs.current[key] = el; };
  const triggerSlotRefs = useRef({});
  const setTriggerSlotRef = (tid, key, el) => { if (el) triggerSlotRefs.current[`${tid}:${key}`] = el; };
  const guidingRef = useRef(null); // id of the trigger currently auto-advancing (or null)
  const actionSlotRefs = useRef({}); // action node id -> its "choose an action" element
  const condSlotRefs = useRef({});   // condition node id -> its "a field" element
  const valueSlotRefs = useRef({});  // condition node id -> its value element
  const argSlotRefs = useRef({});    // action path -> its arg element
  const branchAddRefs = useRef({});  // branch path -> its "+" element
  useEffect(()=>{ document.documentElement.dataset.theme = theme; }, [theme]);

  const [openSlot, setOpenSlot] = useState(null); // unique key of the slot whose popover is open
  const open = (anchor, items, onPick, title, opts={}) => setPop({ anchor, items, onPick, title, ...opts });
  // pick the first anchor that's actually laid out (non-zero rect) — skips stale/detached refs
  // (e.g. the removed "do this…" opener) whose 0×0 rect would leave a popover unable to position.
  const isVisibleEl = (el) => { if(!el || !el.getBoundingClientRect) return false; const r = el.getBoundingClientRect(); return r.width>0 || r.height>0; };
  const firstVisibleEl = (...els) => els.find(isVisibleEl) || null;
  const close = () => { setPop(null); setOpenSlot(null); setBranchMenuPath(null); };
  const hasTrigger = triggers.length > 0;

  /* triggers (multiple, OR'd) */
  // event triggers (record-based) can be OR'd together; periodic triggers (time-based) must stand alone.
  const isPeriodicType = (t) => t==="date_reached" || t==="periodically";
  const firstIsPeriodic = () => triggers.length>0 && isPeriodicType(triggers[0].typeId);
  // trigger-type picker config. `back` (when present) = adding an OR trigger → restrict to event types only.
  const triggerMenuConfig = (anchor, back) => ({
    anchor,
    items: (back ? TRIGGER_MENU.filter(it => it.id ? !isPeriodicType(it.id) : it.header!=="Time based") : TRIGGER_MENU)
      .map(it => it.id ? { ...it, help:TRIGGER_HELP[it.id] } : it),
    wide:true, back, title: back ? "Add trigger" : null, help: NODE_HELP.when,
    onPick:(i)=>{ const nt = { id:nid(), typeId:i.id, vals:{} }; setTriggers(ts=>[...ts, nt]); guidingRef.current = nt.id; setFocusKey(`trig:${nt.id}`); },
    footer:(
      <button className="w-full flex items-center gap-2.5 px-2.5 py-1.5 text-[12px] rounded-lg hover:bg-[var(--pop-hover)]" style={{color:"var(--muted)"}}>
        <span style={{color:"var(--accent2)"}}>{I.ai}</span> Generate with AI
      </button>
    ),
  });
  const pickTriggerType = (anchor) => { setFocusKey("T"); setOpenSlot("Twhen"); setPop(triggerMenuConfig(anchor, null)); };

  const updateTrigger = (tid, key, val) => setTriggers(ts=>ts.map(t=>t.id===tid?{...t, vals:{...t.vals,[key]:val}}:t));
  const removeTrigger = (tid) => setTriggers(ts=>ts.filter(t=>t.id!==tid));

  // Each pick just sets the value — the [triggers] effect re-runs this, so it works for mouse AND keyboard.
  const advanceTrigger = (tid) => {

    const next = view.slots.find(s => !t.vals[s.key]);

  // insert an action at `path` (at `index`, or appended) and immediately open its picker

  // open the field picker for clause `ci` of the condition at `condPath` (id `cid`)

  };

  const addDelayEventAndPick = (path, fallbackEl, index) => { // EVENT-based (wait until a condition is true)

    const idx = index===undefined ? childrenAt(flow, path).length : index;

  // ── GET ("get all {module} where {condition}") — scopes the steps below to each fetched record ──
  const pickGetModule = (path, node, e) => { setOpenSlot(`${pathKey(path)}:module`); open(e.currentTarget, MODULE_NAMES.map(m=>({id:m,label:m})), (i)=>update(path,{module:i.id}), "Record type", {selected:node.module}); };

    "Insert step", {noSearch:true, itemsAsNodes:true});

    setOpenSlot(`trig:${t.id}:${key}`);
